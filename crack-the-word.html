<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Crack the Word · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Crack the Word">
  <meta name="theme-color" content="#0d0d1a">
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="shared.css">
  <style>
    :root { --accent: #3b82f6; --accent-alt: #3b82f6; --warn: #ef4444; }
    .fb-warning { color: var(--bad-text-soft); margin-bottom: 16px; }
    .header h1 { background: linear-gradient(135deg, #fff 30%, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .round-badge span { color: var(--accent-text); }

    /* ── Scoreboard: same shape as Say It's own (see that file), tinted blue.
       Sits at the very bottom of the page now (see the HTML comment there),
       so its entrance delay comes last in the cascade too. ── */
    .scoreboard {
      width: 100%; max-width: 1100px;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
      margin-bottom: 18px;
      animation: fadeUp .5s .25s ease both;
    }
    .score-card {
      flex: 1; min-width: 150px; max-width: 220px;
      background: var(--surface); border: 2px solid var(--border); border-radius: 18px;
      padding: 16px 14px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      transition: border-color .3s, box-shadow .3s;
    }
    .score-card.is-active { border-color: #3b82f6; box-shadow: 0 0 24px rgba(59,130,246,.28); }
    .score-card.is-turn-card { border-color: #fbbf24; box-shadow: 0 0 24px rgba(251,191,36,.28); }
    .score-card .sc-role { font-size: .78rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); min-height: 14px; }
    .score-card .cw-tag { color: var(--accent-text); }
    .score-card .cw-tag.is-guessing { color: #4ade80; }
    .score-card .cw-tag.is-turn { color: #fbbf24; }
    .score-card .cw-tag.is-rejected { color: var(--bad-text-soft); }
    .score-card .sc-name { font-size: 1.05rem; font-weight: 800; color: var(--text); line-height: 1.2; text-align: center; overflow-wrap: break-word; max-width: 100%; }
    .score-card .sc-pts { font-size: 2.1rem; font-weight: 900; color: var(--accent-text); line-height: 1; }
    .cw-fallback-btn {
      background: var(--btn-face); border: 1.5px solid var(--border-3); color: var(--text-dim);
      border-radius: 10px; padding: 6px 12px; font-size: .82rem; font-weight: 800; font-family: inherit; cursor: pointer;
    }
    .cw-fallback-btn:hover { background: var(--btn-face-hi); }

    /* ── Host settings: two standing preferences (turn budget difficulty,
       score display mode), neither tied to any one round, so they live above
       the round panel rather than inside it (the round panel only exists
       while a round is idle/choosing/playing). Collapsed behind one small
       pill instead of an always-open row — same move as Say It Without
       Saying It's own settings popover (see that file's long comment) once
       it grew past a single setting: two full-width button groups sitting
       permanently open above the round panel on a screen that's meant to be
       mostly tiles and letters is exactly the "wasted space" that pattern
       exists to fix. `#settings-popover` itself lives OUTSIDE `.cw-settings-row`
       in the HTML, as its own sibling, not nested inside it — `.cw-settings-row`
       carries a `fadeUp` entrance animation, and `fill-mode: both` leaves the
       finished animation's (identity) transform on the element forever, which
       creates a stacking context a nested popover's z-index could never climb
       out of (see dare-conquest.html for this worked out at length). Position
       is computed from the toggle button's own viewport rect each time it
       opens, not anchored via CSS, for the same reason. */
    .cw-settings-row {
      width: 100%; max-width: 1100px; margin-bottom: 16px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px;
      animation: fadeUp .5s .1s ease both;
    }
    .cw-settings-toggle-btn {
      background: var(--btn-face); border: 2px solid var(--border-3); color: var(--text-dim);
      border-radius: 999px; padding: 7px 14px; cursor: pointer; font: inherit;
      display: flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 700;
      transition: background .15s;
    }
    .cw-settings-toggle-btn:hover { background: var(--btn-face-hi); }
    .cw-settings-toggle-btn .cst-dots { font-size: .8rem; letter-spacing: 1px; }
    .cw-settings-popover {
      position: fixed; z-index: 9999;
      min-width: 240px; max-width: min(340px, calc(100vw - 24px));
      max-height: min(70vh, 520px); overflow-y: auto;
      background: var(--surface); border: 2px solid var(--border-2); border-radius: 16px;
      padding: 16px;
      display: flex; flex-direction: column; gap: 14px;
      box-shadow: 0 14px 34px rgba(0,0,0,.5);
    }
    .cw-setting-group { display: flex; flex-direction: column; gap: 8px; }
    .cw-setting-group + .cw-setting-group { border-top: 1px dashed var(--border-2); padding-top: 14px; }
    .cw-setting-label { font-size: .82rem; font-weight: 800; color: var(--text-muted); }
    /* stacked full-width, not the side-by-side row this button used to sit in —
       the score-mode labels are long sentences, not short words like the turn
       difficulty ones, and a narrow popover has no room to wrap them sideways */
    .cw-setting-btns { display: flex; flex-direction: column; gap: 6px; }
    .cw-diff-btn {
      width: 100%; text-align: left;
      background: var(--btn-face); border: 1.5px solid var(--border-3); color: var(--text-dim);
      border-radius: 10px; padding: 9px 14px; font-size: .9rem; font-weight: 800; font-family: inherit; cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .cw-diff-btn:hover { background: var(--btn-face-hi); }
    .cw-diff-btn.is-on { background: var(--accent); border-color: var(--accent); color: var(--btn-ink); }
    /* the live read-out of what the score setting is currently doing — stays
       visible outside the (closed-by-default) popover, same reasoning as Say
       It's own .phase-summary: a setting that changes what every card shows
       right now shouldn't require opening a menu just to check it */
    .cw-team-total {
      display: flex; align-items: center; gap: 10px;
      background: rgba(59,130,246,.12); border: 1.5px solid rgba(59,130,246,.4); border-radius: 999px;
      padding: 7px 18px;
    }
    .cw-team-total .ctt-label { font-size: .85rem; font-weight: 800; color: var(--accent-text); }
    .cw-team-total .ctt-score { font-size: 1.15rem; font-weight: 900; color: var(--text); }

    /* ── Round panel: tiles, tier chooser, letter grid, guess judge box ── */
    .cw-panel {
      width: 100%; max-width: 1100px;
      background: var(--surface); border: 2px solid var(--border); border-radius: 22px;
      padding: 22px 20px; margin-bottom: 20px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      animation: fadeUp .5s .2s ease both;
    }
    .cw-idle-note, .cw-choosing-note, .cw-guess-box p { color: var(--text-dim); text-align: center; font-size: 1rem; line-height: 1.5; }
    .cw-host-deal, .cw-tier-btn {
      background: var(--accent); border: 2px solid var(--accent); color: var(--btn-ink);
      border-radius: 14px; padding: 14px 20px; font-size: 1.05rem; font-weight: 900; font-family: inherit; cursor: pointer;
      box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 28%, transparent);
      transition: transform .1s;
    }
    .cw-host-deal:active, .cw-tier-btn:active { transform: scale(.97); }
    .cw-host-deal:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .cw-tier-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .cw-tier-btn { display: flex; align-items: baseline; gap: 8px; }
    .cw-tier-pool { font-size: .82rem; font-weight: 700; opacity: .75; }
    .cw-result { width: 100%; text-align: center; }
    .cw-result-line { font-size: 1.15rem; font-weight: 800; color: #4ade80; margin: 0 0 6px; }
    .cw-result-line.is-limit { color: #fbbf24; }
    .cw-result-credits { font-size: .92rem; color: var(--text-muted); margin: 0; }

    /* whose turn it is to press, and how much of the shared turn budget is
       left — the same line every card shows, since neither is secret */
    .cw-turnbar {
      width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      background: rgba(251,191,36,.1); border: 1.5px solid rgba(251,191,36,.4); border-radius: 14px;
      padding: 10px 16px;
    }
    .cw-turnbar-name { font-size: 1rem; font-weight: 800; color: #fbbf24; }
    .cw-turn-count { font-size: .92rem; font-weight: 800; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .cw-turn-count.is-low { color: var(--bad-text-soft); }
    .cw-seat-letters.is-turn .cw-seat-name { color: #fbbf24; }

    .cw-tier-chip {
      align-self: center; background: rgba(59,130,246,.12); border: 1px solid rgba(59,130,246,.4); color: var(--accent-text);
      font-size: .85rem; font-weight: 900; letter-spacing: .5px; text-transform: uppercase;
      padding: 5px 16px; border-radius: 20px;
    }
    .cw-tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .cw-tile {
      min-width: 34px; height: 46px; display: flex; align-items: center; justify-content: center;
      border-bottom: 3px solid var(--border-2); font-size: 1.6rem; font-weight: 900; color: #fff;
    }
    .cw-tile.is-revealed { border-color: #4ade80; color: #4ade80; }
    .cw-tile.is-static { border-bottom: none; min-width: 14px; color: var(--text-muted); }
    .cw-excluded { color: var(--bad-text-soft); font-size: .92rem; font-weight: 700; text-align: center; }
    .cw-guess-box { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .cw-guess-row { display: flex; gap: 8px; width: 100%; }
    .cw-guess-row input {
      flex: 1; min-width: 0; background: var(--bg); border: 2px solid var(--border-2); color: var(--text);
      border-radius: 10px; padding: 10px 12px; font-size: 1rem; font-family: inherit;
    }
    .cw-guess-row button {
      background: #22c55e; border: 2px solid #22c55e; color: #06230f;
      border-radius: 10px; padding: 10px 14px; font-size: .95rem; font-weight: 900; font-family: inherit; cursor: pointer;
    }
    .cw-guess-row button.cw-guess-cancel { background: var(--btn-face); border-color: var(--border-3); color: var(--text-dim); }

    /* the shared vowel row — dashed border and a green tint mark it as "open
       to anyone", distinct from the per-seat grid below it which is gated by
       turn/ownership; is-correct/is-wrong (shared with .cw-letter-btn) still
       win once a vowel is actually pressed, since those are more specific */
    .cw-vowel-row {
      width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px;
      background: rgba(74,222,128,.08); border: 1.5px dashed rgba(74,222,128,.4); border-radius: 14px;
      padding: 12px 14px;
    }
    .cw-vowel-label { font-size: .82rem; font-weight: 800; color: #4ade80; }
    .cw-vowel-btn { border-color: rgba(74,222,128,.55); }
    .cw-letters-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .cw-seat-letters { display: flex; flex-direction: column; gap: 6px; }
    .cw-seat-name { font-size: .82rem; font-weight: 800; color: var(--text-muted); }
    .cw-letter-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .cw-letter-btn {
      width: 30px; height: 30px; border-radius: 8px; background: var(--btn-face); border: 1.5px solid var(--border-3);
      color: var(--text-dim); font-size: .88rem; font-weight: 900; font-family: inherit; cursor: pointer;
    }
    .cw-letter-btn.is-correct { background: #22c55e; border-color: #22c55e; color: #06230f; }
    .cw-letter-btn.is-wrong { background: #3a1d1d; border-color: #5c2b2b; color: #7a4b4b; }
    .cw-letter-btn:disabled { cursor: default; }
    .cw-letter-btn:disabled:not(.is-correct):not(.is-wrong) { opacity: .4; }

    /* the read-only roster below is just for reconnect links; nothing here is
       secret since the tile row already shows the same revealed state */
  </style>
</head>
<body data-guide="crack" data-guide-next="game">

  <div class="topbar">
    <a class="back" href="index.html?step=2" data-i18n="common.backToHub">← Back to Hub</a>
    <div class="round-badge"><span data-i18n="crack.roundLabel">Round</span> <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🔤 Crack the Word</h1>
  </div>

  <div class="fb-warning hidden" id="fb-warning"></div>

  <div class="cw-settings-row" id="settings-row"></div>
  <div class="cw-panel" id="round-panel"></div>

  <div id="room-mount"></div>

  <!-- moved to the very bottom of the page — the round panel above (tiles,
       letters, turn bar) is what the room is actually looking at moment to
       moment; the per-seat score cards are secondary, so they no longer sit
       between the settings row and it -->
  <div class="scoreboard" id="scoreboard"></div>

  <!-- lives outside .cw-settings-row on purpose — see the CSS comment there -->
  <div class="cw-settings-popover hidden" id="settings-popover"></div>

  <script src="guide-data.js"></script>
  <script src="guide.js"></script>
  <script src="qrcode.js"></script>
  <script src="game-data.js"></script>
  <script src="sheet-data.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="room.js"></script>
  <script src="crack-word-engine.js"></script>
  <script>
    I18N.registerDict('crack', {
      roundLabel: { zh: 'Round', en: 'Round' },
      linksNote: { zh: '分數與目前進度即時顯示在下面。', en: "Scores and the round in progress are shown live below." },
      fbWarning: { zh: '⚠️ 尚未設定 Firebase — 這款遊戲需要私人玩家卡片才能進行，無法在沒有 Firebase 的情況下遊玩。', en: "⚠️ Firebase isn't set up — this game needs private player cards to work, so it can't be played without it." },
      tier_short: { zh: '🟢 短字（5 字母以下）', en: '🟢 Short (≤5 letters)' },
      tier_medium: { zh: '🟡 中字（6–8 字母）', en: '🟡 Medium (6–8 letters)' },
      tier_long: { zh: '🔴 長字（9 字母以上）', en: '🔴 Long (9+ letters)' },
      tier_phrase: { zh: '💬 片語（常用英文片語）', en: '💬 Phrases (common English phrases)' },
      idleHostNote: { zh: '任何一位玩家都可以從自己的卡片按「換下一題」開局，並自選要挑戰的長度。', en: 'Any player can start the next round from their own card and choose the length to challenge.' },
      hostDealBtn: { zh: '🔀 主持人代抽下一題', en: '🔀 Deal the next word (host fallback)' },
      linksNeededBtn: { zh: '🔗 需要玩家連結', en: '🔗 Player links needed' },
      choosingHostNote: { zh: '⏳ 等 {name} 選擇題目長度…（手機不方便時，主持人也可以直接點下面的按鈕代選）', en: '⏳ Waiting for {name} to choose a length… (or tap a button below yourself if their phone isn\'t handy)' },
      excludedLabel: { zh: '❌ 已試過、不在這個字裡：', en: '❌ Tried, not in the word:' },
      vowelsLabel: { zh: '🅰️ 母音（任何人隨時都能按）', en: '🅰️ Vowels — anyone can press, any time' },
      guessingHostNote: { zh: '🙋 {name} 正在猜 — 手機不方便時，主持人可以幫忙打字送出：', en: '🙋 {name} is guessing — type it in yourself below if their phone isn\'t handy:' },
      guessPlaceholder: { zh: '輸入猜測的完整單字…', en: 'Type the full guessed word…' },
      hostJudgeBtn: { zh: '送出', en: 'Submit' },
      hostCancelGuessBtn: { zh: '取消', en: 'Cancel' },
      hostBuzzBtn: { zh: '🙋 代按搶答', en: '🙋 Buzz in for them' },
      choosingTag: { zh: '🔀 選長度中', en: '🔀 Choosing length' },
      guessingTag: { zh: '🙋 猜題中', en: '🙋 Guessing' },
      rejectedTag: { zh: '⏸️ 等其他人先猜', en: '⏸️ Waiting for others' },
      resultLine: { zh: '🎉 {name} 猜對了！答案是「{word}」— 全員 +{teamPts} 分，{name} 額外 +{bonus}（共 +{pts}）', en: '🎉 {name} got it! The word was "{word}" — everyone +{teamPts}, {name} gets +{bonus} more (+{pts} total)' },
      creditsLine: { zh: '🔤 按對字母得分：{list}', en: '🔤 Letter credit: {list}' },
      turnTag: { zh: '👆 輪到按字母', en: '👆 Turn to press' },
      turnHostLine: { zh: '輪到 {name} 按字母', en: "It's {name}'s turn to press a letter" },
      turnCounter: { zh: '回合 {used}/{limit}', en: 'Turn {used}/{limit}' },
      allLettersDone: { zh: '所有字母都按完了 — 大家討論看看答案吧！', en: 'Every letter has been pressed — talk it out!' },
      limitResultLine: { zh: '⏰ 回合數用完了！答案是「{word}」— 全員 −{pts} 分', en: '⏰ Out of turns! The word was "{word}" — everyone loses {pts}' },
      turnDiffLabel: { zh: '🎚️ 回合數難度（只影響下一輪）', en: '🎚️ Turn budget (next round only)' },
      turnDiff_easy: { zh: '🟢 簡單', en: '🟢 Easy' },
      turnDiff_medium: { zh: '🟡 中等', en: '🟡 Medium' },
      turnDiff_hard: { zh: '🔴 困難', en: '🔴 Hard' },
      settingsToggleTitle: { zh: '遊戲設定：回合預算、分數顯示方式', en: 'Game settings: turn budget, score display' },
      scoreModeLabel: { zh: '📊 分數顯示方式', en: '📊 Score display' },
      scoreMode_team: { zh: '🏆 團隊總分', en: '🏆 Team total' },
      scoreMode_teamContrib: { zh: '📊 團隊總分＋個人貢獻度', en: '📊 Team total + individual contribution' },
      scoreMode_individual: { zh: '🏅 個別競賽', en: '🏅 Individual competition' },
      teamTotalLabel: { zh: '🏆 團隊總分', en: '🏆 Team score' },
    });
    const tt = (key, vars) => {
      let s = I18N.t('crack', key);
      if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
      return s;
    };
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }
    const TIER_EMOJI = { short: '🟢', medium: '🟡', long: '🔴', phrase: '💬' };

    /* ── The word deck, bucketed by how many actual letters it needs revealed
       (not raw string length — a two-word phrase's space doesn't count). Reuses
       Say It Without Saying It's exact 700-word deck as-is; no changes needed
       there. Computed once at load, after sheet-data.js has already applied any
       collaborator edits on top of GAME_DATA. ── */
    const DECK = GAME_DATA.taboo;
    const BUCKET = { short: [], medium: [], long: [] };
    DECK.forEach((w, i) => { BUCKET[CRACK_ENGINE.tierOf(CRACK_ENGINE.letterCount(w.word))].push(i); });

    /* ── A 4th tier, separate from the three above: a fixed 100-phrase deck
       (game-data.js's `crackPhrase`) rather than a letter-count bucket carved
       out of the shared `taboo` deck. It isn't a `tierOf()` output — nothing
       computes it from letter count — so it's deliberately kept out of
       CRACK_ENGINE.TIERS (that stays the pure short/medium/long classifier the
       engine's tests check) and only added to this page's own `ALL_TIERS`. Its
       whole 100-entry pool counts as its "bucket" since there's no length split
       to make within it. `deckFor()` is the one place that knows which of the
       two decks a tier's cards come from. ── */
    const PHRASE_TIER = 'phrase';
    const ALL_TIERS = CRACK_ENGINE.TIERS.concat([PHRASE_TIER]);
    const PHRASE_DECK = GAME_DATA.crackPhrase;
    BUCKET[PHRASE_TIER] = PHRASE_DECK.map((_, i) => i);
    function deckFor(t) { return t === PHRASE_TIER ? PHRASE_DECK : DECK; }

    /* Not-yet-dealt indices per tier, shuffled — refilled (and reshuffled) only
       once a tier runs dry, so nothing repeats until the whole tier has been
       seen. Persisted the same way Say It's `used` is: fingerprinted against
       each deck's current length, so a sheet reload that changes the `taboo`
       deck's shape (or a future edit to the phrase deck) doesn't replay stale
       indices against a different pool. */
    const SAVE_KEY = 'crackWordUsed.v1';
    let remaining = { short: [], medium: [], long: [], phrase: [] };
    function saveUsed() {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify({ deckLen: DECK.length, phraseLen: PHRASE_DECK.length, remaining })); } catch (e) {}
    }
    (function loadUsed() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (saved && saved.deckLen === DECK.length && saved.phraseLen === PHRASE_DECK.length && saved.remaining) remaining = saved.remaining;
      } catch (e) {}
    })();
    function pickWordIndex(t) {
      const deck = deckFor(t);
      const bucket = (BUCKET[t] && BUCKET[t].length) ? BUCKET[t] : deck.map((_, i) => i);
      if (!remaining[t] || !remaining[t].length) remaining[t] = CRACK_ENGINE.shuffle(bucket);
      const idx = remaining[t].pop();
      saveUsed();
      return idx;
    }

    /* ── Turn-count difficulty: a host-set dial on the shared turn budget,
       separate from the word's own length (tier) or concept difficulty
       (card.level) — players found the computed budget too generous, so
       this scales the whole thing down (see CRACK_ENGINE.applyTurnDifficulty).
       Persisted like a real setting (not page-memory only, unlike scores),
       since it's a host preference that should survive a reload. ── */
    /* ── Score display mode: how the scoreboard (host screen) and each
       player's own "standings" block (their card) present `scores` —
       purely a presentation choice, the underlying numbers never change:
       'team' shows one combined total and nothing per-seat; 'teamContrib'
       (the default) shows that same total plus each seat's own number
       alongside it, read as "how much of the total this person helped get";
       'individual' is the original per-seat leaderboard with no total line
       at all. Persisted like turnDifficulty — a host preference that should
       survive a reload, unlike the page-memory-only `scores` themselves. ── */
    const SETTINGS_KEY = 'crackWordSettings.v1';
    let turnDifficulty = 'easy';
    const SCORE_MODES = ['team', 'teamContrib', 'individual'];
    let scoreDisplayMode = 'teamContrib';
    const TURN_DIFF_DOT = { easy: '🟢', medium: '🟡', hard: '🔴' };
    const SCORE_MODE_ICON = { team: '🏆', teamContrib: '📊', individual: '🏅' };
    function saveSettings() {
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ turnDifficulty, scoreDisplayMode })); } catch (e) {}
    }
    (function loadSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (saved && CRACK_ENGINE.TURN_DIFF_MULT[saved.turnDifficulty]) turnDifficulty = saved.turnDifficulty;
        if (saved && SCORE_MODES.includes(saved.scoreDisplayMode)) scoreDisplayMode = saved.scoreDisplayMode;
      } catch (e) {}
    })();
    function setTurnDifficulty(d) {
      if (!CRACK_ENGINE.TURN_DIFF_MULT[d]) return;
      turnDifficulty = d;
      saveSettings();
      renderSettings();
    }
    /* Unlike turnDifficulty (only read when the NEXT round's budget is
       computed), this changes what every card is showing right this
       moment — idle, playing, or done all already carry a score display —
       so it always pushes immediately rather than waiting for a natural
       next sync(), same as Say It Without Saying It's own setBoardMode(). */
    function setScoreDisplayMode(m) {
      if (!SCORE_MODES.includes(m)) return;
      scoreDisplayMode = m;
      saveSettings();
      sync();
    }

    /* ── Round state — page memory only, exactly like Say It's `scores`/`state`:
       reloading the host tab starts a fresh game, on purpose (see that file for
       why scores are never persisted). ── */
    let roundNum = 0;
    let scores = [];
    let state = 'idle';          // idle | choosing | playing | done
    let tier = null;
    let word = '';                // the secret — lives ONLY here, never published raw
    let owner = {};                // letter -> 0-based seat, this round
    let revealedLetters = [];
    let excludedLetters = [];
    let rejected = [];
    let guessing = null;           // { seat, id } or null
    let roundId = '';              // guards letter/guess messages against a stale round
    let dealId = '';               // one-shot id while idle/done
    let chooseId = '';             // one-shot id while choosing
    let chooserSeat = -1;          // 0-based, or -1 for "the host is choosing"
    let letterCreditsThisRound = [];
    let lastResult = null;
    let turnBag = [];              // shuffled seats not yet used to START a round this cycle
    let lastStarter = -1;          // avoids the same seat starting twice in a row on reshuffle
    let currentTurnSeat = -1;      // whose turn it is to press a letter; -1 = nobody has letters left
    let turnLimit = 0;             // this round's press budget (CRACK_ENGINE.turnLimitFor)
    let turnsUsed = 0;             // presses spent so far this round

    function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

    /* Fair "who starts pressing letters this round" rotation — a shuffled bag
     * exactly like Say It Without Saying It's giverBag: everyone starts once
     * before anyone starts twice, and a reshuffle never hands the bag straight
     * back to whoever just had it. Persists across rounds in page memory only
     * (see the "Round state" comment above); it is who starts, not the whole
     * in-round order, that this fairness applies to — within a round, turns
     * simply proceed seat 0..count-1 from that starting point (advanceTurn()). */
    function drawStarter() {
      const n = ROOM.count;
      if (!turnBag.length) {
        turnBag = CRACK_ENGINE.shuffle(Array.from({ length: n }, (_, i) => i));
        if (n > 1 && turnBag[turnBag.length - 1] === lastStarter) {
          const swapAt = turnBag.length - 2;
          const tmp = turnBag[swapAt]; turnBag[swapAt] = turnBag[turnBag.length - 1]; turnBag[turnBag.length - 1] = tmp;
        }
      }
      const starter = turnBag.pop();
      lastStarter = starter;
      return starter;
    }

    function hasUnpressedLetters(seat) {
      return CRACK_ENGINE.lettersForSeat(owner, seat).some(l => !revealedLetters.includes(l) && !excludedLetters.includes(l));
    }

    /* Round-robin from whoever currently holds the turn, skipping any seat
     * that has already pressed every letter it was dealt. If nobody has any
     * letters left (the whole alphabet has been pressed), there is no turn
     * left to hand out — the round just waits on a guess or the turn limit. */
    function advanceTurn() {
      const n = ROOM.count;
      for (let step = 1; step <= n; step++) {
        const cand = (currentTurnSeat + step + n) % n;
        if (hasUnpressedLetters(cand)) { currentTurnSeat = cand; return; }
      }
      currentTurnSeat = -1;
    }

    function syncScores(n) {
      n = n || ROOM.count;
      while (scores.length < n) scores.push(0);
    }

    function sync() { ROOM.publish(seat => payloadFor(seat)); renderAll(); }

    function openIdle() {
      state = 'idle'; tier = null; word = ''; owner = {};
      revealedLetters = []; excludedLetters = []; rejected = [];
      guessing = null; roundId = ''; chooserSeat = -1; chooseId = '';
      lastResult = null; // a count change invalidates any result still on screen — the
                          // letters it was scored against belonged to a different room size
      currentTurnSeat = -1; turnLimit = 0; turnsUsed = 0;
      turnBag = []; lastStarter = -1; // room size changed underneath it — start the fairness bag over
      dealId = newId();
      sync();
    }

    /* anyone's card (or the host, with seat -1) asking to open the next round */
    function requestDeal(seat) {
      if (state !== 'idle' && state !== 'done') return;
      state = 'choosing';
      chooserSeat = seat;
      chooseId = newId();
      dealId = '';
      lastResult = null;
      sync();
    }

    function requestTier(seat, id, t) {
      if (state !== 'choosing' || seat !== chooserSeat || id !== chooseId) return;
      if (!ALL_TIERS.includes(t)) return;
      const idx = pickWordIndex(t);
      const card = deckFor(t)[idx];
      word = card.word;
      tier = t;
      owner = CRACK_ENGINE.distributeLetters(word, ROOM.count).owner;
      revealedLetters = []; excludedLetters = []; letterCreditsThisRound = [];
      rejected = new Array(ROOM.count).fill(false);
      guessing = null;
      roundId = newId();
      state = 'playing';
      chooseId = ''; chooserSeat = -1;
      roundNum++;
      // the room's shared press budget for this round, and who presses first —
      // fresh every round since both depend on this specific word and this
      // specific fair rotation, see CRACK_ENGINE.turnLimitFor() / drawStarter().
      // turnDifficulty only affects the NEXT deal, like every other setting
      // on this site — changing it mid-round doesn't retroactively shrink
      // the budget a round already started with.
      turnLimit = CRACK_ENGINE.applyTurnDifficulty(CRACK_ENGINE.turnLimitFor(word, card.level || 'medium'), turnDifficulty);
      turnsUsed = 0;
      currentTurnSeat = drawStarter();
      sync();
    }

    function requestBuzz(seat) {
      if (state !== 'playing' || guessing || rejected[seat]) return;
      guessing = { seat, id: newId() };
      sync();
    }

    function cancelGuess(seat) {
      if (state !== 'playing' || !guessing || guessing.seat !== seat) return;
      guessing = null;
      sync();
    }

    function submitGuess(seat, id, text) {
      if (state !== 'playing' || !guessing || guessing.seat !== seat || guessing.id !== id) return;
      if (CRACK_ENGINE.isCorrectGuess(text, word)) {
        finishRound(seat);
        return;
      }
      rejected[seat] = true;
      guessing = null;
      // once every seat has missed once this round, everyone gets another shot —
      // same "full lap of misses" unlock as Say It Without Saying It's referee lock
      if (Array.from({ length: ROOM.count }, (_, i) => i).every(i => rejected[i])) {
        rejected = new Array(ROOM.count).fill(false);
      }
      sync();
    }

    /* A correct guess pays the whole room, not just the solver: everyone gets
     * the number of letter positions still blank at that moment (an early
     * guess off very little information is worth more to the whole team,
     * not only to whoever happened to type it), and the solver alone gets
     * one extra point on top for having actually called it out. */
    function finishRound(solverSeat) {
      const teamPts = CRACK_ENGINE.remainingBlanks(word, revealedLetters);
      for (let s = 0; s < ROOM.count; s++) scores[s] = (scores[s] || 0) + teamPts;
      scores[solverSeat] = (scores[solverSeat] || 0) + CRACK_ENGINE.SOLVER_BONUS;
      lastResult = {
        word, tier, teamPts, solverBonus: CRACK_ENGINE.SOLVER_BONUS,
        solverPts: teamPts + CRACK_ENGINE.SOLVER_BONUS,
        solverSeat, solverName: ROOM.name(solverSeat),
        letterCredits: letterCreditsThisRound.map(c => ({ name: ROOM.name(c.seat), letter: c.letter })),
      };
      state = 'done';
      guessing = null;
      currentTurnSeat = -1;
      dealId = newId();
      sync();
    }

    /* Consonants: only one seat may press at a time — the one currentTurnSeat
     * names — and it spends one of the room's shared turns. Vowels (see
     * CRACK_ENGINE.VOWELS) are the exception to who may press: nobody owns
     * them, so any seat can press one at any time, and doing so costs
     * nothing from the turn budget (turnLimitFor is sized off consonants
     * only, so a vowel press never risks tripping the limit) — but it still
     * passes the turn along to the next seat with unpressed consonants,
     * same as a consonant press does, so one seat can't camp on free vowels
     * forever and stall the round. Either way this is a separate lock from
     * the buzz-to-guess one below: pressing a letter is a mechanical
     * reveal, guessing the whole word stays open to whoever the room has
     * talked into typing it in, any time. */
    function pressLetter(seat, rid, letter) {
      if (state !== 'playing' || rid !== roundId) return;
      letter = String(letter || '').toUpperCase();
      if (!/^[A-Z]$/.test(letter)) return;
      if (revealedLetters.includes(letter) || excludedLetters.includes(letter)) return;
      const isVowel = CRACK_ENGINE.VOWELS.includes(letter);
      if (!isVowel) {
        if (seat !== currentTurnSeat) return;
        if (owner[letter] !== seat) return;
      }
      if (word.toUpperCase().includes(letter)) {
        revealedLetters.push(letter);
        scores[seat] = (scores[seat] || 0) + CRACK_ENGINE.LETTER_CREDIT;
        letterCreditsThisRound.push({ seat, letter });
      } else {
        excludedLetters.push(letter);
      }
      if (!isVowel) {
        turnsUsed++;
        if (turnsUsed >= turnLimit) { finishRoundByLimit(); return; }
      }
      advanceTurn();
      sync();
    }

    /* The room ran out of turns before anyone guessed it — a shared budget
     * misses together, so everyone pays the same flat penalty rather than
     * singling out whoever happened to hold the last turn. The word is
     * revealed in the result exactly like a normal solve, since by this
     * point continuing to keep it secret serves nobody. */
    function finishRoundByLimit() {
      const penalty = CRACK_ENGINE.penaltyFor(turnLimit);
      for (let s = 0; s < ROOM.count; s++) scores[s] = (scores[s] || 0) - penalty;
      lastResult = {
        limitReached: true, word, tier, penalty,
        letterCredits: letterCreditsThisRound.map(c => ({ name: ROOM.name(c.seat), letter: c.letter })),
      };
      state = 'done';
      guessing = null;
      currentTurnSeat = -1;
      dealId = newId();
      sync();
    }

    /* ── What the players send back, all through `vote` like every other game
       on this site:
         anyone   : { id, choice:'deal' }                       (idle/done only)
         chooser  : { id, choice:'tier', tier }                 (choosing only)
         anyone*  : { choice:'buzz' } / { id, choice:'cancelGuess' }
         guesser  : { id, choice:'guess', text }
         current turn holder : { roundId, choice:'letter', letter }
       (*not currently guessing, and not locked out from a recent wrong guess) ── */
    function handleAnswer(num, data) {
      const v = data && data.vote;
      if (!v) return;
      const seat = num - 1;
      ROOM.clearAnswer(seat);
      if (v.choice === 'deal') { if (v.id === dealId) requestDeal(seat); return; }
      if (v.choice === 'tier') { requestTier(seat, v.id, v.tier); return; }
      if (v.choice === 'buzz') { requestBuzz(seat); return; }
      if (v.choice === 'cancelGuess') { if (v.id === (guessing && guessing.id)) cancelGuess(seat); return; }
      if (v.choice === 'guess') { submitGuess(seat, v.id, v.text); return; }
      if (v.choice === 'letter') { pressLetter(seat, v.roundId, v.letter); return; }
    }

    /* ── Host-screen fallbacks: these call the exact same authoritative
       functions a card's request would — the host tab already holds the
       word and the room state, so there is nothing to re-validate. ── */
    function hostDeal() { requestDeal(-1); }
    function hostPickTier(t) { requestTier(chooserSeat, chooseId, t); }
    function hostBuzz(seat) { requestBuzz(seat); }
    function hostCancelGuess() { if (guessing) cancelGuess(guessing.seat); }
    function hostSubmitGuess() {
      if (!guessing) return;
      const input = document.getElementById('cw-guess-input');
      submitGuess(guessing.seat, guessing.id, input ? input.value : '');
    }
    function hostPressLetter(seat, letter) { pressLetter(seat, roundId, letter); }
    /* Vowels have no owning seat (see pressLetter), so there's no single
     * "this seat's phone is down" case to fall back for — any of the other
     * players can already press one from their own card. This button is
     * just for the rare case nobody's phone is handy at all; crediting it
     * to whoever currently holds the turn (or seat 0 once turns run out) is
     * an arbitrary but harmless choice — the credit is the only thing that's
     * arbitrary here; the turn itself advances the same way any vowel press
     * does, regardless of who's credited. */
    function hostPressVowel(letter) { pressLetter(currentTurnSeat >= 0 ? currentTurnSeat : 0, roundId, letter); }

    /* ── What each card gets — the secret `word` itself never leaves this page;
       only the tile pattern (blanks + whatever's already been revealed) does,
       so there's nothing to leak even by reading the payload in devtools. ── */
    function payloadFor(seat) {
      const base = { game: 'crack', state, tier };
      if (state === 'idle' || state === 'done') {
        base.canDeal = true;
        base.dealId = dealId;
      }
      if (state === 'choosing') {
        base.chooserName = chooserSeat >= 0 ? ROOM.name(chooserSeat) : null;
        if (seat === chooserSeat) {
          base.isChooser = true;
          base.chooseId = chooseId;
          base.tierOptions = ALL_TIERS.map(t => ({ tier: t, pool: (BUCKET[t] || []).length }));
        }
      }
      if (state === 'playing') {
        base.roundId = roundId;
        base.tiles = CRACK_ENGINE.tileLayout(word).map(t => t.isLetter
          ? { isLetter: true, ch: revealedLetters.includes(t.ch) ? t.ch : null }
          : { isLetter: false, ch: t.ch });
        base.excluded = excludedLetters.slice().sort();
        base.myLetters = CRACK_ENGINE.lettersForSeat(owner, seat).map(l => ({
          letter: l,
          pressed: revealedLetters.includes(l) || excludedLetters.includes(l),
          correct: revealedLetters.includes(l),
        }));
        // shared, ownerless letters — identical on every seat's payload,
        // unlike myLetters above which only lists this seat's own consonants
        base.vowels = CRACK_ENGINE.VOWELS.map(l => ({
          letter: l,
          pressed: revealedLetters.includes(l) || excludedLetters.includes(l),
          correct: revealedLetters.includes(l),
        }));
        base.guessing = guessing ? { name: ROOM.name(guessing.seat), id: guessing.id, mine: guessing.seat === seat } : null;
        base.canBuzz = !guessing && !rejected[seat];
        base.rejected = !!rejected[seat];
        base.turnSeat = currentTurnSeat;
        base.turnName = currentTurnSeat >= 0 ? ROOM.name(currentTurnSeat) : null;
        base.myTurn = seat === currentTurnSeat;
        base.turnsUsed = turnsUsed;
        base.turnLimit = turnLimit;
      }
      if (state === 'done' && lastResult) base.result = Object.assign({}, lastResult, { mine: seat === lastResult.solverSeat });
      base.board = Array.from({ length: ROOM.count }, (_, s) => ({ n: ROOM.name(s), p: scores[s] || 0, me: s === seat }));
      // sent unconditionally, same as board above — the card decides what to
      // draw from scoreDisplayMode, this page doesn't prune the payload per mode
      base.scoreDisplayMode = scoreDisplayMode;
      base.teamTotal = scores.reduce((sum, p) => sum + (p || 0), 0);
      base.myScore = scores[seat] || 0;
      return base;
    }

    ROOM.init({
      mount: 'room-mount',
      accent: '#3b82f6',
      counts: [2, 3, 4, 5, 6, 7, 8, 9],
      defaultCount: 5,
      hideSetup: true, // player count and links are set up once on index.html now
      linksNote: tt('linksNote'),
      onPlayerData: handleAnswer,
      onCountChange: n => { syncScores(n); openIdle(); },
    });

    function renderFbWarning() {
      document.getElementById('fb-warning').innerHTML = tt('fbWarning');
      document.getElementById('fb-warning').classList.toggle('hidden', ROOM.enabled);
    }
    renderFbWarning();
    syncScores(ROOM.count);
    openIdle();

    function renderAll() {
      document.getElementById('roundNum').textContent = roundNum;
      renderSettings();
      renderScoreboard();
      renderRoundPanel();
    }

    /* The always-visible row (toggle pill + the live team-total read-out)
       and the popover's own contents (both settings groups) — two functions
       because the row must redraw on every renderAll() (the total changes
       every time scores do) while the popover only needs to redraw when a
       setting itself changes or the popover is opened; renderSettings()
       just calls both so callers never have to remember which one to use. */
    function renderSettingsRow() {
      const el = document.getElementById('settings-row');
      const showTotal = scoreDisplayMode !== 'individual';
      const total = scores.reduce((sum, p) => sum + (p || 0), 0);
      el.innerHTML = `
        <div class="cw-settings-popover-wrap" id="settings-popover-wrap">
          <button type="button" class="cw-settings-toggle-btn" id="settings-toggle-btn" onclick="toggleSettingsPopover()" title="${tt('settingsToggleTitle')}">
            ⚙️ <span class="cst-dots">${TURN_DIFF_DOT[turnDifficulty]}${SCORE_MODE_ICON[scoreDisplayMode]}</span>
          </button>
        </div>
        ${showTotal ? `
          <div class="cw-team-total">
            <span class="ctt-label">${tt('teamTotalLabel')}</span>
            <span class="ctt-score">${total}</span>
          </div>` : ''}`;
    }
    function renderSettingsPopover() {
      const el = document.getElementById('settings-popover');
      el.innerHTML = `
        <div class="cw-setting-group">
          <span class="cw-setting-label">${tt('turnDiffLabel')}</span>
          <div class="cw-setting-btns">
            ${['easy', 'medium', 'hard'].map(d => `
              <button class="cw-diff-btn${turnDifficulty === d ? ' is-on' : ''}" onclick="setTurnDifficulty('${d}')">${tt('turnDiff_' + d)}</button>
            `).join('')}
          </div>
        </div>
        <div class="cw-setting-group">
          <span class="cw-setting-label">${tt('scoreModeLabel')}</span>
          <div class="cw-setting-btns">
            ${SCORE_MODES.map(m => `
              <button class="cw-diff-btn${scoreDisplayMode === m ? ' is-on' : ''}" onclick="setScoreDisplayMode('${m}')">${tt('scoreMode_' + m)}</button>
            `).join('')}
          </div>
        </div>`;
    }
    function renderSettings() {
      renderSettingsRow();
      renderSettingsPopover();
    }

    // popover open/close: click the pill to toggle, click anywhere outside to
    // close. Position is computed from the button's own viewport rect each
    // time it opens (see the CSS comment on .cw-settings-popover for why it
    // can't just be CSS-anchored), with the same flip-above/clamp-horizontal
    // logic as Say It Without Saying It's own settings popover — the toggle
    // button here is centred rather than pinned to one edge, so it can land
    // anywhere across a narrow phone screen's width.
    function positionSettingsPopover() {
      const btn = document.getElementById('settings-toggle-btn');
      const pop = document.getElementById('settings-popover');
      if (!btn || !pop) return;
      const margin = 12;
      const r = btn.getBoundingClientRect();
      const popRect = pop.getBoundingClientRect(); // already unhidden by the caller, so this is its real size
      if (r.bottom + 8 + popRect.height > window.innerHeight - margin) {
        pop.style.bottom = (window.innerHeight - r.top + 8) + 'px';
        pop.style.top = '';
      } else {
        pop.style.top = (r.bottom + 8) + 'px';
        pop.style.bottom = '';
      }
      const maxRight = window.innerWidth - margin - popRect.width;
      const right = Math.min(Math.max(window.innerWidth - r.right, margin), Math.max(margin, maxRight));
      pop.style.right = right + 'px';
    }
    function closeSettingsPopover() {
      document.getElementById('settings-popover').classList.add('hidden');
      window.removeEventListener('resize', positionSettingsPopover);
      window.removeEventListener('scroll', onSettingsPageScroll, true);
    }
    // A scroll on any OTHER scrollable area means the anchor moved under a
    // popover pinned by viewport coordinates, so close it — but not a scroll
    // inside the popover's own overflow-y:auto (its two groups can run taller
    // than a short phone screen), which would otherwise close it on the very
    // attempt to scroll down the list just opened.
    function onSettingsPageScroll(e) {
      const pop = document.getElementById('settings-popover');
      if (pop && e.target instanceof Node && pop.contains(e.target)) return;
      closeSettingsPopover();
    }
    function toggleSettingsPopover() {
      const pop = document.getElementById('settings-popover');
      if (pop.classList.contains('hidden')) {
        pop.classList.remove('hidden');
        positionSettingsPopover();
        window.addEventListener('resize', positionSettingsPopover);
        window.addEventListener('scroll', onSettingsPageScroll, true);
      } else {
        closeSettingsPopover();
      }
    }
    document.addEventListener('click', e => {
      const wrap = document.getElementById('settings-popover-wrap');
      const pop = document.getElementById('settings-popover');
      if (!wrap || !pop) return;
      // composedPath(), not .contains(e.target): picking a setting re-renders
      // the popover's innerHTML from inside its own click handler, which runs
      // first and detaches the clicked button before this listener sees the
      // event — .contains(e.target) would report "not inside" for a node that
      // plainly was. composedPath() is the path captured at dispatch time.
      const path = e.composedPath();
      if (!path.includes(wrap) && !path.includes(pop)) closeSettingsPopover();
    });

    function renderScoreboard() {
      const el = document.getElementById('scoreboard');
      const showPts = scoreDisplayMode !== 'team';
      el.innerHTML = Array.from({ length: ROOM.count }, (_, s) => {
        const isChooser = state === 'choosing' && s === chooserSeat;
        const isGuessing = state === 'playing' && guessing && guessing.seat === s;
        const isRejected = state === 'playing' && rejected[s];
        const isTurn = state === 'playing' && !guessing && s === currentTurnSeat;
        const canBuzzHost = state === 'playing' && !guessing && !rejected[s];
        let tag = '';
        if (isChooser) tag = tt('choosingTag');
        else if (isGuessing) tag = tt('guessingTag');
        else if (isTurn) tag = tt('turnTag');
        else if (isRejected) tag = tt('rejectedTag');
        return `
          <div class="score-card${isGuessing ? ' is-active' : ''}${isTurn ? ' is-turn-card' : ''}">
            <span class="sc-role cw-tag${isGuessing ? ' is-guessing' : ''}${isTurn ? ' is-turn' : ''}${isRejected ? ' is-rejected' : ''}">${tag}</span>
            <span class="sc-name">${esc(ROOM.name(s))}</span>
            ${showPts ? `<span class="sc-pts">${scores[s] || 0}</span>` : ''}
            ${canBuzzHost ? `<button class="cw-fallback-btn" onclick="hostBuzz(${s})">${tt('hostBuzzBtn')}</button>` : ''}
          </div>`;
      }).join('');
    }

    function renderRoundPanel() {
      const el = document.getElementById('round-panel');
      if (state === 'idle' || state === 'done') {
        const doneBlock = state === 'done' && lastResult ? (lastResult.limitReached ? `
          <div class="cw-result">
            <p class="cw-result-line is-limit">${tt('limitResultLine', { word: esc(lastResult.word), pts: lastResult.penalty })}</p>
            ${lastResult.letterCredits.length ? `<p class="cw-result-credits">${tt('creditsLine', { list: lastResult.letterCredits.map(c => `${esc(c.name)} (${esc(c.letter)})`).join('、') })}</p>` : ''}
          </div>` : `
          <div class="cw-result">
            <p class="cw-result-line">${tt('resultLine', { name: esc(lastResult.solverName), word: esc(lastResult.word), teamPts: lastResult.teamPts, bonus: lastResult.solverBonus, pts: lastResult.solverPts })}</p>
            ${lastResult.letterCredits.length ? `<p class="cw-result-credits">${tt('creditsLine', { list: lastResult.letterCredits.map(c => `${esc(c.name)} (${esc(c.letter)})`).join('、') })}</p>` : ''}
          </div>`) : '';
        el.innerHTML = `
          ${doneBlock}
          <p class="cw-idle-note">${tt('idleHostNote')}</p>
          <button class="cw-host-deal" onclick="hostDeal()"${ROOM.enabled ? '' : ' disabled'}>${ROOM.enabled ? tt('hostDealBtn') : tt('linksNeededBtn')}</button>`;
        return;
      }
      if (state === 'choosing') {
        const label = chooserSeat >= 0 ? esc(ROOM.name(chooserSeat)) : '…';
        el.innerHTML = `
          <p class="cw-choosing-note">${tt('choosingHostNote', { name: label })}</p>
          <div class="cw-tier-row">
            ${ALL_TIERS.map(t => `
              <button class="cw-tier-btn" onclick="hostPickTier('${t}')">
                <span>${TIER_EMOJI[t]} ${tt('tier_' + t)}</span><span class="cw-tier-pool">${(BUCKET[t] || []).length}</span>
              </button>`).join('')}
          </div>`;
        return;
      }
      // playing
      const tileRow = CRACK_ENGINE.tileLayout(word).map(t => t.isLetter
        ? (revealedLetters.includes(t.ch) ? `<span class="cw-tile is-revealed">${t.ch}</span>` : `<span class="cw-tile"></span>`)
        : `<span class="cw-tile is-static">${t.ch === ' ' ? '' : esc(t.ch)}</span>`
      ).join('');
      const excludedRow = excludedLetters.length ? `<div class="cw-excluded">${tt('excludedLabel')} ${excludedLetters.slice().sort().join(' · ')}</div>` : '';
      // shared, ownerless letters — anyone's card can press these any time,
      // so this row isn't scoped to a seat the way the grid below is
      const vowelRow = `
        <div class="cw-vowel-row">
          <span class="cw-vowel-label">${tt('vowelsLabel')}</span>
          <div class="cw-letter-row">
            ${CRACK_ENGINE.VOWELS.map(l => {
              const pressed = revealedLetters.includes(l) || excludedLetters.includes(l);
              const correct = revealedLetters.includes(l);
              return `<button class="cw-letter-btn cw-vowel-btn${pressed ? (correct ? ' is-correct' : ' is-wrong') : ''}"${pressed ? ' disabled' : ''} onclick="hostPressVowel('${l}')">${l}</button>`;
            }).join('')}
          </div>
        </div>`;
      const guessBox = guessing ? `
        <div class="cw-guess-box">
          <p>${tt('guessingHostNote', { name: esc(ROOM.name(guessing.seat)) })}</p>
          <div class="cw-guess-row">
            <input type="text" id="cw-guess-input" placeholder="${tt('guessPlaceholder')}">
            <button onclick="hostSubmitGuess()">${tt('hostJudgeBtn')}</button>
            <button class="cw-guess-cancel" onclick="hostCancelGuess()">${tt('hostCancelGuessBtn')}</button>
          </div>
        </div>` : '';
      const lettersGrid = Array.from({ length: ROOM.count }, (_, s) => {
        const mine = CRACK_ENGINE.lettersForSeat(owner, s);
        const isTurn = s === currentTurnSeat;
        return `<div class="cw-seat-letters${isTurn ? ' is-turn' : ''}">
          <span class="cw-seat-name">${esc(ROOM.name(s))}${isTurn ? ' 👆' : ''}</span>
          <div class="cw-letter-row">
            ${mine.map(l => {
              const pressed = revealedLetters.includes(l) || excludedLetters.includes(l);
              const correct = revealedLetters.includes(l);
              const clickable = isTurn && !pressed;
              return `<button class="cw-letter-btn${pressed ? (correct ? ' is-correct' : ' is-wrong') : ''}"${clickable ? '' : ' disabled'} onclick="hostPressLetter(${s},'${l}')">${l}</button>`;
            }).join('')}
          </div>
        </div>`;
      }).join('');
      // the turn budget and who is pressing next — the same info every card shows,
      // since none of it is secret (see the file-level comment on payloadFor)
      const turnFrac = turnLimit ? turnsUsed / turnLimit : 0;
      const turnBar = currentTurnSeat >= 0 ? `
        <div class="cw-turnbar">
          <span class="cw-turnbar-name">🔤 ${tt('turnHostLine', { name: esc(ROOM.name(currentTurnSeat)) })}</span>
          <span class="cw-turn-count${turnFrac >= .8 ? ' is-low' : ''}">${tt('turnCounter', { used: turnsUsed, limit: turnLimit })}</span>
        </div>` : `
        <div class="cw-turnbar">
          <span class="cw-turnbar-name">🔤 ${tt('allLettersDone')}</span>
          <span class="cw-turn-count is-low">${tt('turnCounter', { used: turnsUsed, limit: turnLimit })}</span>
        </div>`;
      el.innerHTML = `
        <div class="cw-tier-chip">${TIER_EMOJI[tier]} ${tt('tier_' + tier)}</div>
        ${turnBar}
        <div class="cw-tiles">${tileRow}</div>
        ${excludedRow}
        ${guessBox}
        ${vowelRow}
        <div class="cw-letters-grid">${lettersGrid}</div>`;
    }

    I18N.onChange(renderAll);
  </script>
</body>
</html>
