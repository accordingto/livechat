<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scenario Ratings · IceBreak Hub</title>
  <script src="supabase-config.js"></script>
  <script src="game-data.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100dvh;
      padding: 32px 20px 64px;
    }
    .page-header {
      max-width: 860px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-title { font-size: 1.5rem; font-weight: 800; }
    .page-title span { color: #4ade80; }
    a.back { color: #555; text-decoration: none; font-size: .9rem; transition: color .2s; }
    a.back:hover { color: #eee; }

    /* ── Filter bar ── */
    .filter-row {
      max-width: 860px;
      margin: 0 auto 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label { font-size: .75rem; color: #555; letter-spacing: 1px; text-transform: uppercase; margin-right: 4px; }
    .filter-btn {
      border: 1.5px solid #1e1e42;
      border-radius: 999px;
      padding: 5px 16px;
      font-size: .8rem;
      font-weight: 700;
      color: #555;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      transition: border-color .18s, color .18s, background .18s;
    }
    .filter-btn:hover { border-color: #4ade80; color: #4ade80; }
    .filter-btn.active { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,.1); }

    /* ── Summary bar ── */
    .summary {
      max-width: 860px;
      margin: 0 auto 28px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .summary-chip {
      background: #13132b;
      border: 1px solid #1e1e42;
      border-radius: 12px;
      padding: 10px 20px;
      font-size: .85rem;
    }
    .summary-chip strong { font-size: 1.15rem; }
    .summary-chip .up   { color: #4ade80; }
    .summary-chip .down { color: #f87171; }

    /* ── Bulk delete bar ── */
    .bulk-row {
      max-width: 860px;
      margin: 0 auto 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      padding: 12px 18px;
      background: rgba(239,68,68,.04);
      border: 1px solid rgba(239,68,68,.15);
      border-radius: 12px;
    }
    .bulk-del-btn {
      border: 1.5px solid rgba(239,68,68,.4);
      border-radius: 999px;
      background: transparent;
      color: #ef4444;
      font-size: .82rem;
      font-weight: 700;
      padding: 6px 18px;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, border-color .15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .bulk-del-btn:hover:not(:disabled) { background: rgba(239,68,68,.1); border-color: #ef4444; }
    .bulk-del-btn:disabled { opacity: .35; cursor: not-allowed; }
    .bulk-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 16px;
      padding: 0 5px;
      border-radius: 999px;
      background: rgba(239,68,68,.2);
      color: #ef4444;
      font-size: .68rem;
      font-weight: 900;
    }
    .bulk-count:empty { display: none; }

    /* ── Game section ── */
    .game-section { max-width: 860px; margin: 0 auto 36px; }
    .game-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e1e42;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .game-count {
      font-size: .75rem;
      font-weight: 600;
      color: #555;
      letter-spacing: 1px;
    }

    /* ── Scenario row ── */
    .scenario-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid transparent;
      margin-bottom: 6px;
      transition: background .15s;
    }
    .scenario-row:hover { background: rgba(255,255,255,.03); }
    .scenario-row.liked    { border-color: rgba(74,222,128,.2);  background: rgba(74,222,128,.04); }
    .scenario-row.liked:hover { background: rgba(74,222,128,.07); }
    .scenario-row.disliked { border-color: rgba(248,113,113,.25); background: rgba(248,113,113,.05); }
    .scenario-row.disliked:hover { background: rgba(248,113,113,.08); }

    .sc-thumbs {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
      min-width: 56px;
      padding-top: 2px;
      font-size: .85rem;
      line-height: 1.5;
    }
    .sc-thumb-up   { color: #4ade80; font-weight: 700; }
    .sc-thumb-down { color: #f87171; font-weight: 700; }
    .sc-thumb-num  { margin-left: 4px; }

    .sc-body { flex: 1; min-width: 0; }
    .sc-text {
      font-size: .93rem;
      line-height: 1.55;
      color: #ccc;
      word-break: break-word;
    }
    .sc-meta {
      font-size: .75rem;
      color: #444;
      margin-top: 3px;
    }
    .sc-meta strong { color: #666; }

    .sc-detail {
      font-size: .82rem;
      color: #666;
      line-height: 1.6;
      margin-top: 5px;
    }
    .detail-opt {
      display: inline-block;
      font-size: .65rem; font-weight: 900; letter-spacing: 1px;
      padding: 1px 7px; border-radius: 999px; margin-right: 3px;
    }
    .opt-a { background: #4f9eff; color: #0d0d1a; }
    .opt-b { background: #ef4444; color: #fff; }
    .detail-tag {
      font-size: .65rem; font-weight: 900; letter-spacing: 1px;
      padding: 1px 7px; border-radius: 999px; margin-right: 3px;
      background: rgba(255,255,255,.1); color: #aaa;
    }
    .tag-team   { background: rgba(6,182,212,.2);   color: #06b6d4; }
    .tag-judge  { background: rgba(232,121,249,.2);  color: #e879f9; }
    .tag-char   { background: rgba(245,158,11,.2);   color: #f59e0b; }
    .tag-action { background: rgba(129,140,248,.2);  color: #818cf8; }
    .tag-place  { background: rgba(52,211,153,.2);   color: #34d399; }

    .sc-del {
      flex-shrink: 0;
      background: none;
      border: 1.5px solid #2a1a1a;
      border-radius: 8px;
      color: #3a1a1a;
      font-size: .85rem;
      padding: 4px 9px;
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
      font-family: inherit;
      align-self: center;
    }
    .sc-del:hover {
      border-color: #ef4444;
      color: #ef4444;
      background: rgba(239,68,68,.08);
    }
    .sc-del.deleting { opacity: .4; pointer-events: none; }

    /* ── Loading / empty ── */
    .state-msg {
      max-width: 860px;
      margin: 60px auto;
      text-align: center;
      color: #444;
      font-size: 1rem;
    }
    .state-msg .big { font-size: 2.5rem; margin-bottom: 12px; }

    .no-data { color: #333; font-size: .85rem; padding: 8px 0; }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="page-title">📊 Scenario <span>Ratings</span></div>
    <a class="back" href="index.html">← Back to Hub</a>
  </div>

  <div class="filter-row" id="filter-row">
    <span class="filter-label">Show</span>
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="liked">👍 Popular</button>
    <button class="filter-btn" data-filter="disliked">👎 Disliked</button>
  </div>

  <div class="bulk-row" id="bulk-row">
    <span class="filter-label">Bulk delete</span>
    <button class="bulk-del-btn" id="bulk-del-btn" onclick="bulkDelete()">
      🗑️ Delete all disliked (👎 &gt; 👍)
      <span class="bulk-count" id="bulk-count"></span>
    </button>
  </div>

  <div class="summary" id="summary"></div>
  <div id="content">
    <div class="state-msg"><div class="big">⏳</div>Loading ratings…</div>
  </div>

<script>
const GAME_META = {
  hottake:     { name: 'Hot Take Roulette',    emoji: '🔥' },
  sophies:     { name: "Sophie's Choice",      emoji: '🤔' },
  persuade:    { name: 'Persuade Together!',   emoji: '🤝' },
  scene:       { name: "You're In The Scene",  emoji: '🎭' },
  storyteller: { name: 'Story Teller',         emoji: '📖' },
};

/* ── 與 rating.js 相同的 hash 函式 ── */
function hash(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(36).padStart(7, '0');
}

/* ── 建立 hash → 情境內容 的反查表 ── */
const _byHash = {};
const _charByHash = {}, _actionByHash = {}, _placeByHash = {};

(function buildMaps() {
  GAME_DATA.hottake.forEach(text => {
    _byHash[hash(text)] = { main: text, detail: null };
  });
  GAME_DATA.sophies.forEach(sc => {
    _byHash[hash(sc.situation)] = {
      main:   sc.situation,
      detail: `<span class="detail-opt opt-a">A</span> ${sc.a} &nbsp; <span class="detail-opt opt-b">B</span> ${sc.b}`,
    };
  });
  GAME_DATA.persuade.forEach(sc => {
    _byHash[hash(sc.situation)] = {
      main:   sc.situation,
      detail: `<span class="detail-tag tag-team">👥 Team</span> ${sc.team} &nbsp;·&nbsp; <span class="detail-tag tag-judge">⚖️ Judge</span> ${sc.judge}`,
    };
  });
  GAME_DATA.scene.forEach(sc => {
    _byHash[hash(sc.title)] = {
      main:   `${sc.emoji} <strong>${sc.title}</strong>`,
      detail: sc.situation,
    };
  });
  GAME_DATA.storyteller.characters.forEach(c => { _charByHash[hash(c)]   = c; });
  GAME_DATA.storyteller.actions.forEach(a =>    { _actionByHash[hash(a)] = a; });
  GAME_DATA.storyteller.locations.forEach(p =>  { _placeByHash[hash(p)]  = p; });
})();

function getScenarioDetail(gameId, scenarioId) {
  if (!scenarioId) return null;
  if (gameId === 'storyteller') {
    const parts = scenarioId.split('-');
    if (parts.length === 3) {
      const char   = _charByHash[parts[0]];
      const action = _actionByHash[parts[1]];
      const place  = _placeByHash[parts[2]];
      if (char && action && place) return {
        main:   null,
        detail: `<span class="detail-tag tag-char">👤</span> ${char} &nbsp;·&nbsp; <span class="detail-tag tag-action">⚡</span> ${action} &nbsp;·&nbsp; <span class="detail-tag tag-place">📍</span> ${place}`,
      };
    }
    return null;
  }
  return _byHash[scenarioId] ?? null;
}

let allData      = [];
let activeFilter = 'all';

function render() {
  const content = document.getElementById('content');
  const summary = document.getElementById('summary');

  /* group by game_id + scenario_id */
  const map = {};
  allData.forEach(row => {
    if (!row.scenario_id) return;
    const key = `${row.game_id}||${row.scenario_id}`;
    if (!map[key]) map[key] = { gameId: row.game_id, scenarioId: row.scenario_id, ratings: [] };
    map[key].ratings.push(row.rating);
  });

  const items = Object.values(map).map(g => {
    const up   = g.ratings.filter(r => r > 0).length;
    const down = g.ratings.filter(r => r < 0).length;
    const net  = up - down;
    const tier = net > 0 ? 'liked' : net < 0 ? 'disliked' : '';
    return { ...g, up, down, net, tier };
  });

  /* summary */
  const totalUp    = items.reduce((s, i) => s + i.up, 0);
  const totalDown  = items.reduce((s, i) => s + i.down, 0);
  summary.innerHTML = `
    <div class="summary-chip">Scenarios rated <strong>${items.length}</strong></div>
    <div class="summary-chip">Total <strong class="up">👍 ${totalUp}</strong></div>
    <div class="summary-chip">Total <strong class="down">👎 ${totalDown}</strong></div>
  `;

  /* filter */
  const filtered = activeFilter === 'liked'    ? items.filter(i => i.net > 0)
                 : activeFilter === 'disliked' ? items.filter(i => i.net < 0)
                 :                               items;

  if (!filtered.length) {
    content.innerHTML = `<div class="state-msg"><div class="big">🎉</div>No scenarios in this category yet.</div>`;
    updateBulkCount(items);
    return;
  }

  /* group by game */
  const byGame = {};
  filtered.forEach(item => {
    if (!byGame[item.gameId]) byGame[item.gameId] = [];
    byGame[item.gameId].push(item);
  });

  /* sort: most disliked (lowest net) first */
  Object.values(byGame).forEach(arr => arr.sort((a, b) => a.net - b.net));

  const gameOrder = ['hottake','sophies','persuade','scene','storyteller'];
  let html = '';

  gameOrder.forEach(gameId => {
    const gameItems = byGame[gameId];
    if (!gameItems) return;
    const meta = GAME_META[gameId] || { name: gameId, emoji: '🎮' };

    const rowsHTML = gameItems.map(item => {
      const info    = getScenarioDetail(item.gameId, item.scenarioId);
      const mainHTML = info?.main   ? `<div class="sc-text">${info.main}</div>` : '';
      const detHTML  = info?.detail ? `<div class="sc-detail">${info.detail}</div>` : '';
      const fallback = !info ? `<div class="sc-text" style="color:#444">(scenario #${item.scenarioId})</div>` : '';
      const rowId    = `row-${item.gameId}-${item.scenarioId}`;
      const votes    = item.up + item.down;
      return `
        <div class="scenario-row ${item.tier}" id="${rowId}">
          <div class="sc-thumbs">
            <span class="sc-thumb-up">👍<span class="sc-thumb-num">${item.up}</span></span>
            <span class="sc-thumb-down">👎<span class="sc-thumb-num">${item.down}</span></span>
          </div>
          <div class="sc-body">
            ${mainHTML}${detHTML}${fallback}
            <div class="sc-meta"><strong>${votes}</strong> vote${votes !== 1 ? 's' : ''}</div>
          </div>
          <button class="sc-del" onclick="deleteRatings('${item.gameId}','${item.scenarioId}','${rowId}')">🗑️</button>
        </div>`;
    }).join('');

    html += `
      <div class="game-section">
        <div class="game-title">
          ${meta.emoji} ${meta.name}
          <span class="game-count">${gameItems.length} scenario${gameItems.length !== 1 ? 's' : ''}</span>
        </div>
        ${rowsHTML}
      </div>`;
  });

  content.innerHTML = html;
  updateBulkCount(items);
}

function updateBulkCount(items) {
  if (!items) {
    /* recompute from allData */
    const map = {};
    allData.forEach(row => {
      if (!row.scenario_id) return;
      const key = `${row.game_id}||${row.scenario_id}`;
      if (!map[key]) map[key] = { gameId: row.game_id, scenarioId: row.scenario_id, ratings: [] };
      map[key].ratings.push(row.rating);
    });
    items = Object.values(map).map(g => {
      const up   = g.ratings.filter(r => r > 0).length;
      const down = g.ratings.filter(r => r < 0).length;
      return { ...g, up, down, net: up - down };
    });
  }
  const targets = items.filter(i => i.down > i.up);
  const badge = document.getElementById('bulk-count');
  if (badge) badge.textContent = targets.length || '';
  const btn = document.getElementById('bulk-del-btn');
  if (btn) btn.disabled = targets.length === 0;
}

/* ── 刪除某情境的所有評分 ── */
async function deleteRatings(gameId, scenarioId, rowId) {
  if (!confirm('Delete all ratings for this scenario?')) return;

  const btn = document.querySelector(`#${CSS.escape(rowId)} .sc-del`);
  if (btn) btn.classList.add('deleting');

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/game_ratings` +
      `?game_id=eq.${encodeURIComponent(gameId)}` +
      `&scenario_id=eq.${encodeURIComponent(scenarioId)}`,
      {
        method: 'DELETE',
        headers: {
          'apikey':        SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        }
      }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allData = allData.filter(r => !(r.game_id === gameId && r.scenario_id === scenarioId));
    render();
  } catch (e) {
    alert('Delete failed: ' + e.message);
    if (btn) btn.classList.remove('deleting');
  }
}

/* Filter buttons */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});

/* ── Bulk delete (all where 👎 > 👍) ── */
async function bulkDelete() {
  /* find targets from allData */
  const map = {};
  allData.forEach(row => {
    if (!row.scenario_id) return;
    const key = `${row.game_id}||${row.scenario_id}`;
    if (!map[key]) map[key] = { gameId: row.game_id, scenarioId: row.scenario_id, ratings: [] };
    map[key].ratings.push(row.rating);
  });
  const targets = Object.values(map)
    .map(g => {
      const up   = g.ratings.filter(r => r > 0).length;
      const down = g.ratings.filter(r => r < 0).length;
      return { ...g, up, down };
    })
    .filter(g => g.down > g.up);

  if (!targets.length) return;
  if (!confirm(`Delete ratings for ${targets.length} disliked scenario${targets.length !== 1 ? 's' : ''}?\n\nThis cannot be undone.`)) return;

  const btn = document.getElementById('bulk-del-btn');
  btn.disabled = true;
  const origHTML = btn.innerHTML;
  btn.innerHTML = '⏳ Deleting…';

  let failed = 0;
  for (const t of targets) {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/game_ratings` +
        `?game_id=eq.${encodeURIComponent(t.gameId)}` +
        `&scenario_id=eq.${encodeURIComponent(t.scenarioId)}`,
        {
          method: 'DELETE',
          headers: {
            'apikey':        SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          }
        }
      );
      if (!res.ok) throw new Error('HTTP ' + res.status);
      allData = allData.filter(r => !(r.game_id === t.gameId && r.scenario_id === t.scenarioId));
    } catch (e) {
      failed++;
    }
  }

  if (failed) alert(`${failed} deletion${failed !== 1 ? 's' : ''} failed. Reload to refresh.`);
  render();
  btn.innerHTML = origHTML;
}

/* Fetch from Supabase */
async function load() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/game_ratings?select=game_id,scenario_id,rating&order=game_id`,
      {
        headers: {
          'apikey':        SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        }
      }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allData = await res.json();

    if (!allData.length) {
      document.getElementById('content').innerHTML =
        `<div class="state-msg"><div class="big">👍</div>No ratings yet — go play some games!</div>`;
      document.getElementById('summary').innerHTML = '';
      return;
    }
    render();
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="state-msg"><div class="big">⚠️</div>Could not load ratings.<br><small style="color:#333">${e.message}</small></div>`;
  }
}

load();
</script>
</body>
</html>
