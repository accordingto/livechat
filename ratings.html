<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scenario Ratings · IceBreak Hub</title>
  <script src="supabase-config.js"></script>
  <script src="game-data.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100dvh;
      padding: 32px 20px 64px;
    }
    .page-header {
      max-width: 860px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-title { font-size: 1.5rem; font-weight: 800; }
    .page-title span { color: #f59e0b; }
    a.back { color: #555; text-decoration: none; font-size: .9rem; transition: color .2s; }
    a.back:hover { color: #eee; }

    /* ── Filter bar ── */
    .filter-row {
      max-width: 860px;
      margin: 0 auto 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label { font-size: .75rem; color: #555; letter-spacing: 1px; text-transform: uppercase; margin-right: 4px; }
    .filter-btn {
      border: 1.5px solid #1e1e42;
      border-radius: 999px;
      padding: 5px 16px;
      font-size: .8rem;
      font-weight: 700;
      color: #555;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      transition: border-color .18s, color .18s, background .18s;
    }
    .filter-btn:hover { border-color: #f59e0b; color: #f59e0b; }
    .filter-btn.active { border-color: #f59e0b; color: #f59e0b; background: rgba(245,158,11,.1); }

    /* ── Summary bar ── */
    .summary {
      max-width: 860px;
      margin: 0 auto 28px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .summary-chip {
      background: #13132b;
      border: 1px solid #1e1e42;
      border-radius: 12px;
      padding: 10px 20px;
      font-size: .85rem;
    }
    .summary-chip strong { color: #f59e0b; font-size: 1.15rem; }

    /* ── Game section ── */
    .game-section { max-width: 860px; margin: 0 auto 36px; }
    .game-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e1e42;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .game-count {
      font-size: .75rem;
      font-weight: 600;
      color: #555;
      letter-spacing: 1px;
    }

    /* ── Scenario row ── */
    .scenario-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid transparent;
      margin-bottom: 6px;
      transition: background .15s;
    }
    .scenario-row:hover { background: rgba(255,255,255,.03); }
    .scenario-row.bad  { border-color: rgba(239,68,68,.25); background: rgba(239,68,68,.05); }
    .scenario-row.bad:hover { background: rgba(239,68,68,.08); }
    .scenario-row.ok   { border-color: rgba(245,158,11,.2); background: rgba(245,158,11,.04); }
    .scenario-row.good { border-color: rgba(34,197,94,.18); background: rgba(34,197,94,.04); }

    .sc-stars {
      font-size: 1rem;
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 88px;
      padding-top: 2px;
    }
    .sc-stars.bad  { color: #ef4444; }
    .sc-stars.ok   { color: #f59e0b; }
    .sc-stars.good { color: #4ade80; }

    .sc-body { flex: 1; min-width: 0; }
    .sc-text {
      font-size: .93rem;
      line-height: 1.55;
      color: #ccc;
      word-break: break-word;
    }
    .sc-row-bad .sc-text { color: #fca5a5; }
    .sc-meta {
      font-size: .75rem;
      color: #444;
      margin-top: 3px;
    }
    .sc-meta strong { color: #666; }

    .sc-id {
      font-size: .72rem;
      color: #333;
      flex-shrink: 0;
      padding-top: 4px;
      font-family: 'Courier New', monospace;
    }

    .sc-del {
      flex-shrink: 0;
      background: none;
      border: 1.5px solid #2a1a1a;
      border-radius: 8px;
      color: #3a1a1a;
      font-size: .85rem;
      padding: 4px 9px;
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
      font-family: inherit;
      align-self: center;
    }
    .sc-del:hover {
      border-color: #ef4444;
      color: #ef4444;
      background: rgba(239,68,68,.08);
    }
    .sc-del.deleting {
      opacity: .4;
      pointer-events: none;
    }

    /* ── Loading / empty ── */
    .state-msg {
      max-width: 860px;
      margin: 60px auto;
      text-align: center;
      color: #444;
      font-size: 1rem;
    }
    .state-msg .big { font-size: 2.5rem; margin-bottom: 12px; }

    .sc-detail {
      font-size: .82rem;
      color: #666;
      line-height: 1.6;
      margin-top: 5px;
    }
    .detail-opt {
      display: inline-block;
      font-size: .65rem; font-weight: 900; letter-spacing: 1px;
      padding: 1px 7px; border-radius: 999px; margin-right: 3px;
    }
    .opt-a { background: #4f9eff; color: #0d0d1a; }
    .opt-b { background: #ef4444; color: #fff; }
    .detail-tag {
      font-size: .65rem; font-weight: 900; letter-spacing: 1px;
      padding: 1px 7px; border-radius: 999px; margin-right: 3px;
      background: rgba(255,255,255,.1); color: #aaa;
    }
    .tag-team   { background: rgba(6,182,212,.2);   color: #06b6d4; }
    .tag-judge  { background: rgba(232,121,249,.2);  color: #e879f9; }
    .tag-char   { background: rgba(245,158,11,.2);   color: #f59e0b; }
    .tag-action { background: rgba(129,140,248,.2);  color: #818cf8; }
    .tag-place  { background: rgba(52,211,153,.2);   color: #34d399; }

    /* ── No data badge ── */
    .no-data { color: #333; font-size: .85rem; padding: 8px 0; }

    /* ── Bulk delete bar ── */
    .bulk-row {
      max-width: 860px;
      margin: 0 auto 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      padding: 12px 18px;
      background: rgba(239,68,68,.04);
      border: 1px solid rgba(239,68,68,.15);
      border-radius: 12px;
    }
    .bulk-stars { display: flex; gap: 1px; }
    .bulk-star {
      background: none;
      border: none;
      font-size: 1.35rem;
      color: #2a1010;
      cursor: pointer;
      padding: 2px 4px;
      transition: color .1s, transform .1s;
      font-family: inherit;
      line-height: 1;
    }
    .bulk-star.active { color: #ef4444; }
    .bulk-star:hover  { color: #f87171; transform: scale(1.15); }
    .bulk-star:active { transform: scale(.88); }
    .bulk-del-btn {
      border: 1.5px solid rgba(239,68,68,.4);
      border-radius: 999px;
      background: transparent;
      color: #ef4444;
      font-size: .82rem;
      font-weight: 700;
      padding: 6px 18px;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, border-color .15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .bulk-del-btn:hover:not(:disabled) { background: rgba(239,68,68,.1); border-color: #ef4444; }
    .bulk-del-btn:disabled { opacity: .35; cursor: not-allowed; }
    .bulk-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 16px;
      padding: 0 5px;
      border-radius: 999px;
      background: rgba(239,68,68,.2);
      color: #ef4444;
      font-size: .68rem;
      font-weight: 900;
    }
    .bulk-count:empty { display: none; }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="page-title">📊 Scenario <span>Ratings</span></div>
    <a class="back" href="index.html">← Back to Hub</a>
  </div>

  <div class="filter-row" id="filter-row">
    <span class="filter-label">Show</span>
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="bad">⚠️ Low (≤ 3★)</button>
    <button class="filter-btn" data-filter="ok">Mid (3–4★)</button>
    <button class="filter-btn" data-filter="good">Top (≥ 4★)</button>
  </div>

  <div class="bulk-row" id="bulk-row">
    <span class="filter-label">Bulk delete</span>
    <div class="bulk-stars" id="bulk-stars">
      <button class="bulk-star" data-n="1">★</button>
      <button class="bulk-star" data-n="2">★</button>
      <button class="bulk-star active" data-n="3">★</button>
      <button class="bulk-star" data-n="4">★</button>
      <button class="bulk-star" data-n="5">★</button>
    </div>
    <button class="bulk-del-btn" id="bulk-del-btn" onclick="bulkDelete()">
      🗑️ Delete all ≤ <span id="bulk-n-label">3</span>★
      <span class="bulk-count" id="bulk-count"></span>
    </button>
  </div>

  <div class="summary" id="summary"></div>
  <div id="content">
    <div class="state-msg"><div class="big">⏳</div>Loading ratings…</div>
  </div>

<script>
const GAME_META = {
  hottake:     { name: 'Hot Take Roulette',    emoji: '🔥' },
  sophies:     { name: "Sophie's Choice",      emoji: '🤔' },
  persuade:    { name: 'Persuade Together!',   emoji: '🤝' },
  scene:       { name: "You're In The Scene",  emoji: '🎭' },
};

/* ── 與 rating.js 相同的 hash 函式 ── */
function hash(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(36).padStart(7, '0');
}

/* ── 建立 hash → 情境內容 的反查表 ── */
const _byHash = {};

(function buildMaps() {
  GAME_DATA.hottake.forEach(text => {
    _byHash[hash(text)] = { main: text, detail: null };
  });
  GAME_DATA.sophies.forEach(sc => {
    _byHash[hash(sc.situation)] = {
      main:   sc.situation,
      detail: `<span class="detail-opt opt-a">A</span> ${sc.a} &nbsp; <span class="detail-opt opt-b">B</span> ${sc.b}`,
    };
  });
  GAME_DATA.persuade.forEach(sc => {
    _byHash[hash(sc.situation)] = {
      main:   sc.situation,
      detail: `<span class="detail-tag tag-team">👥 Team</span> ${sc.team} &nbsp;·&nbsp; <span class="detail-tag tag-judge">⚖️ Judge</span> ${sc.judge}`,
    };
  });
  GAME_DATA.scene.forEach(sc => {
    _byHash[hash(sc.title)] = {
      main:   `${sc.emoji} <strong>${sc.title}</strong>`,
      detail: sc.situation,
    };
  });
})();

/* ── 根據 hash 取得情境細節 ── */
function getScenarioDetail(gameId, scenarioId) {
  if (!scenarioId) return null;
  return _byHash[scenarioId] ?? null;
}

function starsHTML(avg) {
  const full  = Math.round(avg);
  let s = '';
  for (let i = 1; i <= 5; i++) s += i <= full ? '★' : '☆';
  return s;
}

function tierClass(avg) {
  if (avg <= 3) return 'bad';
  if (avg < 4)  return 'ok';
  return 'good';
}

let allData   = [];
let activeFilter = 'all';

function render() {
  const content = document.getElementById('content');
  const summary = document.getElementById('summary');

  /* group by game_id + scenario_id, skip rows with empty scenario_id */
  const map = {};
  allData.forEach(row => {
    if (!row.scenario_id) return;
    const key = `${row.game_id}||${row.scenario_id}`;
    if (!map[key]) map[key] = { gameId: row.game_id, scenarioId: row.scenario_id, ratings: [] };
    map[key].ratings.push(row.rating);
  });

  const items = Object.values(map).map(g => {
    const avg = g.ratings.reduce((s,r) => s+r, 0) / g.ratings.length;
    return { ...g, avg, tier: tierClass(avg) };
  });

  /* summary */
  const totalItems  = items.length;
  const badItems    = items.filter(i => i.avg <= 3).length;
  const totalVotes  = allData.length;
  summary.innerHTML = `
    <div class="summary-chip">Scenarios rated <strong>${totalItems}</strong></div>
    <div class="summary-chip">Total votes <strong>${totalVotes}</strong></div>
    <div class="summary-chip">Low-rated (≤3★) <strong style="color:#ef4444">${badItems}</strong></div>
  `;

  /* filter */
  const filtered = activeFilter === 'all'  ? items
                 : activeFilter === 'bad'  ? items.filter(i => i.avg <= 3)
                 : activeFilter === 'ok'   ? items.filter(i => i.avg > 3 && i.avg < 4)
                 :                           items.filter(i => i.avg >= 4);

  if (!filtered.length) {
    content.innerHTML = `<div class="state-msg"><div class="big">🎉</div>No scenarios in this category yet.</div>`;
    return;
  }

  /* group by game */
  const byGame = {};
  filtered.forEach(item => {
    if (!byGame[item.gameId]) byGame[item.gameId] = [];
    byGame[item.gameId].push(item);
  });

  /* sort each game's items by avg asc (worst first) */
  Object.values(byGame).forEach(arr => arr.sort((a,b) => a.avg - b.avg));

  const gameOrder = ['hottake','sophies','persuade','scene'];
  let html = '';

  gameOrder.forEach(gameId => {
    const gameItems = byGame[gameId];
    if (!gameItems) return;
    const meta = GAME_META[gameId] || { name: gameId, emoji: '🎮' };

    const rowsHTML = gameItems.map(item => {
      const info     = getScenarioDetail(item.gameId, item.scenarioId);
      const tier     = item.tier;
      const avgFixed = item.avg.toFixed(1);
      const mainHTML = info?.main  ? `<div class="sc-text">${info.main}</div>` : '';
      const detHTML  = info?.detail? `<div class="sc-detail">${info.detail}</div>` : '';
      const fallback = !info ? `<div class="sc-text" style="color:#444">(scenario #${item.scenarioId})</div>` : '';
      const rowId    = `row-${item.gameId}-${item.scenarioId}`;
      return `
        <div class="scenario-row ${tier}" id="${rowId}">
          <div class="sc-stars ${tier}">${starsHTML(item.avg)}<br>${avgFixed}</div>
          <div class="sc-body">
            ${mainHTML}${detHTML}${fallback}
            <div class="sc-meta"><strong>${item.ratings.length}</strong> vote${item.ratings.length > 1 ? 's' : ''}</div>
          </div>
          <button class="sc-del" onclick="deleteRatings('${item.gameId}','${item.scenarioId}','${rowId}')">🗑️</button>
        </div>`;
    }).join('');

    html += `
      <div class="game-section">
        <div class="game-title">
          ${meta.emoji} ${meta.name}
          <span class="game-count">${gameItems.length} scenario${gameItems.length > 1 ? 's' : ''}</span>
        </div>
        ${rowsHTML}
      </div>`;
  });

  content.innerHTML = html;
  updateBulkCount();
}

/* ── 刪除某情境的所有評分 ── */
async function deleteRatings(gameId, scenarioId, rowId) {
  if (!confirm('Delete all ratings for this scenario?')) return;

  const btn = document.querySelector(`#${CSS.escape(rowId)} .sc-del`);
  if (btn) btn.classList.add('deleting');

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/game_ratings` +
      `?game_id=eq.${encodeURIComponent(gameId)}` +
      `&scenario_id=eq.${encodeURIComponent(scenarioId)}`,
      {
        method: 'DELETE',
        headers: {
          'apikey':        SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        }
      }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);

    /* 從本地資料移除並重新 render */
    allData = allData.filter(r => !(r.game_id === gameId && r.scenario_id === scenarioId));
    render();
  } catch (e) {
    alert('Delete failed: ' + e.message);
    if (btn) btn.classList.remove('deleting');
  }
}

/* Filter buttons */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});

/* ── Bulk delete ── */
let bulkN = 3;

function getBulkTargets() {
  const map = {};
  allData.forEach(row => {
    if (!row.scenario_id) return;
    const key = `${row.game_id}||${row.scenario_id}`;
    if (!map[key]) map[key] = { gameId: row.game_id, scenarioId: row.scenario_id, ratings: [] };
    map[key].ratings.push(row.rating);
  });
  return Object.values(map)
    .map(g => ({ ...g, avg: g.ratings.reduce((s,r) => s+r, 0) / g.ratings.length }))
    .filter(g => g.avg <= bulkN);
}

function updateBulkCount() {
  const targets = getBulkTargets();
  const badge = document.getElementById('bulk-count');
  if (badge) badge.textContent = targets.length || '';
  const btn = document.getElementById('bulk-del-btn');
  if (btn) btn.disabled = targets.length === 0;
}

/* initialise star highlights */
(function initBulkStars() {
  document.querySelectorAll('.bulk-star').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.n, 10) <= bulkN);
  });
})();

document.querySelectorAll('.bulk-star').forEach(btn => {
  btn.addEventListener('click', () => {
    bulkN = parseInt(btn.dataset.n, 10);
    document.querySelectorAll('.bulk-star').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.n, 10) <= bulkN);
    });
    document.getElementById('bulk-n-label').textContent = bulkN;
    updateBulkCount();
  });
});

async function bulkDelete() {
  const targets = getBulkTargets();
  if (!targets.length) return;
  if (!confirm(`Delete ratings for ${targets.length} scenario${targets.length > 1 ? 's' : ''} rated ≤ ${bulkN}★?\n\nThis cannot be undone.`)) return;

  const btn = document.getElementById('bulk-del-btn');
  btn.disabled = true;
  const origHTML = btn.innerHTML;
  btn.innerHTML = '⏳ Deleting…';

  let failed = 0;
  for (const t of targets) {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/game_ratings` +
        `?game_id=eq.${encodeURIComponent(t.gameId)}` +
        `&scenario_id=eq.${encodeURIComponent(t.scenarioId)}`,
        {
          method: 'DELETE',
          headers: {
            'apikey':        SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          }
        }
      );
      if (!res.ok) throw new Error('HTTP ' + res.status);
      allData = allData.filter(r => !(r.game_id === t.gameId && r.scenario_id === t.scenarioId));
    } catch (e) {
      failed++;
    }
  }

  if (failed) alert(`${failed} deletion${failed > 1 ? 's' : ''} failed. Reload to refresh.`);
  render();
  btn.innerHTML = origHTML;
}

/* Fetch from Supabase */
async function load() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/game_ratings?select=game_id,scenario_id,rating&order=game_id`,
      {
        headers: {
          'apikey':        SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        }
      }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allData = await res.json();

    if (!allData.length) {
      document.getElementById('content').innerHTML =
        `<div class="state-msg"><div class="big">⭐</div>No ratings yet — go play some games!</div>`;
      document.getElementById('summary').innerHTML = '';
      return;
    }
    render();
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="state-msg"><div class="big">⚠️</div>Could not load ratings.<br><small style="color:#333">${e.message}</small></div>`;
  }
}

load();
</script>
</body>
</html>
