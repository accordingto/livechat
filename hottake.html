<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hot Take Roulette</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .header h1 { background: linear-gradient(135deg, #fff 30%, #ff7043); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    /* ── Card ── */
    @keyframes pulse-glow {
      0%   { box-shadow: 0 0 0px rgba(255,112,67,0); border-color: #ff7043; }
      40%  { box-shadow: 0 0 28px rgba(255,112,67,.45); border-color: #ff8a65; }
      100% { box-shadow: 0 0 0px rgba(255,112,67,0); border-color: #ff7043; }
    }

    .card {
      width: 100%;
      max-width: 700px;
      background: linear-gradient(160deg, #13132b 0%, #100f25 100%);
      border: 2px solid #1e1e42;
      border-radius: 24px;
      padding: 52px 40px;
      text-align: center;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
      overflow: hidden;
      transition: border-color .4s;
      animation: fadeUp .5s .2s ease both;
    }

    /* Card watermark */
    .card::before {
      content: '🔥';
      position: absolute;
      font-size: 14rem;
      opacity: .04;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      -webkit-text-fill-color: initial;
    }

    .card.active {
      border-color: #ff7043;
      animation: fadeUp .5s .2s ease both, pulse-glow 2.4s ease-in-out infinite;
    }

    .fire-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ff7043;
      font-weight: 700;
    }

    .take-text {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-weight: 600;
      line-height: 1.55;
    }
    .take-text.placeholder { color: #333; font-weight: 400; font-size: 1rem; }

    /* rolling flicker */
    .card.rolling .take-text { animation: flicker .1s linear infinite; }

    /* ripple */
    @keyframes ripple {
      from { transform: scale(0); opacity: .35; }
      to   { transform: scale(5); opacity: 0; }
    }
    .ripple-el {
      position: absolute;
      width: 100px; height: 100px;
      border-radius: 50%;
      background: #ff7043;
      pointer-events: none;
      animation: ripple .7s ease-out forwards;
    }

    /* ── Vote row ── */
    .vote-row {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 700px;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
      animation: fadeUp .5s .3s ease both;
    }

    .vote-btn {
      flex: 1;
      border: 2px solid;
      border-radius: 16px;
      padding: 12px 12px;
      cursor: pointer;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: background .2s, transform .15s, box-shadow .2s;
      font-family: inherit;
    }
    .vote-btn:active { transform: scale(.97); }
    .vote-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }

    .vote-btn.agree  { border-color: #4caf50; color: #4caf50; }
    .vote-btn.agree:hover:not(:disabled) {
      background: rgba(76,175,80,.1);
      box-shadow: 0 6px 28px rgba(76,175,80,.25);
      transform: translateY(-3px);
    }
    .vote-btn.disagree { border-color: #f44336; color: #f44336; }
    .vote-btn.disagree:hover:not(:disabled) {
      background: rgba(244,67,54,.1);
      box-shadow: 0 6px 28px rgba(244,67,54,.25);
      transform: translateY(-3px);
    }
    .vote-btn.middle { border-color: #f59e0b; color: #f59e0b; }
    .vote-btn.middle:hover:not(:disabled) {
      background: rgba(245,158,11,.1);
      box-shadow: 0 6px 28px rgba(245,158,11,.25);
      transform: translateY(-3px);
    }

    .vote-btn .emoji { font-size: 1.4rem; }
    .vote-btn .label { font-size: .75rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .vote-btn .count { font-size: 1.6rem; font-weight: 800; }

    /* bar under count */
    .vote-btn .bar-wrap {
      width: 80%;
      height: 4px;
      background: rgba(255,255,255,.06);
      border-radius: 4px;
      overflow: hidden;
    }
    .vote-btn .bar { height: 100%; border-radius: 4px; transition: width .4s; width: 0%; }
    .vote-btn.agree   .bar { background: #4caf50; }
    .vote-btn.disagree .bar { background: #f44336; }
    .vote-btn.middle   .bar { background: #f59e0b; }

    /* ── Spin wrap ── */
    .spin-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
      animation: fadeUp .5s .4s ease both;
    }

    /* ── Spin button ── */
    .spin-btn {
      background: #ff7043;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 17px 52px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: .5px;
      transition: background .2s, transform .1s, box-shadow .2s;
      box-shadow: 0 4px 24px rgba(255,112,67,.35);
    }
    .spin-btn:hover {
      background: #ff8a65;
      box-shadow: 0 6px 36px rgba(255,112,67,.55);
      transform: translateY(-2px);
    }
    .spin-btn:active { transform: scale(.97); }
    .spin-btn:disabled { background: #2a2a4a; color: #555; cursor: not-allowed; box-shadow: none; transform: none; }

    .round-badge span { color: #ff7043; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🔥 Hot Take Roulette</h1>
    <p>Spin for a bold opinion — tap Agree or Disagree once per participant to tally the room, then debate!</p>
  </div>


  <div class="card" id="card">
    <span class="fire-label">🔥 Hot Take</span>
    <span class="take-text placeholder" id="takeText">Press Spin to reveal a hot take</span>
  </div>


  <div class="vote-row">
    <button class="vote-btn agree" id="btnAgree" disabled onclick="vote('agree')">
      <span class="emoji">👍</span>
      <span class="label">Agree</span>
      <span class="count" id="cntAgree">0</span>
      <div class="bar-wrap"><div class="bar" id="barAgree"></div></div>
    </button>
    <button class="vote-btn middle" id="btnMiddle" disabled onclick="vote('middle')">
      <span class="emoji">🤷</span>
      <span class="label">It Depends</span>
      <span class="count" id="cntMiddle">0</span>
      <div class="bar-wrap"><div class="bar" id="barMiddle"></div></div>
    </button>
    <button class="vote-btn disagree" id="btnDisagree" disabled onclick="vote('disagree')">
      <span class="emoji">👎</span>
      <span class="label">Disagree</span>
      <span class="count" id="cntDisagree">0</span>
      <div class="bar-wrap"><div class="bar" id="barDisagree"></div></div>
    </button>
  </div>

  <div class="spin-wrap">
    <button class="spin-btn" id="spinBtn" onclick="spin()">🎡 Spin!</button>
    <button class="reset-btn" id="resetBtn" onclick="resetVotes()" disabled>↺ Reset</button>
  </div>

  <script src="game-data.js"></script>
  <script src="game-render.js"></script>
  <script>
    GAME_RENDER.injectCSS();
    const takes = GAME_DATA.hottake;

    let rolling = false;
    let round = 0;
    const votes = { agree: 0, middle: 0, disagree: 0 };

    function vote(side) {
      votes[side]++;
      updateBars();
    }

    function updateBars() {
      const total = votes.agree + votes.middle + votes.disagree || 1;
      document.getElementById('cntAgree').textContent    = votes.agree;
      document.getElementById('cntMiddle').textContent   = votes.middle;
      document.getElementById('cntDisagree').textContent = votes.disagree;
      document.getElementById('barAgree').style.width    = (votes.agree   / total * 100) + '%';
      document.getElementById('barMiddle').style.width   = (votes.middle  / total * 100) + '%';
      document.getElementById('barDisagree').style.width = (votes.disagree / total * 100) + '%';
    }

    function triggerRipple() {
      const card = document.getElementById('card');
      const el = document.createElement('div');
      el.className = 'ripple-el';
      el.style.cssText = 'left:50%;top:50%;margin-left:-50px;margin-top:-50px;';
      card.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function spin() {
      if (rolling) return;
      rolling = true;
      votes.agree = votes.middle = votes.disagree = 0;
      updateBars();

      const card    = document.getElementById('card');
      const spinBtn = document.getElementById('spinBtn');
      const btnA    = document.getElementById('btnAgree');
      const btnM    = document.getElementById('btnMiddle');
      const btnD    = document.getElementById('btnDisagree');

      card.innerHTML = '<span class="fire-label">🔥 Hot Take</span><span class="take-text" id="takeText">Drawing…</span>';
      const text = document.getElementById('takeText');

      spinBtn.disabled = true;
      document.getElementById('resetBtn').disabled = true;
      btnA.disabled = btnM.disabled = btnD.disabled = true;
      card.classList.remove('active');
      card.classList.add('rolling');
      triggerRipple();

      const chosen = takes[Math.floor(Math.random() * takes.length)];

      GAME_RENDER.drawTick(takes, tick => { text.textContent = tick; }, () => {
        card.classList.remove('rolling');
        card.classList.add('active');
        GAME_RENDER.hottake(card, chosen);
        round++;
        document.getElementById('roundNum').textContent = round;
        btnA.disabled = btnM.disabled = btnD.disabled = false;
        spinBtn.disabled = false;
        document.getElementById('resetBtn').disabled = false;
        rolling = false;
      });
    }

    function resetVotes() {
      votes.agree = votes.middle = votes.disagree = 0;
      updateBars();
    }
  </script>
</body>
</html>
