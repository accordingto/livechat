<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Your Emotion Card</title>
  <meta name="theme-color" content="#0d0d1a">
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100dvh; padding: 24px;
    }
    .secret-card {
      background: #13132b;
      border: 2px solid #d946ef;
      border-radius: 26px;
      padding: 48px 40px;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      text-align: center;
      max-width: 420px; width: 100%;
      box-shadow: 0 0 60px rgba(217,70,239,.18);
      animation: fadeUp .5s ease both;
    }
    .player-tag {
      font-size: .85rem; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase;
      color: #d946ef;
    }
    .emo-emoji { font-size: 6rem; line-height: 1; }
    .emo-word  { font-size: 2.6rem; font-weight: 800; color: #fff; line-height: 1.1; }
    .secret-hint {
      font-size: .85rem; color: #555; line-height: 1.6;
      border-top: 1px solid #1e1e42; padding-top: 18px; margin-top: 4px;
    }
    .error-msg { color: #666; font-size: 1rem; text-align: center; line-height: 1.7; }
  </style>
</head>
<body>

  <div id="content"></div>

  <script src="game-data.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const idx    = parseInt(params.get('c'), 10);
    const player = parseInt(params.get('p'), 10);
    const emotion = GAME_DATA.emotion[idx];
    const el = document.getElementById('content');

    if (emotion) {
      el.innerHTML = `
        <div class="secret-card">
          <span class="player-tag">🔒 Player ${player || '?'} — your secret emotion</span>
          <span class="emo-emoji">${emotion.emoji}</span>
          <span class="emo-word">${emotion.word}</span>
          <span class="secret-hint">🤫 Don't show this to anyone!<br>Speak in this emotion — let the others guess it.</span>
        </div>`;
    } else {
      el.innerHTML = `
        <div class="error-msg">
          😵 This card link is not valid.<br>
          Please scan your QR code again.
        </div>`;
    }
  </script>

</body>
</html>
