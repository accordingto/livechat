<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Scene Crashers · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Scene Crashers">
  <meta name="theme-color" content="#0d0d1a">
  <link rel="stylesheet" href="shared.css">
  <style>
    :root { --accent: #84cc16; --accent-alt: #84cc16; --warn: #84cc16; }

    .header h1 { background: linear-gradient(135deg, #fff 30%, #84cc16); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .round-badge span { color: #84cc16; }

    /* ── Layout: the scene content (3/4 width) on the left, a progress sidebar
       (1/4 width) tracking how far the scene has gone on the right — same split
       as Kangaroo Court's trial layout, just renamed to this page's own prefix. ── */
    .crash-layout {
      width: 100%; max-width: 1400px;
      display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr);
      align-items: start; gap: 24px;
      margin-bottom: 4px;
    }
    .crash-flow { position: sticky; top: 20px; order: 2; }
    .crash-flow-card {
      background: #13132b; border: 2px solid #1e1e42; border-radius: 18px;
      padding: 20px 18px;
      animation: fadeUp .5s .1s ease both;
    }
    .crash-flow-hdr {
      font-size: .72rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
      color: #555; margin-bottom: 18px;
    }
    .crash-flow-steps { display: flex; flex-direction: column; gap: 20px; }
    .crash-flow-step {
      position: relative; display: flex; align-items: center; gap: 12px;
      padding-left: 40px; min-height: 32px;
    }
    .crash-flow-step::before {
      content: ''; position: absolute; left: 15px; top: -20px; width: 2px; height: 20px;
      background: #1e1e42; transition: background .3s;
    }
    .crash-flow-step:first-child::before { display: none; }
    .crash-flow-dot {
      position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      background: #0d0d1a; border: 2px solid #1e1e42; color: #666;
      display: flex; align-items: center; justify-content: center; font-size: .92rem;
      z-index: 1; transition: border-color .3s, background .3s, color .3s, box-shadow .3s;
    }
    .crash-flow-label { font-size: .82rem; font-weight: 700; color: #555; line-height: 1.35; transition: color .3s; }
    .crash-flow-step.is-done::before { background: #22c55e; }
    .crash-flow-step.is-done .crash-flow-dot { border-color: #22c55e; color: #22c55e; background: rgba(34,197,94,.1); }
    .crash-flow-step.is-done .crash-flow-label { color: #4ade80; }
    .crash-flow-step.is-current .crash-flow-dot {
      border-color: var(--accent); color: #0d0d1a; background: rgba(132,204,22,.35);
      animation: crashFlowPulse 1.8s ease-in-out infinite;
    }
    .crash-flow-step.is-current .crash-flow-label { color: #fff; }
    @keyframes crashFlowPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(132,204,22,.35); }
      50%      { box-shadow: 0 0 22px rgba(132,204,22,.7); }
    }
    .crash-main { width: 100%; min-width: 0; order: 1; display: flex; flex-direction: column; align-items: center; }

    @media (max-width: 900px) {
      .crash-layout { grid-template-columns: 1fr; }
      .crash-flow { position: static; order: 0; }
      .crash-main { order: 1; }
      .crash-flow-steps { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 14px 22px; }
      .crash-flow-step { flex-direction: column; text-align: center; padding-left: 0; min-height: auto; gap: 6px; }
      .crash-flow-step::before { display: none; }
      .crash-flow-dot { position: static; }
    }

    /* ── Status line — same "one real button, one short line" CTA as Kangaroo
       Court's status button ── */
    .status-line {
      display: block; width: 100%;
      background: linear-gradient(135deg, #a3e635, #4d7c0f);
      color: #0d0d1a; border: 2px solid #bef264; border-radius: 12px;
      padding: 14px 12px; margin-top: 18px;
      font-size: .92rem; font-weight: 800; line-height: 1.2; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      box-shadow: 0 6px 18px rgba(132,204,22,.35);
      cursor: pointer;
      transition: box-shadow .2s, transform .1s, filter .15s;
    }
    .status-line:hover { filter: brightness(1.08); box-shadow: 0 8px 22px rgba(132,204,22,.5); }
    .status-line:active { transform: scale(.98); }
    .status-line.is-next { animation: statusPulse 1.6s ease-in-out infinite; }
    @keyframes statusPulse {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.3); }
    }

    .crash-back-btn {
      width: 100%; margin-top: 10px;
      background: transparent; border: 2px solid #1e1e42; color: #666;
      border-radius: 12px; padding: 10px 12px;
      font-size: .8rem; font-weight: 800; font-family: inherit; cursor: pointer;
      transition: border-color .2s, color .2s, opacity .2s;
    }
    .crash-back-btn:hover:not(:disabled) { border-color: #a3e635; color: #a3e635; }
    .crash-back-btn:disabled { opacity: .3; cursor: not-allowed; }
    .crash-skip-btn { width: 100%; margin-top: 10px; }

    /* ── The scene card: location + the leads' shared history ── */
    .scene-card {
      width: 100%; max-width: 1100px;
      background: linear-gradient(135deg, rgba(132,204,22,.14), rgba(132,204,22,.03));
      border: 2px solid #84cc16; border-radius: 22px;
      padding: 22px 30px; margin-bottom: 16px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      text-align: center; justify-content: center;
      position: relative; overflow: hidden;
      animation: fadeUp .5s .1s ease both;
      transition: border-color .3s;
    }
    .scene-card::before {
      content: '🚪'; position: absolute; font-size: 7rem; opacity: .04;
      top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none;
    }
    .scene-card.idle { border-color: #1e1e42; background: #13132b; }
    .scene-top { display: flex; align-items: center; gap: 8px; position: relative; z-index: 1; }
    .scene-label { font-size: .7rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #84cc16; }
    .scene-location {
      font-size: clamp(1.1rem, 3.2vw, 1.5rem); font-weight: 800; color: #fff; line-height: 1.35;
      max-width: 880px; position: relative; z-index: 1;
    }
    .scene-plot {
      font-size: clamp(1rem, 2.6vw, 1.2rem); font-weight: 500; color: #ccc; line-height: 1.55;
      max-width: 820px; position: relative; z-index: 1; margin-top: 4px;
    }
    .scene-emoji { font-size: 1.5rem; line-height: 1; }
    .scene-placeholder { color: #444; font-size: 1rem; position: relative; z-index: 1; }

    .scene-swap { width: 100%; text-align: center; margin-top: 18px; padding-top: 18px; border-top: 1px solid #1e1e42; }
    .scene-swap .btn-secondary { width: 100%; }

    /* ── Lead strip: the two leads carrying the whole scene ── */
    .lead-strip {
      width: 100%; max-width: 1100px;
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px;
      animation: fadeUp .5s .15s ease both;
    }
    .lead-chip {
      flex: 1; min-width: 150px;
      background: #13132b; border: 2px solid #1e1e42; border-radius: 14px;
      padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 4px;
      box-shadow: 0 0 18px transparent;
      transition: border-color .3s, box-shadow .3s, background .3s;
    }
    .lead-chip .lc-label { font-size: .66rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; }
    .lead-chip .lc-name { font-size: 1.1rem; font-weight: 800; color: #fff; }
    .lead-chip.lc-a { background: linear-gradient(160deg, rgba(132,204,22,.24), rgba(132,204,22,.05)); border-color: #84cc16; box-shadow: 0 0 18px rgba(132,204,22,.2); }
    .lead-chip.lc-a .lc-label { color: #bef264; }
    .lead-chip.lc-b { background: linear-gradient(160deg, rgba(245,158,11,.22), rgba(245,158,11,.04)); border-color: #f59e0b; box-shadow: 0 0 18px rgba(245,158,11,.18); }
    .lead-chip.lc-b .lc-label { color: #fdba74; }
    /* every entrance-type beat this scene gets its own permanent chip here,
       right alongside the two leads — this is the ONE place character
       identity (who's playing what) is shown, so the beat log below never
       has to repeat it. The one currently being revealed pulses. */
    .lead-chip.lc-entrance { background: linear-gradient(160deg, rgba(6,182,212,.22), rgba(6,182,212,.04)); border-color: #06b6d4; box-shadow: 0 0 18px rgba(6,182,212,.18); }
    .lead-chip.lc-entrance .lc-label { color: #67e8f9; }
    .lead-chip.lc-active { animation: leadChipPulse 1.8s ease-in-out infinite; }
    @keyframes leadChipPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }

    /* ── Beat log: every "something happens" beat, in order, staying on screen
       for the rest of the scene — same idea as Kangaroo Court's witness log.
       Coloured by TYPE rather than by slot position now, since which kind of
       card came up is the whole surprise — an entrance, an event and a prop
       should never be mistaken for each other at a glance. ── */
    .beat-log {
      width: 100%; max-width: 1100px;
      display: flex; flex-direction: column; gap: 14px;
      margin-bottom: 16px;
    }
    .beat-log.hidden { display: none; }
    .beat-card {
      width: 100%;
      border-radius: 22px;
      padding: 22px 30px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      text-align: center; position: relative; overflow: hidden;
      animation: fadeUp .4s ease both;
      transition: border-color .3s, box-shadow .3s, opacity .3s;
    }
    .beat-card:not(.is-current) { opacity: .75; box-shadow: none; }
    .beat-card::before {
      position: absolute; font-size: 7rem; opacity: .05;
      top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none;
    }
    /* every beat card is an icon riding inline with its story text — the
       character's own NAME never appears here (that lives exclusively in
       the Lead Strip up top), but an entrance-type beat still tags who's
       playing it, pinned to the right of the row, so a card is never
       ambiguous about who's on stage even out of context from the strip */
    .beat-story-row {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px; width: 100%; position: relative; z-index: 1;
    }
    .beat-who { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
    .beat-emoji-solo { font-size: 1.8rem; line-height: 1; flex-shrink: 0; }
    .beat-hint {
      font-size: .92rem; font-weight: 600; line-height: 1.4;
      max-width: 640px; position: relative; z-index: 1;
    }
    /* the emoji has no label of its own to sit under, so it rides inline with
       the hint text instead — left-aligned, since a multi-line sentence next
       to a fixed icon reads better than centered text */
    .beat-who .beat-hint { text-align: left; max-width: 560px; }
    .beat-playedby {
      flex-shrink: 0; display: inline-block; position: relative; z-index: 1;
      border: 1px solid; font-size: .76rem; font-weight: 800; padding: 4px 14px; border-radius: 20px;
    }
    /* event/prop cards have no separate "played by" pill — the target's real
       name is baked straight into the sentence via {player}, just bolded and
       lightened so it still pops out of the line at a glance */
    .beat-target { color: #fff; font-weight: 900; }

    /* a new character — cyan */
    .beat-card.type-entrance { background: linear-gradient(135deg, rgba(6,182,212,.16), rgba(6,182,212,.03)); border: 2px solid #06b6d4; }
    .beat-card.type-entrance::before { content: '🚪'; }
    .beat-card.type-entrance .beat-hint { color: #a5f3fc; }
    .beat-card.type-entrance .beat-playedby { background: rgba(6,182,212,.14); border-color: rgba(6,182,212,.4); color: #67e8f9; }
    .beat-card.type-entrance.is-current { box-shadow: 0 0 30px rgba(6,182,212,.28); }
    /* a public event — fuchsia */
    .beat-card.type-event { background: linear-gradient(135deg, rgba(217,70,239,.16), rgba(217,70,239,.03)); border: 2px solid #d946ef; }
    .beat-card.type-event::before { content: '🎲'; }
    .beat-card.type-event .beat-hint { color: #f5d0fe; }
    .beat-card.type-event.is-current { box-shadow: 0 0 30px rgba(217,70,239,.28); }
    /* a public prop — teal */
    .beat-card.type-prop { background: linear-gradient(135deg, rgba(20,184,166,.16), rgba(20,184,166,.03)); border: 2px solid #14b8a6; }
    .beat-card.type-prop::before { content: '📦'; }
    .beat-card.type-prop .beat-hint { color: #99f6e4; }
    .beat-card.type-prop.is-current { box-shadow: 0 0 30px rgba(20,184,166,.28); }

    /* player links: a per-role tint so the host can see roles without opening a card */
    .link-col.is-role-leadA     { border-color: #84cc16; }
    .link-col.is-role-leadB     { border-color: #f59e0b; }
    .link-col.is-role-entrance { border-color: #06b6d4; }
    .link-col .la-sub { color: #888; }

    /* ── Scenario / entrance browsers ── */
    .crash-browser { width: 100%; max-width: 1100px; margin: 12px 0 40px; }
    .crash-browser-hdr {
      font-size: .72rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
      color: #555; margin-bottom: 12px;
    }
    .crash-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 8px;
    }
    .crash-item {
      background: #13132b; border: 1.5px solid #1e1e42; border-radius: 12px;
      padding: 12px 16px; display: flex; gap: 12px; align-items: flex-start;
      font-size: .85rem; color: #aaa; line-height: 1.5;
    }
    .crash-item .ci-emoji { font-size: 1.2rem; flex-shrink: 0; }
    .crash-item .ci-name { color: #ddd; font-weight: 700; }

    @media (max-width: 520px) {
      .scene-card { padding: 18px 16px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Scene <span id="sceneNum">0</span></div>
  </div>

  <div class="header">
    <h1>🚪 Scene Crashers</h1>
  </div>

  <div class="crash-layout">
    <aside class="crash-flow" id="crash-flow">
      <div class="crash-flow-card">
        <div class="crash-flow-hdr">📍 Scene Progress</div>
        <div class="crash-flow-steps" id="crash-flow-steps"></div>
        <div class="scene-swap hidden" id="scene-swap">
          <button class="btn-secondary" onclick="changeScenario()">🔀 Different Scene</button>
        </div>
        <!-- what's happening right now, as a real button — tap it to advance -->
        <div class="status-line" id="status-line" onclick="advance()"></div>

        <!-- undoes one accidental "advance" click -->
        <button class="crash-back-btn" id="crash-back-btn" onclick="goBack()">⬅️ Previous Step</button>

        <!-- jumps straight to a brand new scene from anywhere in the flow —
             the host doesn't have to play out both beats first if they'd
             rather just fire through scenes back to back -->
        <button class="btn-secondary crash-skip-btn hidden" id="crash-skip-btn" onclick="skipToNextScene()">⏭️ Skip to Next Scene</button>
      </div>
    </aside>

    <div class="crash-main">
      <div class="lead-strip hidden" id="lead-strip"></div>

      <div class="scene-card idle" id="scene-card">
        <span class="scene-placeholder" id="scene-placeholder">Press <strong>🚪 Draw a Scene</strong> to open the story</span>
        <div id="scene-content" style="display:none">
          <div class="scene-top">
            <span class="scene-emoji" id="scene-emoji"></span>
            <span class="scene-label" id="scene-location"></span>
          </div>
          <span class="scene-plot" id="scene-plot"></span>
        </div>
      </div>

      <!-- every beat that's happened, in order, stays here for the rest of
           the scene -->
      <div class="beat-log hidden" id="beat-log"></div>
    </div>
  </div>

  <!-- player cards: role decides what each card shows -->
  <div id="room-mount"></div>

  <div class="crash-browser">
    <div class="crash-browser-hdr" id="scene-browser-hdr"></div>
    <div class="crash-list" id="scene-list"></div>
  </div>

  <div class="crash-browser">
    <div class="crash-browser-hdr" id="entrance-browser-hdr"></div>
    <div class="crash-list" id="entrance-list"></div>
  </div>

  <div class="crash-browser">
    <div class="crash-browser-hdr" id="event-browser-hdr"></div>
    <div class="crash-list" id="event-list"></div>
  </div>

  <div class="crash-browser">
    <div class="crash-browser-hdr" id="prop-browser-hdr"></div>
    <div class="crash-list" id="prop-list"></div>
  </div>

  <script src="qrcode.js"></script>
  <script src="game-data.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="room.js"></script>
  <script>
    const DECK = GAME_DATA.crashers;
    const DECKE = GAME_DATA.crashersEntrance;
    const DECKEV = GAME_DATA.crashersEvent;
    const DECKP = GAME_DATA.crashersProp;

    let sceneNum = 0;
    let phase = 'idle'; // idle | opening | beat
    let leadAIdx = -1, leadBIdx = -1;
    let leadABag = [];    // shuffled players still waiting to lead this cycle
    let leadBCount = [];  // times each player has been Lead B, kept even like the referee in Say It Without Saying It
    let scenario = null;
    let usedScenarios = [];

    /* ── Beats ── how many "something happens" steps a scene gets is decided
       by the room, not fixed: every non-lead player gets exactly one shot at
       being drawn into the scene, so a 3-player room (2 leads + 1 spare) gets
       a single tight beat while an 8-player room (2 leads + 6 spares) gets a
       long, sprawling one. Each beat still randomly lands on one of three
       kinds, so the host never knows in advance what's coming:
        - entrance: a new character walks in
        - event:    a public twist with no new character attached
        - prop:     a public object that suddenly matters
       entranceCount keeps entrance picks even over a session, same trick as
       leadBCount; entranceThisScene avoids using the same player for two
       entrance-type beats in one scene — with numBeats() capped at the
       number of non-leads, every entrance-type beat in a scene can always
       land on someone fresh, so that fallback never actually has to fire. */
    function numBeats() { return Math.max(1, ROOM.count - 2); }
    let entranceCount = [];
    let entranceThisScene = [];
    let usedEntranceCards = [];
    let usedEventCards = [];
    let usedPropCards = [];
    let targetCount = []; // times each player has been the target of an event/prop beat, kept even like leadBCount/entranceCount
    let beats = [];      // beats[i] = { type: 'entrance', card, playerIdx } | { type: 'event'|'prop', card, targetIdx }, i = 0-based beat index
    let beatIndex = -1;  // which beat is currently showing (-1 = none yet this scene)

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
    function shuffled(n) {
      const a = Array.from({ length: n }, (_, i) => i);
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }

    ROOM.init({
      mount: 'room-mount',
      accent: '#84cc16',
      counts: [3, 4, 5, 6, 7, 8],
      defaultCount: 4,
      linksNote: 'Each scene deals two Leads who carry the whole story, plus (as it progresses) new characters drawn from everyone else — roles rotate every scene, so everyone eventually gets a card. Works fine without player links too — the shared screen shows everything.',
      onCountChange: () => { leadAIdx = leadBIdx = -1; leadABag = []; leadBCount = []; entranceCount = []; targetCount = []; resetToIdle(); },
      onNameChange: () => { ROOM.render(); renderAll(); if (phase !== 'idle') pushState(); },
    });

    // once an entrance-type beat reveals who plays it, that player keeps the
    // role for the rest of the scene (every beat up to and including the
    // current one counts) — same idea as Kangaroo Court's witness staying
    // "in the case" after their moment on the stand
    function roleOf(i) {
      if (i === leadAIdx) return 'leadA';
      if (i === leadBIdx) return 'leadB';
      for (let idx = 0; idx <= beatIndex; idx++) {
        const b = beats[idx];
        if (b && b.type === 'entrance' && b.playerIdx === i) return 'entrance' + (idx + 1);
      }
      return 'audience';
    }

    ROOM.setDecorator(i => {
      if (!sceneNum) return {};
      const role = roleOf(i);
      const cls = role === 'audience' ? '' : role.startsWith('entrance') ? 'is-role-entrance' : 'is-role-' + role;
      const label = role === 'leadA' ? '🎭 Lead A' : role === 'leadB' ? '🎭 Lead B' : role.startsWith('entrance') ? '🚪 Entrance' : '👀 Watching';
      return { marked: role !== 'audience', cls, answer: label };
    });

    /* ── Dealing ──
       Lead A comes out of a shuffled bag, same trick as the defendant in
       Kangaroo Court: everyone leads once before anyone repeats, and a refill
       never lets the same Lead A go twice in a row across the seam. Lead B is
       drawn from whoever has led fewest times, so it stays even over a long
       session without ever following a fixed order. */
    function drawLeadA(n) {
      leadABag = leadABag.filter(i => i < n);
      if (!leadABag.length) {
        leadABag = shuffled(n);
        if (n > 1 && leadABag[0] === leadAIdx) leadABag.push(leadABag.shift());
      }
      return leadABag.shift();
    }
    function drawRole(countArr, n, exclude) {
      while (countArr.length < n) countArr.push(0);
      const eligible = Array.from({ length: n }, (_, i) => i).filter(i => !exclude.includes(i));
      const fewest = Math.min(...eligible.map(i => countArr[i] || 0));
      const pool = eligible.filter(i => (countArr[i] || 0) === fewest);
      const pick = pool[Math.floor(Math.random() * pool.length)];
      countArr[pick] = (countArr[pick] || 0) + 1;
      return pick;
    }
    function dealLeads() {
      const n = ROOM.count;
      leadAIdx = drawLeadA(n);
      leadBIdx = drawRole(leadBCount, n, [leadAIdx]);
    }

    /* picks who plays the new character — same fewest-count fairness as
       drawRole above, excluding both leads and whoever's already entered this
       scene. The fallback (allowing a repeat once every non-lead has gone
       once) is defensive only: since numBeats() never exceeds the number of
       non-leads, an entrance-type beat can always find someone fresh. */
    function pickEntrancePlayer() {
      const n = ROOM.count;
      const leads = [leadAIdx, leadBIdx];
      const stillFresh = Array.from({ length: n }, (_, i) => i)
        .some(i => !leads.includes(i) && !entranceThisScene.includes(i));
      const pick = drawRole(entranceCount, n, stillFresh ? leads.concat(entranceThisScene) : leads);
      entranceThisScene.push(pick);
      return pick;
    }

    /* everyone already established in the scene by the time beat `idx` is
       about to happen — the two leads, plus whoever any earlier entrance-type
       beat brought in. Always at least 2 (the leads), so there's always
       someone real for an event/prop beat to happen to. */
    function castBeforeBeat(idx) {
      const cast = [leadAIdx, leadBIdx];
      for (let i = 0; i < idx; i++) {
        const b = beats[i];
        if (b && b.type === 'entrance') cast.push(b.playerIdx);
      }
      return cast;
    }

    /* picks who an event/prop beat happens to — fewest-count fairness again,
       but restricted to the cast already on stage (never someone who hasn't
       entered yet), so the twist always lands on a real, already-introduced
       character instead of a stranger to the scene. */
    function pickBeatTarget(idx) {
      const pool = castBeforeBeat(idx);
      while (targetCount.length < ROOM.count) targetCount.push(0);
      const fewest = Math.min(...pool.map(i => targetCount[i] || 0));
      const eligible = pool.filter(i => (targetCount[i] || 0) === fewest);
      const pick = eligible[Math.floor(Math.random() * eligible.length)];
      targetCount[pick] = (targetCount[pick] || 0) + 1;
      return pick;
    }

    /* draws a card from a deck, cycling through before any repeat — the same
       shape reused for all three "something happens" decks below */
    function drawFromDeck(deck, used) {
      let avail = deck.map((_, i) => i).filter(i => !used.includes(i));
      if (!avail.length) { used.length = 0; avail = deck.map((_, i) => i); }
      const pick = avail[Math.floor(Math.random() * avail.length)];
      used.push(pick);
      return deck[pick];
    }
    function pickEntranceCard() { return drawFromDeck(DECKE, usedEntranceCards); }
    function pickEventCard() { return drawFromDeck(DECKEV, usedEventCards); }
    function pickPropCard() { return drawFromDeck(DECKP, usedPropCards); }

    /* which kind of beat comes up next */
    function pickEscalationType() {
      const pool = ['entrance', 'event', 'prop'];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    /* draws a scenario not currently on screen, cycling through the deck before
       any repeat — shared by dealNewScene() and the host's "Different Scene" reroll */
    function pickScenario(exclude) {
      let avail = DECK.map((_, i) => i).filter(i => !usedScenarios.includes(i) && DECK[i] !== exclude);
      if (!avail.length) { usedScenarios = []; avail = DECK.map((_, i) => i).filter(i => DECK[i] !== exclude); }
      const pick = avail[Math.floor(Math.random() * avail.length)];
      usedScenarios.push(pick);
      return DECK[pick];
    }

    /* ── Scene flow ──
       idle/last beat → opening (new scene) → beat 0 → beat 1 → … → beat
       numBeats()-1 → (repeat) */
    function dealNewScene() {
      dealLeads();
      scenario = pickScenario(null);
      sceneNum++;
      phase = 'opening';
      beats = []; beatIndex = -1;
      entranceThisScene = [];
      ROOM.publish(i => payloadFor(i)); // full reset — wipes last scene's cards
      renderAll();
    }

    /* lets the host reroll a scene that isn't landing, without redealing the
       leads — only available before any beat happens */
    function changeScenario() {
      if (phase !== 'opening' || !scenario) return;
      scenario = pickScenario(scenario);
      pushState();
      renderAll();
    }

    /* rolls which kind of thing happens for beat index `idx`, draws whatever
       that kind needs (a new character + who plays them, or a public
       event/prop card), and makes it the current beat */
    function startBeat(idx) {
      const type = pickEscalationType();
      let data;
      if (type === 'entrance') {
        data = { type, card: pickEntranceCard(), playerIdx: pickEntrancePlayer() };
      } else if (type === 'event') {
        data = { type, card: pickEventCard(), targetIdx: pickBeatTarget(idx) };
      } else {
        data = { type, card: pickPropCard(), targetIdx: pickBeatTarget(idx) };
      }
      beats[idx] = data;
      beatIndex = idx;
      phase = 'beat';
      pushState();
      renderAll();
    }

    function advance() {
      if (phase === 'idle')    { dealNewScene(); return; }
      if (phase === 'opening') { startBeat(0); return; }
      if (phase === 'beat') {
        if (beatIndex + 1 < numBeats()) { startBeat(beatIndex + 1); return; }
        dealNewScene(); return;
      }
    }

    /* undoes one accidental "advance" — each beat is rolled only once
       (entering that index) and nothing overwrites it until the NEXT index is
       entered, so stepping back just moves the pointer and reuses the stored
       beat, no reroll needed. */
    function goBack() {
      if (phase !== 'beat') return;
      if (beatIndex > 0) { beatIndex--; pushState(); renderAll(); return; }
      phase = 'opening';
      pushState();
      renderAll();
    }

    /* jumps straight to a fresh scene from anywhere (opening or any beat) —
       the host doesn't have to play out every beat first if they'd rather
       just fire through scenes back to back. No cap: press it as many times
       in a row as the room wants. */
    function skipToNextScene() {
      if (phase === 'idle') return;
      dealNewScene();
    }

    function resetToIdle() {
      sceneNum = 0; phase = 'idle'; scenario = null;
      beats = []; beatIndex = -1; entranceThisScene = [];
      pushState();
      renderAll();
    }

    /* ── Firebase ── */
    function pushState() { ROOM.update(i => payloadFor(i)); }

    function payloadFor(i) {
      const role = roleOf(i);
      const base = {
        game: 'crashers', scene: sceneNum, phase, role,
        leadAName: sceneNum ? ROOM.name(leadAIdx) : null,
        leadBName: sceneNum ? ROOM.name(leadBIdx) : null,
        emoji: scenario ? scenario.emoji : null,
        location: scenario ? scenario.location : null,
        plot: scenario ? scenario.plot : null,
        entranceCard: null,
        isBeatTarget: false,
      };
      if (role.startsWith('entrance')) {
        base.entranceCard = beats[Number(role.slice('entrance'.length)) - 1].card;
      }
      // if an event/prop beat is live right now and it landed on THIS player,
      // hand them the card so their own screen calls them out by name too —
      // every other role's payload is unaffected
      const curBeat = phase === 'beat' ? beats[beatIndex] : null;
      if (curBeat && curBeat.type !== 'entrance' && curBeat.targetIdx === i) {
        base.isBeatTarget = true;
        base.beatTargetType = curBeat.type;
        base.beatTargetEmoji = curBeat.card.emoji;
        base.beatTargetText = curBeat.card.text.replace(/\{player\}/g, 'You');
      }
      return base;
    }

    /* ── Rendering ── */
    // one entry per beat this scene will get (numBeats() of them) — built
    // fresh on every render since the room's player count decides the count
    function buildFlowSteps() {
      const steps = [
        { phase: 'idle', emoji: '🚪', label: 'Draw a Scene' },
        { phase: 'opening', emoji: '🎬', label: 'Opening Scene' },
      ];
      const n = numBeats();
      for (let i = 0; i < n; i++) {
        steps.push({ phase: 'beat', beatIdx: i, emoji: '🎲', label: i === 0 ? 'Something Happens' : 'Something Else Happens' });
      }
      return steps;
    }
    function renderFlow() {
      const steps = buildFlowSteps();
      const idx = steps.findIndex(s => s.phase === 'beat' ? (phase === 'beat' && s.beatIdx === beatIndex) : phase === s.phase);
      document.getElementById('crash-flow-steps').innerHTML = steps.map((s, i) => {
        const cls = i === idx ? 'is-current' : i < idx ? 'is-done' : '';
        return `<div class="crash-flow-step ${cls}">
          <span class="crash-flow-dot">${i < idx ? '✓' : s.emoji}</span>
          <span class="crash-flow-label">${esc(s.label)}</span>
        </div>`;
      }).join('');
    }

    function renderAll() {
      document.getElementById('sceneNum').textContent = sceneNum;
      renderFlow();
      renderStatus();
      renderBackBtn();
      renderSkipBtn();
      renderScenario();
      renderLeadStrip();
      renderBeatLog();
      ROOM.render();
    }

    function renderBackBtn() {
      document.getElementById('crash-back-btn').disabled = phase === 'idle' || phase === 'opening';
    }

    // hidden before the first scene is dealt — there's nothing to skip past
    // yet, and "Draw a Scene" already does the identical thing
    function renderSkipBtn() {
      document.getElementById('crash-skip-btn').classList.toggle('hidden', phase === 'idle');
    }

    function statusLabel() {
      if (phase === 'idle') return '🚪 Draw a Scene';
      if (phase === 'opening') return '🎲 Let Something Happen';
      // last beat of the scene — advancing deals a fresh one instead of another beat
      if (beatIndex + 1 >= numBeats()) return '🎬 Next Scene';
      return '🎲 Let Something Else Happen';
    }
    function renderStatus() {
      const el = document.getElementById('status-line');
      el.classList.toggle('is-next', phase === 'beat' && beatIndex + 1 >= numBeats());
      el.textContent = statusLabel();
    }

    function renderScenario() {
      const card = document.getElementById('scene-card');
      card.classList.toggle('idle', !scenario);
      document.getElementById('scene-placeholder').style.display = scenario ? 'none' : '';
      document.getElementById('scene-content').style.display = scenario ? '' : 'none';
      if (scenario) {
        document.getElementById('scene-emoji').textContent = scenario.emoji;
        document.getElementById('scene-location').textContent = scenario.location;
        document.getElementById('scene-plot').textContent = scenario.plot;
      }
      document.getElementById('scene-swap').classList.toggle('hidden', phase !== 'opening');
    }

    function renderLeadStrip() {
      const el = document.getElementById('lead-strip');
      el.classList.toggle('hidden', !sceneNum);
      if (!sceneNum) return;
      // an event/prop beat always names one already-established cast member
      // (see castBeforeBeat/pickBeatTarget) — that person's chip pulses too,
      // for the same reason an entrance's own chip pulses: it's their moment
      const curBeat = phase === 'beat' ? beats[beatIndex] : null;
      const targetIdx = curBeat && curBeat.type !== 'entrance' ? curBeat.targetIdx : null;
      let html =
        `<div class="lead-chip lc-a${targetIdx === leadAIdx ? ' lc-active' : ''}">
          <span class="lc-label">🎭 Lead A</span>
          <span class="lc-name">${esc(ROOM.name(leadAIdx))}</span>
        </div>
        <div class="lead-chip lc-b${targetIdx === leadBIdx ? ' lc-active' : ''}">
          <span class="lc-label">🎭 Lead B</span>
          <span class="lc-name">${esc(ROOM.name(leadBIdx))}</span>
        </div>`;
      // every entrance-type beat revealed so far gets a permanent chip here —
      // this is the only place character identity (name + who plays them)
      // is shown, so the beat log never has to repeat it. The one currently
      // being revealed pulses to draw the eye, and so does an already-entered
      // character's chip when a later event/prop beat targets them.
      beats.forEach((s, idx) => {
        if (s.type !== 'entrance') return;
        const isCurrent = (phase === 'beat' && beatIndex === idx) || targetIdx === s.playerIdx;
        html += `<div class="lead-chip lc-entrance${isCurrent ? ' lc-active' : ''}">
          <span class="lc-label">${s.card.emoji} ${esc(s.card.name)}</span>
          <span class="lc-name">${esc(ROOM.name(s.playerIdx))}</span>
        </div>`;
      });
      el.innerHTML = html;
    }

    /* the beat log — one entry per slot, in the order they actually happened,
       each staying on screen for the rest of the scene instead of
       disappearing once the next beat happens. Every type renders the same
       way — an icon inline with its story text — since character identity
       (for entrance-type beats) already lives in the Lead Strip above and
       isn't repeated here. */
    function renderBeatLog() {
      const el = document.getElementById('beat-log');
      el.classList.toggle('hidden', !beats.length);
      el.innerHTML = beats.map((s, idx) => {
        const isCurrent = phase === 'beat' && beatIndex === idx;
        const cls = `type-${s.type}${isCurrent ? ' is-current' : ''}`;
        // entrance cards keep the "Played by" pill (the sentence itself is
        // about the new character, not the player); event/prop cards instead
        // have the target's real name baked into the sentence via {player} —
        // both ways, no beat card is missing a real participant
        const text = s.type === 'entrance'
          ? esc(s.card.hint)
          : esc(s.card.text).replace('{player}', `<strong class="beat-target">${esc(ROOM.name(s.targetIdx))}</strong>`);
        const playedby = s.type === 'entrance'
          ? `<span class="beat-playedby">🎭 Played by ${esc(ROOM.name(s.playerIdx))}</span>`
          : '';
        return `<div class="beat-card ${cls}">
          <div class="beat-story-row">
            <span class="beat-who">
              <span class="beat-emoji-solo">${s.card.emoji}</span>
              <span class="beat-hint">${text}</span>
            </span>
            ${playedby}
          </div>
        </div>`;
      }).join('');
    }

    /* ── Browsers: unnumbered, just for the host to preview what might come
       up — the deck contents are always previewable, same as every other
       game's browser, even though which card actually gets drawn stays a
       surprise ── */
    (function buildBrowsers() {
      document.getElementById('scene-browser-hdr').textContent = `🚪 All Scenes (${DECK.length}) — drawn by "Draw a Scene"`;
      document.getElementById('scene-list').innerHTML = DECK.map(c =>
        `<div class="crash-item"><span class="ci-emoji">${c.emoji}</span><span><span class="ci-name">${esc(c.location)}</span> — ${esc(c.plot)}</span></div>`
      ).join('');

      document.getElementById('entrance-browser-hdr').textContent = `🚪 All Entrances (${DECKE.length}) — one of three kinds a "something happens" step can roll`;
      document.getElementById('entrance-list').innerHTML = DECKE.map(c =>
        `<div class="crash-item"><span class="ci-emoji">${c.emoji}</span><span><span class="ci-name">${esc(c.name)}</span> — ${esc(c.hint)}</span></div>`
      ).join('');

      // {player} gets swapped for whoever's actually targeted in play — here
      // it's just a preview deck with nobody dealt yet, so show a stand-in
      document.getElementById('event-browser-hdr').textContent = `🎲 All Events (${DECKEV.length}) — another kind a "something happens" step can roll`;
      document.getElementById('event-list').innerHTML = DECKEV.map(c =>
        `<div class="crash-item"><span class="ci-emoji">${c.emoji}</span><span>${esc(c.text).replace('{player}', 'someone')}</span></div>`
      ).join('');

      document.getElementById('prop-browser-hdr').textContent = `📦 All Props (${DECKP.length}) — the last kind a "something happens" step can roll`;
      document.getElementById('prop-list').innerHTML = DECKP.map(c =>
        `<div class="crash-item"><span class="ci-emoji">${c.emoji}</span><span>${esc(c.text).replace('{player}', 'someone')}</span></div>`
      ).join('');
    })();

    renderAll();
  </script>
</body>
</html>
