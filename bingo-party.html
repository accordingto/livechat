<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DOUBLE TAKE · Bingo Club · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#f4f3ee">
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="bingo-party.css?v=bp-2">
</head>
<body class="bp-page">
  <div class="topbar">
    <a class="back" href="index.html?step=2" data-i18n="common.backToHub">← Back to Hub</a>
    <span class="bp-soft" id="bp-room-label"></span>
  </div>
  <header class="header">
    <div class="bp-mark" aria-hidden="true"><i class="a"></i><i></i><i class="b"></i><i></i><i class="c"></i><i></i><i class="b"></i><i></i><i class="a"></i></div>
    <h1>DOUBLE TAKE<span>BINGO CLUB / TWO SIDES. ONE GAME.</span></h1>
    <p data-i18n="bingo.tagline"></p>
  </header>
  <main class="bp-host-shell">
    <p class="bp-host-status" id="bp-status" role="status"></p>
    <section class="bp-setup" id="bp-setup-needed" hidden>
      <h2 data-i18n="bingohost.setupNeeded"></h2>
      <p data-i18n="bingohost.setupNeededText"></p>
      <div class="bp-actions"><a class="bp-btn bp-primary" href="index.html?step=1" data-i18n="bingohost.setUpRoom"></a></div>
    </section>
    <div id="bp-stage" aria-label="DOUBLE TAKE"></div>
    <details class="bp-setup" id="bp-open" open hidden>
      <summary data-i18n="bingohost.seatsTitle"></summary>
      <div class="bp-room-details">
        <p data-i18n="bingohost.seatsText"></p>
        <ul id="bp-seats"></ul>
        <div id="bp-extra" hidden>
          <p data-i18n="bingohost.extraText"></p>
          <ul id="bp-extra-list"></ul>
          <div class="bp-actions"><button type="button" class="bp-btn" id="bp-extra-add" data-i18n="bingohost.extraAdd"></button><button type="button" class="bp-btn" id="bp-extra-remove" data-i18n="bingohost.extraRemove"></button></div>
        </div>
        <p class="bp-soft" data-i18n="bingohost.hostNote"></p>
        <div class="bp-actions">
          <button type="button" class="bp-btn bp-primary" id="bp-open-lobby" data-i18n="bingohost.openLobby"></button>
          <button type="button" class="bp-btn" id="bp-sync-roster" hidden data-i18n="bingohost.syncRoster"></button>
          <button type="button" class="bp-btn" id="bp-reclaim" hidden data-i18n="bingohost.reclaim"></button>
          <button type="button" class="bp-btn" id="bp-takeover" hidden data-i18n="bingohost.takeover"></button>
        </div>
        <p class="bp-soft" id="bp-open-note" role="status"></p>
      </div>
    </details>
    <details class="bp-setup bp-rules">
      <summary data-i18n="bingohost.rules"></summary>
      <ol><li data-i18n="bingohost.rule1"></li><li data-i18n="bingohost.rule2"></li><li data-i18n="bingohost.rule3"></li><li data-i18n="bingohost.rule4"></li><li data-i18n="bingohost.rule5"></li><li data-i18n="bingohost.rule6"></li></ol>
    </details>
  </main>
  <div id="room-mount" hidden></div>
  <script src="qrcode.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="room.js?v=life-story-1"></script>
  <script src="bingo-party-content.js?v=bp-1"></script>
  <script src="bingo-party-engine.js?v=bp-2"></script>
  <script src="bingo-party-sync.js?v=bp-1"></script>
  <script src="bingo-party-ui.js?v=bp-2"></script>
  <script src="bingo-party-host.js?v=bp-2"></script>
</body>
</html>
