<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pick a Side! · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pick a Side!">
  <meta name="theme-color" content="#0d0d1a">
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="shared.css">
  <style>
    /* every other host page declares its theme colour here; this one used to
       hardcode #ff7043 everywhere, which left shared.css rules that rely on
       var(--accent) — the guide screen among them — with no colour at all */
    :root { --accent: #ff7043; }
    .header h1 { background: linear-gradient(135deg, #fff 30%, #ff7043); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    /* ── Card ── */
    @keyframes pulse-glow {
      0%   { box-shadow: 0 0 0px rgba(255,112,67,0); border-color: #ff7043; }
      40%  { box-shadow: 0 0 28px rgba(255,112,67,.45); border-color: #ff8a65; }
      100% { box-shadow: 0 0 0px rgba(255,112,67,0); border-color: #ff7043; }
    }

    .card {
      width: 100%;
      max-width: 1100px;
      background: linear-gradient(160deg, var(--surface) 0%, var(--surface-b) 100%);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 52px 40px;
      text-align: center;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
      overflow: hidden;
      transition: border-color .4s;
      animation: fadeUp .5s .2s ease both;
    }

    /* Card watermark */
    .card::before {
      content: '🔥';
      position: absolute;
      font-size: 14rem;
      opacity: .04;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      -webkit-text-fill-color: initial;
    }

    .card.active {
      border-color: #ff7043;
      animation: fadeUp .5s .2s ease both, pulse-glow 2.5s ease-in-out infinite;
    }

    .fire-label {
      font-size: .84rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--accent-text);
      font-weight: 700;
    }

    .take-text {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-weight: 600;
      line-height: 1.55;
    }
    .take-text.placeholder { color: var(--text-dim); font-weight: 400; font-size: 1rem; }

    /* rolling flicker */
    .card.rolling .take-text { animation: flicker .1s linear infinite; }

    /* ripple */
    @keyframes ripple {
      from { transform: scale(0); opacity: .35; }
      to   { transform: scale(5); opacity: 0; }
    }
    .ripple-el {
      position: absolute;
      width: 100px; height: 100px;
      border-radius: 50%;
      background: #ff7043;
      pointer-events: none;
      animation: ripple .7s ease-out forwards;
    }

    /* ── Vote row ── */
    .vote-row {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
      animation: fadeUp .5s .3s ease both;
    }

    .vote-btn {
      flex: 1;
      border: 2px solid;
      border-radius: 16px;
      padding: 12px 12px;
      cursor: pointer;
      background: var(--btn-face);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: background .2s, transform .15s, box-shadow .2s;
      font-family: inherit;
    }
    .vote-btn:active { transform: scale(.97); }
    .vote-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }

    .vote-btn.agree  { background: rgba(76,175,80,.16); border-color: #4caf50; color: #86efac; }
    .vote-btn.agree:hover:not(:disabled) {
      background: rgba(76,175,80,.1);
      box-shadow: 0 6px 28px rgba(76,175,80,.25);
      transform: translateY(-3px);
    }
    .vote-btn.disagree { background: rgba(244,67,54,.16); border-color: #f44336; color: var(--bad-text-soft); }
    .vote-btn.disagree:hover:not(:disabled) {
      background: rgba(244,67,54,.1);
      box-shadow: 0 6px 28px rgba(244,67,54,.25);
      transform: translateY(-3px);
    }
    .vote-btn.middle { background: rgba(245,158,11,.16); border-color: #f59e0b; color: #fcd34d; }
    .vote-btn.middle:hover:not(:disabled) {
      background: rgba(245,158,11,.1);
      box-shadow: 0 6px 28px rgba(245,158,11,.25);
      transform: translateY(-3px);
    }

    .vote-btn .emoji { font-size: 1.4rem; }
    .vote-btn .label { font-size: .86rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
    .vote-btn .count { font-size: 1.6rem; font-weight: 800; }

    /* bar under count */
    .vote-btn .bar-wrap {
      width: 80%;
      height: 4px;
      background: rgba(255,255,255,.06);
      border-radius: 4px;
      overflow: hidden;
    }
    .vote-btn .bar { height: 100%; border-radius: 4px; transition: width .4s; width: 0%; }
    .vote-btn.agree   .bar { background: #4caf50; }
    .vote-btn.disagree .bar { background: #f44336; }
    .vote-btn.middle   .bar { background: #f59e0b; }

    /* ── Spin wrap ── */
    .spin-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
      animation: fadeUp .5s .4s ease both;
    }

    /* ── Spin button ── */
    .spin-btn {
      background: #ff7043;
      color: var(--btn-ink);
      border: none;
      border-radius: 999px;
      padding: 16px 48px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: .5px;
      transition: background .2s, transform .1s, box-shadow .2s;
      box-shadow: 0 4px 24px rgba(255,112,67,.35);
    }
    .spin-btn:hover {
      background: #ff8a65;
      box-shadow: 0 6px 36px rgba(255,112,67,.55);
      transform: translateY(-2px);
    }
    .spin-btn:active { transform: scale(.97); }
    .spin-btn:disabled { background: var(--btn-off); color: var(--text-muted); cursor: not-allowed; box-shadow: none; transform: none; }

    .round-badge span { color: var(--accent-text); }

    @media (max-width: 520px) {
      .card { padding: 32px 20px; }
      .vote-row { gap: 8px; }
      .vote-btn { padding: 10px 4px; border-radius: 12px; gap: 3px; }
      .vote-btn .emoji { font-size: 1.15rem; }
      .vote-btn .label { font-size: .74rem; letter-spacing: .4px; }
      .vote-btn .count { font-size: 1.25rem; }
      .spin-wrap { gap: 8px; }
      .spin-btn { padding: 14px 32px; font-size: .95rem; }
    }

    /* ── Deck browser: every take at a glance, closed by default since the
       screen is being shared ── */
    .deck-browser { width: 100%; max-width: 1100px; margin: 28px 0 40px; }
    .deck-toggle {
      background: var(--surface-2); color: var(--text-dim); border: 2px solid var(--border-3); border-radius: 12px;
      padding: 10px 18px; font-size: .8rem; font-weight: 800; font-family: inherit; cursor: pointer;
      transition: background .2s, border-color .2s, color .2s;
    }
    .deck-toggle:hover { border-color: #ff7043; color: var(--accent-text); }
    .deck-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 8px; margin-top: 14px;
    }
    .deck-item {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px;
      font-size: .88rem; font-weight: 600; color: var(--text-3); line-height: 1.5;
    }
    .deck-item .di-num { color: var(--accent-text); font-weight: 800; margin-right: 6px; }


  </style>
</head>
<body data-guide="hottake" data-guide-next="game">

  <div class="topbar">
    <a class="back" href="index.html?step=2" data-i18n="common.backToHub">← Back to Hub</a>
    <div class="round-badge"><span data-i18n="hottake.round">Round</span> <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🔥 Pick a Side!</h1>
  </div>


  <div class="card" id="card">
    <span class="fire-label" data-i18n="hottake.fireLabel">🔥 Pick a Side</span>
    <span class="take-text placeholder" id="takeText" data-i18n="hottake.placeholder">Press Spin to reveal a bold opinion</span>
  </div>


  <div class="vote-row">
    <button class="vote-btn agree" id="btnAgree" disabled onclick="vote('agree')">
      <span class="emoji">👍</span>
      <span class="label" data-i18n="hottake.agree">Agree</span>
      <span class="count" id="cntAgree">0</span>
      <div class="bar-wrap"><div class="bar" id="barAgree"></div></div>
    </button>
    <button class="vote-btn middle" id="btnMiddle" disabled onclick="vote('middle')">
      <span class="emoji">🤷</span>
      <span class="label" data-i18n="hottake.itDepends">It Depends</span>
      <span class="count" id="cntMiddle">0</span>
      <div class="bar-wrap"><div class="bar" id="barMiddle"></div></div>
    </button>
    <button class="vote-btn disagree" id="btnDisagree" disabled onclick="vote('disagree')">
      <span class="emoji">👎</span>
      <span class="label" data-i18n="hottake.disagree">Disagree</span>
      <span class="count" id="cntDisagree">0</span>
      <div class="bar-wrap"><div class="bar" id="barDisagree"></div></div>
    </button>
  </div>

  <div class="spin-wrap">
    <button class="spin-btn" id="spinBtn" onclick="spin()">🎡 Spin!</button>
    <button class="reset-btn" id="resetBtn" onclick="resetVotes()" disabled data-i18n="hottake.reset">↺ Reset</button>
  </div>
  <!-- the cards spin the next take themselves (see nextGate below); this line shows
       how many are ready, so the host can see the room deciding without touching anything -->
  <div class="next-status hidden" id="next-status"></div>

  <!-- player cards: everyone votes from their own phone, the tally above updates live -->
  <div id="room-mount"></div>

  <div class="deck-browser">
    <button class="deck-toggle" id="deck-toggle" onclick="toggleDeck()"></button>
    <div class="deck-list hidden" id="deck-list"></div>
  </div>

  <!-- how-to-play briefing: shown first, hands over to the page below -->
  <script src="guide-data.js"></script>
  <script src="guide.js"></script>
  <script src="qrcode.js"></script>
  <script src="game-data.js"></script>
  <script src="sheet-data.js"></script>
  <script src="game-render.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="room.js"></script>
  <script src="next-round.js"></script>
  <script>
    GAME_RENDER.injectCSS();
    const takes = GAME_DATA.hottake;

    I18N.registerDict('hottake', {
      round:      { zh: '回合', en: 'Round' },
      fireLabel:  { zh: '🔥 選邊站', en: '🔥 Pick a Side' },
      placeholder:{ zh: '按下 Spin 顯示一句犀利意見', en: 'Press Spin to reveal a bold opinion' },
      agree:      { zh: '同意', en: 'Agree' },
      itDepends:  { zh: '看情況', en: 'It Depends' },
      disagree:   { zh: '不同意', en: 'Disagree' },
      spin:       { zh: '🎡 抽題！', en: '🎡 Spin!' },
      spinAgain:  { zh: '🔁 再抽一次', en: '🔁 Spin Again' },
      drawing:    { zh: '抽題中…', en: 'Drawing…' },
      reset:      { zh: '↺ 重置', en: '↺ Reset' },
      nextStatusFirst: { zh: '📱 任何一位玩家都可以在自己的卡片上按「🎡 抽第一題」開始 — 這裡的 Spin 是備援。', en: '📱 Any player can tap "🎡 Spin the first one" on their own card to start — Spin here is the backup.' },
      nextStatusReady: { zh: '👋 {ready} / {count} 位玩家準備好換下一題（{needed} 位就自動抽）', en: '👋 {ready} of {count} players ready for the next one — it spins itself at {needed}' },
      linksNote:  { zh: '玩家打開自己的卡片連結，針對每個議題投 👍／🤷／👎 —— 上方的統計會把他們的票數和你在這裡點的加總在一起。', en: 'Players open their own card link and vote 👍 / 🤷 / 👎 on each take — the tally above counts their votes together with the ones you tap here.' },
      hideDeckBtn:   { zh: '🙈 收起清單', en: '🙈 Hide the list' },
      browseDeckBtn: { zh: '👁️ 瀏覽全部 {n} 句犀利意見（暴雷 — 分享畫面時請勿開啟）', en: "👁️ Browse all {n} takes (spoilers — don't open while sharing)" },
    });
    const ht = (key, vars) => {
      let s = typeof I18N !== 'undefined' ? I18N.t('hottake', key) : key;
      if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
      return s;
    };

    let rolling = false;
    let round = 0;
    let currentTake = '';
    let voteId = '';          // changes every spin, so last round's card votes stop counting
    const votes = { agree: 0, middle: 0, disagree: 0 }; // tapped by the host, for people without a link

    function buildSides() {
      return { agree: '👍 ' + ht('agree'), middle: '🤷 ' + ht('itDepends'), disagree: '👎 ' + ht('disagree') };
    }
    let SIDES = buildSides();

    function updateSpinLabel() {
      document.getElementById('spinBtn').textContent = round > 0 ? ht('spinAgain') : ht('spin');
    }
    updateSpinLabel();

    ROOM.init({
      mount: 'room-mount',
      accent: '#ff7043',
      hideSetup: true, // player count and links are set up once on index.html now
      linksNote: () => ht('linksNote'),
      onPlayerData: (num, data) => { updateBars(); ROOM.render(); nextGate.handle(num, data); },
      onCountChange: () => { updateBars(); nextGate.sync(); },
      onNameChange: () => ROOM.render(),
    });

    /* The cards spin the next take, the host's Spin button is the backup. A vote
       isn't the end of a round here — the talk after it is the game — so one tap
       must not be able to cut it short: each card says "ready for the next one" and
       the spin fires when more than half the room has. The first spin of a session
       takes one tap, because nothing is on the cards yet. */
    const nextGate = NEXT_ROUND.create({
      count: () => ROOM.count,
      needed: n => round > 0 ? NEXT_ROUND.majority(n) : 1,
      canDraw: () => ROOM.enabled && !rolling,
      draw: () => spin(),
      publish: p => { ROOM.update(p); renderNextStatus(); },
    });

    function renderNextStatus() {
      const el = document.getElementById('next-status');
      const open = nextGate.isOpen();
      el.classList.toggle('hidden', !open);
      if (!open) return;
      el.textContent = round > 0
        ? ht('nextStatusReady', { ready: nextGate.readyNums().length, count: ROOM.count, needed: nextGate.needed() })
        : ht('nextStatusFirst');
    }

    I18N.onChange(() => {
      SIDES = buildSides();
      updateSpinLabel();
      updateBars();
      ROOM.render();
      renderNextStatus();
      // the drawn take's card is built once by GAME_RENDER.hottake() and never
      // touched again, so its "🔥 HOT TAKE" label is baked into the DOM in
      // whatever language was active at draw time — redraw it so a language
      // switch mid-round actually takes effect
      if (currentTake) GAME_RENDER.hottake(document.getElementById('card'), currentTake);
      renderDeckToggleLabel();
    });

    /* what each player picked this round — only votes carrying the current id count */
    function cardVote(playerNum) {
      const d = ROOM.answers[playerNum];
      const v = d && d.vote;
      return v && v.id === voteId && voteId ? v.choice : null;
    }

    ROOM.setDecorator(i => {
      const choice = cardVote(i + 1);
      return choice ? { marked: true, answer: SIDES[choice] || '' } : {};
    });

    function vote(side) {
      votes[side]++;
      updateBars();
    }

    function updateBars() {
      const totals = { agree: votes.agree, middle: votes.middle, disagree: votes.disagree };
      for (let i = 1; i <= ROOM.count; i++) {
        const c = cardVote(i);
        if (c && totals[c] != null) totals[c]++;
      }
      const total = totals.agree + totals.middle + totals.disagree || 1;
      document.getElementById('cntAgree').textContent    = totals.agree;
      document.getElementById('cntMiddle').textContent   = totals.middle;
      document.getElementById('cntDisagree').textContent = totals.disagree;
      document.getElementById('barAgree').style.width    = (totals.agree   / total * 100) + '%';
      document.getElementById('barMiddle').style.width   = (totals.middle  / total * 100) + '%';
      document.getElementById('barDisagree').style.width = (totals.disagree / total * 100) + '%';
    }

    function triggerRipple() {
      const card = document.getElementById('card');
      const el = document.createElement('div');
      el.className = 'ripple-el';
      el.style.cssText = 'left:50%;top:50%;margin-left:-50px;margin-top:-50px;';
      card.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function spin() {
      if (rolling) return;
      rolling = true;
      votes.agree = votes.middle = votes.disagree = 0;
      updateBars();

      const card    = document.getElementById('card');
      const spinBtn = document.getElementById('spinBtn');
      const btnA    = document.getElementById('btnAgree');
      const btnM    = document.getElementById('btnMiddle');
      const btnD    = document.getElementById('btnDisagree');

      card.innerHTML = `<span class="fire-label" data-i18n="hottake.fireLabel">${ht('fireLabel')}</span><span class="take-text" id="takeText" data-i18n="hottake.drawing">${ht('drawing')}</span>`;
      const text = document.getElementById('takeText');

      spinBtn.disabled = true;
      document.getElementById('resetBtn').disabled = true;
      btnA.disabled = btnM.disabled = btnD.disabled = true;
      card.classList.remove('active');
      card.classList.add('rolling');
      triggerRipple();

      const drawnIdx = Math.floor(Math.random() * takes.length);
      const chosen   = takes[drawnIdx];

      GAME_RENDER.drawTick(takes, tick => { text.textContent = tick; }, () => {
        card.classList.remove('rolling');
        card.classList.add('active');
        GAME_RENDER.hottake(card, chosen);
        round++;
        currentTake = chosen;
        document.getElementById('roundNum').textContent = round;
        btnA.disabled = btnM.disabled = btnD.disabled = false;
        updateSpinLabel();
        spinBtn.disabled = false;
        document.getElementById('resetBtn').disabled = false;
        rolling = false;
        pushToCards();
      });
    }

    /* send this round's take to every player's card and open a fresh ballot */
    function pushToCards() {
      voteId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      nextGate.open();   // a new ballot is a new round: everyone's "ready" starts over
      ROOM.publish(Object.assign({ game: 'hottake', round, text: currentTake, voteId }, nextGate.payload()));
      updateBars();
      ROOM.render();
      renderNextStatus();
    }

    /* nothing spun yet: the cards carry only "spin the first one", so the game can
       start from any phone — the same way Say It opens with its deal button */
    function publishIdle() {
      if (!ROOM.enabled || currentTake) return;
      nextGate.open();
      ROOM.publish(Object.assign({ game: 'hottake', round: 0, text: '', voteId: '' }, nextGate.payload()));
      renderNextStatus();
    }
    publishIdle();

    function resetVotes() {
      votes.agree = votes.middle = votes.disagree = 0;
      if (currentTake) pushToCards(); // a new ballot id also wipes the votes cast from the cards
      else updateBars();
    }

    /* ── Deck browser: closed by default, since this screen is being shared ── */
    let deckOpen = false;
    function toggleDeck() {
      deckOpen = !deckOpen;
      document.getElementById('deck-list').classList.toggle('hidden', !deckOpen);
      renderDeckToggleLabel();
    }
    function renderDeckToggleLabel() {
      document.getElementById('deck-toggle').textContent = deckOpen
        ? ht('hideDeckBtn')
        : ht('browseDeckBtn', { n: takes.length });
    }
    function renderDeckList() {
      document.getElementById('deck-list').innerHTML = takes
        .map((t, i) => `<div class="deck-item"><span class="di-num">#${i + 1}</span>${t}</div>`)
        .join('');
    }
    renderDeckList();
    renderDeckToggleLabel();
  </script>
</body>
</html>
