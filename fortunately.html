<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortunately / Unfortunately · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d0d1a">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 72px;
    }

    @keyframes fadeUp  { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
    @keyframes flicker { 0%,100%{opacity:1} 50%{opacity:.55} }
    @keyframes glowGreen { 0%,100%{box-shadow:0 0 0 rgba(34,197,94,0)}  50%{box-shadow:0 0 50px rgba(34,197,94,.35)} }
    @keyframes glowRed   { 0%,100%{box-shadow:0 0 0 rgba(239,68,68,0)}  50%{box-shadow:0 0 50px rgba(239,68,68,.35)} }
    @keyframes popIn   { from{opacity:0;transform:scale(.88)} to{opacity:1;transform:scale(1)} }
    @keyframes slideDown { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }

    /* ── Topbar ── */
    .topbar {
      width:100%; max-width:720px;
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:36px;
      animation:fadeUp .5s ease both;
      position:relative; z-index:1;
    }
    a.back { color:#555; text-decoration:none; font-size:14px; transition:color .2s; }
    a.back:hover { color:#eee; }
    .round-badge { font-size:12px; color:#444; }
    .round-badge span { color:#14b8a6; font-weight:700; }

    /* ── Header ── */
    .header {
      text-align:center; margin-bottom:32px;
      animation:fadeUp .5s .1s ease both;
      position:relative; z-index:1;
    }
    .header h1 {
      font-size:clamp(1.8rem,5vw,2.6rem); font-weight:800;
      background:linear-gradient(135deg,#fff 30%,#14b8a6);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      margin-bottom:8px;
    }
    .header p { color:#666; font-size:.93rem; }

    /* ── Opening scenario box ── */
    .opening-box {
      width:100%; max-width:720px;
      background:#13132b; border:2px solid #1e1e42; border-radius:20px;
      padding:22px 28px; margin-bottom:18px;
      display:flex; align-items:center; gap:16px;
      min-height:110px;
      transition:border-color .4s, box-shadow .4s;
      animation:fadeUp .5s .2s ease both;
      position:relative; z-index:1;
    }
    .opening-box.rolling { border-color:#14b8a6; animation:flicker .13s infinite; }
    .opening-box.set     { border-color:#14b8a6; box-shadow:0 0 24px rgba(20,184,166,.18); }
    .op-icon { font-size:1.9rem; flex-shrink:0; }
    .op-label { font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; color:#14b8a6; margin-bottom:6px; font-weight:700; }
    .op-text  { font-size:1.9rem; color:#444; font-style:italic; line-height:1.4; transition:color .3s; }
    .op-text.loaded { color:#ccc; }

    /* ── Draw / Start button ── */
    .btn-draw {
      width:100%; max-width:720px;
      background:#13132b; color:#14b8a6; border:2px solid #14b8a6;
      border-radius:14px; padding:15px; font-size:1.05rem; font-weight:700;
      cursor:pointer; font-family:inherit; transition:background .2s;
      margin-bottom:22px;
      animation:fadeUp .5s .3s ease both;
      position:relative; z-index:1;
    }
    .btn-draw:hover { background:rgba(20,184,166,.12); }
    .btn-draw:disabled { opacity:.4; cursor:not-allowed; }

    /* ── Start choice buttons ── */
    .btn-start-fort, .btn-start-unfort {
      flex:1; border:none; border-radius:14px; padding:15px 12px;
      font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit;
      transition:transform .15s, box-shadow .15s;
    }
    .btn-start-fort {
      background:rgba(34,197,94,.15); color:#4ade80; border:2px solid #22c55e;
    }
    .btn-start-fort:hover { background:rgba(34,197,94,.25); transform:translateY(-2px); box-shadow:0 6px 20px rgba(34,197,94,.3); }
    .btn-start-unfort {
      background:rgba(239,68,68,.15); color:#f87171; border:2px solid #ef4444;
    }
    .btn-start-unfort:hover { background:rgba(239,68,68,.25); transform:translateY(-2px); box-shadow:0 6px 20px rgba(239,68,68,.3); }

    /* ── WORD CARD ── */
    .word-card {
      width:100%; max-width:720px;
      border-radius:18px; padding:22px 24px;
      text-align:center; margin-bottom:18px;
      display:flex; flex-direction:column; align-items:center; gap:8px;
      opacity:0; pointer-events:none;
      transition:opacity .3s;
      position:relative; z-index:1;
    }
    .word-card.visible { opacity:1; pointer-events:auto; }
    .word-card.fort {
      background:rgba(34,197,94,.13); border:2px solid #22c55e;
      animation:popIn .35s ease both, glowGreen 2.8s ease infinite;
    }
    .word-card.unfort {
      background:rgba(239,68,68,.13); border:2px solid #ef4444;
      animation:popIn .35s ease both, glowRed 2.8s ease infinite;
    }
    .wc-emoji { font-size:1.8rem; }
    .wc-word  {
      font-size:clamp(1.3rem,4vw,2rem); font-weight:900; letter-spacing:.01em; line-height:1.2;
    }
    .word-card.fort   .wc-word { color:#4ade80; }
    .word-card.unfort .wc-word { color:#f87171; }
    .wc-dots { font-size:.9rem; color:#333; margin-top:2px; }

    /* ── Turn dots history ── */
    .dots-strip {
      width:100%; max-width:720px;
      display:flex; align-items:center; gap:7px; flex-wrap:wrap;
      margin-bottom:16px; min-height:18px;
      position:relative; z-index:1;
    }
    .hdot { width:11px; height:11px; border-radius:50%; flex-shrink:0; transition:box-shadow .3s; }
    .hdot.f { background:#22c55e; }
    .hdot.u { background:#ef4444; }
    .hdot.cur { width:15px; height:15px; }
    .hdot.f.cur { box-shadow:0 0 10px #22c55e; }
    .hdot.u.cur { box-shadow:0 0 10px #ef4444; }

    /* ── Action buttons ── */
    .btn-row {
      width:100%; max-width:720px;
      display:flex; gap:12px;
      animation:fadeUp .5s .4s ease both;
      position:relative; z-index:1;
    }
    .btn {
      border:none; border-radius:999px; padding:16px 32px;
      font-size:1rem; font-weight:800; cursor:pointer; font-family:inherit;
      transition:background .2s, transform .1s, box-shadow .2s;
    }
    .btn:active { transform:scale(.97); }
    .btn:disabled { opacity:.35; cursor:not-allowed; }
    .btn-new  {
      flex:1; background:#13132b; color:#14b8a6; border:2px solid #14b8a6;
      padding:14px 24px;
    }
    .btn-new:hover:not(:disabled) { background:rgba(20,184,166,.12); }
    .btn-next {
      flex:2; background:#14b8a6; color:#0d0d1a;
      box-shadow:0 4px 24px rgba(20,184,166,.35);
    }
    .btn-next:hover:not(:disabled) {
      background:#2dd4bf;
      box-shadow:0 4px 32px rgba(20,184,166,.55);
      transform:translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Turn <span id="turn-num">—</span></div>
  </div>

  <div class="header">
    <h1>🎢 Fortunately / Unfortunately</h1>
    <p>Take turns building a story — keep flipping between good and bad luck!</p>
  </div>

  <!-- Opening scenario -->
  <div class="opening-box" id="opening-box">
    <div class="op-icon">📖</div>
    <div>
      <div class="op-label">Opening</div>
      <div class="op-text" id="op-text">Press Draw to reveal the opening scenario</div>
    </div>
  </div>

  <!-- Draw / Start button -->
  <button class="btn-draw" id="draw-btn" onclick="handleDrawBtn()">🎲 Draw Opening</button>

  <!-- Start choice (shown after drawing) -->
  <div id="start-choice" style="display:none; width:100%; max-width:720px; display:none; gap:12px; margin-bottom:22px;">
    <button class="btn-start-fort"  onclick="beginPlay(true)">🍀 Start with FORTUNATELY</button>
    <button class="btn-start-unfort" onclick="beginPlay(false)">💔 Start with UNFORTUNATELY</button>
  </div>

  <!-- Turn history dots -->
  <div class="dots-strip" id="dots-strip"></div>

  <!-- Big word card -->
  <div class="word-card" id="word-card">
    <div class="wc-emoji" id="wc-emoji"></div>
    <div class="wc-word"  id="wc-word"></div>
    <div class="wc-dots">. . .</div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-new"  id="new-btn"  onclick="newStory()" disabled>🔁 New Story</button>
    <button class="btn btn-next" id="next-btn" onclick="nextTurn()" disabled>Next Turn →</button>
  </div>

  <script>
    const openings = [
      'A teacher walked into class on a Monday morning...',
      'A tourist arrived in a new city with just one small suitcase...',
      'A chef was preparing for the most important dinner of his career...',
      'A student woke up on the morning of the biggest exam of the year...',
      'A delivery driver got completely lost in an unfamiliar neighbourhood...',
      'A scientist was working alone in the laboratory late at night...',
      'A dog walker was trying to walk five dogs in the park at once...',
      'A young musician was about to perform on stage for the very first time...',
      'A librarian discovered a book that had never once been checked out...',
      'A pilot sat in the cockpit, ready for a very long international flight...',
      'A wedding photographer arrived at the venue an hour early...',
      'A zookeeper noticed that one of the animals was missing...',
      'A baker was getting ready to open the shop at 6 am...',
      'An astronaut was floating peacefully in space, humming a song...',
      'A journalist arrived at what was supposed to be a quiet press conference...',
      'A superhero woke up and discovered they had lost their powers...',
      'A fisherman set out to sea early in the morning...',
      'A brand new employee showed up for their very first day at work...',
      'A grandma was peacefully baking cookies when the doorbell rang...',
      'A magician was about to perform the greatest trick of his life...',
      'A taxi driver picked up a very unusual-looking passenger...',
      'A sleepy traveller missed their stop on the train...',
      'A painter was putting the final brushstroke on a huge mural...',
      'An inventor was testing their latest creation in the garage...',
      'A firefighter was enjoying a very quiet afternoon at the station...',
      'A park ranger was doing a routine morning patrol through the forest...',
      'A cat sat on a windowsill, watching something strange on the street below...',
      'A dentist opened the clinic door to find the waiting room completely full...',
      'A swimmer was training alone in the pool just before sunrise...',
      'A very tired student sat down to start writing a ten-page essay...',
    ];

    let turnIdx   = -1;
    let usedIdx   = [];
    let rolling   = false;
    let started   = false;
    let startFort = false;

    function handleDrawBtn() {
      if (!started) { drawOpening(); }
      else          { showStartChoice(); }
    }

    function showStartChoice() {
      document.getElementById('draw-btn').style.display = 'none';
      const sc = document.getElementById('start-choice');
      sc.style.display = 'flex';
    }

    function drawOpening() {
      if (rolling) return;
      rolling = true;
      const btn  = document.getElementById('draw-btn');
      const box  = document.getElementById('opening-box');
      const txt  = document.getElementById('op-text');
      btn.disabled = true;
      box.className = 'opening-box rolling';

      let avail = openings.map((_,i)=>i).filter(i => !usedIdx.includes(i));
      if (!avail.length) { usedIdx = []; avail = openings.map((_,i)=>i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      usedIdx.push(fi);

      let ticks = 0;
      const iv = setInterval(() => {
        txt.textContent = openings[Math.floor(Math.random() * openings.length)];
        txt.className   = 'op-text loaded';
        if (++ticks >= 22) {
          clearInterval(iv);
          txt.textContent  = openings[fi];
          box.className    = 'opening-box set';
          btn.disabled     = false;
          btn.textContent  = '▶ Start Story';
          rolling = false;
          started = true;
        }
      }, 85);
    }

    function beginPlay(fort) {
      startFort = fort;
      turnIdx   = 0;
      document.getElementById('start-choice').style.display = 'none';
      document.getElementById('new-btn').disabled  = false;
      document.getElementById('next-btn').disabled = false;
      renderCard();
      renderDots();
      updateTurnNum();
    }

    function nextTurn() {
      turnIdx++;
      renderCard();
      renderDots();
      updateTurnNum();
    }

    function newStory() {
      turnIdx  = -1;
      started  = false;
      const box = document.getElementById('opening-box');
      box.className = 'opening-box';
      document.getElementById('op-text').textContent = 'Press Draw to reveal the opening scenario';
      document.getElementById('op-text').className   = 'op-text';
      const drawBtn = document.getElementById('draw-btn');
      drawBtn.textContent  = '🎲 Draw Opening';
      drawBtn.style.display = '';
      drawBtn.disabled     = false;
      document.getElementById('new-btn').disabled  = true;
      document.getElementById('next-btn').disabled = true;
      document.getElementById('start-choice').style.display = 'none';
      const card = document.getElementById('word-card');
      card.className = 'word-card';
      document.getElementById('dots-strip').innerHTML = '';
      document.getElementById('turn-num').textContent = '—';
    }

    function renderCard() {
      // startFort=true  → even turns = Fortunately, odd = Unfortunately
      // startFort=false → even turns = Unfortunately, odd = Fortunately
      const isFort = startFort ? (turnIdx % 2 === 0) : (turnIdx % 2 === 1);
      const card = document.getElementById('word-card');
      card.className = 'word-card visible ' + (isFort ? 'fort' : 'unfort');
      document.getElementById('wc-emoji').textContent = isFort ? '🍀' : '💔';
      document.getElementById('wc-word').textContent  = isFort ? 'FORTUNATELY' : 'UNFORTUNATELY';
    }

    function renderDots() {
      const strip = document.getElementById('dots-strip');
      strip.innerHTML = '';
      for (let i = 0; i <= turnIdx; i++) {
        const d = document.createElement('div');
        const isUnfort = i % 2 === 0;
        d.className = 'hdot ' + (isUnfort ? 'u' : 'f') + (i === turnIdx ? ' cur' : '');
        strip.appendChild(d);
      }
    }

    function updateTurnNum() {
      document.getElementById('turn-num').textContent = turnIdx + 1;
    }
  </script>
</body>
</html>
