<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortunately / Unfortunately · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d0d1a">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 72px;
    }

    @keyframes fadeUp    { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
    @keyframes flicker   { 0%,100%{opacity:1} 50%{opacity:.55} }
    @keyframes glowGreen { 0%,100%{box-shadow:0 0 0 rgba(34,197,94,0)}   50%{box-shadow:0 0 50px rgba(34,197,94,.35)} }
    @keyframes glowRed   { 0%,100%{box-shadow:0 0 0 rgba(239,68,68,0)}   50%{box-shadow:0 0 50px rgba(239,68,68,.35)} }
    @keyframes glowGold  { 0%,100%{box-shadow:0 0 0 rgba(245,158,11,0)}  50%{box-shadow:0 0 50px rgba(245,158,11,.35)} }
    @keyframes popIn     { from{opacity:0;transform:scale(.88)} to{opacity:1;transform:scale(1)} }
    @keyframes slideDown { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:translateY(0)} }

    /* ── Topbar ── */
    .topbar {
      width:100%; max-width:720px;
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:36px;
      animation:fadeUp .5s ease both;
      position:relative; z-index:1;
    }
    a.back { color:#555; text-decoration:none; font-size:14px; transition:color .2s; }
    a.back:hover { color:#eee; }
    .round-badge { font-size:12px; color:#444; }
    .round-badge span { color:#14b8a6; font-weight:700; }

    /* ── Header ── */
    .header {
      text-align:center; margin-bottom:32px;
      animation:fadeUp .5s .1s ease both;
      position:relative; z-index:1;
    }
    .header h1 {
      font-size:clamp(1.8rem,5vw,2.6rem); font-weight:800;
      background:linear-gradient(135deg,#fff 30%,#14b8a6);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      margin-bottom:8px;
    }
    .header p { color:#666; font-size:.93rem; }

    /* ── Opening scenario box ── */
    .opening-box {
      width:100%; max-width:720px;
      background:#13132b; border:2px solid #1e1e42; border-radius:20px;
      padding:22px 28px; margin-bottom:18px;
      display:flex; align-items:center; gap:16px;
      min-height:110px;
      transition:border-color .4s, box-shadow .4s;
      animation:fadeUp .5s .2s ease both;
      position:relative; z-index:1;
    }
    .opening-box.rolling { border-color:#14b8a6; animation:flicker .13s infinite; }
    .opening-box.set     { border-color:#14b8a6; box-shadow:0 0 24px rgba(20,184,166,.18); }
    .op-icon  { font-size:1.9rem; flex-shrink:0; }
    .op-label { font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; color:#14b8a6; margin-bottom:6px; font-weight:700; }
    .op-text  { font-size:1.9rem; color:#444; font-style:italic; line-height:1.4; transition:color .3s; }
    .op-text.loaded { color:#ccc; }

    /* ── Draw / Redraw row ── */
    .opening-btn-row {
      width:100%; max-width:720px;
      display:flex; gap:12px; margin-bottom:22px;
      animation:fadeUp .5s .3s ease both;
      position:relative; z-index:1;
    }
    .btn-draw {
      flex:2;
      background:#13132b; color:#14b8a6; border:2px solid #14b8a6;
      border-radius:14px; padding:15px; font-size:1.05rem; font-weight:700;
      cursor:pointer; font-family:inherit; transition:background .2s;
    }
    .btn-draw:hover { background:rgba(20,184,166,.12); }
    .btn-draw:disabled { opacity:.4; cursor:not-allowed; }
    .btn-redraw {
      flex:1;
      background:transparent; color:#555; border:2px solid #2a2a4a;
      border-radius:14px; padding:15px; font-size:1rem; font-weight:700;
      cursor:pointer; font-family:inherit; transition:background .2s, color .2s, border-color .2s;
    }
    .btn-redraw:hover { background:rgba(20,184,166,.08); color:#14b8a6; border-color:#14b8a6; }
    .btn-redraw:disabled { opacity:.4; cursor:not-allowed; }

    /* ── Choice Panel ── */
    .choice-panel {
      width:100%; max-width:720px;
      display:none; flex-direction:column; gap:12px;
      margin-bottom:22px;
      position:relative; z-index:1;
    }
    .choice-panel.visible {
      display:flex;
      animation:slideDown .3s ease both;
    }
    .choice-label {
      font-size:.8rem; text-transform:uppercase; letter-spacing:.1em;
      color:#444; font-weight:700; text-align:center;
    }
    .choice-btns { display:flex; gap:12px; }

    .btn-choice {
      flex:1; border:2px solid; border-radius:16px;
      padding:22px 14px;
      font-size:clamp(.9rem,2.3vw,1.1rem); font-weight:800;
      cursor:pointer; font-family:inherit;
      transition:transform .15s, box-shadow .15s, background .15s;
      line-height:1.35; text-align:center;
    }
    .btn-choice:hover  { transform:translateY(-3px); }
    .btn-choice:active { transform:scale(.97); }

    .btn-choice-fort {
      background:rgba(34,197,94,.15); color:#4ade80; border-color:#22c55e;
    }
    .btn-choice-fort:hover  { background:rgba(34,197,94,.25); box-shadow:0 8px 24px rgba(34,197,94,.3); }
    .btn-choice-unfort {
      background:rgba(239,68,68,.15); color:#f87171; border-color:#ef4444;
    }
    .btn-choice-unfort:hover { background:rgba(239,68,68,.25); box-shadow:0 8px 24px rgba(239,68,68,.3); }
    .btn-choice-end {
      background:rgba(245,158,11,.15); color:#fbbf24; border-color:#f59e0b;
    }
    .btn-choice-end:hover    { background:rgba(245,158,11,.25); box-shadow:0 8px 24px rgba(245,158,11,.3); }

    /* ── Turn dots history ── */
    .dots-strip {
      width:100%; max-width:720px;
      display:flex; align-items:center; gap:7px; flex-wrap:wrap;
      margin-bottom:16px; min-height:18px;
      position:relative; z-index:1;
    }
    .hdot { width:11px; height:11px; border-radius:50%; flex-shrink:0; transition:box-shadow .3s; }
    .hdot.f   { background:#22c55e; }
    .hdot.u   { background:#ef4444; }
    .hdot.e   { background:#f59e0b; }
    .hdot.cur { width:15px; height:15px; }
    .hdot.f.cur { box-shadow:0 0 10px #22c55e; }
    .hdot.u.cur { box-shadow:0 0 10px #ef4444; }
    .hdot.e.cur { box-shadow:0 0 10px #f59e0b; }

    /* ── WORD CARD ── */
    .word-card {
      width:100%; max-width:720px;
      border-radius:18px; padding:22px 24px;
      text-align:center; margin-bottom:18px;
      display:flex; flex-direction:column; align-items:center; gap:8px;
      opacity:0; pointer-events:none;
      transition:opacity .3s;
      position:relative; z-index:1;
    }
    .word-card.visible { opacity:1; pointer-events:auto; }
    .word-card.fort   { background:rgba(34,197,94,.13);  border:2px solid #22c55e; animation:popIn .35s ease both, glowGreen 2.8s ease infinite; }
    .word-card.unfort { background:rgba(239,68,68,.13);  border:2px solid #ef4444; animation:popIn .35s ease both, glowRed   2.8s ease infinite; }
    .word-card.end    { background:rgba(245,158,11,.13); border:2px solid #f59e0b; animation:popIn .35s ease both, glowGold  2.8s ease infinite; }
    .wc-emoji { font-size:1.8rem; }
    .wc-word  {
      font-size:clamp(1.3rem,4vw,2rem); font-weight:900; letter-spacing:.01em; line-height:1.2;
    }
    .word-card.fort   .wc-word { color:#4ade80; }
    .word-card.unfort .wc-word { color:#f87171; }
    .word-card.end    .wc-word { color:#fbbf24; }
    .wc-turn { font-size:.82rem; color:#555; margin-top:4px; }

    /* ── Action buttons ── */
    .btn-row {
      width:100%; max-width:720px;
      display:flex; gap:12px;
      animation:fadeUp .5s .4s ease both;
      position:relative; z-index:1;
    }
    .btn {
      border:none; border-radius:999px; padding:16px 32px;
      font-size:1rem; font-weight:800; cursor:pointer; font-family:inherit;
      transition:background .2s, transform .1s, box-shadow .2s;
    }
    .btn:active { transform:scale(.97); }
    .btn:disabled { opacity:.35; cursor:not-allowed; }
    .btn-new  {
      flex:1; background:#13132b; color:#14b8a6; border:2px solid #14b8a6;
      padding:14px 24px;
    }
    .btn-new:hover:not(:disabled) { background:rgba(20,184,166,.12); }
    .btn-next {
      flex:2; background:#14b8a6; color:#0d0d1a;
      box-shadow:0 4px 24px rgba(20,184,166,.35);
    }
    .btn-next:hover:not(:disabled) {
      background:#2dd4bf;
      box-shadow:0 4px 32px rgba(20,184,166,.55);
      transform:translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="turn-num">—</span> / 10</div>
  </div>

  <div class="header">
    <h1>🎢 Fortunately / Unfortunately</h1>
    <p>Take turns building a story — keep flipping between good and bad luck!</p>
  </div>

  <!-- Opening scenario -->
  <div class="opening-box" id="opening-box">
    <div class="op-icon">📖</div>
    <div>
      <div class="op-label">Opening</div>
      <div class="op-text" id="op-text">Press Draw to reveal the opening scenario</div>
    </div>
  </div>

  <!-- Draw / Redraw row -->
  <div class="opening-btn-row">
    <button class="btn-redraw" id="redraw-btn" onclick="redrawOpening()" style="display:none">🔀 Redraw</button>
    <button class="btn-draw"   id="draw-btn"   onclick="handleDrawBtn()">🎲 Draw Opening</button>
  </div>

  <!-- Choice Panel (shown each round) -->
  <div class="choice-panel" id="choice-panel">
    <div class="choice-label" id="choice-label"></div>
    <div class="choice-btns">
      <button class="btn-choice" id="choice-a"></button>
      <button class="btn-choice" id="choice-b"></button>
    </div>
  </div>

  <!-- Turn history dots -->
  <div class="dots-strip" id="dots-strip"></div>

  <!-- Big word card -->
  <div class="word-card" id="word-card">
    <div class="wc-emoji" id="wc-emoji"></div>
    <div class="wc-word"  id="wc-word"></div>
    <div class="wc-turn"  id="wc-turn"></div>
  </div>

  <!-- Bottom buttons -->
  <div class="btn-row">
    <button class="btn btn-new"  id="new-btn"  onclick="newStory()" disabled>🔁 New Story</button>
    <button class="btn btn-next" id="next-btn" onclick="nextTurn()" disabled>Next Round →</button>
  </div>

  <script>
    const openings = [
      "A first-year nurse arrived at the hospital for her very first shift...",
      "A nervous groom realized, one hour before the wedding, that he had lost the rings...",
      "A travel blogger boarded a flight to Tokyo — and landed in Toronto...",
      "An inventor unveiled her greatest invention to the world, but forgot to bring it...",
      "A championship swimmer jumped in the pool and realized it was empty...",
      "A teenager sent a heartfelt text to the wrong contact...",
      "A zookeeper arrived on Monday morning and discovered the gate wide open...",
      "A food critic sat down at a restaurant where the chef was a complete beginner...",
      "A soldier returned home after two years and knocked on the wrong door...",
      "An architect proudly presented her new building design — upside down...",
      "A comedian walked on stage and immediately forgot all of his jokes...",
      "A patient woke up from surgery speaking with a completely different accent...",
      "A mountaineer reached the summit only to realize she had climbed the wrong mountain...",
      "An astronaut floated outside the space station and dropped the repair tool...",
      "A dog sitter arrived to find six dogs instead of the expected one...",
      "A bride-to-be called the caterer and accidentally ordered food for 400 people instead of 40...",
      "A marathon runner burst through the finish line tape — at the 20-kilometer mark...",
      "A professor walked into the wrong lecture hall and gave the wrong class an entire exam...",
      "A magician's assistant disappeared during the trick and didn't come back...",
      "A penguin escaped from the zoo and found its way onto the city subway...",
      "A journalist's career-defining interview was accidentally broadcast live before it was ready...",
      "A sailor found a treasure map but discovered it was printed on the back of a takeaway menu...",
      "A delivery robot drove straight into the mayor's office with an unscheduled package...",
      "A translator at a peace summit accidentally switched two world leaders' speeches...",
      "A competition judge announced the winner — then realized they had read the results backwards...",
      "A lifeguard jumped into the ocean to save someone, then realized she didn't know how to swim...",
      "A firefighter arrived to put out a fire and discovered it was actually a barbecue party...",
      "A taxi driver followed the GPS and ended up driving into a lake...",
      "A skydiver jumped from the plane, then noticed her parachute was a spare backpack...",
      "A chef served the last dish at a sold-out dinner — and then all the lights went out...",
    ];

    const POOL_FORT = [
      { word: 'FORTUNATELY',           emoji: '🍀', type: 'fort' },
      { word: 'LUCKILY',               emoji: '🌟', type: 'fort' },
      { word: 'AMAZINGLY',             emoji: '✨', type: 'fort' },
      { word: 'THANKFULLY',            emoji: '🙏', type: 'fort' },
      { word: 'HAPPILY',               emoji: '😊', type: 'fort' },
      { word: 'MIRACULOUSLY',          emoji: '🎉', type: 'fort' },
      { word: 'TO THEIR RELIEF',       emoji: '😅', type: 'fort' },
      { word: 'AS LUCK WOULD HAVE IT', emoji: '🍀', type: 'fort' },
    ];

    const POOL_UNFORT = [
      { word: 'UNFORTUNATELY',         emoji: '💔', type: 'unfort' },
      { word: 'SADLY',                 emoji: '😢', type: 'unfort' },
      { word: 'TO MAKE MATTERS WORSE', emoji: '😱', type: 'unfort' },
      { word: 'STRANGELY',             emoji: '🙃', type: 'unfort' },
      { word: 'SHOCKINGLY',            emoji: '⚡', type: 'unfort' },
      { word: 'UNEXPECTEDLY',          emoji: '😬', type: 'unfort' },
      { word: 'OF ALL THINGS',         emoji: '🤦', type: 'unfort' },
      { word: 'WORSE STILL',           emoji: '😰', type: 'unfort' },
    ];

    const POOL_ENDING = [
      { word: 'IN THE END',            emoji: '🏁', type: 'end' },
      { word: 'FINALLY',               emoji: '🎯', type: 'end' },
      { word: 'EVENTUALLY',            emoji: '⏰', type: 'end' },
      { word: 'AFTER ALL THAT',        emoji: '🌅', type: 'end' },
      { word: 'AT LAST',               emoji: '✅', type: 'end' },
      { word: 'IN THE LONG RUN',       emoji: '🏃', type: 'end' },
      { word: 'AND SO',                emoji: '📖', type: 'end' },
      { word: 'TO WRAP IT ALL UP',     emoji: '🎀', type: 'end' },
    ];

    const MAX_TURNS = 10;

    let turnIdx  = -1;
    let started  = false;
    let rolling  = false;
    let history  = [];   // [{word, emoji, type}, ...]
    let usedIdx  = [];

    function rand(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    /* Returns the two connector objects to show for a given turn index (0-based). */
    function getChoices(idx) {
      if (idx === 0) {
        return [
          { word: 'FORTUNATELY',   emoji: '🍀', type: 'fort'   },
          { word: 'UNFORTUNATELY', emoji: '💔', type: 'unfort' },
        ];
      }

      if (idx === MAX_TURNS - 1) {
        const pool = [...POOL_ENDING].sort(() => Math.random() - 0.5);
        return [pool[0], pool[1]];
      }

      // Rounds 2–9: one is the opposite polarity, one is a random connector
      const lastType    = history[history.length - 1].type;
      const lastWord    = history[history.length - 1].word;
      const oppPool     = lastType === 'fort' ? POOL_UNFORT : POOL_FORT;
      const opposite    = rand(oppPool);

      const allMiddle   = [...POOL_FORT, ...POOL_UNFORT];
      const others      = allMiddle.filter(c => c.word !== opposite.word && c.word !== lastWord);
      const random      = rand(others);

      return Math.random() < 0.5 ? [opposite, random] : [random, opposite];
    }

    /* ── Game flow ── */

    function handleDrawBtn() {
      if (!started) { drawOpening(); }
      else          { beginPlay();   }
    }

    function drawOpening() {
      if (rolling) return;
      rolling = true;
      const btn = document.getElementById('draw-btn');
      const box = document.getElementById('opening-box');
      const txt = document.getElementById('op-text');
      btn.disabled    = true;
      box.className   = 'opening-box rolling';

      let avail = openings.map((_, i) => i).filter(i => !usedIdx.includes(i));
      if (!avail.length) { usedIdx = []; avail = openings.map((_, i) => i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      usedIdx.push(fi);

      let ticks = 0;
      const iv = setInterval(() => {
        txt.textContent = openings[Math.floor(Math.random() * openings.length)];
        txt.className   = 'op-text loaded';
        if (++ticks >= 22) {
          clearInterval(iv);
          txt.textContent = openings[fi];
          box.className   = 'opening-box set';
          btn.disabled    = false;
          btn.textContent = '▶ Start Story';
          document.getElementById('redraw-btn').style.display = '';
          rolling = false;
          started = true;
        }
      }, 85);
    }

    function beginPlay() {
      turnIdx = 0;
      history = [];
      document.getElementById('draw-btn').style.display   = 'none';
      document.getElementById('redraw-btn').style.display = 'none';
      document.getElementById('new-btn').disabled         = false;
      document.getElementById('next-btn').disabled        = true;
      document.getElementById('dots-strip').innerHTML     = '';
      document.getElementById('word-card').className      = 'word-card';
      updateTurnNum();
      showChoicePanel();
    }

    function showChoicePanel() {
      const choices = getChoices(turnIdx);
      const label   = document.getElementById('choice-label');

      if (turnIdx === 0) {
        label.textContent = '🎬 Round 1 — How does the story begin?';
      } else if (turnIdx === MAX_TURNS - 1) {
        label.textContent = '🏁 Final Round — Time to wrap up the story!';
      } else {
        label.textContent = `Round ${turnIdx + 1} — Pick a connector:`;
      }

      [document.getElementById('choice-a'), document.getElementById('choice-b')].forEach((btn, i) => {
        const c      = choices[i];
        btn.textContent = c.emoji + '  ' + c.word;
        btn.className   = 'btn-choice btn-choice-' + c.type;
        btn.onclick     = () => selectConnector(c);
      });

      document.getElementById('choice-panel').className = 'choice-panel visible';
      document.getElementById('word-card').className    = 'word-card';
      document.getElementById('next-btn').disabled      = true;
    }

    function selectConnector(connector) {
      history.push(connector);
      document.getElementById('choice-panel').className = 'choice-panel';
      renderCard(connector);
      renderDots();

      const isLast = turnIdx === MAX_TURNS - 1;
      const nb     = document.getElementById('next-btn');
      nb.disabled    = isLast;
      nb.textContent = isLast ? '🎉 Story Complete!' : 'Next Round →';
    }

    function nextTurn() {
      if (turnIdx >= MAX_TURNS - 1) return;
      turnIdx++;
      updateTurnNum();
      showChoicePanel();
    }

    function renderCard(connector) {
      const card = document.getElementById('word-card');
      card.className = 'word-card visible ' + connector.type;
      document.getElementById('wc-emoji').textContent = connector.emoji;
      document.getElementById('wc-word').textContent  = connector.word;
      document.getElementById('wc-turn').textContent  = 'Round ' + (turnIdx + 1) + ' / ' + MAX_TURNS;
    }

    function renderDots() {
      const strip = document.getElementById('dots-strip');
      strip.innerHTML = '';
      history.forEach((c, i) => {
        const d = document.createElement('div');
        const tc = c.type === 'fort' ? 'f' : c.type === 'unfort' ? 'u' : 'e';
        d.className = 'hdot ' + tc + (i === history.length - 1 ? ' cur' : '');
        strip.appendChild(d);
      });
    }

    function redrawOpening() {
      if (rolling) return;
      started = false;
      document.getElementById('redraw-btn').style.display = 'none';
      const btn = document.getElementById('draw-btn');
      btn.style.display = '';
      btn.textContent   = '🎲 Draw Opening';
      drawOpening();
    }

    function newStory() {
      turnIdx = -1;
      started = false;
      history = [];
      const box = document.getElementById('opening-box');
      box.className = 'opening-box';
      document.getElementById('op-text').textContent = 'Press Draw to reveal the opening scenario';
      document.getElementById('op-text').className   = 'op-text';
      const drawBtn = document.getElementById('draw-btn');
      drawBtn.textContent  = '🎲 Draw Opening';
      drawBtn.style.display = '';
      drawBtn.disabled     = false;
      document.getElementById('redraw-btn').style.display   = 'none';
      document.getElementById('new-btn').disabled           = true;
      document.getElementById('next-btn').disabled          = true;
      document.getElementById('next-btn').textContent       = 'Next Round →';
      document.getElementById('choice-panel').className     = 'choice-panel';
      document.getElementById('word-card').className        = 'word-card';
      document.getElementById('dots-strip').innerHTML       = '';
      document.getElementById('turn-num').textContent       = '—';
    }

    function updateTurnNum() {
      document.getElementById('turn-num').textContent = turnIdx + 1;
    }
  </script>
</body>
</html>
