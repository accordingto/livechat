<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sophie's Choice · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sophie's Choice">
  <meta name="theme-color" content="#0d0d1a">
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="scenario.css">
  <style>
    :root { --accent: #f59e0b; }

    .header h1 { background: linear-gradient(135deg, #fff 30%, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(245,158,11,0); }
      50%       { box-shadow: 0 0 48px rgba(245,158,11,.25); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Card ── */
    .sc-card {
      width: 100%; max-width: 1100px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 32px 34px;
      margin-bottom: 16px;
      position: relative; overflow: hidden;
      transition: border-color .4s;
      animation: fadeUp .5s .2s ease both;
      min-height: 220px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .sc-card.rolling { border-color: #f59e0b; animation: flicker .14s infinite; }
    .sc-card.landed  { border-color: #f59e0b; animation: pulseGlow 2.5s ease infinite; }
    .sc-card::before {
      content: '🤔';
      position: absolute; font-size: 11rem; opacity: .022;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }

    /* Placeholder */

    /* Content wrapper */

    /* Situation */
    .sc-label {
      font-size: .86rem; text-transform: uppercase;
      letter-spacing: .1em; color: var(--warn-text); font-weight: 700;
      margin-bottom: 10px;
    }
    .sc-situation {
      font-size: clamp(1.15rem, 3vw, 1.45rem); color: var(--text);
      line-height: 1.55; font-weight: 600;
    }
    /* GAME_RENDER.sophies() centers .gr-text by default (shared with other games) — left-align it here only */
    #sc-content .gr-text { text-align: left; }

    /* Divider */
    .sc-divider { height: 1px; background: var(--border); }

    /* Options section */
    .options-section { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .options-section.pop { animation: slideDown .35s ease both; }
    .opt-c { grid-column: 1 / -1; }
    @media (max-width: 640px) {
      .options-section { grid-template-columns: 1fr; }
      .opt-c { grid-column: auto; }
    }

    .opt {
      display: flex; align-items: flex-start; gap: 14px;
      background: rgba(255,255,255,.03);
      border-radius: 14px; padding: 15px 18px;
      border: 1.5px solid rgba(255,255,255,.06);
    }
    .opt-badge {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.05rem; flex-shrink: 0;
      margin-top: 1px;
    }
    .opt-a .opt-badge { background: #2563eb; color: var(--text-hi); }
    .opt-b .opt-badge { background: #dc2626; color: var(--text-hi); }
    .opt-c .opt-badge { background: #16a34a; color: var(--text-hi); }

    .opt-text { font-size: clamp(1rem, 2.5vw, 1.15rem); color: var(--text-3); line-height: 1.55; padding-top: 6px; }
    .opt-c .opt-text { color: #86efac; font-style: italic; }

    /* ── live tally of what the players tapped on their own cards ── */
    .pick-tally {
      width: 100%; max-width: 1100px; margin: 16px auto 18px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .pick-tally.hidden { display: none; }
    .pt-col {
      background: var(--surface); border: 2px solid var(--border); border-radius: 14px;
      padding: 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: border-color .3s;
    }
    .pt-col.lead { border-color: currentColor; }
    .pt-key { font-size: .84rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; }
    .pt-count { font-size: 1.8rem; font-weight: 900; color: var(--text-hi); line-height: 1; }
    .pt-names { font-size: .84rem; font-weight: 700; color: var(--text-dim); text-align: center; line-height: 1.4; }
    /* the three tally columns paint their key and name in their own colour on a card
       face, where the original 600-weight blues and reds only reached 3.5:1 */
    .pt-a { color: #5e8cf0; }
    .pt-b { color: #e76767; }
    .pt-c { color: #45c16d; }
    @media (max-width: 520px) {
      .pick-tally { gap: 6px; }
      .pt-col { padding: 10px 6px; }
      .pt-count { font-size: 1.4rem; }
      .pt-names { font-size: .68rem; }
    }

    /* ── Draw button ── */

    .round-badge span { color: var(--warn-text); }

    @media (max-width: 520px) {
      .sc-card { padding: 22px 20px; }
      .opt-badge { width: 32px; height: 32px; font-size: .9rem; }
    }

    /* ── Filter bar ── */
    .filter-btn {
      border: 1.5px solid var(--border-3); border-radius: 20px;
      padding: 5px 14px; font-size: .8rem; font-weight: 700;
      color: var(--text-dim); background: var(--btn-face); cursor: pointer;
      transition: border-color .18s, color .18s, background .18s, transform .1s;
      font-family: inherit; white-space: nowrap;
    }

    /* ── Scenario browser ── */
    .scenario-num  { font-size: .75rem; font-weight: 900; color: var(--warn-text); flex-shrink: 0; padding-top: 2px; min-width: 22px; }
    .scenario-text { font-size: .88rem; font-weight: 500; color: var(--text-dim); line-height: 1.4; }


  </style>
</head>
<body data-guide="sophies" data-guide-next="game">

  <div class="topbar">
    <a class="back" href="index.html?step=2" data-i18n="common.backToHub">← Back to Hub</a>
    <div class="round-badge"><span data-i18n="sophies.roundLabel">Round</span> <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🤔 Sophie's Choice</h1>
  </div>

  <div class="sc-card" id="sc-card">

    <div class="sc-placeholder" id="sc-placeholder">
      <div class="big-emoji">🤔</div>
      <p id="sc-placeholder-text">Press <strong>Draw</strong> to reveal the situation</p>
    </div>

    <div class="sc-content" id="sc-content">

      <div>
        <div class="sc-label" data-i18n="sophies.situationLabel">🎯 The Situation</div>
        <div class="sc-situation" id="sc-situation"></div>
      </div>

      <div class="sc-divider" id="sc-divider" style="display:none"></div>

      <div class="options-section" id="options-section" style="display:none">
        <div class="opt opt-a">
          <div class="opt-badge">A</div>
          <div class="opt-text" id="opt-a-text"></div>
        </div>
        <div class="opt opt-b">
          <div class="opt-badge">B</div>
          <div class="opt-text" id="opt-b-text"></div>
        </div>
        <div class="opt opt-c">
          <div class="opt-badge">C</div>
          <div class="opt-text" data-i18n="sophies.optionC">Something else — come up with your own answer and share it with the group!</div>
        </div>
      </div>

    </div>
  </div>

  <div class="pick-tally hidden" id="pick-tally"></div>

  <button class="btn-draw" id="draw-btn" onclick="draw()">🎲 Draw</button>

  <!-- player cards: everyone answers on their own phone, the tally above fills in live -->
  <div id="room-mount"></div>

  <div class="scenario-browser">
    <button class="scenario-browser-hdr" id="browser-hdr" onclick="toggleScenarioBrowser()"></button>
    <div class="scenario-browser-body hidden" id="scenario-browser-body">
      <div class="filter-bar" id="filter-bar"></div>
      <div class="scenario-list" id="scenario-list"></div>
    </div>
  </div>

  <!-- how-to-play briefing: shown first, hands over to the page below -->
  <script src="guide-data.js"></script>
  <script src="guide.js"></script>
  <script src="qrcode.js"></script>
  <script src="game-data.js"></script>
  <script src="sheet-data.js"></script>
  <script src="game-render.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="room.js"></script>
  <script>
    I18N.registerDict('sophies', {
      roundLabel: { zh: '回合', en: 'Round' },
      situationLabel: { zh: '🎯 情境', en: '🎯 The Situation' },
      placeholderText: { zh: '按下<strong>抽取</strong>揭曉情境', en: 'Press <strong>Draw</strong> to reveal the situation' },
      optionC: { zh: '其他答案 — 想出你自己的答案，並和大家分享！', en: 'Something else — come up with your own answer and share it with the group!' },
      drawBtn: { zh: '🎲 抽取', en: '🎲 Draw' },
      nextBtn: { zh: '🔁 下一個情境', en: '🔁 Next Situation' },
      rollingText: { zh: '抽取中…', en: 'Drawing…' },
      browseBtn: { zh: '👁️ 瀏覽全部 {n} 個情境（暴雷 — 分享畫面時請勿開啟）', en: "👁️ Browse all {n} scenarios (spoilers — don't open while sharing)" },
      hideBtn: { zh: '🙈 收起情境清單', en: '🙈 Hide the scenario list' },
      filterAll: { zh: '全部', en: 'All' },
      pickedLabel: { zh: '已選擇', en: 'Picked' },
      tallyA: { zh: 'A', en: 'A' },
      tallyB: { zh: 'B', en: 'B' },
      tallyC: { zh: 'C · 自己的答案', en: 'C · Own answer' },
      linksNote: { zh: '玩家開啟自己的卡片連結，點選 A、B 或 C — 卡片下方的統計會即時更新，接著大家再說明理由。', en: 'Players open their own card link and tap A, B or C — the tally under the card fills in as they answer, then everyone explains why.' },
    });
    const st = (key, vars) => {
      let s = I18N.t('sophies', key);
      if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
      return s;
    };

    GAME_RENDER.injectCSS();
    const scenarios = GAME_DATA.sophies;

    let round   = 0;
    let used    = [];
    let rolling = false;
    let voteId  = ''; // new ballot every draw, so old answers stop counting on their own
    let currentScenario = null; // last scenario handed to GAME_RENDER.sophies(), for re-rendering on a language switch

    /* the placeholder ("Press Draw...") and the Draw/Next Situation button both carry
       state-dependent text that data-i18n's static re-apply can't know about, so they're
       kept in sync by hand from here and from the I18N.onChange hook below */
    function renderPlaceholderText() {
      document.getElementById('sc-placeholder-text').innerHTML = st('placeholderText');
    }
    function renderDrawBtnLabel() {
      document.getElementById('draw-btn').textContent = round === 0 ? st('drawBtn') : st('nextBtn');
    }
    renderPlaceholderText();
    renderDrawBtnLabel();

    ROOM.init({
      mount: 'room-mount',
      accent: '#f59e0b',
      hideSetup: true, // player count and links are set up once on index.html now
      linksNote: () => st('linksNote'),
      onPlayerData: renderTally,
      onCountChange: renderTally,
      onNameChange: () => { ROOM.render(); renderTally(); },
    });

    function cardPick(playerNum) {
      const d = ROOM.answers[playerNum];
      const v = d && d.vote;
      return v && voteId && v.id === voteId ? v.choice : null;
    }

    ROOM.setDecorator(i => {
      const c = cardPick(i + 1);
      return c ? { marked: true, answer: `${st('pickedLabel')} <span style="color:var(--warn-text)">${c.toUpperCase()}</span>` } : {};
    });

    /* the live count under the situation card — the whole point of handing out links */
    function renderTally() {
      const el = document.getElementById('pick-tally');
      if (!voteId || !ROOM.enabled) { el.classList.add('hidden'); return; }
      const picks = { a: [], b: [], c: [] };
      for (let i = 0; i < ROOM.count; i++) {
        const c = cardPick(i + 1);
        if (c && picks[c]) picks[c].push(ROOM.name(i));
      }
      const most = Math.max(picks.a.length, picks.b.length, picks.c.length);
      const col = (key, label) => `
        <div class="pt-col pt-${key}${most > 0 && picks[key].length === most ? ' lead' : ''}">
          <span class="pt-key">${label}</span>
          <span class="pt-count">${picks[key].length}</span>
          <span class="pt-names">${picks[key].join(', ') || '—'}</span>
        </div>`;
      el.innerHTML = col('a', st('tallyA')) + col('b', st('tallyB')) + col('c', st('tallyC'));
      el.classList.remove('hidden');
      ROOM.render();
    }

    /* hand this scenario to every card and open a fresh ballot */
    function pushToCards(sc) {
      voteId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      ROOM.publish({ game: 'sophies', round, situation: sc.situation, a: sc.a, b: sc.b, voteId });
      renderTally();
    }

    /* ── Scenario browser: closed by default, since this screen is being shared and
       the full list would spoil every scenario before it's drawn ── */
    let activeCat = '';
    let browserOpen = false;
    function toggleScenarioBrowser() {
      browserOpen = !browserOpen;
      document.getElementById('scenario-browser-body').classList.toggle('hidden', !browserOpen);
      renderBrowserLabel();
    }
    function renderBrowserLabel() {
      document.getElementById('browser-hdr').textContent = browserOpen
        ? st('hideBtn')
        : st('browseBtn', { n: scenarios.length });
    }

    function filterBy(cat) {
      activeCat = cat;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
      document.querySelectorAll('.scenario-item').forEach(item => {
        item.style.display = (!cat || item.dataset.cat === cat) ? '' : 'none';
      });
    }

    function buildList() {
      const filterBar = document.getElementById('filter-bar');
      const list = document.getElementById('scenario-list');
      filterBar.innerHTML = '';
      list.innerHTML = '';
      activeCat = '';
      renderBrowserLabel();

      const cats = [];
      scenarios.forEach(sc => { if (sc.cat && !cats.includes(sc.cat)) cats.push(sc.cat); });

      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn active';
      allBtn.textContent = st('filterAll');
      allBtn.dataset.cat = '';
      allBtn.addEventListener('click', () => filterBy(''));
      filterBar.appendChild(allBtn);

      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = cat;
        btn.dataset.cat = cat;
        btn.addEventListener('click', () => filterBy(cat));
        filterBar.appendChild(btn);
      });

      scenarios.forEach((sc, i) => {
        const btn = document.createElement('button');
        btn.className = 'scenario-item';
        btn.dataset.idx = i;
        btn.dataset.cat = sc.cat || '';
        const preview = sc.situation.length > 80 ? sc.situation.slice(0, 78) + '…' : sc.situation;
        btn.innerHTML = `<span class="scenario-num">${i + 1}</span><span class="scenario-text">${preview}</span>`;
        btn.addEventListener('click', () => loadScenario(sc, i));
        list.appendChild(btn);
      });
    }
    buildList();

    function loadScenario(sc, idx) {
      const btn  = document.getElementById('draw-btn');
      const card = document.getElementById('sc-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      ph.style.display = 'none';
      card.classList.remove('rolling');
      card.classList.add('landed');
      ct.classList.remove('show');
      ct.innerHTML = '';
      GAME_RENDER.sophies(ct, sc);
      currentScenario = sc;
      ct.classList.add('show');
      round++;
      document.getElementById('roundNum').textContent = round;
      renderDrawBtnLabel();
      pushToCards(sc);

      document.querySelectorAll('.scenario-item').forEach(el => {
        el.classList.toggle('active', +el.dataset.idx === idx);
      });
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function draw() {
      if (rolling) return;
      rolling = true;

      const btn  = document.getElementById('draw-btn');
      const card = document.getElementById('sc-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      btn.disabled = true;
      card.classList.remove('landed');
      card.classList.add('rolling');
      ph.style.display = 'none';
      ct.innerHTML = `<span class="gr-text" id="sc-roll-text">${st('rollingText')}</span>`;
      ct.classList.add('show');

      let avail = scenarios.map((_,i) => i).filter(i => !used.includes(i));
      if (!avail.length) { used = []; avail = scenarios.map((_,i) => i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      used.push(fi);

      GAME_RENDER.drawTick(
        scenarios,
        tick => { document.getElementById('sc-roll-text').textContent = tick.situation; },
        () => {
          const sc = scenarios[fi];
          GAME_RENDER.sophies(ct, sc);
          currentScenario = sc;
          pushToCards(sc);
          card.classList.remove('rolling');
          card.classList.add('landed');
          round++;
          document.getElementById('roundNum').textContent = round;
          renderDrawBtnLabel();
          btn.disabled    = false;
          rolling = false;
          document.querySelectorAll('.scenario-item').forEach(el => el.classList.remove('active'));
        }
      );
    }

    /* live language toggle: re-run everything that was built with translated text
       (data-i18n handles the plain static tags on its own) */
    I18N.onChange(() => {
      renderPlaceholderText();
      renderDrawBtnLabel();
      renderBrowserLabel();
      const allBtn = document.querySelector('.filter-btn[data-cat=""]');
      if (allBtn) allBtn.textContent = st('filterAll');
      renderTally();
      ROOM.render();
      // the drawn scenario's card is built once by GAME_RENDER.sophies() and
      // never touched again, so its "🎯 THE SITUATION" label and "C. Something
      // else" option are baked into the DOM in whatever language was active at
      // draw time — redraw it so a language switch mid-round actually takes effect
      if (currentScenario) GAME_RENDER.sophies(document.getElementById('sc-content'), currentScenario);
    });
  </script>
</body>
</html>
