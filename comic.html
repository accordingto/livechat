<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Story Comic · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Story Comic">
  <meta name="theme-color" content="#0d0d1a">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 64px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0%   { opacity: 0; transform: scale(.82); }
      65%  { transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }

    .topbar {
      width: 100%; max-width: 900px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
      animation: fadeUp .5s ease both;
    }
    a.back { color: #555; text-decoration: none; font-size: 14px; transition: color .2s; }
    a.back:hover { color: #eee; }

    .header {
      text-align: center; margin-bottom: 24px;
      animation: fadeUp .5s .1s ease both;
    }
    .header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #f59e0b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .header p { color: #555; font-size: .93rem; }

    .comic-grid {
      width: 100%; max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      background: #111;
      border: 5px solid #111;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 16px;
      animation: fadeUp .5s .2s ease both;
    }

    .panel {
      background: #fffef5;
      display: flex;
      flex-direction: column;
      min-height: 350px;
    }

    .panel-hdr {
      padding: 9px 14px;
      color: #fff;
      font-size: .78rem; font-weight: 800;
      letter-spacing: .09em; text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-hdr .num-badge {
      background: rgba(255,255,255,.22);
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem; font-weight: 900;
    }
    .hdr-1 { background: #2563eb; }
    .hdr-2 { background: #dc2626; }
    .hdr-3 { background: #d97706; }
    .hdr-4 { background: #16a34a; }

    .panel-body {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 18px 14px 12px;
      gap: 10px;
    }

    .ph {
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      pointer-events: none;
    }
    .ph-n { font-size: 5rem; font-weight: 900; color: #ddd; line-height: 1; }
    .ph-t { font-size: .75rem; color: #bbb; font-weight: 600; }

    .pc {
      display: none; flex-direction: column;
      align-items: center; width: 100%; gap: 10px;
    }
    .pc.show { display: flex; animation: popIn .4s ease both; }

    .pc-chars { font-size: 4.2rem; line-height: 1; text-align: center; }

    .bubble {
      background: #fff; border: 2.5px solid #111;
      border-radius: 14px; padding: 9px 13px;
      font-size: .95rem; font-weight: 700; color: #111;
      text-align: center; line-height: 1.4;
      position: relative;
    }
    .bubble::before {
      content: ''; position: absolute;
      top: -13px; left: 50%; transform: translateX(-50%);
      border: 6px solid transparent; border-bottom-color: #111;
    }
    .bubble::after {
      content: ''; position: absolute;
      top: -8px; left: 50%; transform: translateX(-50%);
      border: 5px solid transparent; border-bottom-color: #fff;
    }

    .caption {
      font-size: .82rem; color: #666;
      font-style: italic; text-align: center;
      line-height: 1.45; padding: 0 4px;
    }

    .panel-btn {
      padding: 11px; background: #111; color: #fff;
      border: none; font-size: .85rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s;
      letter-spacing: .02em; flex-shrink: 0;
    }
    .panel-btn:active { transform: scale(.98); }
    .btn-1:hover { background: #1d4ed8; }
    .btn-2:hover { background: #b91c1c; }
    .btn-3:hover { background: #b45309; }
    .btn-4:hover { background: #15803d; }

    .controls {
      width: 100%; max-width: 900px;
      display: flex; gap: 12px;
      animation: fadeUp .5s .3s ease both;
    }
    .ctrl-btn {
      flex: 1; padding: 15px; border-radius: 14px;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s; border: 2px solid;
    }
    .ctrl-btn:active { transform: scale(.98); }
    .ctrl-draw { background: #13132b; color: #f59e0b; border-color: #f59e0b; }
    .ctrl-draw:hover { background: rgba(245,158,11,.1); }
    .ctrl-reset { background: #13132b; color: #555; border-color: #333; }
    .ctrl-reset:hover { background: #1a1a2e; color: #888; }

    @media (max-width: 500px) {
      .panel { min-height: 270px; }
      .pc-chars { font-size: 3rem; }
      .bubble { font-size: .82rem; }
      .caption { font-size: .72rem; }
      .ph-n { font-size: 3.5rem; }
    }
  </style>
</head>

        </div>
      </div>
      <button class="panel-btn btn-4" onclick="drawPanel(4)">🎲 Draw Panel 4</button>
    </div>

  </div>

  <div class="controls">
    <button class="ctrl-btn ctrl-draw"  onclick="drawAll()">🎲 Draw All Panels</button>
    <button class="ctrl-btn ctrl-reset" onclick="resetAll()">↺ New Story</button>
  </div>

    const used = { 1:[], 2:[], 3:[], 4:[] };

    function pick(n) {
      const pool = pools[n];
      let avail = pool.map((_,i) => i).filter(i => !used[n].includes(i));
      if (!avail.length) { used[n] = []; avail = pool.map((_,i) => i); }
      const idx = avail[Math.floor(Math.random() * avail.length)];
      used[n].push(idx);
      return pool[idx];
    }

    function drawPanel(n) {
      const item = pick(n);
      const ph = document.getElementById('ph' + n);
      const pc = document.getElementById('pc' + n);

      ph.style.display = 'none';
      pc.classList.remove('show');
      void pc.offsetWidth;

      document.getElementById('ch' + n).textContent = item.ch;
      document.getElementById('sp' + n).textContent = item.sp;
      document.getElementById('ca' + n).textContent = item.ca;

      pc.classList.add('show');
      document.querySelector('.btn-' + n).textContent = '🔁 Redraw Panel ' + n;
    }

    function drawAll() {
      [1,2,3,4].forEach((n, i) => setTimeout(() => drawPanel(n), i * 200));
    }

    function resetAll() {
      [1,2,3,4].forEach(n => {
        document.getElementById('ph' + n).style.display = '';
        document.getElementById('pc' + n).classList.remove('show');
        document.querySelector('.btn-' + n).textContent = '🎲 Draw Panel ' + n;
      });
    }
