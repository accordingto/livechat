<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Surprise Me! · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Surprise Me!">
  <meta name="theme-color" content="#0d0d1a">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(72px, calc(env(safe-area-inset-bottom) + 24px)) max(20px, env(safe-area-inset-left));
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(232,121,249,0); }
      50%       { box-shadow: 0 0 56px rgba(232,121,249,.3); }
    }

    /* ── Topbar ── */
    .topbar {
      width: 100%; max-width: 720px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 32px;
      animation: fadeUp .45s ease both;
      position: relative; z-index: 1;
    }
    a.back { color: #555; text-decoration: none; font-size: 14px; transition: color .2s; }
    a.back:hover { color: #eee; }
    .round-badge { font-size: 12px; color: #444; }
    .round-badge span { color: #e879f9; font-weight: 700; }

    /* ── Header ── */
    .header {
      text-align: center; margin-bottom: 28px;
      animation: fadeUp .45s .08s ease both;
      position: relative; z-index: 1;
    }
    .header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #e879f9);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .header p { color: #666; font-size: .93rem; }

    /* ── Game badge ── */
    .game-badge-wrap {
      margin-bottom: 22px;
      min-height: 36px;
      display: flex; justify-content: center;
      animation: fadeUp .45s .16s ease both;
    }
    .game-badge {
      display: inline-flex; align-items: center; gap: 8px;
      border-radius: 999px; padding: 7px 20px;
      font-size: .8rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
      background: rgba(232,121,249,.12); border: 1.5px solid rgba(232,121,249,.3);
      color: #e879f9;
      transition: all .4s;
    }
    .game-badge.visible { animation: popIn .3s ease both; }

    /* ── Result card ── */
    .result-wrap {
      width: 100%; max-width: 680px;
      margin-bottom: 28px;
      min-height: 200px;
      animation: fadeUp .45s .24s ease both;
    }
    .result-card {
      background: linear-gradient(160deg, #16112a 0%, #0f0f24 100%);
      border: 2px solid #2a1a40;
      border-radius: 24px;
      padding: 40px 32px;
      display: flex; flex-direction: column;
      align-items: center; gap: 18px;
      min-height: 200px; justify-content: center;
      transition: border-color .4s, box-shadow .4s;
      position: relative; overflow: hidden;
    }
    .result-card.active { animation: pulseGlow 2.6s ease-in-out infinite; }
    .result-card.rolling .result-text { animation: flicker .12s linear infinite; }

    /* Watermark */
    .result-card::before {
      content: attr(data-icon);
      position: absolute; font-size: 12rem; line-height: 1;
      opacity: .03; pointer-events: none;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      -webkit-text-fill-color: initial;
    }

    .result-label {
      font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
      color: #e879f9; font-weight: 700; position: relative; z-index: 1;
    }
    .result-text {
      font-size: clamp(1.1rem, 3vw, 1.45rem);
      font-weight: 700; line-height: 1.55;
      text-align: center;
      position: relative; z-index: 1;
    }
    .result-placeholder { color: #2a2050; font-size: 1rem; font-weight: 400; }

    /* ── Storyteller 3-card layout ── */
    .st-cards {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 14px; width: 100%;
      position: relative; z-index: 1;
    }
    @media (max-width: 520px) { .st-cards { grid-template-columns: 1fr; } }
    .st-card {
      border-radius: 16px; padding: 20px 14px;
      border: 2px solid #1e1e42;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      min-height: 130px; justify-content: center; text-align: center;
      position: relative;
    }
    .st-card::before {
      position: absolute; font-size: 7rem; opacity: .04;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      -webkit-text-fill-color: initial; pointer-events: none;
    }
    .st-char   { background: linear-gradient(160deg, #1a1400, #13132b); --sc:#f59e0b; }
    .st-action { background: linear-gradient(160deg, #110d1a, #13132b); --sc:#818cf8; }
    .st-place  { background: linear-gradient(160deg, #001a0d, #13132b); --sc:#34d399; }
    .st-char::before   { content:'👤'; }
    .st-action::before { content:'⚡'; }
    .st-place::before  { content:'📍'; }
    .st-card.active { border-color: var(--sc); }
    .st-pill {
      font-size: 9px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
      background: var(--sc); color: #0d0d1a;
      border-radius: 999px; padding: 3px 12px;
      position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
    }
    .st-text { font-size: .95rem; font-weight: 600; color: #eee; line-height: 1.5; }
    .st-text.placeholder { color: #2a2a50; font-weight: 400; }

    /* ── Sophie's Choice option rows ── */
    .option-row {
      width: 100%; display: flex; gap: 10px; flex-direction: column;
      position: relative; z-index: 1;
    }
    .opt {
      border-radius: 14px; padding: 14px 20px;
      display: flex; align-items: flex-start; gap: 14px;
      border: 1.5px solid transparent;
    }
    .opt-a { background: rgba(79,158,255,.1); border-color: rgba(79,158,255,.3); }
    .opt-b { background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.3); }
    .opt-c { background: rgba(34,197,94,.1); border-color: rgba(34,197,94,.3); }
    .opt-key {
      font-size: .75rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 3px 10px; border-radius: 999px; flex-shrink: 0; margin-top: 2px;
    }
    .opt-a .opt-key { background: #4f9eff; color: #0d0d1a; }
    .opt-b .opt-key { background: #ef4444; color: #fff; }
    .opt-c .opt-key { background: #22c55e; color: #0d0d1a; }
    .opt-text { font-size: .93rem; line-height: 1.55; }

    /* ── Persuade team/judge rows ── */
    .p-row {
      width: 100%; display: flex; gap: 10px;
      flex-wrap: wrap; justify-content: center;
      position: relative; z-index: 1;
    }
    .p-chip {
      border-radius: 12px; padding: 12px 18px;
      display: flex; align-items: center; gap: 10px;
      font-size: .9rem; border: 1.5px solid transparent;
    }
    .p-team  { background: rgba(6,182,212,.1); border-color: rgba(6,182,212,.3); }
    .p-judge { background: rgba(232,121,249,.1); border-color: rgba(232,121,249,.3); }
    .p-chip-label {
      font-size: .65rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
      color: #666;
    }
    .p-chip-val { font-weight: 700; }
    .p-team  .p-chip-val { color: #06b6d4; }
    .p-judge .p-chip-val { color: #e879f9; }

    /* ── Divider ── */
    .divider { width: 100%; height: 1px; background: #1e1e3a; margin: 4px 0; }

    /* ── Buttons ── */
    .btn-row {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
      animation: fadeUp .45s .32s ease both;
      position: relative; z-index: 1;
    }
    .btn {
      border: none; border-radius: 999px; padding: 16px 48px;
      font-size: 1rem; font-weight: 800; cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s, box-shadow .2s; letter-spacing: .3px;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-go {
      background: #e879f9; color: #0d0d1a;
      box-shadow: 0 4px 28px rgba(232,121,249,.4);
    }
    .btn-go:hover:not(:disabled) {
      background: #f0a0ff;
      box-shadow: 0 6px 40px rgba(232,121,249,.6);
      transform: translateY(-2px);
    }

    /* ── Hot Take vote row ── */
    .vote-section {
      width: 100%; max-width: 680px;
      margin-bottom: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
      animation: fadeUp .35s ease both;
    }
    .vote-section.visible { display: flex; }
    .vote-row {
      display: flex; gap: 14px; width: 100%;
    }
    .vote-btn {
      flex: 1; border: 2px solid; border-radius: 16px;
      padding: 12px 10px; cursor: pointer; background: transparent;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      transition: background .2s, transform .15s, box-shadow .2s;
      font-family: inherit;
    }
    .vote-btn:active { transform: scale(.97); }
    .vote-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }
    .vote-btn.agree    { border-color: #4caf50; color: #4caf50; }
    .vote-btn.disagree { border-color: #f44336; color: #f44336; }
    .vote-btn.middle   { border-color: #f59e0b; color: #f59e0b; }
    .vote-btn.agree:hover:not(:disabled)    { background: rgba(76,175,80,.1);  box-shadow: 0 6px 24px rgba(76,175,80,.25);  transform: translateY(-3px); }
    .vote-btn.disagree:hover:not(:disabled) { background: rgba(244,67,54,.1);  box-shadow: 0 6px 24px rgba(244,67,54,.25);  transform: translateY(-3px); }
    .vote-btn.middle:hover:not(:disabled)   { background: rgba(245,158,11,.1); box-shadow: 0 6px 24px rgba(245,158,11,.25); transform: translateY(-3px); }
    .vote-btn .v-emoji { font-size: 1.4rem; }
    .vote-btn .v-label { font-size: .7rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .vote-btn .v-count { font-size: 1.5rem; font-weight: 800; }
    .vote-btn .bar-wrap { width: 80%; height: 4px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; }
    .vote-btn .bar { height: 100%; border-radius: 4px; transition: width .4s; width: 0%; }
    .vote-btn.agree    .bar { background: #4caf50; }
    .vote-btn.disagree .bar { background: #f44336; }
    .vote-btn.middle   .bar { background: #f59e0b; }
    .vote-reset {
      align-self: center; background: transparent; color: #555;
      border: 2px solid #2a2a4a; border-radius: 999px;
      padding: 10px 24px; font-size: .9rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s, color .2s, border-color .2s;
    }
    .vote-reset:hover { background: rgba(255,255,255,.05); color: #aaa; border-color: #444; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🎰 Surprise Me!</h1>
    <p>One random game · one random scenario · zero planning</p>
  </div>

  <!-- which game was picked -->
  <div class="game-badge-wrap">
    <span class="game-badge" id="gameBadge" style="visibility:hidden">🎰 Waiting…</span>
  </div>

  <!-- dynamic result area -->
  <div class="result-wrap" id="resultWrap">
    <div class="result-card" id="resultCard" data-icon="🎰">
      <span class="result-label" id="resultLabel">SURPRISE ME!</span>
      <span class="result-text result-placeholder" id="resultText">Press Go! to draw a random game &amp; scenario</span>
    </div>
  </div>

  <!-- Hot Take vote area — hidden unless hottake is drawn -->
  <div class="vote-section" id="voteSection">
    <div class="vote-row">
      <button class="vote-btn agree"    id="vBtnAgree"    disabled onclick="htVote('agree')">
        <span class="v-emoji">👍</span>
        <span class="v-label">Agree</span>
        <span class="v-count" id="vCntAgree">0</span>
        <div class="bar-wrap"><div class="bar" id="vBarAgree"></div></div>
      </button>
      <button class="vote-btn middle"   id="vBtnMiddle"   disabled onclick="htVote('middle')">
        <span class="v-emoji">🤷</span>
        <span class="v-label">It Depends</span>
        <span class="v-count" id="vCntMiddle">0</span>
        <div class="bar-wrap"><div class="bar" id="vBarMiddle"></div></div>
      </button>
      <button class="vote-btn disagree" id="vBtnDisagree" disabled onclick="htVote('disagree')">
        <span class="v-emoji">👎</span>
        <span class="v-label">Disagree</span>
        <span class="v-count" id="vCntDisagree">0</span>
        <div class="bar-wrap"><div class="bar" id="vBarDisagree"></div></div>
      </button>
    </div>
    <button class="vote-reset" onclick="htResetVotes()">↺ Reset votes</button>
  </div>

  <div class="btn-row">
    <button class="btn btn-go" id="goBtn" onclick="go()">🎰 Go!</button>
  </div>

  <script src="game-data.js"></script>
  <script>
    const GAMES = ['never', 'hottake', 'storyteller', 'sophies', 'persuade'];
    const CONFIGS = {
      never:       { name: 'Never Have I Ever', icon: '🙋', color: '#4f9eff' },
      hottake:     { name: 'Hot Take Roulette',  icon: '🔥', color: '#ff7043' },
      storyteller: { name: 'Story Teller',       icon: '📖', color: '#f59e0b' },
      sophies:     { name: "Sophie's Choice",    icon: '🤔', color: '#a78bfa' },
      persuade:    { name: 'Persuade Together',  icon: '🤝', color: '#06b6d4' },
    };

    let round = 0, rolling = false;
    const htVotes = { agree: 0, middle: 0, disagree: 0 };

    function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function htVote(side) {
      htVotes[side]++;
      htUpdateBars();
    }
    function htResetVotes() {
      htVotes.agree = htVotes.middle = htVotes.disagree = 0;
      htUpdateBars();
    }
    function htUpdateBars() {
      const total = htVotes.agree + htVotes.middle + htVotes.disagree || 1;
      ['agree','middle','disagree'].forEach(k => {
        document.getElementById('vCnt' + k[0].toUpperCase() + k.slice(1)).textContent = htVotes[k];
        document.getElementById('vBar' + k[0].toUpperCase() + k.slice(1)).style.width = (htVotes[k] / total * 100) + '%';
      });
    }
    function htShowVote(enabled) {
      const sec = document.getElementById('voteSection');
      if (!enabled) { sec.classList.remove('visible'); return; }
      htResetVotes();
      ['vBtnAgree','vBtnMiddle','vBtnDisagree'].forEach(id => document.getElementById(id).disabled = false);
      sec.classList.add('visible');
    }

    function hexRgba(hex, a) {
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${a})`;
    }

    function resetCard() {
      const card = document.getElementById('resultCard');
      card.innerHTML = '<span class="result-label" id="resultLabel">…</span><span class="result-text" id="resultText">…</span>';
      card.style.borderColor = '';
      card.style.boxShadow   = '';
      card.style.background  = '';
      card.style.padding     = '';
      card.style.minHeight   = '';
      card.style.gap         = '';
      card.style.overflow    = '';
      card.setAttribute('data-icon', '🎰');
      return card;
    }

    function go() {
      if (rolling) return;
      rolling = true;

      const goBtn  = document.getElementById('goBtn');
      const badge  = document.getElementById('gameBadge');

      // Always restore the card to a known state before roll
      const resultCard  = resetCard();
      const resultLabel = document.getElementById('resultLabel');
      const resultText  = document.getElementById('resultText');

      goBtn.disabled = true;
      badge.style.visibility = 'hidden';
      badge.className = 'game-badge';
      htShowVote(false);
      resultCard.classList.remove('active');
      resultCard.classList.add('rolling');

      const gameKey = GAMES[Math.floor(Math.random() * GAMES.length)];
      const cfg     = CONFIGS[gameKey];

      let ticks = 0;
      const iv = setInterval(() => {
        const rc = CONFIGS[GAMES[Math.floor(Math.random() * GAMES.length)]];
        resultLabel.textContent = rc.icon + ' ' + rc.name.toUpperCase();
        resultText.textContent  = '…';
        resultText.className    = 'result-text';
        ticks++;
        if (ticks >= 24) {
          clearInterval(iv);
          resultCard.classList.remove('rolling');
          showResult(gameKey, cfg, resultCard, resultLabel, resultText, badge);
          round++;
          document.getElementById('roundNum').textContent = round;
          goBtn.disabled = false;
          rolling = false;
        }
      }, 90);
    }

    function showResult(gameKey, cfg, card, label, text, badge) {
      card.setAttribute('data-icon', cfg.icon);
      card.style.borderColor = cfg.color;
      card.classList.add('active');

      badge.innerHTML         = cfg.icon + ' ' + cfg.name;
      badge.style.visibility  = 'visible';
      badge.style.color       = cfg.color;
      badge.style.borderColor = hexRgba(cfg.color, 0.5);
      badge.style.background  = hexRgba(cfg.color, 0.12);
      badge.className = 'game-badge visible';

      if (gameKey === 'never') {
        label.textContent = 'NEVER HAVE I EVER…';
        text.className    = 'result-text';
        text.textContent  = rand(GAME_DATA.never);

      } else if (gameKey === 'hottake') {
        label.textContent = '🔥 HOT TAKE';
        text.className    = 'result-text';
        text.textContent  = rand(GAME_DATA.hottake);
        htShowVote(true);

      } else if (gameKey === 'storyteller') {
        renderStoryteller(card, cfg);

      } else if (gameKey === 'sophies') {
        renderSophies(card, rand(GAME_DATA.sophies));

      } else if (gameKey === 'persuade') {
        renderPersuade(card, rand(GAME_DATA.persuade));
      }
    }

    function renderStoryteller(card, cfg) {
      const char   = rand(GAME_DATA.storyteller.characters);
      const action = rand(GAME_DATA.storyteller.actions);
      const place  = rand(GAME_DATA.storyteller.locations);

      // Strip outer card visuals — the three sub-cards are the display
      card.classList.remove('active');
      card.style.borderColor = 'transparent';
      card.style.background  = 'transparent';
      card.style.boxShadow   = 'none';
      card.style.padding     = '14px 0 0';   // top breathing room for pill labels
      card.style.minHeight   = 'auto';
      card.style.gap         = '0';
      card.style.overflow    = 'visible';    // allow pill labels to protrude above

      card.innerHTML = `
        <div class="st-cards">
          <div class="st-card st-char active">
            <span class="st-pill">👤 Character</span>
            <span class="st-text">${char}</span>
          </div>
          <div class="st-card st-action active">
            <span class="st-pill">⚡ Action</span>
            <span class="st-text">${action}</span>
          </div>
          <div class="st-card st-place active">
            <span class="st-pill">📍 Location</span>
            <span class="st-text">${place}</span>
          </div>
        </div>`;
    }

    function renderSophies(card, sc) {
      card.innerHTML = `
        <span class="result-label">🎯 THE SITUATION</span>
        <span class="result-text">${sc.situation}</span>
        <div class="divider"></div>
        <div class="option-row">
          <div class="opt opt-a"><span class="opt-key">A</span><span class="opt-text">${sc.a}</span></div>
          <div class="opt opt-b"><span class="opt-key">B</span><span class="opt-text">${sc.b}</span></div>
          <div class="opt opt-c"><span class="opt-key">C</span><span class="opt-text">Something else! Tell us your own answer.</span></div>
        </div>`;
    }

    function renderPersuade(card, sc) {
      card.innerHTML = `
        <span class="result-label" style="color:#06b6d4">${sc.emoji || '🤝'} ${sc.cat ? sc.cat.toUpperCase() : 'PERSUADE TOGETHER'}</span>
        <span class="result-text">${sc.situation}</span>
        <div class="divider"></div>
        <div class="p-row">
          <div class="p-chip p-team">
            <span class="p-chip-label">Team</span>
            <span class="p-chip-val">${sc.team}</span>
          </div>
          <div class="p-chip p-judge">
            <span class="p-chip-label">Judge</span>
            <span class="p-chip-val">${sc.judge}</span>
          </div>
        </div>`;
    }
  </script>

</body>
</html>
