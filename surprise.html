<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Surprise Me! · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Surprise Me!">
  <meta name="theme-color" content="#0d0d1a">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(72px, calc(env(safe-area-inset-bottom) + 24px)) max(20px, env(safe-area-inset-left));
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(232,121,249,0); }
      50%       { box-shadow: 0 0 56px rgba(232,121,249,.3); }
    }

    /* ── Topbar ── */
    .topbar {
      width: 100%; max-width: 720px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 32px;
      animation: fadeUp .45s ease both;
      position: relative; z-index: 1;
    }
    a.back { color: #555; text-decoration: none; font-size: 14px; transition: color .2s; }
    a.back:hover { color: #eee; }
    .round-badge { font-size: 12px; color: #444; }
    .round-badge span { color: #e879f9; font-weight: 700; }

    /* ── Header ── */
    .header {
      text-align: center; margin-bottom: 28px;
      animation: fadeUp .45s .08s ease both;
      position: relative; z-index: 1;
    }
    .header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #e879f9);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .header p { color: #666; font-size: .93rem; }

    /* ── Game badge ── */
    .game-badge-wrap {
      margin-bottom: 22px;
      min-height: 36px;
      display: flex; justify-content: center;
      animation: fadeUp .45s .16s ease both;
    }
    .game-badge {
      display: inline-flex; align-items: center; gap: 8px;
      border-radius: 999px; padding: 7px 20px;
      font-size: .8rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
      background: rgba(232,121,249,.12); border: 1.5px solid rgba(232,121,249,.3);
      color: #e879f9;
      transition: all .4s;
    }
    .game-badge.visible { animation: popIn .3s ease both; }

    /* ── Result card ── */
    .result-wrap {
      width: 100%; max-width: 680px;
      margin-bottom: 28px;
      min-height: 200px;
      animation: fadeUp .45s .24s ease both;
    }
    .result-card {
      background: linear-gradient(160deg, #16112a 0%, #0f0f24 100%);
      border: 2px solid #2a1a40;
      border-radius: 24px;
      padding: 40px 32px;
      display: flex; flex-direction: column;
      align-items: center; gap: 18px;
      min-height: 200px; justify-content: center;
      transition: border-color .4s, box-shadow .4s;
      position: relative; overflow: hidden;
    }
    .result-card.active { animation: pulseGlow 2.6s ease-in-out infinite; }
    .result-card.rolling .result-text { animation: flicker .12s linear infinite; }

    /* Watermark */
    .result-card::before {
      content: attr(data-icon);
      position: absolute; font-size: 12rem; line-height: 1;
      opacity: .03; pointer-events: none;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      -webkit-text-fill-color: initial;
    }

    .result-label {
      font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
      color: #e879f9; font-weight: 700; position: relative; z-index: 1;
    }
    .result-text {
      font-size: clamp(1.1rem, 3vw, 1.45rem);
      font-weight: 700; line-height: 1.55;
      text-align: center;
      position: relative; z-index: 1;
    }
    .result-placeholder { color: #2a2050; font-size: 1rem; font-weight: 400; }

    /* ── Divider (kept for result-card inner use) ── */
    .divider { width: 100%; height: 1px; background: #1e1e3a; margin: 4px 0; }

    /* ── Buttons ── */
    .btn-row {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
      animation: fadeUp .45s .32s ease both;
      position: relative; z-index: 1;
    }
    .btn {
      border: none; border-radius: 999px; padding: 16px 48px;
      font-size: 1rem; font-weight: 800; cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s, box-shadow .2s; letter-spacing: .3px;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-go {
      background: #e879f9; color: #0d0d1a;
      box-shadow: 0 4px 28px rgba(232,121,249,.4);
    }
    .btn-go:hover:not(:disabled) {
      background: #f0a0ff;
      box-shadow: 0 6px 40px rgba(232,121,249,.6);
      transform: translateY(-2px);
    }

    /* ── Hot Take vote row ── */
    .vote-section {
      width: 100%; max-width: 680px;
      margin-bottom: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
      animation: fadeUp .35s ease both;
    }
    .vote-section.visible { display: flex; }
    .vote-row {
      display: flex; gap: 14px; width: 100%;
    }
    .vote-btn {
      flex: 1; border: 2px solid; border-radius: 16px;
      padding: 12px 10px; cursor: pointer; background: transparent;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      transition: background .2s, transform .15s, box-shadow .2s;
      font-family: inherit;
    }
    .vote-btn:active { transform: scale(.97); }
    .vote-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }
    .vote-btn.agree    { border-color: #4caf50; color: #4caf50; }
    .vote-btn.disagree { border-color: #f44336; color: #f44336; }
    .vote-btn.middle   { border-color: #f59e0b; color: #f59e0b; }
    .vote-btn.agree:hover:not(:disabled)    { background: rgba(76,175,80,.1);  box-shadow: 0 6px 24px rgba(76,175,80,.25);  transform: translateY(-3px); }
    .vote-btn.disagree:hover:not(:disabled) { background: rgba(244,67,54,.1);  box-shadow: 0 6px 24px rgba(244,67,54,.25);  transform: translateY(-3px); }
    .vote-btn.middle:hover:not(:disabled)   { background: rgba(245,158,11,.1); box-shadow: 0 6px 24px rgba(245,158,11,.25); transform: translateY(-3px); }
    .vote-btn .v-emoji { font-size: 1.4rem; }
    .vote-btn .v-label { font-size: .7rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .vote-btn .v-count { font-size: 1.5rem; font-weight: 800; }
    .vote-btn .bar-wrap { width: 80%; height: 4px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; }
    .vote-btn .bar { height: 100%; border-radius: 4px; transition: width .4s; width: 0%; }
    .vote-btn.agree    .bar { background: #4caf50; }
    .vote-btn.disagree .bar { background: #f44336; }
    .vote-btn.middle   .bar { background: #f59e0b; }
    .vote-reset {
      align-self: center; background: transparent; color: #555;
      border: 2px solid #2a2a4a; border-radius: 999px;
      padding: 10px 24px; font-size: .9rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s, color .2s, border-color .2s;
    }
    .vote-reset:hover { background: rgba(255,255,255,.05); color: #aaa; border-color: #444; }

    /* ── Never Have I Ever reaction buttons ── */
    .react-section {
      width: 100%; max-width: 680px;
      margin-bottom: 20px;
      display: none;
      gap: 14px;
      flex-wrap: wrap; justify-content: center;
      animation: fadeUp .35s ease both;
    }
    .react-section.visible { display: flex; }
    .react-btn {
      background: linear-gradient(160deg, #13132b 0%, #0f0f24 100%);
      border: 1.5px solid #1e1e50;
      border-radius: 20px;
      padding: 18px 22px;
      font-size: 1rem; cursor: pointer; color: #eee;
      font-family: inherit;
      transition: background .2s, border-color .2s, transform .15s, box-shadow .2s;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      min-width: 110px;
    }
    .react-btn .r-emoji { font-size: 1.9rem; }
    .react-btn .r-label { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #555; }
    .react-btn .r-count { font-size: 1.5rem; font-weight: 900; color: #4f9eff; min-width: 1.5ch; text-align: center; }
    .react-btn:hover {
      background: #1a1a3a; border-color: #4f9eff;
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(79,158,255,.2);
    }
    .react-btn:active { transform: scale(.95); }

    /* ── Slot-machine reel ── */
    .reel-surround { width: 100%; position: relative; }
    .reel-window {
      width: 100%; height: 160px;
      overflow: hidden; position: relative;
    }
    .reel-fade {
      position: absolute; left: 0; right: 0; height: 50px;
      z-index: 3; pointer-events: none;
    }
    .reel-fade.top { top: 0;    background: linear-gradient(to bottom, #16112a 30%, transparent); }
    .reel-fade.bot { bottom: 0; background: linear-gradient(to top,   #0f0f24 30%, transparent); }
    .reel-sel {
      position: absolute; left: 10%; right: 10%; height: 1px;
      background: rgba(255,255,255,.2); z-index: 4;
    }
    .reel-sel.top { top: 0; }
    .reel-sel.bot { bottom: 0; }
    .reel-track { display: flex; flex-direction: column; }
    @keyframes reelScroll {
      from { transform: translateY(0); }
      to   { transform: translateY(var(--reel-end)); }
    }
    .reel-item {
      height: 160px; flex-shrink: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px;
    }
    .reel-item-icon { font-size: 3.6rem; line-height: 1; }
    .reel-item-name {
      font-size: 1rem; font-weight: 800;
      letter-spacing: 2.5px; text-transform: uppercase;
    }

    /* ── Particle burst ── */
    @keyframes particleFly {
      0%   { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }
    .burst-dot {
      position: absolute; border-radius: 50%;
      animation: particleFly .9s ease-out forwards;
      pointer-events: none; z-index: 20;
    }

    /* ── Card land bounce ── */
    @keyframes cardLandBounce {
      0%   { transform: scale(1); }
      28%  { transform: scale(1.08); }
      58%  { transform: scale(0.96); }
      78%  { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .result-card.landing { animation: cardLandBounce .6s cubic-bezier(.36,.07,.19,.97) both; }

    /* ── Reel spin — rainbow border cycling all 5 game colours ── */
    @keyframes rainbowSpin {
      0%   { border-color: #4f9eff; box-shadow: 0 0 48px rgba(79,158,255,.45); }
      20%  { border-color: #ff7043; box-shadow: 0 0 48px rgba(255,112,67,.45); }
      40%  { border-color: #f59e0b; box-shadow: 0 0 48px rgba(245,158,11,.45); }
      60%  { border-color: #a78bfa; box-shadow: 0 0 48px rgba(167,139,250,.45); }
      80%  { border-color: #06b6d4; box-shadow: 0 0 48px rgba(6,182,212,.45); }
      100% { border-color: #4f9eff; box-shadow: 0 0 48px rgba(79,158,255,.45); }
    }
    .result-card.spinning { animation: rainbowSpin .55s linear infinite; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🎰 Surprise Me!</h1>
    <p>One random game · one random scenario · zero planning</p>
  </div>

  <!-- which game was picked -->
  <div class="game-badge-wrap">
    <span class="game-badge" id="gameBadge" style="visibility:hidden">🎰 Waiting…</span>
  </div>

  <!-- dynamic result area -->
  <div class="result-wrap" id="resultWrap">
    <div class="result-card" id="resultCard" data-icon="🎰">
      <span class="result-label" id="resultLabel">SURPRISE ME!</span>
      <span class="result-text result-placeholder" id="resultText">Press Go! to draw a random game &amp; scenario</span>
    </div>
  </div>

  <!-- Never Have I Ever reactions — hidden unless never is drawn -->
  <div class="react-section" id="reactSection">
    <button class="react-btn" onclick="neverReact('done')">
      <span class="r-emoji">✋</span>
      <span class="r-label">Done it</span>
      <span class="r-count" id="rCntDone">0</span>
    </button>
    <button class="react-btn" onclick="neverReact('nope')">
      <span class="r-emoji">🙅</span>
      <span class="r-label">Never!</span>
      <span class="r-count" id="rCntNope">0</span>
    </button>
    <button class="react-btn" onclick="neverReact('lol')">
      <span class="r-emoji">😂</span>
      <span class="r-label">LOL</span>
      <span class="r-count" id="rCntLol">0</span>
    </button>
  </div>

  <!-- Hot Take vote area — hidden unless hottake is drawn -->
  <div class="vote-section" id="voteSection">
    <div class="vote-row">
      <button class="vote-btn agree"    id="vBtnAgree"    disabled onclick="htVote('agree')">
        <span class="v-emoji">👍</span>
        <span class="v-label">Agree</span>
        <span class="v-count" id="vCntAgree">0</span>
        <div class="bar-wrap"><div class="bar" id="vBarAgree"></div></div>
      </button>
      <button class="vote-btn middle"   id="vBtnMiddle"   disabled onclick="htVote('middle')">
        <span class="v-emoji">🤷</span>
        <span class="v-label">It Depends</span>
        <span class="v-count" id="vCntMiddle">0</span>
        <div class="bar-wrap"><div class="bar" id="vBarMiddle"></div></div>
      </button>
      <button class="vote-btn disagree" id="vBtnDisagree" disabled onclick="htVote('disagree')">
        <span class="v-emoji">👎</span>
        <span class="v-label">Disagree</span>
        <span class="v-count" id="vCntDisagree">0</span>
        <div class="bar-wrap"><div class="bar" id="vBarDisagree"></div></div>
      </button>
    </div>
    <button class="vote-reset" onclick="htResetVotes()">↺ Reset votes</button>
  </div>

  <div class="btn-row">
    <button class="btn btn-go" id="goBtn" onclick="go()">🎰 Go!</button>
  </div>

  <script src="game-data.js"></script>
  <script src="game-render.js"></script>
  <script>
    GAME_RENDER.injectCSS();
    const GAMES = ['never', 'hottake', 'storyteller', 'sophies', 'persuade'];
    const CONFIGS = {
      never:       { name: 'Never Have I Ever', icon: '🙋', color: '#4f9eff' },
      hottake:     { name: 'Hot Take Roulette',  icon: '🔥', color: '#ff7043' },
      storyteller: { name: 'Story Teller',       icon: '📖', color: '#f59e0b' },
      sophies:     { name: "Sophie's Choice",    icon: '🤔', color: '#a78bfa' },
      persuade:    { name: 'Persuade Together',  icon: '🤝', color: '#06b6d4' },
    };

    let round = 0, rolling = false, lastGame = null;
    const htVotes = { agree: 0, middle: 0, disagree: 0 };

    function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    const neverCounts = { done: 0, nope: 0, lol: 0 };
    function neverReact(type) {
      neverCounts[type]++;
      const ids = { done: 'rCntDone', nope: 'rCntNope', lol: 'rCntLol' };
      document.getElementById(ids[type]).textContent = neverCounts[type];
    }
    function neverShowReact(enabled) {
      const sec = document.getElementById('reactSection');
      if (!enabled) { sec.classList.remove('visible'); return; }
      neverCounts.done = neverCounts.nope = neverCounts.lol = 0;
      ['rCntDone','rCntNope','rCntLol'].forEach(id => document.getElementById(id).textContent = 0);
      sec.classList.add('visible');
    }

    function htVote(side) {
      htVotes[side]++;
      htUpdateBars();
    }
    function htResetVotes() {
      htVotes.agree = htVotes.middle = htVotes.disagree = 0;
      htUpdateBars();
    }
    function htUpdateBars() {
      const total = htVotes.agree + htVotes.middle + htVotes.disagree || 1;
      ['agree','middle','disagree'].forEach(k => {
        document.getElementById('vCnt' + k[0].toUpperCase() + k.slice(1)).textContent = htVotes[k];
        document.getElementById('vBar' + k[0].toUpperCase() + k.slice(1)).style.width = (htVotes[k] / total * 100) + '%';
      });
    }
    function htShowVote(enabled) {
      const sec = document.getElementById('voteSection');
      if (!enabled) { sec.classList.remove('visible'); return; }
      htResetVotes();
      ['vBtnAgree','vBtnMiddle','vBtnDisagree'].forEach(id => document.getElementById(id).disabled = false);
      sec.classList.add('visible');
    }

    function hexRgba(hex, a) {
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${a})`;
    }

    const REEL_H = 160;

    function spawnParticles(card, color) {
      const w = card.offsetWidth, h = card.offsetHeight;
      for (let i = 0; i < 32; i++) {
        const d     = document.createElement('div');
        d.className = 'burst-dot';
        const size  = 5 + Math.random() * 9;
        const angle = Math.random() * Math.PI * 2;
        const dist  = 60 + Math.random() * 140;
        d.style.cssText = [
          `width:${size}px`, `height:${size}px`,
          `background:${color}`,
          `left:${w/2}px`, `top:${h/2}px`,
          `margin-left:-${size/2}px`, `margin-top:-${size/2}px`,
          `--tx:${(Math.cos(angle)*dist).toFixed(1)}px`,
          `--ty:${(Math.sin(angle)*dist).toFixed(1)}px`,
        ].join(';');
        card.appendChild(d);
        setTimeout(() => d.remove(), 1100);
      }
    }

    function go() {
      if (rolling) return;
      rolling = true;

      const goBtn = document.getElementById('goBtn');
      const badge = document.getElementById('gameBadge');
      const card  = document.getElementById('resultCard');

      /* Reset card to reel state */
      card.style.borderColor = '';
      card.style.boxShadow   = '';
      card.style.background  = '';
      card.style.padding     = '0';
      card.style.minHeight   = '220px';
      card.style.gap         = '0';
      card.style.overflow    = 'hidden';
      card.setAttribute('data-icon', '🎰');

      goBtn.disabled = true;
      badge.style.visibility = 'hidden';
      badge.className = 'game-badge';
      neverShowReact(false);
      htShowVote(false);
      card.classList.remove('active', 'landing');
      card.classList.add('spinning');

      const pool    = GAMES.filter(g => g !== lastGame);
      const gameKey = pool[Math.floor(Math.random() * pool.length)];
      lastGame = gameKey;
      const cfg     = CONFIGS[gameKey];

      /* Build reel — N items, last is the winner */
      const N     = 28;
      const items = Array.from({length: N}, (_, i) =>
        i === N - 1 ? gameKey : GAMES[Math.floor(Math.random() * GAMES.length)]);

      card.innerHTML = `
        <div class="reel-surround">
          <div class="reel-window">
            <div class="reel-fade top"></div>
            <div class="reel-sel top"></div>
            <div class="reel-track" id="reelTrack">
              ${items.map(k => `
                <div class="reel-item" style="color:${CONFIGS[k].color}">
                  <div class="reel-item-icon">${CONFIGS[k].icon}</div>
                  <div class="reel-item-name">${CONFIGS[k].name}</div>
                </div>`).join('')}
            </div>
            <div class="reel-sel bot"></div>
            <div class="reel-fade bot"></div>
          </div>
        </div>`;

      const track = document.getElementById('reelTrack');
      track.style.setProperty('--reel-end', `${-(N - 1) * REEL_H}px`);

      /* Double rAF so layout is committed before animation starts */
      requestAnimationFrame(() => requestAnimationFrame(() => {
        track.style.animation = 'reelScroll 2.8s cubic-bezier(0.1, 0.65, 0.32, 1) forwards';
      }));

      track.addEventListener('animationend', () => {
        card.classList.remove('spinning');

        /* Particle burst + border flash */
        spawnParticles(card, cfg.color);
        card.style.borderColor = cfg.color;
        card.style.boxShadow   = `0 0 90px ${hexRgba(cfg.color, 0.6)}`;
        card.classList.add('landing');

        /* Badge */
        badge.innerHTML         = cfg.icon + ' ' + cfg.name;
        badge.style.visibility  = 'visible';
        badge.style.color       = cfg.color;
        badge.style.borderColor = hexRgba(cfg.color, 0.5);
        badge.style.background  = hexRgba(cfg.color, 0.12);
        badge.className         = 'game-badge visible';

        /* Show actual result after bounce settles */
        setTimeout(() => {
          card.classList.remove('landing');
          card.style.padding   = '';
          card.style.gap       = '';
          card.style.overflow  = '';
          card.style.minHeight = '';
          card.style.boxShadow = '';
          showResult(gameKey, cfg, card, null, null, badge);
          round++;
          document.getElementById('roundNum').textContent = round;
          goBtn.disabled = false;
          rolling = false;
        }, 700);
      }, { once: true });
    }

    function showResult(gameKey, cfg, card, label, text, badge) {
      badge.innerHTML         = cfg.icon + ' ' + cfg.name;
      badge.style.visibility  = 'visible';
      badge.style.color       = cfg.color;
      badge.style.borderColor = hexRgba(cfg.color, 0.5);
      badge.style.background  = hexRgba(cfg.color, 0.12);
      badge.className = 'game-badge visible';

      if (gameKey === 'storyteller') {
        card.classList.remove('active');
        card.style.borderColor = 'transparent';
        card.style.background  = 'transparent';
        card.style.boxShadow   = 'none';
        card.style.padding     = '14px 0 0';
        card.style.minHeight   = 'auto';
        card.style.gap         = '0';
        card.style.overflow    = 'visible';
        GAME_RENDER.storyteller(card,
          rand(GAME_DATA.storyteller.characters),
          rand(GAME_DATA.storyteller.actions),
          rand(GAME_DATA.storyteller.locations));

      } else if (gameKey === 'sophies') {
        card.setAttribute('data-icon', cfg.icon);
        card.style.borderColor = cfg.color;
        card.classList.add('active');
        GAME_RENDER.sophies(card, rand(GAME_DATA.sophies));

      } else if (gameKey === 'persuade') {
        card.setAttribute('data-icon', cfg.icon);
        card.style.borderColor = cfg.color;
        card.classList.add('active');
        GAME_RENDER.persuade(card, rand(GAME_DATA.persuade));

      } else if (gameKey === 'never') {
        card.setAttribute('data-icon', cfg.icon);
        card.style.borderColor = cfg.color;
        card.classList.add('active');
        GAME_RENDER.never(card, rand(GAME_DATA.never));
        neverShowReact(true);

      } else if (gameKey === 'hottake') {
        card.setAttribute('data-icon', cfg.icon);
        card.style.borderColor = cfg.color;
        card.classList.add('active');
        GAME_RENDER.hottake(card, rand(GAME_DATA.hottake));
        htShowVote(true);
      }
    }
  </script>

</body>
