<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Would You Rather</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(72px, calc(env(safe-area-inset-bottom) + 24px)) max(20px, env(safe-area-inset-left));
    }

    /* ── Topbar ── */
    .topbar {
      width: 100%; max-width: 860px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 36px;
    }
    a.back { color: #555; text-decoration: none; font-size: 14px; transition: color .2s; }
    a.back:hover { color: #eee; }
    .round-badge { font-size: 12px; color: #444; }
    .round-badge span { color: #e94560; font-weight: 700; }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 28px; }
    .header h1 {
      font-size: clamp(2rem, 5vw, 3rem); font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #e94560);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .header p { color: #666; font-size: .93rem; }


    /* ── Arena ── */
    .arena {
      width: 100%; max-width: 860px;
      display: flex;
      align-items: stretch;
      gap: 0;
      margin-bottom: 36px;
    }

    /* ── Option cards ── */
    .option-card {
      flex: 1;
      background: linear-gradient(150deg, #13132b 0%, #0f0f22 100%);
      border: 2px solid #1e1e42;
      border-radius: 24px;
      padding: 52px 32px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 260px;
      position: relative;
      overflow: hidden;
      transition: border-color .5s, box-shadow .5s, transform .3s;
    }

    /* large faded letter watermark */
    .option-card::before {
      content: attr(data-letter);
      position: absolute;
      font-size: 16rem;
      font-weight: 900;
      color: rgba(233,69,96,.045);
      right: -24px;
      bottom: -48px;
      line-height: 1;
      pointer-events: none;
      user-select: none;
      transition: color .5s;
    }

    .option-card.active {
      border-color: #e94560;
      box-shadow: 0 0 48px rgba(233,69,96,.14), inset 0 0 48px rgba(233,69,96,.04);
    }
    .option-card.active::before { color: rgba(233,69,96,.08); }

    /* top label tab */
    .opt-label {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      background: #e94560;
      color: #fff;
      font-size: 10px; font-weight: 900;
      letter-spacing: 2.5px; text-transform: uppercase;
      padding: 6px 22px;
      border-radius: 0 0 14px 14px;
      white-space: nowrap;
    }

    .question-text {
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      font-weight: 700;
      line-height: 1.65;
      color: #eee;
      position: relative;
      z-index: 1;
      transition: opacity .15s;
    }
    .question-text.placeholder { color: #252545; font-weight: 400; font-size: .95rem; }

    /* rolling flicker */
    @keyframes flicker {
      0%,100% { opacity: 1; }
      50%      { opacity: .25; }
    }
    .option-card.rolling .question-text { animation: flicker .1s linear infinite; }

    /* landing pulse */
    @keyframes pulse-border {
      0%   { box-shadow: 0 0 0   rgba(233,69,96,0); }
      40%  { box-shadow: 0 0 60px rgba(233,69,96,.35); }
      100% { box-shadow: 0 0 48px rgba(233,69,96,.14); }
    }
    .option-card.landed { animation: pulse-border .6s ease forwards; }

    /* ripple */
    @keyframes ripple { from{transform:scale(0);opacity:.35} to{transform:scale(6);opacity:0} }
    .ripple-el {
      position: absolute; width: 60px; height: 60px; border-radius: 50%;
      background: #e94560; pointer-events: none;
      animation: ripple .8s ease-out forwards;
      left: 50%; top: 50%; margin: -30px 0 0 -30px; z-index: 0;
    }

    /* ── VS divider ── */
    .vs-wrap {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 0 20px; z-index: 2;
    }
    .vs-badge {
      width: 64px; height: 64px;
      background: radial-gradient(circle at 38% 38%, #e94560, #8b1a2e);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; font-weight: 900; color: #fff; letter-spacing: 1px;
      box-shadow: 0 0 28px rgba(233,69,96,.45), 0 0 8px rgba(233,69,96,.2);
      border: 2px solid rgba(233,69,96,.4);
      flex-shrink: 0;
    }

    /* ── Status ── */
    .status {
      width: 100%; max-width: 860px;
      text-align: center;
      font-size: .9rem; color: #555;
      margin-bottom: 28px; min-height: 1.4em;
      transition: color .3s;
    }
    .status.ready { color: #e94560; font-weight: 600; }

    /* ── Button ── */
    .btn-row { display: flex; gap: 12px; justify-content: center; }
    .btn {
      border: none; border-radius: 999px; padding: 18px 56px;
      font-size: 1.05rem; font-weight: 800; cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s, box-shadow .2s; letter-spacing: .5px;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-draw {
      background: #e94560; color: #fff;
      box-shadow: 0 6px 28px rgba(233,69,96,.35);
    }
    .btn-draw:hover:not(:disabled) {
      background: #f0617a;
      box-shadow: 0 8px 36px rgba(233,69,96,.5);
    }

    /* ── Mobile ── */
    @media (max-width: 560px) {
      .arena { flex-direction: column; gap: 0; }
      .vs-wrap { padding: 14px 0; }
      .option-card { min-height: 160px; padding: 40px 20px 32px; }
      .option-card::before { font-size: 10rem; }
      .btn { padding: 16px 32px; font-size: .98rem; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🎲 Would You Rather?</h1>
    <p>Two choices. No right answer. Debate away!</p>
  </div>


  <div class="arena">
    <div class="option-card" id="cardA" data-letter="A">
      <span class="opt-label">Question A</span>
      <span class="question-text placeholder" id="textA">Press Draw to start</span>
    </div>

    <div class="vs-wrap">
      <div class="vs-badge">VS</div>
    </div>

    <div class="option-card" id="cardB" data-letter="B">
      <span class="opt-label">Question B</span>
      <span class="question-text placeholder" id="textB">Press Draw to start</span>
    </div>
  </div>

  <div class="status" id="status">Click Draw to reveal two dilemmas</div>

  <div class="btn-row">
    <button class="btn btn-draw" id="drawBtn" onclick="draw()">🎲 Draw!</button>
  </div>

  <script>
    const questions = [
      "Would you rather travel to the past or the future?",
      "Would you rather be able to fly or be invisible?",
      "Would you rather live in the city or the countryside?",
      "Would you rather speak every language or play every instrument?",
      "Would you rather have a rewind button or a pause button for your life?",
      "Would you rather eat only sweet food or only savory food forever?",
      "Would you rather be the funniest person in the room or the smartest?",
      "Would you rather lose your phone or lose your wallet?",
      "Would you rather have a pet dragon or a pet unicorn?",
      "Would you rather always be 10 minutes late or 2 hours early?",
      "Would you rather live without music or without movies?",
      "Would you rather be famous but poor or rich but unknown?",
      "Would you rather fight one horse-sized duck or 100 duck-sized horses?",
      "Would you rather have super strength or super speed?",
      "Would you rather be the best player on a losing team or the worst on a winning team?",
      "Would you rather live in a world without the internet or without cars?",
      "Would you rather always have to sing instead of speak or dance instead of walk?",
      "Would you rather know when you'll die or how you'll die?",
      "Would you rather have the power to heal others or to read minds?",
      "Would you rather only be able to whisper or only be able to shout?",
      "Would you rather explore the deep ocean or outer space?",
      "Would you rather be 4 feet tall or 8 feet tall?",
      "Would you rather never be cold again or never be hot again?",
      "Would you rather have a dog that talks or a cat that understands you?",
      "Would you rather give up social media or give up coffee for a year?",
      "Would you rather live in a treehouse or a houseboat?",
      "Would you rather always know the truth or always be happy?",
      "Would you rather meet your great-great-grandparents or your great-great-grandchildren?",
      "Would you rather have a personal chef or a personal driver?",
      "Would you rather work four 10-hour days or five 8-hour days?",
      "Would you rather lose your sense of taste or your sense of smell?",
      "Would you rather always feel like it's Monday morning or always feel like it's Sunday night?",
      "Would you rather be able to talk to animals or speak all human languages?",
      "Would you rather be an Olympic athlete or a Nobel Prize winner?",
      "Would you rather have unlimited money but no free time or free time but very little money?",
      "Would you rather be able to teleport or time travel?",
      "Would you rather forget who you are or forget everyone you love?",
      "Would you rather have legs as long as your fingers or fingers as long as your legs?",
      "Would you rather live in a world of constant rain or constant sunshine?",
      "Would you rather eat pizza every day or never eat pizza again?",
      "Would you rather be able to pause time or rewind time?",
      "Would you rather have to eat the same meal every day or never eat your favourite food again?",
      "Would you rather be a superhero with a useless power or a villain with an awesome power?",
      "Would you rather be the main character of a reality show or a documentary?",
      "Would you rather have Wi-Fi anywhere but pay for everything or have everything free but no internet?",
      "Would you rather always have to tell the truth or always be able to get away with lying?",
      "Would you rather be incredibly lucky or incredibly skilled?",
      "Would you rather live in a horror movie or an action movie?",
      "Would you rather have unlimited battery on your phone or unlimited fuel for your car?",
      "Would you rather be the best in the world at something nobody cares about or average at something everyone loves?",
      "Would you rather wake up as a different person every day or stay exactly as you are forever?",
      "Would you rather have a photographic memory or the ability to forget anything you want?",
      "Would you rather speak at a packed stadium or perform a song to your whole school?",
      "Would you rather be completely alone for a year or never be alone for a year?",
      "Would you rather live without hot showers or without air conditioning forever?",
      "Would you rather always have spinach in your teeth or always have a bad hair day?",
      "Would you rather be able to stop time or slow time down by half?",
      "Would you rather have a job you love with low pay or a job you hate with high pay?",
      "Would you rather go back to age 10 knowing what you know now or jump forward to age 60?",
      "Would you rather be the world's greatest chef or the world's greatest musician?",
      "Would you rather communicate only through emojis or only through GIFs?",
      "Would you rather have a free round-the-world trip alone or a free trip anywhere with your best friends?",
      "Would you rather be able to run at 100mph or swim like a dolphin?",
      "Would you rather live in the 1800s or the year 2200?",
      "Would you rather never need sleep or never feel hungry?",
      "Would you rather have every day feel exciting but exhausting or calm but a little boring?",
      "Would you rather be great at sports or great at art?",
      "Would you rather only communicate by writing or only by speaking?",
      "Would you rather be stranded on a desert island with friends or in a luxury hotel alone?",
      "Would you rather know every secret about your friends or have them know every secret about you?",
      "Would you rather have summer all year or winter all year?",
      "Would you rather be the oldest sibling or the youngest?",
      "Would you rather win an Oscar or win a Grammy?",
      "Would you rather have a magic wand or a genie with three wishes?",
      "Would you rather travel for free everywhere but stay in hostels or pay full price but stay in 5-star hotels?",
      "Would you rather be able to breathe underwater or survive in space?",
      "Would you rather age in reverse after 30 or stay exactly your current age?",
      "Would you rather have your dream job but work 80 hours a week or an OK job with 20 hours a week?",
      "Would you rather always say what you're thinking or never be able to speak again?",
      "Would you rather be a famous YouTuber or a published bestselling author?",
      "Would you rather have a lifetime supply of your favourite snack or your favourite drink?",
      "Would you rather live on the moon or under the sea?",
      "Would you rather be a master of disguise or a master of escape?",
      "Would you rather know every historical fact or every scientific formula?",
      "Would you rather have hands for feet or feet for hands?",
      "Would you rather only eat food that's white or only eat food that's green?",
      "Would you rather be able to see one minute into the future or one year?",
      "Would you rather have a robot best friend or a robot assistant?",
      "Would you rather always be surrounded by people who laugh too loud or people who never laugh?",
      "Would you rather have the ability to make anyone laugh or make anyone cry?",
      "Would you rather be a professional gamer or a professional traveller?",
      "Would you rather be able to control fire or control water?",
      "Would you rather give up watching TV shows or give up listening to music?",
      "Would you rather have unlimited data on your phone or free food for life?",
      "Would you rather have a clone of yourself or a time machine?",
      "Would you rather be famous for something embarrassing or completely unknown for something great?",
      "Would you rather always find a parking spot instantly or never wait in line ever again?",
      "Would you rather have the ability to fly but only at walking speed or run at airplane speed but stay on the ground?",
    ];

    let rolling = false, round = 0;
    let usedA = -1, usedB = -1;

    function randomPair() {
      let i, j;
      do { i = Math.floor(Math.random() * questions.length); } while (i === usedA || i === usedB);
      do { j = Math.floor(Math.random() * questions.length); } while (j === i || j === usedA || j === usedB);
      return [i, j];
    }

    function triggerRipple(card) {
      const el = document.createElement('div');
      el.className = 'ripple-el';
      card.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    function draw() {
      if (rolling) return;
      rolling = true;

      const btn   = document.getElementById('drawBtn');
      const cardA = document.getElementById('cardA');
      const cardB = document.getElementById('cardB');
      const tA    = document.getElementById('textA');
      const tB    = document.getElementById('textB');
      const status = document.getElementById('status');

      btn.disabled = true;
      cardA.classList.remove('active', 'landed');
      cardB.classList.remove('active', 'landed');
      cardA.classList.add('rolling');
      cardB.classList.add('rolling');
      tA.className = 'question-text';
      tB.className = 'question-text';
      status.className = 'status';
      status.textContent = 'Drawing…';

      triggerRipple(cardA);
      setTimeout(() => triggerRipple(cardB), 140);

      const [fi, fj] = randomPair();
      let ticks = 0;

      const iv = setInterval(() => {
        const [i, j] = randomPair();
        tA.textContent = questions[i];
        tB.textContent = questions[j];
        ticks++;

        if (ticks >= 26) {
          clearInterval(iv);
          usedA = fi; usedB = fj;
          round++;
          document.getElementById('roundNum').textContent = round;

          tA.textContent = questions[fi];
          cardA.classList.remove('rolling');
          cardA.classList.add('active', 'landed');

          setTimeout(() => {
            tB.textContent = questions[fj];
            cardB.classList.remove('rolling');
            cardB.classList.add('active', 'landed');

            status.textContent = 'Pick A or B — type your choice in chat at the same time!';
            status.className = 'status ready';
            btn.disabled = false;
            rolling = false;
          }, 180);
        }
      }, 82);
    }
  </script>

</body>
</html>
