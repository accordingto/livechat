<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('ib-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
  <script src="theme.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sophie's Choice · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sophie's Choice">
  <meta name="theme-color" content="#0d0d1a">
  <link rel="stylesheet" href="shared.css">
  <style>
    .header h1 { background: linear-gradient(135deg, #fff 30%, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(245,158,11,0); }
      50%       { box-shadow: 0 0 48px rgba(245,158,11,.25); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Card ── */
    .sc-card {
      width: 100%; max-width: 1100px;
      background: #13132b;
      border: 2px solid #1e1e42;
      border-radius: 22px;
      padding: 32px 34px;
      margin-bottom: 16px;
      position: relative; overflow: hidden;
      transition: border-color .4s;
      animation: fadeUp .5s .2s ease both;
      min-height: 220px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .sc-card.rolling { border-color: #f59e0b; animation: flicker .14s infinite; }
    .sc-card.landed  { border-color: #f59e0b; animation: pulseGlow 2.5s ease infinite; }
    .sc-card::before {
      content: '🤔';
      position: absolute; font-size: 11rem; opacity: .022;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }

    /* Placeholder */
    .sc-placeholder {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; text-align: center;
      min-height: 200px;
    }
    .sc-placeholder .big-emoji { font-size: 3.2rem; }
    .sc-placeholder p { color: #333; font-size: .95rem; }

    /* Content wrapper */
    .sc-content { display: none; flex-direction: column; gap: 20px; }
    .sc-content.show { display: flex; }

    /* Situation */
    .sc-label {
      font-size: .72rem; text-transform: uppercase;
      letter-spacing: .13em; color: #f59e0b; font-weight: 700;
      margin-bottom: 10px;
    }
    .sc-situation {
      font-size: clamp(1.15rem, 3vw, 1.45rem); color: #eee;
      line-height: 1.55; font-weight: 600;
    }

    /* Divider */
    .sc-divider { height: 1px; background: #1e1e42; }

    /* Options section */
    .options-section { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .options-section.pop { animation: slideDown .35s ease both; }
    .opt-c { grid-column: 1 / -1; }
    @media (max-width: 640px) {
      .options-section { grid-template-columns: 1fr; }
      .opt-c { grid-column: auto; }
    }

    .opt {
      display: flex; align-items: flex-start; gap: 14px;
      background: rgba(255,255,255,.03);
      border-radius: 14px; padding: 15px 18px;
      border: 1.5px solid rgba(255,255,255,.06);
    }
    .opt-badge {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.05rem; flex-shrink: 0;
      margin-top: 1px;
    }
    .opt-a .opt-badge { background: #2563eb; color: #fff; }
    .opt-b .opt-badge { background: #dc2626; color: #fff; }
    .opt-c .opt-badge { background: #16a34a; color: #fff; }

    .opt-text { font-size: clamp(1rem, 2.5vw, 1.15rem); color: #ccc; line-height: 1.55; padding-top: 6px; }
    .opt-c .opt-text { color: #86efac; font-style: italic; }

    /* ── Draw button ── */
    .btn-draw {
      width: 100%; max-width: 1100px;
      background: #13132b; color: #f59e0b; border: 2px solid #f59e0b;
      border-radius: 14px; padding: 16px;
      font-size: 1.05rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s;
      animation: fadeUp .5s .3s ease both;
    }
    .btn-draw:hover { background: rgba(245,158,11,.1); }
    .btn-draw:active { transform: scale(.98); }
    .btn-draw:disabled { opacity: .4; cursor: not-allowed; }

    .round-badge span { color: #f59e0b; }

    /* ── Vote section ── */
    @keyframes voteIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .vote-section {
      display: flex; flex-direction: column; gap: 12px;
      animation: voteIn .4s .1s ease both;
    }
    .vote-history {
      font-size: .82rem; color: #555; text-align: center; letter-spacing: .04em;
    }
    .vote-row { display: flex; gap: 12px; }
    .vote-btn {
      flex: 1; border: 2px solid; border-radius: 14px;
      padding: 14px 12px; cursor: pointer; background: transparent;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      transition: background .2s, transform .15s, box-shadow .2s;
      font-family: inherit;
    }
    .vote-btn:active { transform: scale(.97); }
    .vote-btn.up   { border-color: #22c55e; color: #22c55e; }
    .vote-btn.down { border-color: #f87171; color: #f87171; }
    .vote-btn.up:hover   { background: rgba(34,197,94,.1);  box-shadow: 0 4px 20px rgba(34,197,94,.2);  transform: translateY(-2px); }
    .vote-btn.down:hover { background: rgba(248,113,113,.1); box-shadow: 0 4px 20px rgba(248,113,113,.2); transform: translateY(-2px); }
    .vote-btn .v-emoji { font-size: 1.6rem; line-height: 1; }
    .vote-btn .v-count { font-size: 1.8rem; font-weight: 800; }
    .vote-btn .v-label { font-size: .68rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
    .vote-btn .bar-wrap { width: 80%; height: 4px; background: rgba(255,255,255,.07); border-radius: 4px; overflow: hidden; }
    .vote-btn .bar { height: 100%; border-radius: 4px; transition: width .45s; width: 0%; }
    .vote-btn.up   .bar { background: #22c55e; }
    .vote-btn.down .bar { background: #f87171; }

    /* Soft / sunset / forest overrides */
    [data-theme="soft"] .vote-history { color: var(--text-muted); }
    [data-theme="soft"] .vote-btn.up   { border-color: #16a34a; color: #16a34a; }
    [data-theme="soft"] .vote-btn.down { border-color: #dc2626; color: #dc2626; }
    [data-theme="soft"] .vote-btn .bar-wrap { background: rgba(0,0,0,.07); }

    @media (max-width: 520px) {
      .sc-card { padding: 22px 20px; }
      .opt-badge { width: 32px; height: 32px; font-size: .9rem; }
    }

    /* ── Scenario browser ── */
    .scenario-browser {
      width: 100%; max-width: 1100px;
      margin-top: 28px;
    }
    .scenario-browser-hdr {
      font-size: .72rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
      color: #555; margin-bottom: 12px;
    }
    .scenario-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 8px;
    }
    .scenario-item {
      display: flex; align-items: flex-start; gap: 10px;
      background: #13132b; border: 1.5px solid #1e1e42;
      border-radius: 12px; padding: 12px 16px;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .1s;
      font-family: inherit; text-align: left;
    }
    .scenario-item:hover  { border-color: #f59e0b; background: rgba(245,158,11,.06); }
    .scenario-item:active { transform: scale(.98); }
    .scenario-item.active { border-color: #f59e0b; background: rgba(245,158,11,.1); }
    .scenario-num  { font-size: .75rem; font-weight: 900; color: #f59e0b; flex-shrink: 0; padding-top: 2px; min-width: 22px; }
    .scenario-text { font-size: .88rem; font-weight: 500; color: #aaa; line-height: 1.4; }

    [data-theme="soft"]   .scenario-item { background: var(--surface); border-color: var(--border); }
    [data-theme="soft"]   .scenario-item:hover  { border-color: #f59e0b; }
    [data-theme="soft"]   .scenario-item.active { border-color: #f59e0b; background: rgba(245,158,11,.08); }
    [data-theme="soft"]   .scenario-text { color: var(--text-muted); }
    [data-theme="sunset"] .scenario-item { background: var(--surface); border-color: var(--border); }
    [data-theme="sunset"] .scenario-item:hover  { border-color: #f59e0b; }
    [data-theme="sunset"] .scenario-item.active { border-color: #f59e0b; }
    [data-theme="forest"] .scenario-item { background: var(--surface); border-color: var(--border); }
    [data-theme="forest"] .scenario-item:hover  { border-color: #f59e0b; }
    [data-theme="forest"] .scenario-item.active { border-color: #f59e0b; }

    /* ── Soft theme ── */
    [data-theme="soft"] .sc-card {
      background: var(--surface);
      border-color: var(--border);
      box-shadow: 0 4px 24px rgba(100,60,20,.08);
    }
    [data-theme="soft"] .sc-card.landed { border-color: #f59e0b; }
    [data-theme="soft"] .btn-draw { background: var(--surface); border-color: #f59e0b; color: #92400e; }
    [data-theme="soft"] .btn-draw:hover { background: #fffbeb; }
    [data-theme="sunset"] .sc-card { background: linear-gradient(160deg, var(--surface) 0%, var(--surface-b) 100%); border-color: var(--border); }
    [data-theme="sunset"] .sc-card.landed { border-color: #f59e0b; }
    [data-theme="sunset"] .btn-draw { background: var(--surface); border-color: #f59e0b; color: var(--text); }
    [data-theme="sunset"] .btn-draw:hover { background: var(--border); }
    [data-theme="forest"] .sc-card { background: linear-gradient(160deg, var(--surface) 0%, var(--surface-b) 100%); border-color: var(--border); }
    [data-theme="forest"] .sc-card.landed { border-color: #f59e0b; }
    [data-theme="forest"] .btn-draw { background: var(--surface); border-color: #f59e0b; color: var(--text); }
    [data-theme="forest"] .btn-draw:hover { background: var(--border); }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🤔 Sophie's Choice</h1>
    <p>Draw a tough situation — pick A, B, or come up with your own answer!</p>
  </div>

  <div class="sc-card" id="sc-card">

    <div class="sc-placeholder" id="sc-placeholder">
      <div class="big-emoji">🤔</div>
      <p>Press <strong>Draw</strong> to reveal the situation</p>
    </div>

    <div class="sc-content" id="sc-content">

      <div>
        <div class="sc-label">🎯 The Situation</div>
        <div class="sc-situation" id="sc-situation"></div>
      </div>

      <div class="sc-divider" id="sc-divider" style="display:none"></div>

      <div class="options-section" id="options-section" style="display:none">
        <div class="opt opt-a">
          <div class="opt-badge">A</div>
          <div class="opt-text" id="opt-a-text"></div>
        </div>
        <div class="opt opt-b">
          <div class="opt-badge">B</div>
          <div class="opt-text" id="opt-b-text"></div>
        </div>
        <div class="opt opt-c">
          <div class="opt-badge">C</div>
          <div class="opt-text">Something else — come up with your own answer and share it with the group!</div>
        </div>
      </div>

    </div>
  </div>

  <button class="btn-draw" id="draw-btn" onclick="draw()">🎲 Draw</button>

  <div class="scenario-browser">
    <div class="scenario-browser-hdr">📋 All Scenarios (50) — click to load</div>
    <div class="scenario-list" id="scenario-list"></div>
  </div>

  <script src="game-data.js"></script>
  <script src="game-render.js"></script>
  <script>
    GAME_RENDER.injectCSS();
    const scenarios = GAME_DATA.sophies;

    let round   = 0;
    let used    = [];
    let rolling = false;
    let currentScIdx = null;

    /* ── Vote storage ── */
    const VOTES_KEY = 'sc-sophies-votes';
    function getVotes() {
      try { return JSON.parse(localStorage.getItem(VOTES_KEY)) || {}; } catch { return {}; }
    }
    function saveVotes(v) { localStorage.setItem(VOTES_KEY, JSON.stringify(v)); }

    function castVote(dir) {
      if (currentScIdx === null) return;
      const v = getVotes();
      if (!v[currentScIdx]) v[currentScIdx] = { up: 0, down: 0 };
      v[currentScIdx][dir]++;
      saveVotes(v);
      renderVotes();
    }

    function renderVotes() {
      if (currentScIdx === null) return;
      const votes = getVotes()[currentScIdx] || { up: 0, down: 0 };
      const total = votes.up + votes.down;

      const elUp   = document.getElementById('v-count-up');
      const elDown = document.getElementById('v-count-down');
      const barUp  = document.getElementById('v-bar-up');
      const barDown= document.getElementById('v-bar-down');
      const hist   = document.getElementById('vote-history');
      if (!elUp) return;

      elUp.textContent   = votes.up;
      elDown.textContent = votes.down;
      const pct = total ? (votes.up / total * 100) : 0;
      barUp.style.width   = pct + '%';
      barDown.style.width = (100 - pct) + '%';

      if (total > 0) {
        hist.textContent = `${total} vote${total > 1 ? 's' : ''} recorded for this scenario`;
      } else {
        hist.textContent = 'No votes yet — be the first!';
      }
    }

    function appendVoteSection(ct) {
      const div = document.createElement('div');
      div.innerHTML = `
        <div class="sc-divider"></div>
        <div class="vote-section">
          <div class="vote-history" id="vote-history"></div>
          <div class="vote-row">
            <button class="vote-btn up" onclick="castVote('up')">
              <span class="v-emoji">👍</span>
              <span class="v-count" id="v-count-up">0</span>
              <span class="v-label">Love it</span>
              <div class="bar-wrap"><div class="bar" id="v-bar-up"></div></div>
            </button>
            <button class="vote-btn down" onclick="castVote('down')">
              <span class="v-emoji">👎</span>
              <span class="v-count" id="v-count-down">0</span>
              <span class="v-label">Skip it</span>
              <div class="bar-wrap"><div class="bar" id="v-bar-down"></div></div>
            </button>
          </div>
        </div>`;
      while (div.firstChild) ct.appendChild(div.firstChild);
    }

    /* ── Scenario browser ── */
    (function buildList() {
      const list = document.getElementById('scenario-list');
      scenarios.forEach((sc, i) => {
        const btn = document.createElement('button');
        btn.className = 'scenario-item';
        btn.dataset.idx = i;
        const preview = sc.situation.length > 80 ? sc.situation.slice(0, 78) + '…' : sc.situation;
        btn.innerHTML = `<span class="scenario-num">${i + 1}</span><span class="scenario-text">${preview}</span>`;
        btn.addEventListener('click', () => loadScenario(sc, i));
        list.appendChild(btn);
      });
    })();

    function loadScenario(sc, idx) {
      const btn  = document.getElementById('draw-btn');
      const card = document.getElementById('sc-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      ph.style.display = 'none';
      card.classList.remove('rolling');
      card.classList.add('landed');
      ct.classList.remove('show');
      ct.innerHTML = '';
      GAME_RENDER.sophies(ct, sc);
      currentScIdx = idx;
      appendVoteSection(ct);
      renderVotes();
      ct.classList.add('show');
      round++;
      document.getElementById('roundNum').textContent = round;
      btn.textContent = '🔁 Next Situation';

      document.querySelectorAll('.scenario-item').forEach(el => {
        el.classList.toggle('active', +el.dataset.idx === idx);
      });
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function draw() {
      if (rolling) return;
      rolling = true;

      const btn  = document.getElementById('draw-btn');
      const card = document.getElementById('sc-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      btn.disabled = true;
      card.classList.remove('landed');
      card.classList.add('rolling');
      ph.style.display = 'none';
      ct.innerHTML = '<span class="gr-text" id="sc-roll-text">Drawing…</span>';
      ct.classList.add('show');

      let avail = scenarios.map((_,i) => i).filter(i => !used.includes(i));
      if (!avail.length) { used = []; avail = scenarios.map((_,i) => i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      used.push(fi);

      GAME_RENDER.drawTick(
        scenarios,
        tick => { document.getElementById('sc-roll-text').textContent = tick.situation; },
        () => {
          const sc = scenarios[fi];
          GAME_RENDER.sophies(ct, sc);
          currentScIdx = fi;
          appendVoteSection(ct);
          renderVotes();
          card.classList.remove('rolling');
          card.classList.add('landed');
          round++;
          document.getElementById('roundNum').textContent = round;
          btn.textContent = '🔁 Next Situation';
          btn.disabled    = false;
          rolling = false;
          document.querySelectorAll('.scenario-item').forEach(el => el.classList.remove('active'));
        }
      );
    }
  </script>
</body>
</html>
