<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sophie's Choice · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sophie's Choice">
  <meta name="theme-color" content="#0d0d1a">
  <link rel="stylesheet" href="shared.css">
  <style>
    .header h1 { background: linear-gradient(135deg, #fff 30%, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(245,158,11,0); }
      50%       { box-shadow: 0 0 48px rgba(245,158,11,.25); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Card ── */
    .sc-card {
      width: 100%; max-width: 740px;
      background: #13132b;
      border: 2px solid #1e1e42;
      border-radius: 22px;
      padding: 32px 34px;
      margin-bottom: 16px;
      position: relative; overflow: hidden;
      transition: border-color .4s;
      animation: fadeUp .5s .2s ease both;
      min-height: 260px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .sc-card.rolling { border-color: #f59e0b; animation: flicker .14s infinite; }
    .sc-card.landed  { border-color: #f59e0b; animation: pulseGlow 2.8s ease infinite; }
    .sc-card::before {
      content: '🤔';
      position: absolute; font-size: 11rem; opacity: .022;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }

    /* Placeholder */
    .sc-placeholder {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; text-align: center;
      min-height: 200px;
    }
    .sc-placeholder .big-emoji { font-size: 3.2rem; }
    .sc-placeholder p { color: #333; font-size: .95rem; }

    /* Content wrapper */
    .sc-content { display: none; flex-direction: column; gap: 20px; }
    .sc-content.show { display: flex; }

    /* Situation */
    .sc-label {
      font-size: .72rem; text-transform: uppercase;
      letter-spacing: .13em; color: #f59e0b; font-weight: 700;
      margin-bottom: 10px;
    }
    .sc-situation {
      font-size: 1.55rem; color: #eee;
      line-height: 1.55; font-weight: 600;
    }

    /* Divider */
    .sc-divider { height: 1px; background: #1e1e42; }

    /* Options section */
    .options-section { display: flex; flex-direction: column; gap: 10px; }
    .options-section.pop { animation: slideDown .35s ease both; }

    .opt {
      display: flex; align-items: flex-start; gap: 14px;
      background: rgba(255,255,255,.03);
      border-radius: 14px; padding: 15px 18px;
      border: 1.5px solid rgba(255,255,255,.06);
    }
    .opt-badge {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.05rem; flex-shrink: 0;
      margin-top: 1px;
    }
    .opt-a .opt-badge { background: #2563eb; color: #fff; }
    .opt-b .opt-badge { background: #dc2626; color: #fff; }
    .opt-c .opt-badge { background: #16a34a; color: #fff; }

    .opt-text { font-size: 1.08rem; color: #ccc; line-height: 1.55; padding-top: 6px; }
    .opt-c .opt-text { color: #86efac; font-style: italic; }

    /* ── Draw button ── */
    .btn-draw {
      width: 100%; max-width: 740px;
      background: #13132b; color: #f59e0b; border: 2px solid #f59e0b;
      border-radius: 14px; padding: 17px;
      font-size: 1.05rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s;
      animation: fadeUp .5s .3s ease both;
    }
    .btn-draw:hover { background: rgba(245,158,11,.1); }
    .btn-draw:active { transform: scale(.98); }
    .btn-draw:disabled { opacity: .4; cursor: not-allowed; }

    .round-badge span { color: #f59e0b; }

    @media (max-width: 520px) {
      .sc-card { padding: 22px 20px; }
      .sc-situation { font-size: 1.2rem; }
      .opt-text { font-size: .95rem; }
      .opt-badge { width: 32px; height: 32px; font-size: .9rem; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🤔 Sophie's Choice</h1>
    <p>Draw a tough situation — pick A, B, or come up with your own answer!</p>
  </div>

  <div class="sc-card" id="sc-card">

    <div class="sc-placeholder" id="sc-placeholder">
      <div class="big-emoji">🤔</div>
      <p>Press <strong>Draw</strong> to reveal the situation</p>
    </div>

    <div class="sc-content" id="sc-content">

      <div>
        <div class="sc-label">🎯 The Situation</div>
        <div class="sc-situation" id="sc-situation"></div>
      </div>

      <div class="sc-divider" id="sc-divider" style="display:none"></div>

      <div class="options-section" id="options-section" style="display:none">
        <div class="opt opt-a">
          <div class="opt-badge">A</div>
          <div class="opt-text" id="opt-a-text"></div>
        </div>
        <div class="opt opt-b">
          <div class="opt-badge">B</div>
          <div class="opt-text" id="opt-b-text"></div>
        </div>
        <div class="opt opt-c">
          <div class="opt-badge">C</div>
          <div class="opt-text">Something else — come up with your own answer and share it with the group!</div>
        </div>
      </div>

    </div>
  </div>

  <button class="btn-draw" id="draw-btn" onclick="draw()">🎲 Draw</button>

  <script src="game-data.js"></script>
  <script src="game-render.js"></script>
  <script>
    GAME_RENDER.injectCSS();
    const scenarios = GAME_DATA.sophies;

    let round   = 0;
    let used    = [];
    let rolling = false;

    function draw() {
      if (rolling) return;
      rolling = true;

      const btn  = document.getElementById('draw-btn');
      const card = document.getElementById('sc-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      btn.disabled = true;
      card.classList.remove('landed');
      card.classList.add('rolling');
      ph.style.display = 'none';
      ct.innerHTML = '<span class="gr-text" id="sc-roll-text">Drawing…</span>';
      ct.classList.add('show');

      let avail = scenarios.map((_,i) => i).filter(i => !used.includes(i));
      if (!avail.length) { used = []; avail = scenarios.map((_,i) => i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      used.push(fi);

      GAME_RENDER.drawTick(
        scenarios,
        tick => { document.getElementById('sc-roll-text').textContent = tick.situation; },
        () => {
          const sc = scenarios[fi];
          GAME_RENDER.sophies(ct, sc);
          card.classList.remove('rolling');
          card.classList.add('landed');
          round++;
          document.getElementById('roundNum').textContent = round;
          btn.textContent = '🔁 Next Situation';
          btn.disabled    = false;
          rolling = false;
        }
      );
    }
  </script>
</body>
</html>
