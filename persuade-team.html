<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Persuade Together! · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Persuade Together">
  <meta name="theme-color" content="#0d0d1a">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 72px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50%       { opacity: .55; }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(6,182,212,0); }
      50%       { box-shadow: 0 0 40px rgba(6,182,212,.28); }
    }

    /* ── Topbar ── */
    .topbar {
      width: 100%; max-width: 720px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 36px;
      animation: fadeUp .5s ease both;
      position: relative; z-index: 1;
    }
    a.back { color: #555; text-decoration: none; font-size: 14px; transition: color .2s; }
    a.back:hover { color: #eee; }
    .round-badge { font-size: 12px; color: #444; }
    .round-badge span { color: #06b6d4; font-weight: 700; }

    /* ── Header ── */
    .header {
      text-align: center; margin-bottom: 32px;
      animation: fadeUp .5s .1s ease both;
      position: relative; z-index: 1;
    }
    .header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #06b6d4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .header p { color: #555; font-size: .93rem; }

    /* ── Scenario card ── */
    .scenario-card {
      width: 100%; max-width: 720px;
      background: #13132b;
      border: 2px solid #1e1e42;
      border-radius: 22px;
      padding: 28px 30px;
      margin-bottom: 16px;
      position: relative; overflow: hidden;
      transition: border-color .4s;
      animation: fadeUp .5s .2s ease both;
      min-height: 200px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .scenario-card.rolling { border-color: #06b6d4; animation: flicker .13s infinite; }
    .scenario-card.landed  { border-color: #06b6d4; animation: pulseGlow 2.8s ease infinite; }
    .scenario-card::before {
      content: '🤝';
      position: absolute; font-size: 10rem; opacity: .025;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }

    /* Placeholder */
    .sc-placeholder {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; text-align: center;
      min-height: 160px;
    }
    .sc-placeholder .big-emoji { font-size: 3rem; }
    .sc-placeholder p { color: #333; font-size: .95rem; }

    /* Content */
    .sc-content { display: none; flex-direction: column; gap: 18px; }
    .sc-content.show { display: flex; }

    /* Category badge */
    .sc-category-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(6,182,212,.12);
      border: 1px solid rgba(6,182,212,.3);
      color: #06b6d4;
      font-size: .75rem; font-weight: 700;
      padding: 4px 12px; border-radius: 20px;
      letter-spacing: .05em;
      align-self: flex-start;
    }

    .sc-field { display: flex; flex-direction: column; gap: 5px; }
    .sc-label {
      font-size: .72rem; text-transform: uppercase;
      letter-spacing: .13em; color: #06b6d4; font-weight: 700;
    }
    .sc-team      { font-size: 1.95rem; font-weight: 700; color: #eee; line-height: 1.3; }
    .sc-situation { font-size: 1.95rem; color: #ccc; line-height: 1.5; }
    .sc-judge     { font-size: 1.95rem; font-weight: 700; color: #eee; }
    .sc-divider   { height: 1px; background: #1e1e42; }

    /* ── Draw button ── */
    .btn-draw {
      width: 100%; max-width: 720px;
      background: #13132b; color: #06b6d4; border: 2px solid #06b6d4;
      border-radius: 14px; padding: 16px;
      font-size: 1.05rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s;
      animation: fadeUp .5s .3s ease both;
      position: relative; z-index: 1;
    }
    .btn-draw:hover { background: rgba(6,182,212,.1); }
    .btn-draw:active { transform: scale(.98); }
    .btn-draw:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Counter ── */
    .sc-counter {
      width: 100%; max-width: 720px;
      text-align: center; font-size: .8rem; color: #2a2a50;
      margin-top: 12px;
      animation: fadeUp .5s .35s ease both;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="round-num">0</span></div>
  </div>

  <div class="header">
    <h1>🤝 Persuade Together!</h1>
    <p>One judge, everyone else teams up — convince them together!</p>
  </div>

  <!-- Scenario card -->
  <div class="scenario-card" id="sc-card">
    <div class="sc-placeholder" id="sc-placeholder">
      <div class="big-emoji">🤝</div>
      <p>Press <strong>Draw</strong> to reveal the scene</p>
    </div>
    <div class="sc-content" id="sc-content">
      <div class="sc-category-badge" id="sc-category"></div>
      <div class="sc-divider"></div>
      <div class="sc-field">
        <div class="sc-label">👥 Your Team Plays</div>
        <div class="sc-team" id="sc-team"></div>
      </div>
      <div class="sc-divider"></div>
      <div class="sc-field">
        <div class="sc-label">🎯 The Situation</div>
        <div class="sc-situation" id="sc-situation"></div>
      </div>
      <div class="sc-divider"></div>
      <div class="sc-field">
        <div class="sc-label">👨‍⚖️ The Judge</div>
        <div class="sc-judge" id="sc-judge"></div>
      </div>
    </div>
  </div>

  <button class="btn-draw" id="draw-btn" onclick="draw()">🎲 Draw</button>
  <div class="sc-counter" id="sc-counter">100 scenarios</div>

  <script>
    const scenarios = [

    let round   = 0;
    let used    = [];
    let rolling = false;

    function updateCounter() {
      const left = scenarios.length - used.length;
      document.getElementById('sc-counter').textContent =
        left < scenarios.length ? left + ' scenarios left' : scenarios.length + ' scenarios';
    }

    function draw() {
      if (rolling) return;
      rolling = true;

      const btn  = document.getElementById('draw-btn');
      const card = document.getElementById('sc-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      btn.disabled = true;
      card.classList.remove('landed');
      card.classList.add('rolling');
      ph.style.display = 'none';
      ct.classList.add('show');

      let avail = scenarios.map((_, i) => i).filter(i => !used.includes(i));
      if (!avail.length) { used = []; avail = scenarios.map((_, i) => i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      used.push(fi);

      let ticks = 0;
      const iv = setInterval(() => {
        const tmp = scenarios[Math.floor(Math.random() * scenarios.length)];
        document.getElementById('sc-category').textContent  = tmp.cat;
        document.getElementById('sc-team').textContent      = tmp.team;
        document.getElementById('sc-situation').textContent = tmp.situation;
        document.getElementById('sc-judge').textContent     = tmp.emoji + ' ' + tmp.judge;
        if (++ticks >= 24) {
          clearInterval(iv);
          const sc = scenarios[fi];
          document.getElementById('sc-category').textContent  = sc.cat;
          document.getElementById('sc-team').textContent      = sc.team;
          document.getElementById('sc-situation').textContent = sc.situation;
          document.getElementById('sc-judge').textContent     = sc.emoji + ' ' + sc.judge;
          card.classList.remove('rolling');
          card.classList.add('landed');
          round++;
          document.getElementById('round-num').textContent = round;
          btn.textContent = '🔁 Redraw';
          btn.disabled    = false;
          rolling         = false;
          updateCounter();
        }
      }, 82);
    }

    updateCounter();
  </script>
