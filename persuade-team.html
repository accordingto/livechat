<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('ib-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
  <script src="theme.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Persuade Together! · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Persuade Together">
  <meta name="theme-color" content="#0d0d1a">
  <link rel="stylesheet" href="shared.css">
  <style>
    .header h1 { background: linear-gradient(135deg, #fff 30%, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(6,182,212,0); }
      50%       { box-shadow: 0 0 40px rgba(6,182,212,.28); }
    }

    /* ── Scenario card ── */
    .scenario-card {
      width: 100%; max-width: 1100px;
      background: #13132b;
      border: 2px solid #1e1e42;
      border-radius: 22px;
      padding: 28px 30px;
      margin-bottom: 16px;
      position: relative; overflow: hidden;
      transition: border-color .4s;
      animation: fadeUp .5s .2s ease both;
      min-height: 220px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .scenario-card.rolling { border-color: #06b6d4; animation: flicker .13s infinite; }
    .scenario-card.landed  { border-color: #06b6d4; animation: pulseGlow 2.5s ease infinite; }
    .scenario-card::before {
      content: '🤝';
      position: absolute; font-size: 10rem; opacity: .025;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }

    /* Placeholder */
    .sc-placeholder {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; text-align: center;
      min-height: 160px;
    }
    .sc-placeholder .big-emoji { font-size: 3rem; }
    .sc-placeholder p { color: #333; font-size: .95rem; }

    /* Content */
    .sc-content { display: none; flex-direction: column; gap: 0; }
    .sc-content.show { display: flex; }

    /* ── Redesigned card layout ── */
    .pt-cat {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(6,182,212,.12);
      border: 1px solid rgba(6,182,212,.28);
      color: #06b6d4;
      font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 20px;
      align-self: flex-start;
      margin-bottom: 22px;
    }
    .pt-block { margin-bottom: 20px; }
    .pt-lbl {
      font-size: .65rem; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase;
      margin-bottom: 7px;
    }
    .pt-lbl-team  { color: #06b6d4; }
    .pt-lbl-sit   { color: #64748b; }
    .pt-lbl-judge { color: #c084fc; }
    .pt-team {
      font-size: clamp(1.3rem, 4vw, 1.75rem); font-weight: 800; color: #fff;
      line-height: 1.3;
    }
    .pt-sit {
      font-size: clamp(1.2rem, 3.2vw, 1.5rem); color: #bbb;
      line-height: 1.65; font-weight: 500;
    }
    .pt-judge {
      font-size: clamp(1.3rem, 4vw, 1.75rem); font-weight: 800; color: #e9d5ff;
      line-height: 1.3;
    }
    .pt-divider { height: 1px; background: #1e1e42; margin: 4px 0 22px; }

    /* theme overrides for new layout */
    [data-theme="soft"] .pt-team  { color: var(--text); }
    [data-theme="soft"] .pt-sit   { color: var(--text-muted); }
    [data-theme="soft"] .pt-judge { color: #7c3aed; }
    [data-theme="soft"] .pt-divider { background: var(--divider); }
    [data-theme="sunset"] .pt-team  { color: var(--text); }
    [data-theme="sunset"] .pt-sit   { color: var(--text-dim); }
    [data-theme="sunset"] .pt-divider { background: var(--divider); }
    [data-theme="forest"] .pt-team  { color: var(--text); }
    [data-theme="forest"] .pt-sit   { color: var(--text-dim); }
    [data-theme="forest"] .pt-divider { background: var(--divider); }

    /* ── Draw button ── */
    .btn-draw {
      width: 100%; max-width: 1100px;
      background: #13132b; color: #06b6d4; border: 2px solid #06b6d4;
      border-radius: 14px; padding: 16px;
      font-size: 1.05rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s;
      animation: fadeUp .5s .3s ease both;
      position: relative; z-index: 1;
    }
    .btn-draw:hover { background: rgba(6,182,212,.1); }
    .btn-draw:active { transform: scale(.98); }
    .btn-draw:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Counter ── */
    .sc-counter {
      width: 100%; max-width: 1100px;
      text-align: center; font-size: .8rem; color: #2a2a50;
      margin-top: 12px;
      animation: fadeUp .5s .35s ease both;
    }

    .round-badge span { color: #06b6d4; }

    /* ── Scenario browser ── */
    .scenario-browser {
      width: 100%; max-width: 1100px;
      margin-top: 28px;
    }
    .scenario-browser-hdr {
      font-size: .72rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
      color: #555; margin-bottom: 12px;
    }
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 7px;
      margin-bottom: 14px;
    }
    .filter-btn {
      border: 1.5px solid #1e1e42; border-radius: 20px;
      padding: 5px 14px; font-size: .8rem; font-weight: 700;
      color: #555; background: transparent; cursor: pointer;
      transition: border-color .18s, color .18s, background .18s, transform .1s;
      font-family: inherit; white-space: nowrap;
    }
    .filter-btn:hover  { border-color: #06b6d4; color: #06b6d4; }
    .filter-btn:active { transform: scale(.96); }
    .filter-btn.active { border-color: #06b6d4; color: #06b6d4; background: rgba(6,182,212,.12); }

    [data-theme="soft"]   .filter-btn { border-color: var(--border); color: var(--text-muted); }
    [data-theme="soft"]   .filter-btn:hover  { border-color: #06b6d4; color: #0e7490; }
    [data-theme="soft"]   .filter-btn.active { border-color: #06b6d4; color: #0e7490; background: rgba(6,182,212,.1); }
    [data-theme="sunset"] .filter-btn { border-color: var(--border); color: var(--text-muted); }
    [data-theme="sunset"] .filter-btn:hover  { border-color: #06b6d4; color: #22d3ee; }
    [data-theme="sunset"] .filter-btn.active { border-color: #06b6d4; color: #22d3ee; background: rgba(6,182,212,.12); }
    [data-theme="forest"] .filter-btn { border-color: var(--border); color: var(--text-muted); }
    [data-theme="forest"] .filter-btn:hover  { border-color: #06b6d4; color: #22d3ee; }
    [data-theme="forest"] .filter-btn.active { border-color: #06b6d4; color: #22d3ee; background: rgba(6,182,212,.12); }
    .scenario-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 8px;
    }
    .scenario-item {
      display: flex; align-items: flex-start; gap: 10px;
      background: #13132b; border: 1.5px solid #1e1e42;
      border-radius: 12px; padding: 12px 16px;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .1s;
      font-family: inherit; text-align: left;
    }
    .scenario-item:hover  { border-color: #06b6d4; background: rgba(6,182,212,.06); }
    .scenario-item:active { transform: scale(.98); }
    .scenario-item.active { border-color: #06b6d4; background: rgba(6,182,212,.1); }
    .scenario-emoji { font-size: 1.3rem; flex-shrink: 0; line-height: 1; padding-top: 1px; }
    .scenario-text  { font-size: .88rem; font-weight: 500; color: #aaa; line-height: 1.4; }

    [data-theme="soft"]   .scenario-item { background: var(--surface); border-color: var(--border); }
    [data-theme="soft"]   .scenario-item:hover  { border-color: #06b6d4; }
    [data-theme="soft"]   .scenario-item.active { border-color: #06b6d4; background: rgba(6,182,212,.08); }
    [data-theme="soft"]   .scenario-text { color: var(--text-muted); }
    [data-theme="sunset"] .scenario-item { background: var(--surface); border-color: var(--border); }
    [data-theme="sunset"] .scenario-item:hover  { border-color: #06b6d4; }
    [data-theme="sunset"] .scenario-item.active { border-color: #06b6d4; }
    [data-theme="forest"] .scenario-item { background: var(--surface); border-color: var(--border); }
    [data-theme="forest"] .scenario-item:hover  { border-color: #06b6d4; }
    [data-theme="forest"] .scenario-item.active { border-color: #06b6d4; }

    /* ── Soft theme ── */
    [data-theme="soft"] .scenario-card {
      background: var(--surface);
      border-color: var(--border);
      box-shadow: 0 4px 24px rgba(100,60,20,.08);
    }
    [data-theme="soft"] .scenario-card.landed { border-color: #06b6d4; }
    [data-theme="soft"] .btn-draw { background: var(--surface); border-color: #06b6d4; color: #0e7490; }
    [data-theme="soft"] .btn-draw:hover { background: #ecfeff; }
    [data-theme="soft"] .sc-counter { color: var(--text-muted); }
    [data-theme="sunset"] .scenario-card { background: linear-gradient(160deg, var(--surface) 0%, var(--surface-b) 100%); border-color: var(--border); }
    [data-theme="sunset"] .scenario-card.landed { border-color: #06b6d4; }
    [data-theme="sunset"] .btn-draw { background: var(--surface); border-color: #06b6d4; color: #22d3ee; }
    [data-theme="sunset"] .btn-draw:hover { background: var(--border); }
    [data-theme="sunset"] .sc-counter { color: var(--text-muted); }
    [data-theme="forest"] .scenario-card { background: linear-gradient(160deg, var(--surface) 0%, var(--surface-b) 100%); border-color: var(--border); }
    [data-theme="forest"] .scenario-card.landed { border-color: #06b6d4; }
    [data-theme="forest"] .btn-draw { background: var(--surface); border-color: #06b6d4; color: #22d3ee; }
    [data-theme="forest"] .btn-draw:hover { background: var(--border); }
    [data-theme="forest"] .sc-counter { color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🤝 Persuade Together!</h1>
    <p>One judge, everyone else teams up — convince them together!</p>
  </div>

  <!-- Scenario card -->
  <div class="scenario-card" id="sc-card">
    <div class="sc-placeholder" id="sc-placeholder">
      <div class="big-emoji">🤝</div>
      <p>Press <strong>Draw</strong> to reveal the scene</p>
    </div>
    <div class="sc-content" id="sc-content"></div>
  </div>

  <button class="btn-draw" id="draw-btn" onclick="draw()">🎲 Draw</button>
  <div class="sc-counter" id="sc-counter">100 scenarios</div>

  <div class="scenario-browser">
    <div class="scenario-browser-hdr">📋 All Scenarios (100) — click to load</div>
    <div class="filter-bar" id="filter-bar"></div>
    <div class="scenario-list" id="scenario-list"></div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="rating.js"></script>
  <script src="game-data.js"></script>
  <script src="game-loader.js"></script>
  <script src="game-render.js"></script>
  <script>
    GAME_RENDER.injectCSS();
    GAME_RATING.init('persuade');
    let scenarios = GAME_DATA.persuade;
    GAME_LOADER.init('persuade').then(d => { if (d) scenarios = d; });

    let round   = 0;
    let used    = [];
    let rolling = false;

    function renderCard(sc) {
      const ct = document.getElementById('sc-content');
      ct.innerHTML = `
        <span class="pt-cat">${sc.emoji} ${sc.cat || 'Scenario'}</span>
        <div class="pt-block">
          <div class="pt-lbl pt-lbl-team">👥 Your Team Plays</div>
          <div class="pt-team">${sc.team}</div>
        </div>
        <div class="pt-divider"></div>
        <div class="pt-block">
          <div class="pt-lbl pt-lbl-sit">🎯 The Situation</div>
          <div class="pt-sit">${sc.situation}</div>
        </div>
        <div class="pt-divider"></div>
        <div class="pt-block" style="margin-bottom:0">
          <div class="pt-lbl pt-lbl-judge">👨‍⚖️ The Judge</div>
          <div class="pt-judge">${sc.judge}</div>
        </div>`;
      ct.classList.add('show');
    }

    function updateCounter() {
      const left = scenarios.length - used.length;
      document.getElementById('sc-counter').textContent =
        left < scenarios.length ? left + ' scenarios left' : scenarios.length + ' scenarios';
    }

    /* ── Scenario browser ── */
    let activeCat = '';

    function filterBy(cat) {
      activeCat = cat;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
      document.querySelectorAll('.scenario-item').forEach(item => {
        item.style.display = (!cat || item.dataset.cat === cat) ? '' : 'none';
      });
    }

    (function buildList() {
      const filterBar = document.getElementById('filter-bar');
      const list = document.getElementById('scenario-list');

      /* Collect unique categories in order */
      const cats = [];
      scenarios.forEach(sc => { if (sc.cat && !cats.includes(sc.cat)) cats.push(sc.cat); });

      /* All button */
      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn active';
      allBtn.textContent = 'All';
      allBtn.dataset.cat = '';
      allBtn.addEventListener('click', () => filterBy(''));
      filterBar.appendChild(allBtn);

      /* Category buttons */
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = cat;
        btn.dataset.cat = cat;
        btn.addEventListener('click', () => filterBy(cat));
        filterBar.appendChild(btn);
      });

      /* Scenario items */
      scenarios.forEach((sc, i) => {
        const btn = document.createElement('button');
        btn.className = 'scenario-item';
        btn.dataset.idx = i;
        btn.dataset.cat = sc.cat || '';
        const preview = sc.situation.length > 80 ? sc.situation.slice(0, 78) + '…' : sc.situation;
        btn.innerHTML = `<span class="scenario-emoji">${sc.emoji}</span><span class="scenario-text">${preview}</span>`;
        btn.addEventListener('click', () => loadScenario(sc, i));
        list.appendChild(btn);
      });
    })();

    function loadScenario(sc, idx) {
      const btn  = document.getElementById('draw-btn');
      const card = document.getElementById('sc-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      ph.style.display = 'none';
      card.classList.remove('rolling');
      card.classList.add('landed');
      renderCard(sc);
      round++;
      document.getElementById('roundNum').textContent = round;
      btn.textContent = '🔁 Redraw';
      used.push(idx);
      updateCounter();

      document.querySelectorAll('.scenario-item').forEach(el => {
        el.classList.toggle('active', +el.dataset.idx === idx);
      });
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      GAME_RATING.showFor(GAME_RATING.hash(sc.situation));
    }

    function draw() {
      if (rolling) return;
      rolling = true;

      const btn  = document.getElementById('draw-btn');
      const card = document.getElementById('sc-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      btn.disabled = true;
      card.classList.remove('landed');
      card.classList.add('rolling');
      ph.style.display = 'none';
      ct.innerHTML = '<span class="gr-text" id="sc-roll-text">Drawing…</span>';
      ct.classList.add('show');

      let avail = scenarios.map((_, i) => i).filter(i => !used.includes(i));
      if (!avail.length) { used = []; avail = scenarios.map((_, i) => i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      used.push(fi);

      GAME_RATING.hide();
      GAME_RENDER.drawTick(
        scenarios,
        tick => { document.getElementById('sc-roll-text').textContent = tick.situation; },
        () => {
          const sc = scenarios[fi];
          renderCard(sc);
          card.classList.remove('rolling');
          card.classList.add('landed');
          round++;
          document.getElementById('roundNum').textContent = round;
          btn.textContent = '🔁 Redraw';
          btn.disabled    = false;
          rolling         = false;
          updateCounter();
          document.querySelectorAll('.scenario-item').forEach(el => el.classList.remove('active'));
          GAME_RATING.showFor(GAME_RATING.hash(scenarios[fi].situation));
        },
        { count: 24, ms: 82 }
      );
    }

    updateCounter();
  </script>
</body>
</html>
