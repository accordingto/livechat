<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Persuade Together! · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Persuade Together">
  <meta name="theme-color" content="#0d0d1a">
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="scenario.css">
  <style>
    :root { --accent: #06b6d4; }
    /* this game's cards are shorter than the other two scenario games */
    .sc-placeholder { gap: 12px; min-height: 160px; }
    .sc-placeholder .big-emoji { font-size: 3rem; }
    .sc-content { gap: 0; }

    .header h1 { background: linear-gradient(135deg, #fff 30%, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(6,182,212,0); }
      50%       { box-shadow: 0 0 40px rgba(6,182,212,.28); }
    }

    /* ── Scenario card ── */
    .scenario-card {
      width: 100%; max-width: 1100px;
      background: #13132b;
      border: 2px solid #1e1e42;
      border-radius: 22px;
      padding: 28px 30px;
      margin-bottom: 16px;
      position: relative; overflow: hidden;
      transition: border-color .4s;
      animation: fadeUp .5s .2s ease both;
      min-height: 220px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .scenario-card.rolling { border-color: #06b6d4; animation: flicker .13s infinite; }
    .scenario-card.landed  { border-color: #06b6d4; animation: pulseGlow 2.5s ease infinite; }
    .scenario-card::before {
      content: '🤝';
      position: absolute; font-size: 10rem; opacity: .025;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }

    /* Placeholder */

    /* Content */

    /* ── Redesigned card layout ── */
    .pt-cat {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(6,182,212,.12);
      border: 1px solid rgba(6,182,212,.28);
      color: #06b6d4;
      font-size: .82rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 20px;
      align-self: flex-start;
      margin-bottom: 22px;
    }
    .pt-block { margin-bottom: 20px; }
    .pt-lbl {
      font-size: .8rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 7px;
    }
    .pt-lbl-team  { color: #06b6d4; }
    .pt-lbl-sit   { color: #64748b; }
    .pt-lbl-judge { color: #c084fc; }
    .pt-team, .pt-sit, .pt-judge {
      font-size: clamp(1.3rem, 4vw, 1.75rem); font-weight: 800; color: #fff;
      line-height: 1.3;
    }
    .pt-divider { height: 1px; background: #1e1e42; margin: 4px 0 22px; }
    /* who the judge is, once the roles are dealt to the player cards */
    .pt-judge-name {
      display: inline-block; margin-top: 8px;
      background: rgba(192,132,252,.12); border: 1px solid rgba(192,132,252,.35); color: #e9d5ff;
      font-size: .82rem; font-weight: 800; letter-spacing: .5px;
      padding: 5px 14px; border-radius: 20px;
    }

    /* ── The judge's verdict, tapped on their own card ── */
    .verdict-banner {
      width: 100%; max-width: 1100px; margin: 16px auto 18px;
      border: 2px solid #1e1e42; border-radius: 14px; padding: 16px 18px;
      text-align: center; font-size: 1.05rem; font-weight: 800; color: #888;
      animation: fadeUp .3s ease both;
    }
    .verdict-banner.hidden { display: none; }
    .verdict-banner.yes { border-color: #22c55e; color: #22c55e; background: rgba(34,197,94,.08); }
    .verdict-banner.no  { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,.08); }

    /* theme overrides for new layout */

    /* ── Draw button ── */

    /* ── Counter ── */
    .sc-counter {
      width: 100%; max-width: 1100px;
      text-align: center; font-size: .8rem; color: #2a2a50;
      margin-top: 12px;
      animation: fadeUp .5s .35s ease both;
    }

    .round-badge span { color: #06b6d4; }

    @media (max-width: 520px) {
      .scenario-card { padding: 20px 18px; min-height: 160px; }
      .sc-placeholder { min-height: 120px; }
      .sc-placeholder .big-emoji { font-size: 2.3rem; }
    }

    /* ── Scenario browser ── */
    .filter-btn {
      border: 1.5px solid #35335e; border-radius: 20px;
      padding: 5px 14px; font-size: .8rem; font-weight: 700;
      color: #999; background: #1a1a38; cursor: pointer;
      transition: border-color .18s, color .18s, background .18s, transform .1s;
      font-family: inherit; white-space: nowrap;
    }
    .scenario-emoji { font-size: 1.3rem; flex-shrink: 0; line-height: 1; padding-top: 1px; }
    .scenario-text  { font-size: .88rem; font-weight: 500; color: #aaa; line-height: 1.4; }


  </style>
</head>
<body data-guide="persuade" data-guide-next="game">

  <div class="topbar">
    <a class="back" href="index.html?step=2" data-i18n="common.backToHub">← Back to Hub</a>
    <div class="round-badge"><span data-i18n="persuade.roundLabel">Round</span> <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🤝 Persuade Together!</h1>
  </div>

  <!-- Scenario card -->
  <div class="scenario-card" id="sc-card">
    <div class="sc-placeholder" id="sc-placeholder">
      <div class="big-emoji">🤝</div>
      <p id="draw-hint">Press <strong>Draw</strong> to reveal the scene</p>
    </div>
    <div class="sc-content" id="sc-content"></div>
  </div>

  <div class="verdict-banner hidden" id="verdict-banner"></div>

  <button class="btn-draw" id="draw-btn" onclick="draw()">🎲 Draw</button>
  <div class="sc-counter" id="sc-counter">10 scenarios</div>

  <!-- player cards: one player is dealt the judge, everyone else joins the team -->
  <div id="room-mount"></div>

  <div class="scenario-browser">
    <button class="scenario-browser-hdr" id="browser-hdr" onclick="toggleScenarioBrowser()"></button>
    <div class="scenario-browser-body hidden" id="scenario-browser-body">
      <div class="filter-bar" id="filter-bar"></div>
      <div class="scenario-list" id="scenario-list"></div>
    </div>
  </div>

  <!-- how-to-play briefing: shown first, hands over to the page below -->
  <script src="guide-data.js"></script>
  <script src="guide.js"></script>
  <script src="qrcode.js"></script>
  <script src="game-data.js"></script>
  <script src="game-render.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="room.js"></script>
  <script>
    GAME_RENDER.injectCSS();

    I18N.registerDict('persuade', {
      roundLabel: { zh: '回合', en: 'Round' },
      drawHint: { zh: '按下<strong>抽取</strong>揭曉場景', en: 'Press <strong>Draw</strong> to reveal the scene' },
      drawBtn: { zh: '🎲 抽取', en: '🎲 Draw' },
      redrawBtn: { zh: '🔁 重新抽取', en: '🔁 Redraw' },
      drawingText: { zh: '抽取中…', en: 'Drawing…' },
      scenarioFallback: { zh: '場景', en: 'Scenario' },
      teamLbl: { zh: '👥 你的隊伍扮演', en: '👥 Your Team Plays' },
      situationLbl: { zh: '🎯 情境', en: '🎯 The Situation' },
      judgeLbl: { zh: '👨‍⚖️ 裁判', en: '👨‍⚖️ The Judge' },
      playedBy: { zh: '🎴 由 {name} 扮演', en: '🎴 Played by {name}' },
      convinced: { zh: '✅ 被說服了', en: '✅ Convinced' },
      notConvinced: { zh: '❌ 沒被說服', en: '❌ Not convinced' },
      judgingWait: { zh: '👨‍⚖️ {who} 正在裁決 — 等待判決中…', en: '👨‍⚖️ {who} is judging — waiting for the verdict…' },
      convincedMsg: { zh: '✅ {who} 被說服了 — 隊伍獲勝！', en: '✅ {who} is convinced — the team wins!' },
      notConvincedMsg: { zh: '❌ {who} 沒被說服 — 下一輪加油！', en: '❌ {who} is not convinced — better luck next round!' },
      scenariosLeft: { zh: '剩下 {n} 個場景', en: '{n} scenarios left' },
      scenariosTotal: { zh: '共 {n} 個場景', en: '{n} scenarios' },
      browseBtn: { zh: '👁️ 瀏覽全部 {n} 個場景（暴雷 — 分享畫面時請勿開啟）', en: "👁️ Browse all {n} scenarios (spoilers — don't open while sharing)" },
      hideBtn: { zh: '🙈 收起場景清單', en: '🙈 Hide the scenario list' },
      allFilter: { zh: '全部', en: 'All' },
      // category labels — used in the filter bar and the scenario card's category chip.
      // The scenario content itself (team/situation/judge text in game-data.js) is never translated.
      '🏢 Workplace':      { zh: '🏢 職場',     en: '🏢 Workplace' },
      '🏫 School':         { zh: '🏫 學校',     en: '🏫 School' },
      '🏠 Family':         { zh: '🏠 家庭',     en: '🏠 Family' },
      '🏋️ Gym':            { zh: '🏋️ 健身房',   en: '🏋️ Gym' },
      '🏘️ Apartment':      { zh: '🏘️ 公寓社區', en: '🏘️ Apartment' },
      '✈️ Travel':         { zh: '✈️ 旅行',     en: '✈️ Travel' },
      '🍽️ Restaurant':     { zh: '🍽️ 餐廳',     en: '🍽️ Restaurant' },
      '⚽ Sports Team':    { zh: '⚽ 運動團隊',  en: '⚽ Sports Team' },
      '📚 Book Club':      { zh: '📚 讀書會',   en: '📚 Book Club' },
      '🎂 Birthday Party': { zh: '🎂 生日派對', en: '🎂 Birthday Party' },
    });
    const pt = (key, vars) => {
      let s = I18N.t('persuade', key);
      if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
      return s;
    };

    const scenarios = GAME_DATA.persuade;

    let round   = 0;
    let used    = [];
    let rolling = false;
    let judgeIdx = -1;  // which player was dealt the judge this round
    let voteId   = '';  // the judge's verdict carries this, so an old verdict can't linger

    ROOM.init({
      mount: 'room-mount',
      accent: '#06b6d4',
      hideSetup: true, // player count and links are set up once on index.html now
      linksNote: 'Each round one player is dealt the judge and everyone else joins the persuader team — their cards say which. The judge taps their verdict when the team is done.',
      onPlayerData: renderVerdict,
      onCountChange: () => { dealRoles(); },
      onNameChange: () => { ROOM.render(); renderVerdict(); },
    });

    ROOM.setDecorator(i => {
      if (judgeIdx !== i) return {};
      const v = verdict();
      return {
        marked: true,
        answer: pt('judgeLbl') + (v ? `<span class="la-sub">${v === 'yes' ? pt('convinced') : pt('notConvinced')}</span>` : ''),
      };
    });

    function verdict() {
      if (judgeIdx < 0) return null;
      const d = ROOM.answers[judgeIdx + 1];
      const v = d && d.vote;
      return v && voteId && v.id === voteId ? v.choice : null;
    }

    function renderVerdict() {
      const el = document.getElementById('verdict-banner');
      const v = verdict();
      el.classList.remove('yes', 'no');
      if (!ROOM.enabled || judgeIdx < 0) { el.classList.add('hidden'); return; }
      el.classList.remove('hidden');
      const who = ROOM.name(judgeIdx);
      if (!v) { el.textContent = pt('judgingWait', { who }); }
      else {
        el.classList.add(v === 'yes' ? 'yes' : 'no');
        el.textContent = v === 'yes' ? pt('convincedMsg', { who }) : pt('notConvincedMsg', { who });
      }
      ROOM.render();
    }
    I18N.onChange(() => renderVerdict());

    /* deal the roles: one random judge, everyone else on the team */
    function dealRoles() {
      if (!currentScenario) { renderVerdict(); return; }
      const sc = currentScenario;
      judgeIdx = ROOM.count ? Math.floor(Math.random() * ROOM.count) : -1;
      voteId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      ROOM.publish(i => ({
        game: 'persuade', round, voteId,
        isJudge: i === judgeIdx,
        judge: sc.judge, team: sc.team, situation: sc.situation,
      }));
      renderCard(sc);
      renderVerdict();
    }

    let currentScenario = null;

    function renderCard(sc) {
      currentScenario = sc;
      const ct = document.getElementById('sc-content');
      const dealt = ROOM.enabled && judgeIdx >= 0;
      ct.innerHTML = `
        <span class="pt-cat">${sc.emoji} ${sc.cat ? pt(sc.cat) : pt('scenarioFallback')}</span>
        <div class="pt-block">
          <div class="pt-lbl pt-lbl-team">${pt('teamLbl')}</div>
          <div class="pt-team">${sc.team}</div>
        </div>
        <div class="pt-divider"></div>
        <div class="pt-block">
          <div class="pt-lbl pt-lbl-sit">${pt('situationLbl')}</div>
          <div class="pt-sit">${sc.situation}</div>
        </div>
        <div class="pt-divider"></div>
        <div class="pt-block" style="margin-bottom:0">
          <div class="pt-lbl pt-lbl-judge">${pt('judgeLbl')}</div>
          <div class="pt-judge">${sc.judge}</div>
          ${dealt ? `<span class="pt-judge-name">${pt('playedBy', { name: ROOM.name(judgeIdx) })}</span>` : ''}
        </div>`;
      ct.classList.add('show');
    }
    I18N.onChange(() => { if (currentScenario) renderCard(currentScenario); });

    function updateCounter() {
      const left = scenarios.length - used.length;
      document.getElementById('sc-counter').textContent =
        left < scenarios.length ? pt('scenariosLeft', { n: left }) : pt('scenariosTotal', { n: scenarios.length });
    }
    I18N.onChange(() => updateCounter());

    /* ── Scenario browser: closed by default, since this screen is being shared and
       the full list would spoil every scenario before it's drawn ── */
    let activeCat = '';
    let loadedIdx = -1; // idx of the scenario-item currently highlighted as loaded, so a language toggle (which rebuilds the list) can restore it
    let browserOpen = false;
    function toggleScenarioBrowser() {
      browserOpen = !browserOpen;
      document.getElementById('scenario-browser-body').classList.toggle('hidden', !browserOpen);
      renderBrowserLabel();
    }
    function renderBrowserLabel() {
      document.getElementById('browser-hdr').textContent = browserOpen
        ? pt('hideBtn')
        : pt('browseBtn', { n: scenarios.length });
    }

    function filterBy(cat) {
      activeCat = cat;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
      document.querySelectorAll('.scenario-item').forEach(item => {
        item.style.display = (!cat || item.dataset.cat === cat) ? '' : 'none';
      });
    }

    function buildList() {
      const filterBar = document.getElementById('filter-bar');
      const list = document.getElementById('scenario-list');
      filterBar.innerHTML = '';
      list.innerHTML = '';
      activeCat = '';
      renderBrowserLabel();

      const cats = [];
      scenarios.forEach(sc => { if (sc.cat && !cats.includes(sc.cat)) cats.push(sc.cat); });

      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn active';
      allBtn.textContent = pt('allFilter');
      allBtn.dataset.cat = '';
      allBtn.addEventListener('click', () => filterBy(''));
      filterBar.appendChild(allBtn);

      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = pt(cat);
        btn.dataset.cat = cat;
        btn.addEventListener('click', () => filterBy(cat));
        filterBar.appendChild(btn);
      });

      scenarios.forEach((sc, i) => {
        const btn = document.createElement('button');
        btn.className = 'scenario-item';
        btn.dataset.idx = i;
        btn.dataset.cat = sc.cat || '';
        const preview = sc.situation.length > 80 ? sc.situation.slice(0, 78) + '…' : sc.situation;
        btn.innerHTML = `<span class="scenario-emoji">${sc.emoji}</span><span class="scenario-text">${preview}</span>`;
        btn.addEventListener('click', () => loadScenario(sc, i));
        list.appendChild(btn);
      });
    }
    buildList();
    I18N.onChange(() => {
      const prevCat = activeCat;
      buildList();
      if (prevCat) filterBy(prevCat);
      if (loadedIdx >= 0) {
        document.querySelectorAll('.scenario-item').forEach(el => {
          el.classList.toggle('active', +el.dataset.idx === loadedIdx);
        });
      }
    });

    function loadScenario(sc, idx) {
      const btn  = document.getElementById('draw-btn');
      const card = document.getElementById('sc-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      ph.style.display = 'none';
      card.classList.remove('rolling');
      card.classList.add('landed');
      renderCard(sc);
      round++;
      document.getElementById('roundNum').textContent = round;
      btn.textContent = pt('redrawBtn');
      used.push(idx);
      updateCounter();
      dealRoles();

      loadedIdx = idx;
      document.querySelectorAll('.scenario-item').forEach(el => {
        el.classList.toggle('active', +el.dataset.idx === idx);
      });
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function draw() {
      if (rolling) return;
      rolling = true;

      const btn  = document.getElementById('draw-btn');
      const card = document.getElementById('sc-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      btn.disabled = true;
      card.classList.remove('landed');
      card.classList.add('rolling');
      ph.style.display = 'none';
      ct.innerHTML = `<span class="gr-text" id="sc-roll-text">${pt('drawingText')}</span>`;
      ct.classList.add('show');

      let avail = scenarios.map((_, i) => i).filter(i => !used.includes(i));
      if (!avail.length) { used = []; avail = scenarios.map((_, i) => i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      used.push(fi);

      GAME_RENDER.drawTick(
        scenarios,
        tick => { document.getElementById('sc-roll-text').textContent = tick.situation; },
        () => {
          const sc = scenarios[fi];
          renderCard(sc);
          card.classList.remove('rolling');
          card.classList.add('landed');
          round++;
          document.getElementById('roundNum').textContent = round;
          btn.textContent = pt('redrawBtn');
          btn.disabled    = false;
          rolling         = false;
          updateCounter();
          dealRoles();
          loadedIdx = -1;
          document.querySelectorAll('.scenario-item').forEach(el => el.classList.remove('active'));
        },
        { count: 24, ms: 82 }
      );
    }

    updateCounter();

    /* the draw-hint paragraph and the Draw/Redraw button label aren't rebuilt by any
       other render function, so give them their own tiny sync + hook it to toggles */
    function syncStaticText() {
      document.getElementById('draw-hint').innerHTML = pt('drawHint');
      document.getElementById('draw-btn').textContent = round > 0 ? pt('redrawBtn') : pt('drawBtn');
    }
    syncStaticText();
    I18N.onChange(syncStaticText);
  </script>
</body>
</html>
