<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Persuade! · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Persuade!">
  <meta name="theme-color" content="#0d0d1a">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    :root {
      --accent: #06b6d4;
      --accent-rgb: 6,182,212;
      --card-emoji: '🤝';
    }
    :root.solo {
      --accent: #d946ef;
      --accent-rgb: 217,70,239;
      --card-emoji: '🎭';
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 72px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50%       { opacity: .55; }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(var(--accent-rgb),0); }
      50%       { box-shadow: 0 0 40px rgba(var(--accent-rgb),.28); }
    }

    /* ── Topbar ── */
    .topbar {
      width: 100%; max-width: 720px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 36px;
      animation: fadeUp .5s ease both;
      position: relative; z-index: 1;
    }
    a.back { color: #555; text-decoration: none; font-size: 14px; transition: color .2s; }
    a.back:hover { color: #eee; }
    .round-badge { font-size: 12px; color: #444; }
    .round-badge span { color: var(--accent); font-weight: 700; transition: color .3s; }

    /* ── Header ── */
    .header {
      text-align: center; margin-bottom: 24px;
      animation: fadeUp .5s .1s ease both;
      position: relative; z-index: 1;
    }
    .header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
      transition: background .3s;
    }
    .header p { color: #555; font-size: .93rem; transition: opacity .2s; }

    /* ── Mode Toggle ── */
    .mode-toggle {
      width: 100%; max-width: 720px;
      display: flex; gap: 8px;
      background: #13132b;
      border: 1px solid #1e1e42;
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 24px;
      animation: fadeUp .5s .15s ease both;
      position: relative; z-index: 1;
    }
    .mode-btn {
      flex: 1; padding: 11px 16px;
      border-radius: 10px; border: none;
      background: transparent; color: #444;
      cursor: pointer; font-weight: 700; font-size: .95rem;
      font-family: inherit;
      transition: background .25s, color .25s, transform .1s;
    }
    .mode-btn:hover:not(.active) { color: #888; }
    .mode-btn:active { transform: scale(.97); }
    .mode-btn.active {
      background: var(--accent);
      color: #0d0d1a;
    }

    /* ── Scenario card ── */
    .scenario-card {
      width: 100%; max-width: 720px;
      background: #13132b;
      border: 2px solid #1e1e42;
      border-radius: 22px;
      padding: 28px 30px;
      margin-bottom: 16px;
      position: relative; overflow: hidden;
      transition: border-color .4s;
      animation: fadeUp .5s .2s ease both;
      min-height: 200px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .scenario-card.rolling { border-color: var(--accent); animation: flicker .13s infinite; }
    .scenario-card.landed  { border-color: var(--accent); animation: pulseGlow 2.8s ease infinite; }
    .scenario-card::before {
      content: var(--card-emoji);
      position: absolute; font-size: 10rem; opacity: .025;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }

    /* Placeholder */
    .sc-placeholder {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; text-align: center;
      min-height: 160px;
    }
    .sc-placeholder .big-emoji { font-size: 3rem; }
    .sc-placeholder p { color: #333; font-size: .95rem; }

    /* Content */
    .sc-content { display: none; flex-direction: column; gap: 18px; }
    .sc-content.show { display: flex; }

    .sc-field { display: flex; flex-direction: column; gap: 5px; }
    .sc-label {
      font-size: .72rem; text-transform: uppercase;
      letter-spacing: .13em; color: var(--accent); font-weight: 700;
      transition: color .3s;
    }
    .sc-role      { font-size: 1.95rem; font-weight: 700; color: #eee; line-height: 1.3; }
    .sc-situation { font-size: 1.95rem; color: #ccc; line-height: 1.5; }
    .sc-judge     { font-size: 1.95rem; font-weight: 700; color: #eee; }
    .sc-divider   { height: 1px; background: #1e1e42; }

    /* ── Draw button ── */
    .btn-draw {
      width: 100%; max-width: 720px;
      background: #13132b; color: var(--accent); border: 2px solid var(--accent);
      border-radius: 14px; padding: 16px;
      font-size: 1.05rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s, color .3s, border-color .3s, transform .1s;
      animation: fadeUp .5s .3s ease both;
      position: relative; z-index: 1;
    }
    .btn-draw:hover { background: rgba(var(--accent-rgb),.1); }
    .btn-draw:active { transform: scale(.98); }
    .btn-draw:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Scenario counter ── */
    .scenario-counter {
      width: 100%; max-width: 720px;
      text-align: center;
      font-size: .8rem; color: #2a2a50;
      margin-top: 12px;
      animation: fadeUp .5s .35s ease both;
    }
  </style>
</head>

      { judge:'Mom & Dad', emoji:'🎆',
        role:'Kids who want to stay up for New Year\'s',
        situation:'All the children want to stay up past midnight to celebrate New Year\'s Eve. Convince the parents this is a once-a-year event and everyone will survive the next day.' },
      { judge:'Mom & Dad', emoji:'🚗',
        role:'Kids who want a spontaneous road trip',
        situation:'All the children want to skip school on Friday for a spontaneous 3-day road trip. Convince your parents it will be the best family memory ever made.' },
      { judge:'Grandparents', emoji:'🏕️',
        role:'Family members who want to go camping',
        situation:'The whole family wants to go camping in the forest instead of the usual formal dinner at a fancy restaurant. Convince the grandparents this will be a much more fun tradition.' },
      { judge:'Mom & Dad', emoji:'📺',
        role:'Kids who want a bigger TV',
        situation:'Everyone in the house wants to replace the old small TV with a massive smart TV. Convince your parents it is a worthwhile investment for the whole family.' },
      { judge:'Mom & Dad', emoji:'📱',
        role:'Siblings who all want smartphones',
        situation:'All the siblings feel they are the only kids without a smartphone. Convince your parents that having phones is necessary, safe, and completely manageable with rules.' },
      // Friends / Social
      { judge:'One reluctant friend', emoji:'🤷',
        role:'Friends who need everyone on the trip',
        situation:'Your whole friend group has planned a trip, but one person keeps saying no. Convince them to come — you genuinely need everyone there to make it perfect.' },
      { judge:'The friend who planned everything', emoji:'🗓️',
        role:'Group members who want to change the destination',
        situation:'The group originally planned to go to the mountains, but almost everyone now wants to go to the beach instead. Convince the trip organiser to change the plan.' },
      { judge:'One friend who wants to leave early', emoji:'🌙',
        role:'Friends who want to keep the party going',
        situation:'It is only 9pm and one friend is already suggesting everyone go home. Convince them to stay at least two more hours — the fun is just getting started.' },
      { judge:'The one friend who always refuses karaoke', emoji:'🎤',
        role:'Friends who love karaoke',
        situation:'Everyone wants to go to karaoke but one person refuses every single time. Convince them that this time will be completely different — and they will actually enjoy it.' },
      { judge:'The most skeptical friend', emoji:'💪',
        role:'Friends on a fitness mission',
        situation:'The whole group wants to start a 30-day fitness challenge together. Convince the most skeptical friend that it will be fun, achievable, and worth it for everyone.' },
      { judge:'The most hesitant friend', emoji:'🐛',
        role:'The adventurous group who wants to try insect cuisine',
        situation:'Your group has found an amazing restaurant that only serves insect-based dishes. Convince the most hesitant friend to give it a fair try — it might change their life.' },
      { judge:'The friend who planned the house party', emoji:'🏕️',
        role:'Friends who want to go camping instead',
        situation:'Your friend worked hard to organise a house party, but the rest of the group now wants to go camping in the woods instead. Convince the organiser to change the plan.' },
      { judge:'The shyest member of the group', emoji:'🎸',
        role:'Friends who want to start a band',
        situation:'Your friend group has decided to start a band and perform at the school talent show. Convince the shyest member to be the lead singer — the whole band needs their voice.' },
      // Sports
      { judge:'Coach', emoji:'🏆',
        role:'Players who want a lighter training schedule',
        situation:'The whole team thinks training six days a week is too intense and people are getting injured. Convince the coach to reduce it to four days without losing performance.' },
      { judge:'Referee', emoji:'🟨',
        role:'Players who disagree with a call',
        situation:'Your team believes the referee made a wrong call that could cost you the game. Convince the referee to reconsider the decision before the final whistle.' },
      { judge:'Coach / Sponsor', emoji:'👕',
        role:'Players who want to design their own jersey',
        situation:'The whole team is tired of the boring standard jersey. Convince the coach and sponsor to let the players design a unique team jersey for the next season.' },
      { judge:'Team Captain', emoji:'🥂',
        role:'Players who want a fancy end-of-season party',
        situation:'The whole squad wants to celebrate the end of the season at a five-star rooftop restaurant instead of the usual pub. Convince the team captain to upgrade the plan.' },
      // Consumer / Travel
      { judge:'Restaurant Manager', emoji:'🍽️',
        role:'A group of diners who had a terrible experience',
        situation:'Your entire table received cold food, waited over an hour, and experienced rude service. Convince the restaurant manager to give your whole group a full refund.' },
      { judge:'Hotel Manager', emoji:'🏨',
        role:'A group of guests who arrived to problems',
        situation:'Your group booked three rooms but they were not ready on arrival — two hours late with no apology. Convince the hotel manager to upgrade everyone to suites at no extra cost.' },
      { judge:'Airline Customer Service', emoji:'✈️',
        role:'Passengers who missed a connecting flight',
        situation:'Your whole group missed a connecting flight because of the airline\'s own delay. Convince customer service to rebook everyone for free and provide a meal voucher.' },
      { judge:'Museum Tour Coordinator', emoji:'🏛️',
        role:'A group desperate to see a special exhibition',
        situation:'The special exhibition at the museum is fully booked for two months. Convince the tour coordinator to squeeze your group in for a private after-hours visit.' },
      { judge:'Event Manager', emoji:'🎪',
        role:'A group of passionate fans',
        situation:'The music festival has sold out and your group is standing outside. Convince the event manager that letting your group in will only make the atmosphere better for everyone.' },
      { judge:'City Planner', emoji:'🌳',
        role:'Residents who want a park instead of a parking lot',
        situation:'The city plans to build a large parking lot in the middle of your neighbourhood. Convince the city planner to turn the space into a green park with trees and benches instead.' },
    ];

    let currentMode = 'team';
    let round = 0;
    let used  = [];
    let rolling = false;

    function setMode(m) {
      if (m === currentMode) return;
      currentMode = m;
      round = 0;
      used  = [];
      rolling = false;

      document.getElementById('round-num').textContent = '0';
      document.getElementById('draw-btn').textContent  = '🎲 Draw';
      document.getElementById('draw-btn').disabled     = false;

      const card = document.getElementById('sc-card');
      card.classList.remove('rolling','landed');

      const ph = document.getElementById('sc-placeholder');
      const ct = document.getElementById('sc-content');
      ph.style.display = '';
      ct.classList.remove('show');

      const html = document.documentElement;

      if (m === 'solo') {
        html.classList.add('solo');
        document.getElementById('btn-solo').classList.add('active');
        document.getElementById('btn-team').classList.remove('active');
        document.getElementById('page-title').textContent   = '🎭 Persuade!';
        document.getElementById('page-sub').textContent     = 'Take turns — one at a time, convince the judge!';
        document.getElementById('ph-emoji').textContent     = '🎭';
        document.getElementById('role-label').textContent   = '🗣️ Persuader Plays';
        document.getElementById('judge-label').textContent  = '👨‍⚖️ Judge\'s Role';
      } else {
        html.classList.remove('solo');
        document.getElementById('btn-team').classList.add('active');
        document.getElementById('btn-solo').classList.remove('active');
        document.getElementById('page-title').textContent   = '🤝 Persuade!';
        document.getElementById('page-sub').textContent     = 'One judge, everyone else teams up — convince them together!';
        document.getElementById('ph-emoji').textContent     = '🤝';
        document.getElementById('role-label').textContent   = '👥 Your Team Plays';
        document.getElementById('judge-label').textContent  = '👨‍⚖️ The Judge';
      }

      updateCounter();
    }

    function updateCounter() {
      const pool  = currentMode === 'solo' ? soloScenarios : teamScenarios;
      const left  = pool.length - used.length;
      document.getElementById('sc-counter').textContent =
        left < pool.length ? left + ' scenarios left' : pool.length + ' scenarios';
    }

    function draw() {
      if (rolling) return;
      rolling = true;

      const pool = currentMode === 'solo' ? soloScenarios : teamScenarios;
      const btn  = document.getElementById('draw-btn');
      const card = document.getElementById('sc-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      btn.disabled = true;
      card.classList.remove('landed');
      card.classList.add('rolling');
      ph.style.display = 'none';
      ct.classList.add('show');

      let avail = pool.map((_,i) => i).filter(i => !used.includes(i));
      if (!avail.length) { used = []; avail = pool.map((_,i) => i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      used.push(fi);

      let ticks = 0;
      const iv = setInterval(() => {
        const tmp = pool[Math.floor(Math.random() * pool.length)];
        document.getElementById('sc-role').textContent      = tmp.role;
        document.getElementById('sc-situation').textContent = tmp.situation;
        document.getElementById('sc-judge').textContent     = tmp.emoji + ' ' + tmp.judge;
        if (++ticks >= 24) {
          clearInterval(iv);
          const sc = pool[fi];
          document.getElementById('sc-role').textContent      = sc.role;
          document.getElementById('sc-situation').textContent = sc.situation;
          document.getElementById('sc-judge').textContent     = sc.emoji + ' ' + sc.judge;
          card.classList.remove('rolling');
          card.classList.add('landed');
          round++;
          document.getElementById('round-num').textContent = round;
          btn.textContent = '🔁 Redraw';
          btn.disabled    = false;
          rolling         = false;
          updateCounter();
        }
      }, 82);
    }

    updateCounter();
  </script>
