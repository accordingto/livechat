<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Story Teller</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(72px, calc(env(safe-area-inset-bottom) + 24px)) max(20px, env(safe-area-inset-left));
      position: relative;
      overflow-x: hidden;
    }

    /* ── Fade-up entrance animation ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .topbar {
      width: 100%; max-width: 900px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 36px;
      position: relative; z-index: 1;
      animation: fadeUp .5s ease both;
      animation-delay: 0s;
    }
    a.back { color: #555; text-decoration: none; font-size: 14px; transition: color .2s; }
    a.back:hover { color: #eee; }
    .round-badge { font-size: 12px; color: #444; }
    .round-badge span { color: #f59e0b; font-weight: 700; }

    .header {
      text-align: center; margin-bottom: 28px;
      position: relative; z-index: 1;
      animation: fadeUp .5s ease both;
      animation-delay: .1s;
    }
    .header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #f59e0b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .header p { color: #666; font-size: .93rem; }


    /* ── Three cards ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%; max-width: 900px;
      margin-bottom: 36px;
      position: relative; z-index: 1;
      animation: fadeUp .5s ease both;
      animation-delay: .2s;
    }
    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
    }

    .card {
      border: 2px solid #1e1e42;
      border-radius: 20px;
      padding: 28px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      min-height: 180px;
      justify-content: center;
      position: relative;
      transition: border-color .4s, transform .3s, box-shadow .4s;
    }

    /* ── Card gradients per type ── */
    .card-char   { background: linear-gradient(160deg, #1a1400 0%, #13132b 100%); }
    .card-action { background: linear-gradient(160deg, #110d1a 0%, #13132b 100%); }
    .card-place  { background: linear-gradient(160deg, #001a0d 0%, #13132b 100%); }

    /* ── Card watermarks ── */
    .card::before {
      position: absolute;
      font-size: 10rem;
      opacity: .03;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      -webkit-text-fill-color: initial;
    }
    .card-char::before   { content: '👤'; }
    .card-action::before { content: '⚡'; }
    .card-place::before  { content: '📍'; }

    /* ── Active card glows per type ── */
    .card-char.active {
      box-shadow: 0 0 40px rgba(245,158,11,.2), inset 0 0 30px rgba(245,158,11,.04);
      border-color: #f59e0b;
      transform: translateY(-4px);
    }
    .card-action.active {
      box-shadow: 0 0 40px rgba(129,140,248,.2), inset 0 0 30px rgba(129,140,248,.04);
      border-color: #818cf8;
      transform: translateY(-4px);
    }
    .card-place.active {
      box-shadow: 0 0 40px rgba(52,211,153,.2), inset 0 0 30px rgba(52,211,153,.04);
      border-color: #34d399;
      transform: translateY(-4px);
    }

    /* ── Card hover (non-active) ── */
    .card:hover:not(.active) { transform: translateY(-3px); }

    .card-label {
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #0d0d1a;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 16px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }

    .card-icon { font-size: 2.2rem; line-height: 1; }

    .card-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.5;
      text-align: center;
      color: #eee;
      min-height: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-text.placeholder { color: #2a2a50; font-weight: 400; }

    .card-char   { --accent: #f59e0b; } /* amber  */
    .card-action { --accent: #818cf8; } /* purple */
    .card-place  { --accent: #34d399; } /* green  */

    @keyframes roll {
      0%   { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .card.rolling .card-text { animation: roll .1s ease infinite alternate; }

    /* ── Status bar ── */
    @keyframes statusPop {
      from { opacity: 0; transform: scale(.95); }
      to   { opacity: 1; transform: scale(1); }
    }
    .status {
      width: 100%; max-width: 900px;
      text-align: center;
      font-size: .95rem;
      color: #555;
      margin-bottom: 32px;
      min-height: 1.4em;
      transition: color .3s;
      position: relative; z-index: 1;
      animation: fadeUp .5s ease both;
      animation-delay: .3s;
    }
    .status.ready {
      color: #f59e0b;
      font-weight: 600;
      animation: statusPop .3s ease both;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
      position: relative; z-index: 1;
      animation: fadeUp .5s ease both;
      animation-delay: .4s;
    }
    .btn {
      border: none; border-radius: 999px; padding: 16px 44px;
      font-size: 1rem; font-weight: 800; cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s, opacity .2s, box-shadow .2s; letter-spacing: .3px;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-draw {
      background: #f59e0b;
      color: #0d0d1a;
      box-shadow: 0 4px 24px rgba(245,158,11,.35);
    }
    .btn-draw:hover:not(:disabled) {
      background: #fbbf24;
      box-shadow: 0 4px 24px rgba(245,158,11,.55);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>📖 Story Teller</h1>
    <p>Draw a character, an action, and a location — then tell your story!</p>
  </div>


  <div class="cards">
    <div class="card card-char" id="cardChar">
      <span class="card-label">👤 Character</span>
      <span class="card-icon">🧑</span>
      <span class="card-text placeholder" id="textChar">Waiting…</span>
    </div>
    <div class="card card-action" id="cardAction">
      <span class="card-label">⚡ Action</span>
      <span class="card-icon">🎬</span>
      <span class="card-text placeholder" id="textAction">Waiting…</span>
    </div>
    <div class="card card-place" id="cardPlace">
      <span class="card-label">📍 Location</span>
      <span class="card-icon">🗺️</span>
      <span class="card-text placeholder" id="textPlace">Waiting…</span>
    </div>
  </div>

  <div class="status" id="status">Press Draw to get your story ingredients</div>

  <div class="btn-row">
    <button class="btn btn-draw" id="drawBtn" onclick="draw()">🎲 Draw!</button>
  </div>

  <script>
    const characters = [
      "a lost tourist",
      "a nervous student",
      "a tired teacher",
      "a friendly taxi driver",
      "a noisy neighbour",
      "a confused chef",
      "a shy singer",
      "a clumsy waiter",
      "a bossy coach",
      "a forgetful doctor",
      "a brave firefighter",
      "a lazy security guard",
      "a curious little kid",
      "a grumpy old man",
      "a cheerful delivery driver",
      "a helpful stranger",
      "a street musician",
      "a very tall basketball player",
      "a sleepy librarian",
      "an overexcited tour guide",
      "a grandma who loves video games",
      "a proud dad taking too many photos",
      "a nervous bride on her wedding day",
      "a first-day employee at a new job",
      "a very loud sports fan",
      "a bored office worker",
      "a kind old lady with too many bags",
      "a teenage boy trying to look cool",
      "an excited kid on a school trip",
      "a man who has not slept in two days",
      "a very competitive runner",
      "a stressed mother with three young kids",
      "a teenager who just failed their driving test",
      "a retired teacher on holiday",
      "a very shy person on a first date",
    ];

    const actions = [
      "finds a bag full of cash on the floor",
      "gets completely lost and asks five different people for help",
      "accidentally breaks something very expensive",
      "misses the last bus home",
      "finds a lost dog on the street",
      "bumps into an old friend they haven't seen in years",
      "wins a surprise prize they never signed up for",
      "forgets someone's name at the worst possible moment",
      "drops their phone into water",
      "gets on the wrong train and ends up in the wrong place",
      "gets soaked in a sudden heavy rainstorm",
      "is mistaken for a famous person",
      "accidentally orders the wrong food in the wrong language",
      "gets stuck in an elevator with a complete stranger",
      "loses their wallet and has no money at all",
      "sends a private message to completely the wrong person",
      "shows up at a party at the totally wrong address",
      "gets locked out of their house at midnight",
      "burns dinner right before the guests arrive",
      "calls someone by the wrong name all day long",
      "picks up someone else's shopping bag by mistake",
      "falls asleep somewhere very embarrassing in public",
      "drops their ice cream on a stranger's shoes",
      "trips and falls in front of a large crowd",
      "walks into the wrong room during a very important meeting",
      "gets hiccups right before giving a big speech",
      "arrives very late and tries to pretend they were there the whole time",
      "signs up for the completely wrong class by mistake",
      "wins an argument but immediately feels terrible about it",
      "runs into their ex at the most awkward possible moment",
      "tries to pay for something and their card is rejected",
      "spills a full drink on a stranger",
      "sends a voice message instead of a regular text by mistake",
      "gives totally wrong directions to someone who needed help",
      "sits down at the wrong table and eats someone else's food",
    ];

    const locations = [
      "at a busy supermarket",
      "in a coffee shop",
      "on a crowded bus",
      "at a birthday party",
      "in a school classroom",
      "at a shopping mall",
      "at a train station",
      "in an elevator",
      "at a hospital waiting room",
      "on a beach",
      "in a park",
      "at an airport",
      "in a library",
      "at a wedding",
      "in a gym",
      "on an airplane",
      "at a cinema",
      "in a hotel lobby",
      "at a job interview",
      "at a street market",
      "at a sports stadium",
      "at a music concert",
      "in a taxi",
      "in a dentist's waiting room",
      "at a karaoke bar",
      "at a fancy restaurant",
      "inside a bakery",
      "at a theme park",
      "on a first date",
      "at a convenience store late at night",
      "at a bus stop in the rain",
      "in a pharmacy",
      "at a food court",
      "at a car wash",
      "in a crowded car park",
    ];

    let rolling = false, round = 0;
    function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function setCard(id, text, isPlaceholder) {
      const el = document.getElementById(id);
      el.className = isPlaceholder ? 'card-text placeholder' : 'card-text';
      el.textContent = text;
    }

    function draw() {
      if (rolling) return;
      rolling = true;

      document.getElementById('drawBtn').disabled = true;
      document.getElementById('status').className = 'status';
      document.getElementById('status').textContent = 'Drawing…';

      const finalChar   = rand(characters);
      const finalAction = rand(actions);
      const finalPlace  = rand(locations);

      const pools   = [characters, actions, locations];
      const textIds = ['textChar', 'textAction', 'textPlace'];
      const finals  = [finalChar, finalAction, finalPlace];
      const cardIds = ['cardChar', 'cardAction', 'cardPlace'];

      cardIds.forEach(id => {
        document.getElementById(id).classList.add('rolling');
        document.getElementById(id).classList.remove('active');
      });

      let ticks = 0;
      const iv = setInterval(() => {
        textIds.forEach((tid, i) => setCard(tid, rand(pools[i]), false));
        ticks++;
        if (ticks >= 28) {
          clearInterval(iv);
          finals.forEach((val, i) => {
            setTimeout(() => {
              setCard(textIds[i], val, false);
              document.getElementById(cardIds[i]).classList.remove('rolling');
              document.getElementById(cardIds[i]).classList.add('active');
              if (i === 2) {
                round++;
                document.getElementById('roundNum').textContent = round;
                const st = document.getElementById('status');
                st.textContent = '✨ Now tell your story using all three!';
                st.className = 'status ready';
                document.getElementById('drawBtn').disabled = false;
                rolling = false;
              }
            }, i * 200);
          });
        }
      }, 80);
    }
  </script>

</body>
</html>
