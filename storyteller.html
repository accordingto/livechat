<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('ib-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
  <script src="theme.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Story Teller · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Story Teller">
  <meta name="theme-color" content="#0d0d1a">
  <link rel="stylesheet" href="shared.css">
  <style>
    .header h1 { background: linear-gradient(135deg, #fff 30%, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    /* ── Three cards ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%; max-width: 1100px;
      margin-bottom: 36px;
      position: relative; z-index: 1;
      animation: fadeUp .5s ease both;
      animation-delay: .2s;
    }

    .card {
      border: 2px solid #1e1e42;
      border-radius: 20px;
      padding: 28px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      min-height: 180px;
      justify-content: center;
      position: relative;
      transition: border-color .4s, transform .3s, box-shadow .4s;
    }

    /* ── Card gradients per type ── */
    .card-char   { background: linear-gradient(160deg, #1a1400 0%, #13132b 100%); }
    .card-action { background: linear-gradient(160deg, #110d1a 0%, #13132b 100%); }
    .card-place  { background: linear-gradient(160deg, #001a0d 0%, #13132b 100%); }

    /* ── Card watermarks ── */
    .card::before {
      position: absolute;
      font-size: 10rem;
      opacity: .03;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      -webkit-text-fill-color: initial;
    }
    .card-char::before   { content: '👤'; }
    .card-action::before { content: '⚡'; }
    .card-place::before  { content: '📍'; }

    /* ── Active card glows per type ── */
    .card-char.active {
      box-shadow: 0 0 40px rgba(245,158,11,.2), inset 0 0 30px rgba(245,158,11,.04);
      border-color: #f59e0b;
      transform: translateY(-4px);
    }
    .card-action.active {
      box-shadow: 0 0 40px rgba(129,140,248,.2), inset 0 0 30px rgba(129,140,248,.04);
      border-color: #818cf8;
      transform: translateY(-4px);
    }
    .card-place.active {
      box-shadow: 0 0 40px rgba(52,211,153,.2), inset 0 0 30px rgba(52,211,153,.04);
      border-color: #34d399;
      transform: translateY(-4px);
    }

    /* ── Card hover (non-active) ── */
    .card:hover:not(.active) { transform: translateY(-3px); }

    .card-label {
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #0d0d1a;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 16px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }

    .card-icon { font-size: 2.2rem; line-height: 1; }

    .card-text {
      font-size: clamp(1.25rem, 3vw, 1.55rem);
      font-weight: 600;
      line-height: 1.5;
      text-align: center;
      color: #eee;
      min-height: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-text.placeholder { color: #2a2a50; font-weight: 400; }

    .card-char   { --accent: #f59e0b; } /* amber  */
    .card-action { --accent: #818cf8; } /* purple */
    .card-place  { --accent: #34d399; } /* green  */

    @keyframes roll {
      0%   { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .card.rolling .card-text { animation: roll .1s ease infinite alternate; }

    /* ── Status bar ── */
    @keyframes statusPop {
      from { opacity: 0; transform: scale(.95); }
      to   { opacity: 1; transform: scale(1); }
    }
    .status {
      width: 100%; max-width: 1100px;
      text-align: center;
      font-size: .95rem;
      color: #555;
      margin-bottom: 32px;
      min-height: 1.4em;
      transition: color .3s;
      position: relative; z-index: 1;
      animation: fadeUp .5s ease both;
      animation-delay: .3s;
    }
    .status.ready {
      color: #f59e0b;
      font-weight: 600;
      animation: statusPop .3s ease both;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
      position: relative; z-index: 1;
      animation: fadeUp .5s ease both;
      animation-delay: .4s;
    }
    .btn {
      border: none; border-radius: 999px; padding: 16px 48px;
      font-size: 1rem; font-weight: 800; cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s, opacity .2s, box-shadow .2s; letter-spacing: .3px;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-draw {
      background: #f59e0b;
      color: #0d0d1a;
      box-shadow: 0 4px 24px rgba(245,158,11,.35);
    }
    .btn-draw:hover:not(:disabled) {
      background: #fbbf24;
      box-shadow: 0 4px 24px rgba(245,158,11,.55);
      transform: translateY(-2px);
    }

    .round-badge span { color: #f59e0b; }

    @media (max-width: 640px) {
      .cards { grid-template-columns: 1fr; }
      .card { padding: 22px 16px 18px; min-height: 140px; }
    }
    @media (max-width: 480px) {
      .btn { padding: 14px 32px; }
    }

    /* ── Soft theme ── */
    [data-theme="soft"] .card {
      background: var(--surface);
      border-color: var(--border);
      box-shadow: 0 4px 16px rgba(100,60,20,.08);
    }
    [data-theme="soft"] .card-char   { background: linear-gradient(160deg, #fffbeb, var(--surface)); }
    [data-theme="soft"] .card-action { background: linear-gradient(160deg, #f5f3ff, var(--surface)); }
    [data-theme="soft"] .card-place  { background: linear-gradient(160deg, #ecfdf5, var(--surface)); }
    [data-theme="soft"] .card-text { color: var(--text); }
    [data-theme="soft"] .card-text.placeholder { color: var(--text-faint); }
    [data-theme="soft"] .card-label { color: #1a0a00; }
    [data-theme="soft"] .status { color: var(--text-muted); }
    [data-theme="soft"] .status.ready { color: #d97706; }
    [data-theme="sunset"] .card { background: linear-gradient(160deg, var(--surface) 0%, var(--surface-b) 100%); border-color: var(--border); }
    [data-theme="sunset"] .card-char   { background: linear-gradient(160deg, #2e1a10, var(--surface)); }
    [data-theme="sunset"] .card-action { background: linear-gradient(160deg, #2a1040, var(--surface)); }
    [data-theme="sunset"] .card-place  { background: linear-gradient(160deg, #1a1a40, var(--surface)); }
    [data-theme="sunset"] .card-text { color: var(--text); }
    [data-theme="sunset"] .card-text.placeholder { color: var(--text-faint); }
    [data-theme="sunset"] .card-label { color: #0d0000; }
    [data-theme="sunset"] .status { color: var(--text-muted); }
    [data-theme="sunset"] .status.ready { color: #ff8040; }
    [data-theme="forest"] .card { background: linear-gradient(160deg, var(--surface) 0%, var(--surface-b) 100%); border-color: var(--border); }
    [data-theme="forest"] .card-char   { background: linear-gradient(160deg, #1a1a08, var(--surface)); }
    [data-theme="forest"] .card-action { background: linear-gradient(160deg, #0a1818, var(--surface)); }
    [data-theme="forest"] .card-place  { background: linear-gradient(160deg, #081808, var(--surface)); }
    [data-theme="forest"] .card-text { color: var(--text); }
    [data-theme="forest"] .card-text.placeholder { color: var(--text-faint); }
    [data-theme="forest"] .card-label { color: #000e00; }
    [data-theme="forest"] .status { color: var(--text-muted); }
    [data-theme="forest"] .status.ready { color: #4ade80; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>📖 Story Teller</h1>
    <p>Draw a character, an action, and a location — then tell your story!</p>
  </div>


  <div class="cards" id="cards">
    <div class="card card-char" id="cardChar">
      <span class="card-label">👤 Character</span>
      <span class="card-icon">🧑</span>
      <span class="card-text placeholder" id="textChar">Waiting…</span>
    </div>
    <div class="card card-action" id="cardAction">
      <span class="card-label">⚡ Action</span>
      <span class="card-icon">🎬</span>
      <span class="card-text placeholder" id="textAction">Waiting…</span>
    </div>
    <div class="card card-place" id="cardPlace">
      <span class="card-label">📍 Location</span>
      <span class="card-icon">🗺️</span>
      <span class="card-text placeholder" id="textPlace">Waiting…</span>
    </div>
  </div>

  <div class="status" id="status">Press Draw to get your story ingredients</div>

  <div class="btn-row">
    <button class="btn btn-draw" id="drawBtn" onclick="draw()">🎲 Draw!</button>
  </div>

  <script src="supabase-config.js"></script>
  <script src="rating.js"></script>
  <script src="game-data.js"></script>
  <script src="game-loader.js"></script>
  <script src="game-render.js"></script>
  <script>
    GAME_RENDER.injectCSS();
    GAME_RATING.init('storyteller');
    let characters = GAME_DATA.storyteller.characters;
    let actions    = GAME_DATA.storyteller.actions;
    let locations  = GAME_DATA.storyteller.locations;
    GAME_LOADER.init('storyteller').then(d => { if (d) { characters = d.characters; actions = d.actions; locations = d.locations; } });

    let rolling = false, round = 0;
    function rand(arr) { const i = Math.floor(Math.random() * arr.length); return { item: arr[i], idx: i }; }

    function setCard(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    }

    function resetCards() {
      document.getElementById('cards').innerHTML = `
        <div class="card card-char" id="cardChar">
          <span class="card-label">👤 Character</span>
          <span class="card-icon">🧑</span>
          <span class="card-text" id="textChar">Drawing…</span>
        </div>
        <div class="card card-action" id="cardAction">
          <span class="card-label">⚡ Action</span>
          <span class="card-icon">🎬</span>
          <span class="card-text" id="textAction">Drawing…</span>
        </div>
        <div class="card card-place" id="cardPlace">
          <span class="card-label">📍 Location</span>
          <span class="card-icon">🗺️</span>
          <span class="card-text" id="textPlace">Drawing…</span>
        </div>`;
    }

    function draw() {
      if (rolling) return;
      rolling = true;
      GAME_RATING.hide();

      document.getElementById('drawBtn').disabled = true;
      document.getElementById('status').className = 'status';
      document.getElementById('status').textContent = 'Drawing…';

      resetCards();

      const charResult   = rand(characters);
      const actionResult = rand(actions);
      const placeResult  = rand(locations);
      const finalChar   = charResult.item;
      const finalAction = actionResult.item;
      const finalPlace  = placeResult.item;

      const pools   = [characters, actions, locations];
      const textIds = ['textChar', 'textAction', 'textPlace'];
      const cardIds = ['cardChar', 'cardAction', 'cardPlace'];

      cardIds.forEach(id => document.getElementById(id).classList.add('rolling'));

      GAME_RENDER.drawTick(
        characters,
        () => { textIds.forEach((tid, i) => setCard(tid, rand(pools[i]).item)); },
        () => {
          GAME_RENDER.storyteller(document.getElementById('cards'), finalChar, finalAction, finalPlace);
          round++;
          document.getElementById('roundNum').textContent = round;
          const st = document.getElementById('status');
          st.textContent = '✨ Now tell your story using all three!';
          st.className = 'status ready';
          document.getElementById('drawBtn').disabled = false;
          rolling = false;
          GAME_RATING.showFor(GAME_RATING.hash(finalChar) + '-' + GAME_RATING.hash(finalAction) + '-' + GAME_RATING.hash(finalPlace));
        },
        { count: 28, ms: 80 }
      );
    }
  </script>

</body>
</html>
