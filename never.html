<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Never Have I Ever</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .header h1 { background: linear-gradient(135deg, #fff 30%, #4f9eff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .header p { color: #666; }
    .card-wrap {
      width: 100%; max-width: 580px;
      margin-bottom: 32px;
      position: relative; z-index: 1;
      animation: fadeUp .5s .2s ease both;
    }

    .card {
      background: linear-gradient(160deg, #13132b 0%, #0f0f24 100%);
      border: 2px solid #1e1e50;
      border-radius: 24px;
      padding: 52px 36px;
      text-align: center;
      min-height: 220px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      transition: border-color .4s, box-shadow .4s;
      position: relative; overflow: hidden;
    }
    .card::before {
      content: '🙋';
      position: absolute;
      font-size: 14rem; line-height: 1;
      opacity: .025;
      pointer-events: none;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      -webkit-text-fill-color: initial;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 48px rgba(79,158,255,.18), inset 0 0 48px rgba(79,158,255,.04); }
      50%       { box-shadow: 0 0 72px rgba(79,158,255,.35), inset 0 0 64px rgba(79,158,255,.08); }
    }
    .card.active {
      border-color: #4f9eff;
      animation: pulse-glow 2.5s ease-in-out infinite;
    }

    .card .prefix {
      font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
      color: #4f9eff; font-weight: 700; position: relative; z-index: 1;
    }
    .card .statement {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-weight: 700; line-height: 1.55;
      min-height: 3em; display: flex; align-items: center;
      position: relative; z-index: 1;
    }
    .card .placeholder { color: #2a2a50; font-weight: 400; font-size: 1rem; }

    @keyframes ripple { from { transform: scale(0); opacity: .4; } to { transform: scale(4); opacity: 0; } }
    .ripple-el {
      position: absolute; width: 120px; height: 120px; border-radius: 50%;
      background: #4f9eff; animation: ripple .65s ease-out forwards; pointer-events: none;
    }
    .card.rolling .statement { animation: flicker .12s linear infinite; }

    .reactions {
      display: flex; gap: 14px; margin-bottom: 36px;
      flex-wrap: wrap; justify-content: center;
      position: relative; z-index: 1;
      animation: fadeUp .5s .3s ease both;
    }
    .react-btn {
      background: linear-gradient(160deg, #13132b 0%, #0f0f24 100%);
      border: 1.5px solid #1e1e50;
      border-radius: 20px;
      padding: 18px 22px;
      font-size: 1rem; cursor: pointer; color: #eee;
      font-family: inherit;
      transition: background .2s, border-color .2s, transform .15s, box-shadow .2s;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      min-width: 110px;
    }
    .react-btn .r-emoji { font-size: 1.9rem; }
    .react-btn .r-label { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #555; }
    .react-btn .r-count { font-size: 1.5rem; font-weight: 900; color: #4f9eff; min-width: 1.5ch; text-align: center; }
    .react-btn:hover {
      background: #1a1a3a; border-color: #4f9eff;
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(79,158,255,.2);
    }
    .react-btn:active { transform: scale(.95); }

    .btn-wrap {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      animation: fadeUp .5s .4s ease both;
    }
    .draw-btn {
      background: #4f9eff; color: #0d0d1a;
      border: none; border-radius: 999px;
      padding: 16px 48px; font-size: 1.05rem; font-weight: 900;
      cursor: pointer; letter-spacing: .5px; font-family: inherit;
      transition: background .2s, transform .1s, box-shadow .2s;
      box-shadow: 0 4px 24px rgba(79,158,255,.35);
    }
    .draw-btn:hover { background: #73b4ff; box-shadow: 0 6px 40px rgba(79,158,255,.6); transform: translateY(-2px); }
    .draw-btn:active { transform: scale(.97); }
    .draw-btn:disabled { background: #1e1e42; color: #444; cursor: not-allowed; box-shadow: none; transform: none; }

    .hint.active { color: #4f9eff; }

    .round-badge span { color: #4f9eff; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🙋 Never Have I Ever</h1>
    <p>Draw a prompt — raise your hand if you've done it!</p>
  </div>

  <div class="card-wrap">
    <div class="card" id="card">
      <span class="prefix">Never have I ever…</span>
      <span class="statement placeholder" id="statement">Press Draw to get a prompt</span>
    </div>
  </div>

  <div class="reactions" id="reactions">
    <button class="react-btn" onclick="react('done')">
      <span class="r-emoji">✋</span>
      <span class="r-label">Done it</span>
      <span class="r-count" id="cnt-done">0</span>
    </button>
    <button class="react-btn" onclick="react('nope')">
      <span class="r-emoji">🙅</span>
      <span class="r-label">Never!</span>
      <span class="r-count" id="cnt-nope">0</span>
    </button>
    <button class="react-btn" onclick="react('lol')">
      <span class="r-emoji">😂</span>
      <span class="r-label">LOL</span>
      <span class="r-count" id="cnt-lol">0</span>
    </button>
  </div>
  <div class="btn-wrap">
    <div class="draw-row">
      <button class="draw-btn" id="drawBtn" onclick="draw()">🎰 Draw!</button>
      <button class="reset-btn" onclick="resetCounts()">↺ Reset</button>
    </div>
    <p class="hint" id="hint">100 prompts ready to go</p>
  </div>

  <script src="game-data.js"></script>
  <script src="game-render.js"></script>
  <script>
    GAME_RENDER.injectCSS();
    const prompts = GAME_DATA.never;

    let round = 0;
    let rolling = false;
    const counts = { done: 0, nope: 0, lol: 0 };

    function resetCounts() {
      counts.done = counts.nope = counts.lol = 0;
      ['done','nope','lol'].forEach(k => document.getElementById(`cnt-${k}`).textContent = 0);
    }

    function react(type) {
      counts[type]++;
      document.getElementById(`cnt-${type}`).textContent = counts[type];
      const btn = event.currentTarget;
      btn.style.transform = 'scale(1.15) translateY(-4px)';
      btn.style.boxShadow = '0 12px 36px rgba(79,158,255,.3)';
      btn.style.borderColor = '#4f9eff';
      setTimeout(() => { btn.style.transform = ''; btn.style.boxShadow = ''; btn.style.borderColor = ''; }, 250);
    }

    function triggerRipple(card) {
      const el = document.createElement('div');
      el.className = 'ripple-el';
      el.style.left = '50%'; el.style.top = '50%';
      el.style.marginLeft = '-60px'; el.style.marginTop = '-60px';
      card.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }

    function draw() {
      if (rolling) return;
      rolling = true;
      counts.done = counts.nope = counts.lol = 0;
      ['done','nope','lol'].forEach(k => document.getElementById(`cnt-${k}`).textContent = 0);

      const btn  = document.getElementById('drawBtn');
      const card = document.getElementById('card');
      const hint = document.getElementById('hint');

      card.innerHTML = '<span class="prefix">Never have I ever…</span><span class="statement" id="statement">Drawing…</span>';
      const stmt = document.getElementById('statement');

      btn.disabled = true;
      card.classList.add('rolling');
      card.classList.remove('active');
      hint.textContent = 'Drawing…';
      hint.classList.remove('active');
      triggerRipple(card);

      const chosen = prompts[Math.floor(Math.random() * prompts.length)];

      GAME_RENDER.drawTick(prompts, tick => { stmt.textContent = tick; }, () => {
        card.classList.remove('rolling');
        card.classList.add('active');
        GAME_RENDER.never(card, chosen);
        round++;
        document.getElementById('roundNum').textContent = round;
        hint.textContent = 'React below — how many have done this? 👇';
        hint.classList.add('active');
        btn.textContent = '🔁 Draw Again';
        btn.disabled = false;
        rolling = false;
      });
    }
  </script>

</body>
</html>
