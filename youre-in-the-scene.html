<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>You're In The Scene · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="In The Scene">
  <meta name="theme-color" content="#0d0d1a">
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="scenario.css">
  <style>
    :root { --accent: #ec4899;
            /* the pink is 4.3:1 as a label on a button face — lighten it for text */
            --accent-text: #ee57a1; }
    .scenario-item { align-items: center; gap: 12px; }
    .sc-placeholder { min-height: 280px; }
    .sc-content { gap: 0; }

    .header h1 {
      background: linear-gradient(135deg, #fff 30%, #ec4899);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* ── Scene card ── */
    .scene-card {
      width: 100%; max-width: 1100px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 32px 34px;
      margin-bottom: 16px;
      position: relative; overflow: hidden;
      transition: border-color .4s;
      animation: fadeUp .5s .2s ease both;
    }
    .scene-card.rolling { border-color: #ec4899; animation: flicker .14s infinite; }
    .scene-card.landed  { border-color: #ec4899; animation: pulseGlow 2.5s ease infinite; }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(236,72,153,0); }
      50%       { box-shadow: 0 0 52px rgba(236,72,153,.22); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Watermark */
    .scene-card::before {
      content: attr(data-emoji);
      position: absolute; font-size: 11rem; opacity: .03;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }

    /* Placeholder */

    /* Content */

    /* Situation block */
    .situation-block { margin-bottom: 24px; }
    .sc-theme-tag {
      display: inline-block;
      font-size: .88rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--accent-text);
      margin-bottom: 10px;
    }
    .sc-title {
      font-size: clamp(1.5rem, 4vw, 1.9rem); font-weight: 800; color: var(--text-hi);
      line-height: 1.2; margin-bottom: 14px;
    }
    .sc-situation {
      font-size: clamp(1.15rem, 3vw, 1.45rem); color: var(--text-3);
      line-height: 1.65; font-weight: 500;
    }

    /* Divider */
    .sc-divider {
      height: 1px; background: var(--border);
      margin-bottom: 20px;
    }

    /* ── Player count selector ── */
    .ps-wrap { margin-bottom: 20px; }
    .ps-label {
      font-size: .86rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 10px;
    }
    .ps-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .ps-btn {
      border: 1.5px solid var(--border-3); border-radius: 8px;
      padding: 5px 18px; font-size: .88rem; font-weight: 700;
      color: var(--text-dim); background: var(--btn-face); cursor: pointer;
      transition: border-color .18s, color .18s, background .18s, transform .1s;
      font-family: inherit; letter-spacing: .5px;
    }
    .ps-btn:hover  { border-color: #ec4899; color: var(--accent-text); }
    .ps-btn:active { transform: scale(.95); }
    .ps-btn.active {
      border-color: #ec4899; color: var(--accent-text);
      background: rgba(236,72,153,.13);
    }

    /* ── Roles header ── */
    .roles-header {
      font-size: .88rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 14px;
    }

    /* ── Role grid ── */
    .roles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Role card */
    @keyframes roleIn {
      from { opacity: 0; transform: scale(.93) translateY(6px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .role-card {
      border-radius: 14px;
      padding: 18px 20px;
      border: 1.5px solid transparent;
      display: flex; flex-direction: column; gap: 6px;
      animation: roleIn .28s ease both;
    }
    .role-card.full-width { grid-column: 1 / -1; }

    .role-a { background: rgba(99,102,241,.12);  border-color: rgba(99,102,241,.4); }
    .role-b { background: rgba(236,72,153,.12);  border-color: rgba(236,72,153,.4); }
    .role-c { background: rgba(245,158,11,.12);  border-color: rgba(245,158,11,.4); }
    .role-d { background: rgba(6,182,212,.12);   border-color: rgba(6,182,212,.4); }
    .role-e { background: rgba(163,230,53,.12);  border-color: rgba(163,230,53,.4); }
    .role-f { background: rgba(217,70,239,.12);  border-color: rgba(217,70,239,.4); }

    /* who was dealt this role, once the cards are handed out */
    .role-owner {
      margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.09);
      font-size: .8rem; font-weight: 800; color: var(--text-2); letter-spacing: .3px;
    }

    .role-letter {
      font-size: .84rem; font-weight: 900; letter-spacing: 1.5px;
      text-transform: uppercase; margin-bottom: 2px;
    }
    .role-a .role-letter { color: #818cf8; }
    .role-b .role-letter { color: var(--accent-text); }
    .role-c .role-letter { color: var(--warn-text); }
    .role-d .role-letter { color: #22d3ee; }
    .role-e .role-letter { color: #a3e635; }
    .role-f .role-letter { color: #d946ef; }

    .role-name {
      font-size: clamp(1rem, 2.5vw, 1.15rem); font-weight: 700; color: var(--text);
      line-height: 1.3;
    }
    .role-hint {
      font-size: clamp(.88rem, 2vw, .98rem); color: var(--text-dim); line-height: 1.5;
      margin-top: 2px;
    }

    /* Rolling text */
    .sc-roll-text {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-weight: 700; color: var(--text);
      text-align: center; min-height: 280px;
      display: flex; align-items: center; justify-content: center;
    }

    /* Draw button */

    .round-badge span { color: var(--accent-text); }

    /* Mobile */
    @media (max-width: 560px) {
      .scene-card { padding: 22px 18px; }
      .sc-placeholder { min-height: 160px; }
      .sc-placeholder .big-emoji { font-size: 2.5rem; }
      .ps-btn { padding: 8px 16px; }
    }

    /* Soft theme ps-btn */

    /* ── Filter bar ── */
    .filter-btn {
      border: 1.5px solid var(--border-3); border-radius: 20px;
      padding: 5px 14px; font-size: .8rem; font-weight: 700;
      color: var(--text-dim); background: var(--surface-2); cursor: pointer;
      transition: border-color .18s, color .18s, background .18s, transform .1s;
      font-family: inherit; white-space: nowrap;
    }

    /* ── Scenario browser ── */
    .scenario-emoji { font-size: 1.4rem; flex-shrink: 0; line-height: 1; }
    .scenario-title { font-size: .95rem; font-weight: 600; color: var(--text-3); line-height: 1.3; }


    /* ── Theme overrides ── */


  </style>
</head>
<body data-guide="scene" data-guide-next="game">

  <div class="topbar">
    <a class="back" href="index.html?step=2" data-i18n="common.backToHub">← Back to Hub</a>
    <div class="round-badge"><span data-i18n="scene.roundLabel">Round</span> <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🎭 You're In The Scene</h1>
  </div>

  <div class="scene-card" id="scene-card" data-emoji="🎭">

    <div class="sc-placeholder" id="sc-placeholder">
      <div class="big-emoji">🎭</div>
      <p id="sc-placeholder-text">Press <strong>Draw Scene</strong> to reveal your situation and roles</p>
    </div>

    <div class="sc-content" id="sc-content"></div>

  </div>

  <button class="btn-draw" id="draw-btn" onclick="draw()">🎲 Draw Scene</button>
  <!-- the cards draw the next scene themselves (see nextGate below); this line shows
       how many are ready, so the host can see the room deciding without touching anything -->
  <div class="next-status hidden" id="next-status"></div>

  <!-- player cards: each player is dealt one role privately -->
  <div id="room-mount"></div>

  <div class="scenario-browser">
    <button class="scenario-browser-hdr" id="browser-hdr" onclick="toggleScenarioBrowser()"></button>
    <div class="scenario-browser-body hidden" id="scenario-browser-body">
      <div class="filter-bar" id="filter-bar"></div>
      <div class="scenario-list" id="scenario-list"></div>
    </div>
  </div>

  <!-- how-to-play briefing: shown first, hands over to the page below -->
  <script src="guide-data.js"></script>
  <script src="guide.js"></script>
  <script src="qrcode.js"></script>
  <script src="game-data.js"></script>
  <script src="sheet-data.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="room.js"></script>
  <script src="next-round.js"></script>
  <script>
    I18N.registerDict('scene', {
      roundLabel: { zh: '回合', en: 'Round' },
      placeholder: { zh: '按下 <strong>抽場景</strong> 揭曉你們的情境與角色', en: 'Press <strong>Draw Scene</strong> to reveal your situation and roles' },
      drawBtn: { zh: '🎲 抽場景', en: '🎲 Draw Scene' },
      nextBtn: { zh: '🔁 下一個場景', en: '🔁 Next Scene' },
      rollingText: { zh: '抽選中…', en: 'Drawing…' },
      theSceneTag: { zh: '🎭 場景', en: '🎭 The Scene' },
      howManyPlayers: { zh: '幾位玩家？', en: 'How many players?' },
      rolesHdrPick: { zh: '🎪 你們的角色 — 選一個並演出來！', en: '🎪 Your Roles — Pick one and play it!' },
      rolesHdrDealt: { zh: '🎪 你們的角色 — 看看自己的卡片！', en: '🎪 Your Roles — check your own card!' },
      browseBtn: { zh: '👁️ 瀏覽全部 {n} 個場景（暴雷 — 分享畫面時請勿開啟）', en: "👁️ Browse all {n} scenarios (spoilers — don't open while sharing)" },
      hideBtn: { zh: '🙈 收起場景清單', en: '🙈 Hide the scenario list' },
      filterAll: { zh: '全部', en: 'All' },
      nextStatusFirst: { zh: '📱 任何一位玩家都可以在自己的卡片上按「🎭 抽第一個場景」開始 — 這裡的抽場景鈕是備援。', en: '📱 Any player can tap "🎭 Draw the first scene" on their own card to start — Draw Scene here is the backup.' },
      nextStatusReady: { zh: '👋 {ready} / {count} 位玩家準備好換下一個場景（{needed} 位就自動抽）', en: '👋 {ready} of {count} players ready for the next scene — it draws itself at {needed}' },
    });
    const st = (key, vars) => {
      let s = I18N.t('scene', key);
      if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
      return s;
    };

    const scenarios = GAME_DATA.scene;
    let round   = 0;
    let used    = [];
    let rolling = false;
    let currentScene = null;
    let currentPlayers = 0;
    let roleOf = []; // roleOf[playerIndex] = which role that player was dealt

    const ALL_COLORS  = ['a','b','c','d','e','f'];
    const ALL_LETTERS = ['A','B','C','D','E','F'];

    ROOM.init({
      mount: 'room-mount',
      accent: '#ec4899',
      hideSetup: true, // player count and links are set up once on index.html now
      linksNote: 'Every player gets one role dealt privately to their own card — including the hint for how to play it. The list below stays on your screen so everyone can follow the scene.',
      onPlayerData: (num, data) => { nextGate.handle(num, data); },
      onCountChange: n => { if (currentScene) setPlayers(n, true); else nextGate.sync(); },
      onNameChange: () => { ROOM.render(); renderRoleGrid(); },
    });

    /* The cards draw the next scene, the host's Draw Scene button is the backup.
       A scene ends when the players feel done, and nothing on the host page knows
       when that is — so each card says "ready for the next one" and the draw fires
       when more than half the room has, never on one tap. The first draw of a
       session takes one tap, because nothing is on the cards yet. */
    const nextGate = NEXT_ROUND.create({
      count: () => ROOM.count,
      needed: n => round > 0 ? NEXT_ROUND.majority(n) : 1,
      canDraw: () => ROOM.enabled && !rolling,
      draw: () => draw(),
      publish: p => { ROOM.update(p); renderNextStatus(); },
    });

    function renderNextStatus() {
      const el = document.getElementById('next-status');
      const open = nextGate.isOpen();
      el.classList.toggle('hidden', !open);
      if (!open) return;
      el.textContent = round > 0
        ? st('nextStatusReady', { ready: nextGate.readyNums().length, count: ROOM.count, needed: nextGate.needed() })
        : st('nextStatusFirst');
    }

    /* nothing drawn yet: the cards carry only "draw the first scene", so the game
       can start from any phone — the same way Say It opens with its deal button */
    function publishIdle() {
      if (!ROOM.enabled || currentScene) return;
      nextGate.open();
      ROOM.publish(Object.assign({ game: 'scene', round: 0, title: '', situation: '', role: null }, nextGate.payload()));
      renderNextStatus();
    }

    ROOM.setDecorator(i => {
      if (!ROOM.enabled || roleOf.length <= i || !currentScene) return {};
      const role = getRoleData(currentScene, roleOf[i]);
      return role ? { marked: true, answer: `🎭 ${role.label}<span class="la-sub">Role ${ALL_LETTERS[roleOf[i]]}</span>` } : {};
    });

    function getRoleData(sc, index) {
      const keys = ['a','b','c','d','e','f'];
      return sc[keys[index]];
    }

    function renderScene(sc) {
      currentScene  = sc;
      currentPlayers = 0;
      roleOf = [];

      const el = document.getElementById('sc-content');
      el.innerHTML = `
        <div class="situation-block">
          <div class="sc-theme-tag">${st('theSceneTag')}</div>
          <div class="sc-title">${sc.emoji} ${sc.title}</div>
          <div class="sc-situation">${sc.situation}</div>
        </div>
        <div class="sc-divider"></div>
        <div class="ps-wrap">
          <div class="ps-label">${st('howManyPlayers')}</div>
          <div class="ps-btns" id="ps-btns">
            ${[2,3,4,5,6].map(n =>
              `<button class="ps-btn" onclick="setPlayers(${n})">${n}</button>`
            ).join('')}
          </div>
        </div>
        <div class="sc-divider" id="roles-divider" style="display:none"></div>
        <div class="roles-header" id="roles-header" style="display:none">
          ${st('rolesHdrPick')}
        </div>
        <div class="roles-grid" id="roles-grid">
          <div class="role-card role-a">
            <div class="role-letter">A</div>
            <div class="role-name">${sc.a.label}</div>
            <div class="role-hint">${sc.a.hint}</div>
          </div>
        </div>`;
      el.classList.add('show');
      // the room already knows how many players there are — deal straight away
      setPlayers(ROOM.count, true);
    }

    function setPlayers(n, fromRoom) {
      if (!currentScene) return;
      currentPlayers = n;
      // the player count lives in the shared room, so every game opens on the same one
      if (!fromRoom && ROOM.count !== n) ROOM.setCount(n);

      /* Update active button */
      document.querySelectorAll('.ps-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.textContent) === n);
      });

      /* Show roles divider + header */
      document.getElementById('roles-divider').style.display = '';
      document.getElementById('roles-header').style.display  = '';

      dealRoles();
      renderRoleGrid();
    }

    /* hand one role to each player's card — no more "who wants to be B?" */
    function dealRoles() {
      if (!currentScene || !currentPlayers) return;
      const order = shuffle(Array.from({ length: currentPlayers }, (_, i) => i));
      roleOf = order; // roleOf[playerIndex] = role index
      nextGate.open();   // a fresh deal is a new round: everyone's "ready" starts over
      const next = nextGate.payload();
      ROOM.publish(i => {
        const ri = roleOf[i];
        const role = getRoleData(currentScene, ri);
        if (!role) return null;
        return Object.assign({
          game: 'scene', round,
          title: currentScene.title,
          situation: currentScene.situation,
          role: { letter: ALL_LETTERS[ri], label: role.label, hint: role.hint },
        }, next);
      });
      ROOM.render();
      renderNextStatus();
    }

    /* who plays which role, so the shared screen and the phones agree */
    function playerForRole(roleIdx) {
      const i = roleOf.indexOf(roleIdx);
      return i < 0 ? '' : ROOM.name(i);
    }

    function renderRoleGrid() {
      const n = currentPlayers;
      const grid = document.getElementById('roles-grid');
      if (!grid || !n) return;
      const narrow = window.innerWidth <= 560;
      grid.style.gridTemplateColumns = (narrow || n === 2 || n === 4) ? '1fr 1fr' : 'repeat(3, 1fr)';
      grid.innerHTML = '';
      const dealt = ROOM.enabled && roleOf.length === n;
      document.getElementById('roles-header').textContent = dealt
        ? st('rolesHdrDealt')
        : st('rolesHdrPick');
      for (let i = 0; i < n; i++) {
        const role   = getRoleData(currentScene, i);
        // 場景的角色數少於房間人數時（外部題庫可能只填了前幾個角色），
        // 這裡以前會直接在 role.label 上丟 TypeError 把整頁打掛。少一張
        // 角色卡總比整頁當掉好——sheet-data.js 那邊也會把角色補滿六個。
        if (!role) continue;
        const letter = ALL_LETTERS[i];
        const color  = ALL_COLORS[i];
        const div    = document.createElement('div');
        div.className = `role-card role-${color}`;
        div.style.animationDelay = (i * 55) + 'ms';
        div.innerHTML = `
          <div class="role-letter">${letter}</div>
          <div class="role-name">${role.label}</div>
          <div class="role-hint">${role.hint}</div>
          ${dealt ? `<div class="role-owner">🎴 ${playerForRole(i)}</div>` : ''}`;
        grid.appendChild(div);
      }
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /* ── Scenario browser: closed by default, since this screen is being shared and
       the full list would spoil every scenario before it's drawn ── */
    let activeCat = '';
    let browserOpen = false;
    function toggleScenarioBrowser() {
      browserOpen = !browserOpen;
      document.getElementById('scenario-browser-body').classList.toggle('hidden', !browserOpen);
      renderBrowserLabel();
    }
    function renderBrowserLabel() {
      document.getElementById('browser-hdr').textContent = browserOpen
        ? st('hideBtn')
        : st('browseBtn', { n: scenarios.length });
    }

    function filterBy(cat) {
      activeCat = cat;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
      document.querySelectorAll('.scenario-item').forEach(item => {
        item.style.display = (!cat || item.dataset.cat === cat) ? '' : 'none';
      });
    }

    function buildList() {
      const filterBar = document.getElementById('filter-bar');
      const list = document.getElementById('scenario-list');
      filterBar.innerHTML = '';
      list.innerHTML = '';
      activeCat = '';
      renderBrowserLabel();

      const cats = [];
      scenarios.forEach(sc => { if (sc.cat && !cats.includes(sc.cat)) cats.push(sc.cat); });

      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn active';
      allBtn.textContent = st('filterAll');
      allBtn.dataset.cat = '';
      allBtn.addEventListener('click', () => filterBy(''));
      filterBar.appendChild(allBtn);

      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = cat;
        btn.dataset.cat = cat;
        btn.addEventListener('click', () => filterBy(cat));
        filterBar.appendChild(btn);
      });

      scenarios.forEach((sc, i) => {
        const btn = document.createElement('button');
        btn.className = 'scenario-item';
        btn.dataset.idx = i;
        btn.dataset.cat = sc.cat || '';
        btn.innerHTML = `<span class="scenario-emoji">${sc.emoji}</span><span class="scenario-title">${sc.title}</span>`;
        btn.addEventListener('click', () => loadScenario(sc, i));
        list.appendChild(btn);
      });
    }
    buildList();

    function loadScenario(sc, idx) {
      const card = document.getElementById('scene-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      ph.style.display = 'none';
      card.classList.remove('rolling');
      card.classList.add('landed');
      card.setAttribute('data-emoji', sc.emoji);
      ct.classList.remove('show');
      ct.innerHTML = '';
      renderScene(sc);

      round++;
      document.getElementById('roundNum').textContent = round;
      document.getElementById('draw-btn').textContent = st('nextBtn');

      document.querySelectorAll('.scenario-item').forEach(el => {
        el.classList.toggle('active', +el.dataset.idx === idx);
      });

      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function draw() {
      if (rolling) return;
      rolling = true;

      const btn  = document.getElementById('draw-btn');
      const card = document.getElementById('scene-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      btn.disabled = true;
      card.classList.remove('landed');
      card.classList.add('rolling');
      ph.style.display = 'none';
      ct.classList.remove('show');
      ct.innerHTML = `<div class="sc-roll-text" id="roll-text">${st('rollingText')}</div>`;
      ct.classList.add('show');

      let avail = scenarios.map((_,i) => i).filter(i => !used.includes(i));
      if (!avail.length) { used = []; avail = scenarios.map((_,i) => i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      used.push(fi);

      let n = 0, count = 22;
      const iv = setInterval(() => {
        const rnd = scenarios[Math.floor(Math.random() * scenarios.length)];
        document.getElementById('roll-text').textContent = rnd.emoji + ' ' + rnd.title;
        if (++n >= count) {
          clearInterval(iv);
          const sc = scenarios[fi];
          card.setAttribute('data-emoji', sc.emoji);
          ct.classList.remove('show');
          ct.innerHTML = '';
          card.classList.remove('rolling');
          card.classList.add('landed');
          round++;
          document.getElementById('roundNum').textContent = round;
          btn.textContent = st('nextBtn');
          btn.disabled    = false;
          rolling = false;
          // after round++ and rolling = false: renderScene() deals the roles, and the
          // next-round gate reads both when it decides what the cards may show (a
          // majority toggle, and only once the animation is over)
          renderScene(sc);
          document.querySelectorAll('.scenario-item').forEach(el => el.classList.remove('active'));
        }
      }, 85);
    }

    /* re-run on every language toggle: the placeholder, the Draw/Next Scene button,
       the role-assignment header (via renderRoleGrid), and the browsable list's
       header + "All" filter label. The scenario/role content from game-data.js
       (titles, situations, role labels/hints, categories) is never touched here —
       only the UI chrome. Doesn't call buildList() again so the current filter
       and "loaded" highlight in the list below aren't reset by a toggle. */
    function refreshSceneI18n() {
      const ph = document.getElementById('sc-placeholder-text');
      if (ph) ph.innerHTML = st('placeholder');
      const drawBtn = document.getElementById('draw-btn');
      if (drawBtn && !rolling) drawBtn.textContent = round > 0 ? st('nextBtn') : st('drawBtn');
      // the drawn scene's card is built once by renderScene() and never fully
      // redrawn again (a redraw would reset currentPlayers/roleOf and wipe out
      // whichever roles are already dealt) — patch its two static labels in
      // place instead, the same way roles-header is patched via renderRoleGrid()
      const themeTag = document.querySelector('.sc-theme-tag');
      if (themeTag) themeTag.textContent = st('theSceneTag');
      const psLabel = document.querySelector('.ps-label');
      if (psLabel) psLabel.textContent = st('howManyPlayers');
      renderRoleGrid();
      renderBrowserLabel();
      renderNextStatus();
      const allBtn = document.querySelector('.filter-btn[data-cat=""]');
      if (allBtn) allBtn.textContent = st('filterAll');
    }
    refreshSceneI18n();
    I18N.onChange(refreshSceneI18n);
    publishIdle();
  </script>
</body>
</html>
