<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Plot Twist · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Plot Twist">
  <meta name="theme-color" content="#0d0d1a">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 72px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Scan beam sweeping up the card */
    @keyframes scanBeam {
      0%   { transform: translateY(110%); opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { transform: translateY(-110%); opacity: 0; }
    }

    /* Text blur-squish while rolling */
    @keyframes textRoll {
      0%, 100% { filter: blur(0px);   transform: scaleY(1)    translateY(0);   opacity: 1; }
      40%       { filter: blur(3px);   transform: scaleY(0.82) translateY(-3px); opacity: 0.45; }
      60%       { filter: blur(2px);   transform: scaleY(0.88) translateY(3px);  opacity: 0.6; }
    }

    /* Bounce-in on land */
    @keyframes landBounce {
      0%   { transform: scale(0.72) translateY(14px); opacity: 0; filter: blur(8px); }
      52%  { transform: scale(1.1)  translateY(-4px); opacity: 1; filter: blur(0); }
      72%  { transform: scale(0.96) translateY(1px); }
      88%  { transform: scale(1.02); }
      100% { transform: scale(1)    translateY(0); }
    }

    /* Glow burst on land */
    @keyframes glowBurst {
      0%   { box-shadow: 0 0 0   transparent; }
      18%  { box-shadow: 0 0 80px var(--glow, transparent), 0 0 140px var(--glow, transparent); }
      100% { box-shadow: 0 0 28px var(--glow, transparent); }
    }

    /* Gentle pulse after landing */
    @keyframes cardGlow {
      0%, 100% { box-shadow: 0 0 28px var(--glow, transparent); }
      50%       { box-shadow: 0 0 50px var(--glow, transparent); }
    }

    /* ── Topbar ── */
    .topbar {
      width: 100%; max-width: 720px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 36px;
      animation: fadeUp .5s ease both;
    }
    a.back { color: #555; text-decoration: none; font-size: 14px; transition: color .2s; }
    a.back:hover { color: #eee; }
    .step-badge { font-size: 12px; color: #444; }
    .step-badge span { color: #6366f1; font-weight: 700; }

    /* ── Header ── */
    .header {
      text-align: center; margin-bottom: 32px;
      animation: fadeUp .5s .1s ease both;
    }
    .header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .header p { color: #666; font-size: .93rem; }

    /* ── Opening card ── */
    .opening-card {
      width: 100%; max-width: 720px;
      background: #13132b; border: 2px solid #1e1e42;
      border-radius: 22px; padding: 28px 30px;
      margin-bottom: 16px;
      position: relative; overflow: hidden;
      transition: border-color .3s;
      animation: fadeUp .5s .2s ease both;
      min-height: 140px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .opening-card.rolling { border-color: #6366f1; }
    .opening-card.rolling::after {
      content: '';
      position: absolute; inset: 0; border-radius: inherit;
      background: linear-gradient(to top, transparent 0%, rgba(99,102,241,.18) 50%, transparent 100%);
      animation: scanBeam .55s linear infinite;
      pointer-events: none;
    }
    .opening-card.landed {
      border-color: #6366f1;
      --glow: rgba(99,102,241,.38);
      animation: glowBurst .65s ease forwards, cardGlow 2.8s .65s ease infinite;
    }
    .opening-card::before {
      content: '📖';
      position: absolute; font-size: 8rem; opacity: .03;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }
    .op-ph {
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 10px; text-align: center; min-height: 100px;
    }
    .op-ph .big-emoji { font-size: 2.5rem; }
    .op-ph p { color: #333; font-size: .9rem; }
    .op-ct { display: none; flex-direction: column; gap: 8px; }
    .op-ct.show { display: flex; }
    .op-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .13em; color: #6366f1; font-weight: 700; }
    .op-text { font-size: clamp(1.3rem, 4vw, 1.8rem); color: #eee; line-height: 1.5; }

    /* ── Start choice ── */
    /* ── Main card ── */
    .main-card {
      width: 100%; max-width: 720px;
      background: #13132b; border: 2px solid #1e1e42;
      border-radius: 22px; padding: 40px 30px;
      margin-bottom: 16px;
      position: relative; overflow: hidden;
      transition: border-color .25s;
      min-height: 210px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 14px;
      animation: fadeUp .5s .3s ease both;
    }
    .main-card.rolling::after {
      content: '';
      position: absolute; inset: 0; border-radius: inherit;
      background: linear-gradient(to top, transparent 0%, rgba(255,255,255,.07) 50%, transparent 100%);
      animation: scanBeam .5s linear infinite;
      pointer-events: none;
    }
    .main-card.landed { animation: glowBurst .65s ease forwards, cardGlow 2.8s .65s ease infinite; }
    .card-bg {
      position: absolute; font-size: 10rem; opacity: .04;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }

    /* Text animation states */
    .text-rolling {
      animation: textRoll .22s ease-in-out infinite;
      will-change: transform, filter;
    }
    .text-landed {
      animation: landBounce .6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    /* Placeholder */
    .card-ph {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; min-height: 140px;
    }
    .card-ph .big-emoji { font-size: 2.5rem; }
    .card-ph p { color: #333; font-size: .9rem; }

    /* F/U section */
    .fu-ct { display: none; flex-direction: column; align-items: center; gap: 10px; }
    .fu-ct.show { display: flex; }
    .fu-step-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; }
    .fu-word { font-size: clamp(1.8rem, 6vw, 3.2rem); font-weight: 900; letter-spacing: .02em; line-height: 1.2; }

    /* Connector section */
    .conn-ct { display: none; flex-direction: column; align-items: center; gap: 10px; }
    .conn-ct.show { display: flex; }
    .conn-cat { font-size: .78rem; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; }
    .conn-word { font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 800; line-height: 1.2; }

    /* Ending section */
    .end-ct { display: none; flex-direction: column; align-items: center; gap: 10px; }
    .end-ct.show { display: flex; }
    .end-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; color: #fbbf24; }
    .end-word { font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 800; color: #fbbf24; line-height: 1.2; }

    /* ── Story done ── */
    .story-done {
      width: 100%; max-width: 720px;
      background: linear-gradient(110deg, rgba(251,191,36,.1), rgba(99,102,241,.1));
      border: 2px solid #fbbf24;
      border-radius: 18px; padding: 20px 24px;
      text-align: center;
      font-size: 1.3rem; font-weight: 700; color: #fbbf24;
      margin-bottom: 16px;
      animation: fadeUp .4s ease both;
    }

    /* ── History dots ── */
    .history-row {
      width: 100%; max-width: 720px;
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 16px; min-height: 20px;
      animation: fadeUp .5s .35s ease both;
    }
    .hdot { width: 20px; height: 20px; border-radius: 50%; }
    .hdot.cur { transform: scale(1.35); filter: brightness(1.3); }

    /* ── Buttons ── */
    .btn-opening-row {
      width: 100%; max-width: 720px;
      display: flex; gap: 12px;
      animation: fadeUp .5s .3s ease both;
    }
    .btn-opening {
      flex: 2;
      background: #6366f1; color: #fff; border: none;
      border-radius: 14px; padding: 18px;
      font-size: 1.1rem; font-weight: 800;
      cursor: pointer; font-family: inherit;
      transition: opacity .2s, transform .1s;
    }
    .btn-opening:hover { opacity: .88; }
    .btn-opening:active { transform: scale(.98); }
    .btn-opening:disabled { opacity: .4; cursor: not-allowed; }
    .btn-redraw-op {
      flex: 1;
      background: transparent; color: #555; border: 2px solid #2a2a4a;
      border-radius: 14px; padding: 18px;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s, color .2s, border-color .2s;
    }
    .btn-redraw-op:hover { background: rgba(99,102,241,.08); color: #6366f1; border-color: #6366f1; }
    .btn-redraw-op:disabled { opacity: .4; cursor: not-allowed; }

    .btn-row {
      width: 100%; max-width: 720px;
      display: flex; gap: 12px;
    }
    .btn-new {
      flex: 1;
      background: transparent; color: #6366f1; border: 2px solid #6366f1;
      border-radius: 14px; padding: 16px;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s;
    }
    .btn-new:hover { background: rgba(99,102,241,.1); }
    .btn-new:active { transform: scale(.98); }
    .btn-new:disabled { opacity: .4; cursor: not-allowed; }

    .btn-draw {
      flex: 2;
      background: #6366f1; color: #fff; border: none;
      border-radius: 14px; padding: 16px;
      font-size: 1.05rem; font-weight: 800;
      cursor: pointer; font-family: inherit;
      transition: opacity .2s, transform .1s;
    }
    .btn-draw:hover { opacity: .88; }
    .btn-draw:active { transform: scale(.98); }
    .btn-draw:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="step-badge">Step <span id="step-num">0</span> / 10</div>
  </div>

  <div class="header">
    <h1>🎬 Plot Twist</h1>
    <p>Fortunately… Unfortunately… and then a twist! 10 steps to a wild story.</p>
  </div>

  <!-- Opening card -->
  <div class="opening-card" id="op-card">
    <div class="op-ph" id="op-ph">
      <div class="big-emoji">📖</div>
      <p>Press <strong>Draw Opening</strong> to begin your story</p>
    </div>
    <div class="op-ct" id="op-ct">
      <div class="op-label">📖 Opening</div>
      <div class="op-text" id="op-text"></div>
    </div>
  </div>

  <!-- Main game card -->
  <div class="main-card" id="main-card" style="display:none">
    <div class="card-bg" id="card-bg">🎬</div>

    <div class="card-ph" id="card-ph">
      <div class="big-emoji">🎬</div>
      <p>Press <strong>Draw</strong> for the next step</p>
    </div>

    <div class="fu-ct" id="fu-ct">
      <div class="fu-step-label" id="fu-step-label"></div>
      <div class="fu-word" id="fu-word"></div>
    </div>

    <div class="conn-ct" id="conn-ct">
      <div class="conn-cat" id="conn-cat"></div>
      <div class="conn-word" id="conn-word"></div>
    </div>

    <div class="end-ct" id="end-ct">
      <div class="end-label">🏁 Final Step</div>
      <div class="end-word" id="end-word"></div>
    </div>
  </div>

  <!-- Story done banner -->
  <div class="story-done" id="story-done" style="display:none">
    🎬 The End! — Great story, everyone!
  </div>

  <!-- History dots -->
  <div class="history-row" id="history-row"></div>

  <!-- Initial button row -->
  <div class="btn-opening-row" id="btn-opening-row">
    <button class="btn-redraw-op" id="btn-redraw-op" onclick="redrawOpeningPT()" style="display:none">🔀 Redraw</button>
    <button class="btn-opening"   id="btn-opening"   onclick="drawOpening()">🎲 Draw Opening</button>
  </div>

  <!-- Game buttons -->
  <div class="btn-row" id="btn-row" style="display:none">
    <button class="btn-new" id="btn-new" onclick="newStory()">🔁 New Story</button>
    <button class="btn-draw" id="btn-draw" onclick="drawNext()">🎲 Draw</button>
  </div>

  <script>
    const openings = [
      "A dentist discovered that every tooth she pulled contained a tiny folded note.",
      "A firefighter arrived at a burning building and found the fire was actually freezing cold.",
      "A marathon runner crossed the finish line and realized she had run to the wrong city.",
      "An ordinary elevator button labeled 'B13' appeared overnight in every building in town.",
      "A dog returned home after three years away and brought an unopened letter in its mouth.",
      "A news anchor accidentally read tomorrow's headlines live on air — and they all came true.",
      "A doctor prescribed laughter as medicine, and the pharmacy actually had it in stock.",
      "A painter finished a portrait of a stranger, only to receive a call from that exact person.",
      "A translator at the United Nations realized every world leader was saying the opposite of what they meant.",
      "A pilot announced the wrong destination, but all 200 passengers said they preferred it anyway.",
      "A locksmith found a key that didn't fit any lock — except one door no one could explain.",
      "An elderly woman started writing a novel and discovered her characters were writing back.",
      "A gardener planted seeds in winter and found flowers blooming the very next morning.",
      "A comedian told a joke so funny that the audience laughed for three days straight.",
      "A librarian checked out a book and found her own name on the return slip — dated thirty years in the future.",
      "A mountain climber reached the summit and found a doorbell at the top.",
      "A teacher gave her students a blank exam and told them the test was to figure out the questions.",
      "A sailor got lost at sea and discovered an island that appeared on no map.",
      "A child found a message in a bottle that contained instructions for finding a treasure — in her own backyard.",
      "A lawyer defending an impossible case found the perfect witness in the most unexpected place.",
      "A sleep researcher fell asleep during an experiment and woke up speaking fluent Mandarin.",
      "A baker's bread rose so high it floated out the window and disappeared into the clouds.",
      "A retired spy received one final mission — delivered by a pigeon to her nursing home room.",
      "A tourist asked for directions and was accidentally given a tour of the city's biggest secret.",
      "A hotel concierge checked in a guest who had the same name, birthday, and face as himself.",
    ];

    const connectors = [
      { word: 'Although',              cat: 'Contrast',       emoji: '⚡', color: '#ef4444' },
      { word: 'Even so',               cat: 'Contrast',       emoji: '⚡', color: '#ef4444' },
      { word: 'All the same',          cat: 'Contrast',       emoji: '⚡', color: '#ef4444' },
      { word: 'That said',             cat: 'Contrast',       emoji: '⚡', color: '#ef4444' },
      { word: 'Regardless',            cat: 'Contrast',       emoji: '⚡', color: '#ef4444' },
      { word: 'In spite of this',      cat: 'Contrast',       emoji: '⚡', color: '#ef4444' },
      { word: 'Moreover',              cat: 'Addition',       emoji: '➕', color: '#22c55e' },
      { word: 'Furthermore',           cat: 'Addition',       emoji: '➕', color: '#22c55e' },
      { word: 'In addition',           cat: 'Addition',       emoji: '➕', color: '#22c55e' },
      { word: 'Beyond that',           cat: 'Addition',       emoji: '➕', color: '#22c55e' },
      { word: 'On top of it all',      cat: 'Addition',       emoji: '➕', color: '#22c55e' },
      { word: 'Consequently',          cat: 'Cause & Effect', emoji: '🔗', color: '#f59e0b' },
      { word: 'For this reason',       cat: 'Cause & Effect', emoji: '🔗', color: '#f59e0b' },
      { word: 'This led to',           cat: 'Cause & Effect', emoji: '🔗', color: '#f59e0b' },
      { word: 'Which meant that',      cat: 'Cause & Effect', emoji: '🔗', color: '#f59e0b' },
      { word: 'Before long',           cat: 'Time',           emoji: '⏱️', color: '#4f9eff' },
      { word: 'All of a sudden',       cat: 'Time',           emoji: '⏱️', color: '#4f9eff' },
      { word: 'Later that day',        cat: 'Time',           emoji: '⏱️', color: '#4f9eff' },
      { word: 'From that point',       cat: 'Time',           emoji: '⏱️', color: '#4f9eff' },
      { word: 'Strangely enough',      cat: 'Surprise',       emoji: '✨', color: '#a78bfa' },
      { word: 'Against all odds',      cat: 'Surprise',       emoji: '✨', color: '#a78bfa' },
      { word: 'Much to their surprise',cat: 'Surprise',       emoji: '✨', color: '#a78bfa' },
      { word: 'Of all things',         cat: 'Surprise',       emoji: '✨', color: '#a78bfa' },
    ];

    const endings = [
      'And just like that',
      'In the end, of course',
      'From that moment on',
      'And so it happened that',
      'Nobody expected it, but',
      'Looking back on it',
      'As anyone could have guessed',
      'Against all odds',
    ];

    let step      = 0;
    let startFort = true;
    let history   = [];
    let rolling   = false;
    let usedOp    = [];
    let usedConn  = [];
    let usedEnd   = [];

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    /* Slot-machine roll: decelerates from fast → slow, then calls onLand */
    function rollTicks(onTick, onLand, totalTicks = 20) {
      let tick = 0;
      function next() {
        if (tick < totalTicks) {
          onTick(tick);
          // quadratic ease-out: starts ~55ms, ends ~265ms
          const delay = Math.round(55 + 210 * Math.pow((tick + 1) / totalTicks, 2.4));
          tick++;
          setTimeout(next, delay);
        } else {
          onLand();
        }
      }
      next();
    }

    function clearTextAnim(...ids) {
      ids.forEach(id => {
        const el = document.getElementById(id);
        el.classList.remove('text-rolling', 'text-landed');
      });
    }

    function getStepType(s) {
      if (s === 10) return 'ending';
      const mod = (s - 1) % 3;
      if (mod === 2) return 'connector';
      if (mod === 0) return startFort ? 'fort' : 'unfort';
      return startFort ? 'unfort' : 'fort';
    }

    function drawOpening() {
      if (rolling) return;
      rolling = true;

      const btn  = document.getElementById('btn-opening');
      const card = document.getElementById('op-card');
      const ph   = document.getElementById('op-ph');
      const ct   = document.getElementById('op-ct');
      const txt  = document.getElementById('op-text');

      btn.disabled = true;
      card.classList.add('rolling');
      ph.style.display = 'none';
      ct.classList.add('show');
      txt.classList.add('text-rolling');

      let avail = openings.map((_, i) => i).filter(i => !usedOp.includes(i));
      if (!avail.length) { usedOp = []; avail = openings.map((_, i) => i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      usedOp.push(fi);

      rollTicks(
        () => { txt.textContent = openings[Math.floor(Math.random() * openings.length)]; },
        () => {
          txt.classList.remove('text-rolling');
          txt.textContent = openings[fi];
          txt.classList.add('text-landed');
          card.classList.remove('rolling');
          card.classList.add('landed');
          document.getElementById('btn-redraw-op').style.display = '';
          btn.textContent = '▶ Begin Story';
          btn.onclick = beginStory;
          btn.disabled = false;
          rolling = false;
        }
      );
    }

    function beginStory() {
      document.getElementById('btn-redraw-op').style.display = 'none';
      document.getElementById('btn-opening').style.display   = 'none';
      beginPlay(Math.random() > .5);
    }

    function redrawOpeningPT() {
      if (rolling) return;
      const btn = document.getElementById('btn-opening');
      btn.textContent = '🎲 Draw Opening';
      btn.onclick = drawOpening;
      document.getElementById('btn-redraw-op').style.display = 'none';
      const card = document.getElementById('op-card');
      card.classList.remove('landed');
      clearTextAnim('op-text');
      document.getElementById('op-ph').style.display = '';
      document.getElementById('op-ct').classList.remove('show');
      drawOpening();
    }

    function beginPlay(isFort) {
      startFort = isFort;
      document.getElementById('main-card').style.display = 'flex';
      document.getElementById('btn-row').style.display   = 'flex';
    }

    function drawNext() {
      if (rolling) return;
      rolling = true;

      step++;
      document.getElementById('step-num').textContent = step;

      const type   = getStepType(step);
      const btn    = document.getElementById('btn-draw');
      const btnNew = document.getElementById('btn-new');
      const card   = document.getElementById('main-card');
      const bgEl   = document.getElementById('card-bg');

      btn.disabled    = true;
      btnNew.disabled = true;
      document.getElementById('card-ph').style.display = 'none';
      document.getElementById('fu-ct').classList.remove('show');
      document.getElementById('conn-ct').classList.remove('show');
      document.getElementById('end-ct').classList.remove('show');
      clearTextAnim('fu-word', 'conn-word', 'end-word');
      card.classList.remove('landed');
      card.classList.add('rolling');
      card.style.removeProperty('--glow');

      if (type === 'fort' || type === 'unfort') {
        const fuEl    = document.getElementById('fu-word');
        const stepLbl = document.getElementById('fu-step-label');
        document.getElementById('fu-ct').classList.add('show');

        const final      = type === 'fort' ? 'FORTUNATELY' : 'UNFORTUNATELY';
        const finalColor = type === 'fort' ? '#22c55e' : '#ef4444';
        bgEl.textContent = type === 'fort' ? '🍀' : '💔';
        fuEl.classList.add('text-rolling');

        rollTicks(
          () => {
            const isF = Math.random() > .5;
            fuEl.textContent       = isF ? 'FORTUNATELY' : 'UNFORTUNATELY';
            fuEl.style.color       = isF ? '#22c55e' : '#ef4444';
            card.style.borderColor = isF ? '#22c55e' : '#ef4444';
          },
          () => {
            fuEl.classList.remove('text-rolling');
            fuEl.textContent       = final;
            fuEl.style.color       = finalColor;
            fuEl.classList.add('text-landed');
            stepLbl.textContent    = type === 'fort' ? '🍀 Fortunately…' : '💔 Unfortunately…';
            stepLbl.style.color    = finalColor;
            card.style.borderColor = finalColor;
            card.style.setProperty('--glow', hexToRgba(finalColor, .35));
            card.classList.remove('rolling');
            card.classList.add('landed');
            history.push({ color: finalColor });
            renderHistory();
            btn.disabled    = false;
            btnNew.disabled = false;
            rolling = false;
          }
        );

      } else if (type === 'connector') {
        const catEl  = document.getElementById('conn-cat');
        const wordEl = document.getElementById('conn-word');
        document.getElementById('conn-ct').classList.add('show');

        let avail = connectors.map((_, i) => i).filter(i => !usedConn.includes(i));
        if (!avail.length) { usedConn = []; avail = connectors.map((_, i) => i); }
        const fi = avail[Math.floor(Math.random() * avail.length)];
        usedConn.push(fi);
        wordEl.classList.add('text-rolling');

        rollTicks(
          () => {
            const tmp = connectors[Math.floor(Math.random() * connectors.length)];
            catEl.textContent      = tmp.emoji + ' ' + tmp.cat;
            catEl.style.color      = tmp.color;
            wordEl.textContent     = tmp.word;
            wordEl.style.color     = tmp.color;
            bgEl.textContent       = tmp.emoji;
            card.style.borderColor = tmp.color;
          },
          () => {
            const sc = connectors[fi];
            wordEl.classList.remove('text-rolling');
            catEl.textContent      = sc.emoji + ' ' + sc.cat;
            catEl.style.color      = sc.color;
            wordEl.textContent     = sc.word;
            wordEl.style.color     = sc.color;
            wordEl.classList.add('text-landed');
            bgEl.textContent       = sc.emoji;
            card.style.borderColor = sc.color;
            card.style.setProperty('--glow', hexToRgba(sc.color, .35));
            card.classList.remove('rolling');
            card.classList.add('landed');
            history.push({ color: sc.color });
            renderHistory();
            btn.disabled    = false;
            btnNew.disabled = false;
            rolling = false;
          }
        );

      } else {
        // ending
        const endEl = document.getElementById('end-word');
        document.getElementById('end-ct').classList.add('show');
        bgEl.textContent = '🏁';

        let avail = endings.map((_, i) => i).filter(i => !usedEnd.includes(i));
        if (!avail.length) { usedEnd = []; avail = endings.map((_, i) => i); }
        const fi = avail[Math.floor(Math.random() * avail.length)];
        usedEnd.push(fi);

        const gold = '#fbbf24';
        endEl.classList.add('text-rolling');

        rollTicks(
          () => {
            endEl.textContent      = endings[Math.floor(Math.random() * endings.length)];
            card.style.borderColor = gold;
          },
          () => {
            endEl.classList.remove('text-rolling');
            endEl.textContent = endings[fi];
            endEl.classList.add('text-landed');
            card.style.borderColor = gold;
            card.style.setProperty('--glow', hexToRgba(gold, .35));
            card.classList.remove('rolling');
            card.classList.add('landed');
            history.push({ color: gold });
            renderHistory();
            btn.style.display = 'none';
            document.getElementById('story-done').style.display = 'block';
            btnNew.disabled = false;
            rolling = false;
          }
        );
      }
    }

    function renderHistory() {
      const row = document.getElementById('history-row');
      row.innerHTML = '';
      history.forEach((h, i) => {
        const d = document.createElement('div');
        d.className        = 'hdot' + (i === history.length - 1 ? ' cur' : '');
        d.style.background = h.color;
        row.appendChild(d);
      });
    }

    function newStory() {
      if (rolling) return;
      step     = 0;
      history  = [];
      usedConn = [];
      rolling  = false;

      document.getElementById('step-num').textContent = '0';

      const opCard = document.getElementById('op-card');
      opCard.classList.remove('rolling', 'landed');
      opCard.style.animation = '';
      document.getElementById('op-ph').style.display = '';
      document.getElementById('op-ct').classList.remove('show');
      clearTextAnim('op-text');

      const mainCard = document.getElementById('main-card');
      mainCard.style.display = 'none';
      mainCard.style.borderColor = '';
      mainCard.style.removeProperty('--glow');
      mainCard.classList.remove('rolling', 'landed');
      document.getElementById('card-ph').style.display = '';
      document.getElementById('fu-ct').classList.remove('show');
      document.getElementById('conn-ct').classList.remove('show');
      document.getElementById('end-ct').classList.remove('show');
      document.getElementById('card-bg').textContent = '🎬';
      clearTextAnim('fu-word', 'conn-word', 'end-word');

      document.getElementById('story-done').style.display = 'none';
      document.getElementById('history-row').innerHTML    = '';

      const btnOp = document.getElementById('btn-opening');
      btnOp.style.display = '';
      btnOp.disabled = false;
      btnOp.textContent = '🎲 Draw Opening';
      btnOp.onclick = drawOpening;
      document.getElementById('btn-redraw-op').style.display = 'none';

      const btnDraw = document.getElementById('btn-draw');
      btnDraw.style.display = '';
      btnDraw.disabled = false;

      document.getElementById('btn-row').style.display = 'none';
      document.getElementById('btn-new').disabled = false;
    }
  </script>
</body>
</html>
