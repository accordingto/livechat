<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('ib-theme');if(t)document.documentElement.setAttribute('data-theme',t);})()</script>
  <script src="theme.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>You're In The Scene · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="In The Scene">
  <meta name="theme-color" content="#0d0d1a">
  <link rel="stylesheet" href="shared.css">
  <style>
    .header h1 {
      background: linear-gradient(135deg, #fff 30%, #ec4899);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* ── Scene card ── */
    .scene-card {
      width: 100%; max-width: 1100px;
      background: #13132b;
      border: 2px solid #1e1e42;
      border-radius: 22px;
      padding: 32px 34px;
      margin-bottom: 16px;
      position: relative; overflow: hidden;
      transition: border-color .4s;
      animation: fadeUp .5s .2s ease both;
    }
    .scene-card.rolling { border-color: #ec4899; animation: flicker .14s infinite; }
    .scene-card.landed  { border-color: #ec4899; animation: pulseGlow 2.5s ease infinite; }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(236,72,153,0); }
      50%       { box-shadow: 0 0 52px rgba(236,72,153,.22); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Watermark */
    .scene-card::before {
      content: attr(data-emoji);
      position: absolute; font-size: 11rem; opacity: .03;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }

    /* Placeholder */
    .sc-placeholder {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; text-align: center;
      min-height: 280px;
    }
    .sc-placeholder .big-emoji { font-size: 3.2rem; }
    .sc-placeholder p { color: #333; font-size: .95rem; }

    /* Content */
    .sc-content { display: none; flex-direction: column; gap: 0; }
    .sc-content.show { display: flex; }

    /* Situation block */
    .situation-block { margin-bottom: 24px; }
    .sc-theme-tag {
      display: inline-block;
      font-size: .78rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
      color: #ec4899;
      margin-bottom: 10px;
    }
    .sc-title {
      font-size: clamp(1.5rem, 4vw, 1.9rem); font-weight: 800; color: #fff;
      line-height: 1.2; margin-bottom: 14px;
    }
    .sc-situation {
      font-size: clamp(1.15rem, 3vw, 1.45rem); color: #ccc;
      line-height: 1.65; font-weight: 500;
    }

    /* Divider */
    .sc-divider {
      height: 1px; background: #1e1e42;
      margin-bottom: 20px;
    }

    /* ── Player count selector ── */
    .ps-wrap { margin-bottom: 20px; }
    .ps-label {
      font-size: .72rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
      color: #666; margin-bottom: 10px;
    }
    .ps-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .ps-btn {
      border: 1.5px solid #1e1e42; border-radius: 8px;
      padding: 5px 18px; font-size: .88rem; font-weight: 700;
      color: #555; background: transparent; cursor: pointer;
      transition: border-color .18s, color .18s, background .18s, transform .1s;
      font-family: inherit; letter-spacing: .5px;
    }
    .ps-btn:hover  { border-color: #ec4899; color: #ec4899; }
    .ps-btn:active { transform: scale(.95); }
    .ps-btn.active {
      border-color: #ec4899; color: #ec4899;
      background: rgba(236,72,153,.13);
    }

    /* ── Roles header ── */
    .roles-header {
      font-size: .78rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
      color: #666; margin-bottom: 14px;
    }

    /* ── Role grid ── */
    .roles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Role card */
    @keyframes roleIn {
      from { opacity: 0; transform: scale(.93) translateY(6px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .role-card {
      border-radius: 14px;
      padding: 18px 20px;
      border: 1.5px solid transparent;
      display: flex; flex-direction: column; gap: 6px;
      animation: roleIn .28s ease both;
    }
    .role-card.full-width { grid-column: 1 / -1; }

    .role-a { background: rgba(99,102,241,.12);  border-color: rgba(99,102,241,.4); }
    .role-b { background: rgba(236,72,153,.12);  border-color: rgba(236,72,153,.4); }
    .role-c { background: rgba(245,158,11,.12);  border-color: rgba(245,158,11,.4); }
    .role-d { background: rgba(6,182,212,.12);   border-color: rgba(6,182,212,.4); }
    .role-e { background: rgba(163,230,53,.12);  border-color: rgba(163,230,53,.4); }
    .role-f { background: rgba(217,70,239,.12);  border-color: rgba(217,70,239,.4); }

    .role-letter {
      font-size: .72rem; font-weight: 900; letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 2px;
    }
    .role-a .role-letter { color: #818cf8; }
    .role-b .role-letter { color: #ec4899; }
    .role-c .role-letter { color: #f59e0b; }
    .role-d .role-letter { color: #22d3ee; }
    .role-e .role-letter { color: #a3e635; }
    .role-f .role-letter { color: #d946ef; }

    .role-name {
      font-size: clamp(1rem, 2.5vw, 1.15rem); font-weight: 700; color: #eee;
      line-height: 1.3;
    }
    .role-hint {
      font-size: clamp(.88rem, 2vw, .98rem); color: #999; line-height: 1.5;
      margin-top: 2px;
    }

    /* Rolling text */
    .sc-roll-text {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-weight: 700; color: #eee;
      text-align: center; min-height: 280px;
      display: flex; align-items: center; justify-content: center;
    }

    /* Draw button */
    .btn-draw {
      width: 100%; max-width: 1100px;
      background: #13132b; color: #ec4899; border: 2px solid #ec4899;
      border-radius: 14px; padding: 16px;
      font-size: 1.05rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s;
      animation: fadeUp .5s .3s ease both;
    }
    .btn-draw:hover { background: rgba(236,72,153,.1); }
    .btn-draw:active { transform: scale(.98); }
    .btn-draw:disabled { opacity: .4; cursor: not-allowed; }

    .round-badge span { color: #ec4899; }

    /* Mobile */
    @media (max-width: 560px) {
      .scene-card { padding: 22px 18px; }
      .roles-grid { grid-template-columns: 1fr; }
      .role-card.full-width { grid-column: auto; }
    }

    /* Soft theme ps-btn */
    [data-theme="soft"] .ps-btn { border-color: var(--border); color: var(--text-muted); }
    [data-theme="soft"] .ps-btn:hover  { border-color: #ec4899; color: #be185d; }
    [data-theme="soft"] .ps-btn.active { border-color: #ec4899; color: #be185d; background: rgba(236,72,153,.08); }
    [data-theme="soft"] .ps-label { color: var(--text-faint); }
    [data-theme="soft"] .roles-header { color: var(--text-faint); }
    [data-theme="sunset"] .ps-btn { border-color: var(--border); color: var(--text-muted); }
    [data-theme="sunset"] .ps-btn.active { border-color: #ec4899; color: #ec4899; background: rgba(236,72,153,.13); }
    [data-theme="forest"] .ps-btn { border-color: var(--border); color: var(--text-muted); }
    [data-theme="forest"] .ps-btn.active { border-color: #ec4899; color: #ec4899; background: rgba(236,72,153,.13); }

    /* ── Filter bar ── */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .filter-btn {
      border: 1.5px solid #1e1e42; border-radius: 20px;
      padding: 5px 14px; font-size: .8rem; font-weight: 700;
      color: #555; background: transparent; cursor: pointer;
      transition: border-color .18s, color .18s, background .18s, transform .1s;
      font-family: inherit; white-space: nowrap;
    }
    .filter-btn:hover  { border-color: #ec4899; color: #ec4899; }
    .filter-btn:active { transform: scale(.96); }
    .filter-btn.active { border-color: #ec4899; color: #ec4899; background: rgba(236,72,153,.12); }
    [data-theme="soft"]   .filter-btn { border-color: var(--border); color: var(--text-muted); }
    [data-theme="soft"]   .filter-btn:hover  { border-color: #ec4899; color: #be185d; }
    [data-theme="soft"]   .filter-btn.active { border-color: #ec4899; color: #be185d; background: rgba(236,72,153,.08); }
    [data-theme="sunset"] .filter-btn { border-color: var(--border); color: var(--text-muted); }
    [data-theme="sunset"] .filter-btn:hover  { border-color: #ec4899; color: #ec4899; }
    [data-theme="sunset"] .filter-btn.active { border-color: #ec4899; color: #ec4899; background: rgba(236,72,153,.12); }
    [data-theme="forest"] .filter-btn { border-color: var(--border); color: var(--text-muted); }
    [data-theme="forest"] .filter-btn:hover  { border-color: #ec4899; color: #ec4899; }
    [data-theme="forest"] .filter-btn.active { border-color: #ec4899; color: #ec4899; background: rgba(236,72,153,.12); }

    /* ── Scenario browser ── */
    .scenario-browser {
      width: 100%; max-width: 1100px;
      margin-top: 28px;
    }
    .scenario-browser-hdr {
      font-size: .72rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
      color: #555; margin-bottom: 12px;
    }
    .scenario-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 8px;
    }
    .scenario-item {
      display: flex; align-items: center; gap: 12px;
      background: #13132b; border: 1.5px solid #1e1e42;
      border-radius: 12px; padding: 12px 16px;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .1s;
      font-family: inherit; text-align: left;
    }
    .scenario-item:hover { border-color: #ec4899; background: rgba(236,72,153,.06); }
    .scenario-item:active { transform: scale(.98); }
    .scenario-item.active { border-color: #ec4899; background: rgba(236,72,153,.1); }
    .scenario-emoji { font-size: 1.4rem; flex-shrink: 0; line-height: 1; }
    .scenario-title { font-size: .95rem; font-weight: 600; color: #ccc; line-height: 1.3; }

    [data-theme="soft"] .scenario-item { background: var(--surface); border-color: var(--border); }
    [data-theme="soft"] .scenario-item:hover { border-color: #ec4899; }
    [data-theme="soft"] .scenario-item.active { border-color: #ec4899; background: rgba(236,72,153,.08); }
    [data-theme="soft"] .scenario-title { color: var(--text); }
    [data-theme="sunset"] .scenario-item { background: var(--surface); border-color: var(--border); }
    [data-theme="sunset"] .scenario-item:hover { border-color: #ec4899; }
    [data-theme="sunset"] .scenario-item.active { border-color: #ec4899; }
    [data-theme="sunset"] .scenario-title { color: var(--text); }
    [data-theme="forest"] .scenario-item { background: var(--surface); border-color: var(--border); }
    [data-theme="forest"] .scenario-item:hover { border-color: #ec4899; }
    [data-theme="forest"] .scenario-item.active { border-color: #ec4899; }
    [data-theme="forest"] .scenario-title { color: var(--text); }

    /* ── Theme overrides ── */
    [data-theme="soft"] .scene-card { background: var(--surface); border-color: var(--border); }
    [data-theme="soft"] .scene-card.landed { border-color: #ec4899; }
    [data-theme="soft"] .sc-situation { color: var(--text-dim); }
    [data-theme="soft"] .sc-title { color: var(--text); }
    [data-theme="soft"] .sc-divider { background: var(--divider); }
    [data-theme="soft"] .role-name { color: var(--text); }
    [data-theme="soft"] .role-hint { color: var(--text-muted); }
    [data-theme="soft"] .roles-header { color: var(--text-faint); }
    [data-theme="soft"] .btn-draw { background: var(--surface); }
    [data-theme="soft"] .btn-draw:hover { background: rgba(236,72,153,.07); }

    [data-theme="sunset"] .scene-card { background: var(--surface); border-color: var(--border); }
    [data-theme="sunset"] .scene-card.landed { border-color: #ec4899; }
    [data-theme="sunset"] .sc-situation { color: var(--text-dim); }
    [data-theme="sunset"] .sc-title { color: var(--text); }
    [data-theme="sunset"] .sc-divider { background: var(--divider); }
    [data-theme="sunset"] .role-name { color: var(--text); }
    [data-theme="sunset"] .btn-draw { background: var(--surface); }
    [data-theme="sunset"] .btn-draw:hover { background: var(--border-dim); }

    [data-theme="forest"] .scene-card { background: var(--surface); border-color: var(--border); }
    [data-theme="forest"] .scene-card.landed { border-color: #ec4899; }
    [data-theme="forest"] .sc-situation { color: var(--text-dim); }
    [data-theme="forest"] .sc-title { color: var(--text); }
    [data-theme="forest"] .sc-divider { background: var(--divider); }
    [data-theme="forest"] .role-name { color: var(--text); }
    [data-theme="forest"] .btn-draw { background: var(--surface); }
    [data-theme="forest"] .btn-draw:hover { background: var(--border-dim); }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🎭 You're In The Scene</h1>
    <p>Draw a scenario — everyone gets a role and jumps in. No script, just improv!</p>
  </div>

  <div class="scene-card" id="scene-card" data-emoji="🎭">

    <div class="sc-placeholder" id="sc-placeholder">
      <div class="big-emoji">🎭</div>
      <p>Press <strong>Draw Scene</strong> to reveal your situation and roles</p>
    </div>

    <div class="sc-content" id="sc-content"></div>

  </div>

  <button class="btn-draw" id="draw-btn" onclick="draw()">🎲 Draw Scene</button>

  <div class="scenario-browser">
    <div class="scenario-browser-hdr">📋 All Scenarios (40) — click to load</div>
    <div class="filter-bar" id="filter-bar"></div>
    <div class="scenario-list" id="scenario-list"></div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="rating.js"></script>
  <script src="game-data.js"></script>
  <script>
    GAME_RATING.init('scene');
    const scenarios = GAME_DATA.scene;
    let round   = 0;
    let used    = [];
    let rolling = false;
    let currentScene = null;
    let currentPlayers = 0;

    const ALL_COLORS  = ['a','b','c','d','e','f'];
    const ALL_LETTERS = ['A','B','C','D','E','F'];

    function getRoleData(sc, index) {
      const keys = ['a','b','c','d','e','f'];
      return sc[keys[index]];
    }

    function roleCardHTML(sc, index, extraDelay) {
      const role   = getRoleData(sc, index);
      const letter = ALL_LETTERS[index];
      const color  = ALL_COLORS[index];
      const isOdd  = index % 2 !== 0;   // used to check if it's the last card and lonely
      return `<div class="role-card role-${color}" style="animation-delay:${extraDelay}ms">
        <div class="role-letter">${letter}</div>
        <div class="role-name">${role.label}</div>
        <div class="role-hint">${role.hint}</div>
      </div>`;
    }

    function renderScene(sc) {
      currentScene  = sc;
      currentPlayers = 0;

      const el = document.getElementById('sc-content');
      el.innerHTML = `
        <div class="situation-block">
          <div class="sc-theme-tag">🎭 The Scene</div>
          <div class="sc-title">${sc.emoji} ${sc.title}</div>
          <div class="sc-situation">${sc.situation}</div>
        </div>
        <div class="sc-divider"></div>
        <div class="ps-wrap">
          <div class="ps-label">How many players?</div>
          <div class="ps-btns" id="ps-btns">
            ${[2,3,4,5,6].map(n =>
              `<button class="ps-btn" onclick="setPlayers(${n})">${n}</button>`
            ).join('')}
          </div>
        </div>
        <div class="sc-divider" id="roles-divider" style="display:none"></div>
        <div class="roles-header" id="roles-header" style="display:none">
          🎪 Your Roles — Pick one and play it!
        </div>
        <div class="roles-grid" id="roles-grid">
          <div class="role-card role-a">
            <div class="role-letter">A</div>
            <div class="role-name">${sc.a.label}</div>
            <div class="role-hint">${sc.a.hint}</div>
          </div>
        </div>`;
      el.classList.add('show');
    }

    function setPlayers(n) {
      if (!currentScene) return;
      currentPlayers = n;

      /* Update active button */
      document.querySelectorAll('.ps-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.textContent) === n);
      });

      /* Show roles divider + header */
      document.getElementById('roles-divider').style.display = '';
      document.getElementById('roles-header').style.display  = '';

      /* Re-render roles grid */
      const grid = document.getElementById('roles-grid');
      grid.style.gridTemplateColumns = (n === 2 || n === 4) ? '1fr 1fr' : 'repeat(3, 1fr)';
      grid.innerHTML = '';
      for (let i = 0; i < n; i++) {
        const role   = getRoleData(currentScene, i);
        const letter = ALL_LETTERS[i];
        const color  = ALL_COLORS[i];
        const div    = document.createElement('div');
        div.className = `role-card role-${color}`;
        div.style.animationDelay = (i * 55) + 'ms';
        div.innerHTML = `
          <div class="role-letter">${letter}</div>
          <div class="role-name">${role.label}</div>
          <div class="role-hint">${role.hint}</div>`;
        grid.appendChild(div);
      }
    }

    /* ── Scenario browser ── */
    let activeCat = '';

    function filterBy(cat) {
      activeCat = cat;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
      document.querySelectorAll('.scenario-item').forEach(item => {
        item.style.display = (!cat || item.dataset.cat === cat) ? '' : 'none';
      });
    }

    (function buildList() {
      const filterBar = document.getElementById('filter-bar');
      const list = document.getElementById('scenario-list');

      const cats = [];
      scenarios.forEach(sc => { if (sc.cat && !cats.includes(sc.cat)) cats.push(sc.cat); });

      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn active';
      allBtn.textContent = 'All';
      allBtn.dataset.cat = '';
      allBtn.addEventListener('click', () => filterBy(''));
      filterBar.appendChild(allBtn);

      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = cat;
        btn.dataset.cat = cat;
        btn.addEventListener('click', () => filterBy(cat));
        filterBar.appendChild(btn);
      });

      scenarios.forEach((sc, i) => {
        const btn = document.createElement('button');
        btn.className = 'scenario-item';
        btn.dataset.idx = i;
        btn.dataset.cat = sc.cat || '';
        btn.innerHTML = `<span class="scenario-emoji">${sc.emoji}</span><span class="scenario-title">${sc.title}</span>`;
        btn.addEventListener('click', () => loadScenario(sc, i));
        list.appendChild(btn);
      });
    })();

    function loadScenario(sc, idx) {
      const card = document.getElementById('scene-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      ph.style.display = 'none';
      card.classList.remove('rolling');
      card.classList.add('landed');
      card.setAttribute('data-emoji', sc.emoji);
      ct.classList.remove('show');
      ct.innerHTML = '';
      renderScene(sc);

      round++;
      document.getElementById('roundNum').textContent = round;
      document.getElementById('draw-btn').textContent = '🔁 Next Scene';

      document.querySelectorAll('.scenario-item').forEach(el => {
        el.classList.toggle('active', +el.dataset.idx === idx);
      });

      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      GAME_RATING.showFor(GAME_RATING.hash(sc.title));
    }

    function draw() {
      if (rolling) return;
      rolling = true;

      const btn  = document.getElementById('draw-btn');
      const card = document.getElementById('scene-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      btn.disabled = true;
      card.classList.remove('landed');
      card.classList.add('rolling');
      ph.style.display = 'none';
      ct.classList.remove('show');
      ct.innerHTML = `<div class="sc-roll-text" id="roll-text">Drawing…</div>`;
      ct.classList.add('show');

      let avail = scenarios.map((_,i) => i).filter(i => !used.includes(i));
      if (!avail.length) { used = []; avail = scenarios.map((_,i) => i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      used.push(fi);

      GAME_RATING.hide();
      let n = 0, count = 22;
      const iv = setInterval(() => {
        const rnd = scenarios[Math.floor(Math.random() * scenarios.length)];
        document.getElementById('roll-text').textContent = rnd.emoji + ' ' + rnd.title;
        if (++n >= count) {
          clearInterval(iv);
          const sc = scenarios[fi];
          card.setAttribute('data-emoji', sc.emoji);
          ct.classList.remove('show');
          ct.innerHTML = '';
          renderScene(sc);
          card.classList.remove('rolling');
          card.classList.add('landed');
          round++;
          document.getElementById('roundNum').textContent = round;
          btn.textContent = '🔁 Next Scene';
          btn.disabled    = false;
          rolling = false;
          document.querySelectorAll('.scenario-item').forEach(el => el.classList.remove('active'));
          GAME_RATING.showFor(GAME_RATING.hash(sc.title));
        }
      }, 85);
    }
  </script>
</body>
</html>
