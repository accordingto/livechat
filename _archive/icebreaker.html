<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Would You Rather</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(72px, calc(env(safe-area-inset-bottom) + 24px)) max(20px, env(safe-area-inset-left));
    }

    /* ── Topbar ── */
    .topbar {
      width: 100%; max-width: 860px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 36px;
    }
    a.back { color: #555; text-decoration: none; font-size: 14px; transition: color .2s; }
    a.back:hover { color: #eee; }
    .round-badge { font-size: 12px; color: #444; }
    .round-badge span { color: #e94560; font-weight: 700; }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 28px; }
    .header h1 {
      font-size: clamp(2rem, 5vw, 3rem); font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #e94560);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .header p { color: #666; font-size: .93rem; }


    /* ── Arena ── */
    .arena {
      width: 100%; max-width: 860px;
      display: flex;
      align-items: stretch;
      gap: 0;
      margin-bottom: 36px;
    }

    /* ── Option cards ── */
    .option-card {
      flex: 1;
      background: linear-gradient(150deg, #13132b 0%, #0f0f22 100%);
      border: 2px solid #1e1e42;
      border-radius: 24px;
      padding: 52px 32px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 260px;
      position: relative;
      overflow: hidden;
      transition: border-color .5s, box-shadow .5s, transform .3s;
    }

    /* large faded letter watermark */
    .option-card::before {
      content: attr(data-letter);
      position: absolute;
      font-size: 16rem;
      font-weight: 900;
      color: rgba(233,69,96,.045);
      right: -24px;
      bottom: -48px;
      line-height: 1;
      pointer-events: none;
      user-select: none;
      transition: color .5s;
    }

    .option-card.active {
      border-color: #e94560;
      box-shadow: 0 0 48px rgba(233,69,96,.14), inset 0 0 48px rgba(233,69,96,.04);
    }
    .option-card.active::before { color: rgba(233,69,96,.08); }

    /* top label tab */
    .opt-label {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      background: #e94560;
      color: #fff;
      font-size: 10px; font-weight: 900;
      letter-spacing: 2.5px; text-transform: uppercase;
      padding: 6px 22px;
      border-radius: 0 0 14px 14px;
      white-space: nowrap;
    }

    .question-text {
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      font-weight: 700;
      line-height: 1.65;
      color: #eee;
      position: relative;
      z-index: 1;
      transition: opacity .15s;
    }
    .question-text.placeholder { color: #252545; font-weight: 400; font-size: .95rem; }

    /* rolling flicker */
    @keyframes flicker {
      0%,100% { opacity: 1; }
      50%      { opacity: .25; }
    }
    .option-card.rolling .question-text { animation: flicker .1s linear infinite; }

    /* landing pulse */
    @keyframes pulse-border {
      0%   { box-shadow: 0 0 0   rgba(233,69,96,0); }
      40%  { box-shadow: 0 0 60px rgba(233,69,96,.35); }
      100% { box-shadow: 0 0 48px rgba(233,69,96,.14); }
    }
    .option-card.landed { animation: pulse-border .6s ease forwards; }

    /* ripple */
    @keyframes ripple { from{transform:scale(0);opacity:.35} to{transform:scale(6);opacity:0} }
    .ripple-el {
      position: absolute; width: 60px; height: 60px; border-radius: 50%;
      background: #e94560; pointer-events: none;
      animation: ripple .8s ease-out forwards;
      left: 50%; top: 50%; margin: -30px 0 0 -30px; z-index: 0;
    }

    /* ── VS divider ── */
    .vs-wrap {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 0 20px; z-index: 2;
    }
    .vs-badge {
      width: 64px; height: 64px;
      background: radial-gradient(circle at 38% 38%, #e94560, #8b1a2e);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; font-weight: 900; color: #fff; letter-spacing: 1px;
      box-shadow: 0 0 28px rgba(233,69,96,.45), 0 0 8px rgba(233,69,96,.2);
      border: 2px solid rgba(233,69,96,.4);
      flex-shrink: 0;
    }

    /* ── Status ── */
    .status {
      width: 100%; max-width: 860px;
      text-align: center;
      font-size: .9rem; color: #555;
      margin-bottom: 28px; min-height: 1.4em;
      transition: color .3s;
    }
    .status.ready { color: #e94560; font-weight: 600; }

    /* ── Button ── */
    .btn-row { display: flex; gap: 12px; justify-content: center; }
    .btn {
      border: none; border-radius: 999px; padding: 18px 56px;
      font-size: 1.05rem; font-weight: 800; cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s, box-shadow .2s; letter-spacing: .5px;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-draw {
      background: #e94560; color: #fff;
      box-shadow: 0 6px 28px rgba(233,69,96,.35);
    }
    .btn-draw:hover:not(:disabled) {
      background: #f0617a;
      box-shadow: 0 8px 36px rgba(233,69,96,.5);
    }

    /* ── Mobile ── */
    @media (max-width: 560px) {
      .arena { flex-direction: column; gap: 0; }
      .vs-wrap { padding: 14px 0; }
      .option-card { min-height: 160px; padding: 40px 20px 32px; }
      .option-card::before { font-size: 10rem; }
      .btn { padding: 16px 32px; font-size: .98rem; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🎲 Would You Rather?</h1>
    <p>Two choices. No right answer. Debate away!</p>
  </div>


  <div class="arena">
    <div class="option-card" id="cardA" data-letter="A">
      <span class="opt-label">Question A</span>
      <span class="question-text placeholder" id="textA">Press Draw to start</span>
    </div>

    <div class="vs-wrap">
      <div class="vs-badge">VS</div>
    </div>

    <div class="option-card" id="cardB" data-letter="B">
      <span class="opt-label">Question B</span>
      <span class="question-text placeholder" id="textB">Press Draw to start</span>
    </div>
  </div>

  <div class="status" id="status">Click Draw to reveal two dilemmas</div>

  <div class="btn-row">
    <button class="btn btn-draw" id="drawBtn" onclick="draw()">🎲 Draw!</button>
  </div>

  <script>
    const questions = [
      // Food & Daily Life
      "Would you rather eat your least favourite food every day for a year or never eat your favourite food again?",
      "Would you rather have to eat everything with chopsticks or eat everything with your bare hands for the rest of your life?",
      "Would you rather cook every single meal yourself from scratch or never be allowed to cook again?",
      "Would you rather have to sing your order at every restaurant or do a cartwheel before entering any building?",
      "Would you rather drink only water for the rest of your life or give up your single favourite food forever?",
      "Would you rather eat a full meal in 60 seconds every time or spend two hours at every single meal?",
      "Would you rather only eat food that is white or only eat food that is green for the rest of your life?",
      "Would you rather have free food from one restaurant for life or free flights anywhere in the world forever?",
      "Would you rather always be a little bit hungry or always be a little bit too full?",
      "Would you rather have a personal chef who only cooks food you hate or cook for yourself forever?",

      // Superpowers
      "Would you rather speak every language in the world but never enjoy music or love music perfectly but only speak your native language?",
      "Would you rather be able to fly but only as fast as jogging or run on the ground at 300 km/h?",
      "Would you rather have a pause button or a delete button for your life?",
      "Would you rather talk to animals but they all dislike you or read minds but only ever hear boring thoughts?",
      "Would you rather age at half the normal rate starting now or go back to age 18 with none of your current knowledge?",
      "Would you rather have perfect balance and never fall or never feel physical pain again?",
      "Would you rather be able to see one minute into the future or remember everything from the past perfectly?",
      "Would you rather be invisible but only in crowds or fly but only at night?",
      "Would you rather have a superpower that only works on Tuesdays or a very weak superpower that works every day?",
      "Would you rather be able to stop time or rewind it by 30 seconds whenever you want?",

      // Social & Relationships
      "Would you rather know exactly what everyone thinks of you or never know what anyone thinks of you?",
      "Would you rather have one best friend who would do absolutely anything for you or fifty good friends who each help a little?",
      "Would you rather always be the most interesting person in any room or always be the most comfortable person in any room?",
      "Would you rather be famous for five minutes and then completely forgotten or never famous but deeply loved by a small group?",
      "Would you rather always say exactly what you are thinking or never be able to express your feelings at all?",
      "Would you rather know the exact date you will die or know exactly how you will die?",
      "Would you rather have no enemies but also no deep friendships or have intense enemies and incredibly loyal friends?",
      "Would you rather always be the one who loves more in a relationship or always be the one who is loved more?",
      "Would you rather receive 100 texts a day from people you barely know or never receive any message unless you send first?",
      "Would you rather be liked by everyone but trusted by nobody or trusted completely by just a few people?",

      // Career & Money
      "Would you rather have your dream job that pays very little or a job you find boring that makes you very rich?",
      "Would you rather work 80 hours a week doing something you love or 10 hours a week doing something meaningless?",
      "Would you rather be the best in the world at something nobody cares about or mediocre at the most admired skill on earth?",
      "Would you rather have complete job security with no chance of promotion or unlimited potential but constant risk of losing everything?",
      "Would you rather be incredibly wealthy but work every single day or comfortably middle-class with all the free time you want?",
      "Would you rather be your own boss with an unpredictable income or someone's employee with a guaranteed salary?",
      "Would you rather start a business that might fail or have a stable career that never gets exciting?",
      "Would you rather retire at 35 with just enough money or retire at 70 with more than you could ever spend?",

      // Travel & Adventure
      "Would you rather visit every country once and never return or revisit your three favourite places as often as you like?",
      "Would you rather travel alone for a full year or stay home for a year with your favourite people?",
      "Would you rather explore the deepest part of the ocean or the surface of Mars?",
      "Would you rather travel in extreme luxury once a year or travel budget-style as many times as you want?",
      "Would you rather live in a different country every year or stay in one place your whole life?",
      "Would you rather always travel with a packed itinerary or always travel with no plan at all?",

      // Technology & Modern Life
      "Would you rather lose your phone for a month or permanently lose every photo and message you have ever saved?",
      "Would you rather have a robot that does all your chores but constantly talks back or do everything yourself in complete peace?",
      "Would you rather live in a world where AI does all creative work or one where AI does all physical labour?",
      "Would you rather have unlimited internet but pay real money for everything or have everything in the world be free but no internet?",
      "Would you rather your search history be made public or your bank statements?",
      "Would you rather have a social media account that only shows your embarrassing moments or have no social media at all?",

      // Funny & Absurd
      "Would you rather have a laugh that sounds like a foghorn or sneeze every single time you try to tell a lie?",
      "Would you rather only be able to speak in questions or only be able to speak in rhyme?",
      "Would you rather have a dramatic movie theme song play every time you enter a room or have subtitles appear below your face when you talk?",
      "Would you rather sweat maple syrup or cry glitter?",
      "Would you rather narrate everything you do out loud or have a documentary crew follow you everywhere for a year?",
      "Would you rather have legs as long as your fingers or fingers as long as your legs?",
      "Would you rather always speak in a random accent or always speak at double your normal speed?",
      "Would you rather hiccup every time someone says your name or burp every time you say thank you?",
      "Would you rather have a tail that wags when you are happy or ears that go flat when you are nervous?",
      "Would you rather fight one horse-sized cat or fifty cat-sized horses?",

      // Life & Big Choices
      "Would you rather live to 150 looking 80 from age 40 or live only to 60 feeling 25 the entire time?",
      "Would you rather remember everything perfectly but never forget anything painful or forget easily but lose precious memories too?",
      "Would you rather always know the right thing to say but feel nothing or feel deeply but never find the right words?",
      "Would you rather go back to age 10 knowing what you know now or fast-forward to age 60 to see how your life turned out?",
      "Would you rather be an only child with very wealthy parents or one of five siblings in a close, ordinary family?",
      "Would you rather be incredibly lucky all your life or incredibly talented with no luck whatsoever?",
      "Would you rather have the last laugh in every argument or always be the bigger person who walks away?",
      "Would you rather live a safe, comfortable life with no big risks or a wild, unpredictable life with no safety net?",
      "Would you rather always have something exciting to look forward to or always feel completely content with right now?",
      "Would you rather know what your life will look like in 10 years or be completely surprised?",

      // Knowledge & Skills
      "Would you rather know everything about one subject or know a little about every subject?",
      "Would you rather have a perfect memory but no creativity or be wildly creative but forget things easily?",
      "Would you rather instantly answer any question or learn any skill in a single day?",
      "Would you rather be a brilliant student who hates learning or an average student who genuinely loves it?",
      "Would you rather speak at a packed stadium or perform a song in front of everyone you know?",

      // Fame & Recognition
      "Would you rather be incredibly famous for something embarrassing or completely unknown for something extraordinary?",
      "Would you rather be the funniest person alive but never taken seriously or the wisest person alive but have no sense of humour?",
      "Would you rather win an Oscar or a Nobel Prize?",
      "Would you rather be a legendary musician who dies at 30 or a mediocre musician who lives happily to 100?",
      "Would you rather be famous during your lifetime and forgotten after or unknown now but celebrated for centuries after you are gone?",
    ];

    let rolling = false, round = 0;
    let usedA = -1, usedB = -1;

    function randomPair() {
      let i, j;
      do { i = Math.floor(Math.random() * questions.length); } while (i === usedA || i === usedB);
      do { j = Math.floor(Math.random() * questions.length); } while (j === i || j === usedA || j === usedB);
      return [i, j];
    }

    function triggerRipple(card) {
      const el = document.createElement('div');
      el.className = 'ripple-el';
      card.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    function draw() {
      if (rolling) return;
      rolling = true;

      const btn   = document.getElementById('drawBtn');
      const cardA = document.getElementById('cardA');
      const cardB = document.getElementById('cardB');
      const tA    = document.getElementById('textA');
      const tB    = document.getElementById('textB');
      const status = document.getElementById('status');

      btn.disabled = true;
      cardA.classList.remove('active', 'landed');
      cardB.classList.remove('active', 'landed');
      cardA.classList.add('rolling');
      cardB.classList.add('rolling');
      tA.className = 'question-text';
      tB.className = 'question-text';
      status.className = 'status';
      status.textContent = 'Drawing…';

      triggerRipple(cardA);
      setTimeout(() => triggerRipple(cardB), 140);

      const [fi, fj] = randomPair();
      let ticks = 0;

      const iv = setInterval(() => {
        const [i, j] = randomPair();
        tA.textContent = questions[i];
        tB.textContent = questions[j];
        ticks++;

        if (ticks >= 26) {
          clearInterval(iv);
          usedA = fi; usedB = fj;
          round++;
          document.getElementById('roundNum').textContent = round;

          tA.textContent = questions[fi];
          cardA.classList.remove('rolling');
          cardA.classList.add('active', 'landed');

          setTimeout(() => {
            tB.textContent = questions[fj];
            cardB.classList.remove('rolling');
            cardB.classList.add('active', 'landed');

            status.textContent = 'Pick A or B — type your choice in chat at the same time!';
            status.className = 'status ready';
            btn.disabled = false;
            rolling = false;
          }, 180);
        }
      }, 82);
    }
  </script>

</body>
</html>
