<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Describe the Scene</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(72px, calc(env(safe-area-inset-bottom) + 24px)) max(20px, env(safe-area-inset-left));
      position: relative;
      overflow-x: hidden;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .topbar {
      width: 100%; max-width: 820px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 32px;
      position: relative; z-index: 1;
      animation: fadeUp .5s ease both;
      animation-delay: 0s;
    }
    a.back { color: #555; text-decoration: none; font-size: 14px; transition: color .2s; }
    a.back:hover { color: #eee; }
    .round-badge { font-size: 12px; color: #444; }
    .round-badge span { color: #22c55e; font-weight: 700; }

    .header {
      text-align: center; margin-bottom: 28px;
      position: relative; z-index: 1;
      animation: fadeUp .5s ease both;
      animation-delay: .1s;
    }
    .header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #22c55e);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .header p { color: #666; font-size: .93rem; }


    /* ── Image card ── */
    .img-card {
      width: 100%; max-width: 820px;
      background: #13132b; border: 2px solid #1e1e42; border-radius: 20px;
      overflow: hidden; margin-bottom: 16px;
      transition: border-color .4s, box-shadow .4s;
      position: relative; z-index: 1;
      animation: fadeUp .5s ease both;
      animation-delay: .2s;
    }
    .img-card.active {
      border-color: #22c55e;
      box-shadow: 0 0 60px rgba(34,197,94,.18), inset 0 0 0 0 transparent;
      animation: fadeUp .5s ease both, pulse-border 3s ease-in-out infinite;
      animation-delay: .2s, 0s;
    }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 60px rgba(34,197,94,.18), inset 0 0 0 0 transparent; }
      50%       { box-shadow: 0 0 80px rgba(34,197,94,.32), inset 0 0 0 0 transparent; }
    }

    .img-meta {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 20px; border-bottom: 1px solid #1a1a38;
    }
    .cat-pill {
      background: rgba(34,197,94,.12); color: #22c55e;
      border-radius: 999px; padding: 5px 18px;
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      box-shadow: 0 0 14px rgba(34,197,94,.2);
    }
    .diff { display: flex; gap: 4px; margin-left: auto; }
    .diff span { width: 8px; height: 8px; border-radius: 50%; background: #1e1e42; }
    .diff span.on { background: #22c55e; }

    .img-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      background: #0a0a18;
    }

    .scene-img {
      position: absolute;
      inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      opacity: 0;
      transform: scale(1);
      transition: opacity .5s ease, transform .6s ease;
      display: block;
    }
    .scene-img.loaded { opacity: 1; transform: scale(1.02); }

    .img-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(ellipse at center, rgba(15,15,34,.8) 0%, transparent 70%);
    }
    .ph-icon {
      font-size: 4rem;
      color: #2a2a50;
      filter: drop-shadow(0 0 12px rgba(34,197,94,.3));
    }
    .ph-text {
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .6px;
      font-weight: 500;
      color: #3a3a6a;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #1e1e42; border-top-color: #22c55e;
      border-radius: 50%; animation: spin .7s linear infinite;
    }

    /* ── Status bar ── */
    .status-bar {
      width: 100%; max-width: 820px;
      text-align: center; font-size: .9rem; color: #555;
      margin-bottom: 20px; min-height: 1.4em;
      transition: color .3s;
      position: relative; z-index: 1;
      animation: fadeUp .5s ease both;
      animation-delay: .3s;
    }
    .status-bar.active { color: #22c55e; font-weight: 600; }

    /* ── Vocab hints ── */
    .hints-panel {
      width: 100%; max-width: 820px; margin-bottom: 24px;
      position: relative; z-index: 1;
      animation: fadeUp .5s ease both;
      animation-delay: .4s;
    }
    .hints-toggle {
      width: 100%; background: #13132b; border: 1px solid #1e1e42;
      border-radius: 12px; padding: 13px 20px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; color: #777; font-size: .88rem; font-family: inherit;
      transition: border-color .2s, color .2s, box-shadow .2s;
    }
    .hints-toggle:hover {
      border-color: #22c55e;
      color: #eee;
      box-shadow: -3px 0 14px rgba(34,197,94,.15);
    }
    .hints-toggle .arrow { transition: transform .25s; }
    .hints-toggle.open .arrow { transform: rotate(180deg); }
    .hints-body {
      display: none; padding: 16px 20px;
      background: #0f0f22; border: 1px solid #1e1e42; border-top: none;
      border-radius: 0 0 12px 12px; flex-wrap: wrap; gap: 10px;
    }
    .hints-body.open { display: flex; }
    .hint-chip {
      background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.25);
      color: #86efac; border-radius: 999px; padding: 5px 14px; font-size: .85rem;
      transition: transform .15s, box-shadow .15s;
    }
    .hint-chip:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(34,197,94,.2);
      cursor: default;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
      position: relative; z-index: 1;
      animation: fadeUp .5s ease both;
      animation-delay: .5s;
    }
    .btn {
      border: none; border-radius: 999px; padding: 15px 40px;
      font-size: 1rem; font-weight: 800; cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s, opacity .2s, box-shadow .2s; letter-spacing: .3px;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-draw {
      background: #22c55e; color: #0d0d1a;
      box-shadow: 0 4px 24px rgba(34,197,94,.3);
    }
    .btn-draw:hover:not(:disabled) {
      background: #4ade80;
      box-shadow: 0 6px 36px rgba(34,197,94,.5);
      transform: translateY(-2px);
    }
    .btn-skip { background: #13132b; color: #555; border: 1px solid #1e1e42; padding: 14px 28px; }
    .btn-skip:hover:not(:disabled) { border-color: #555; color: #aaa; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🖼️ Describe the Scene</h1>
    <p>Look at the photo — then describe what you see in English!</p>
  </div>


  <div class="img-card" id="imgCard">
    <div class="img-meta">
      <span class="cat-pill" id="catPill">Scene</span>
      <div class="diff" id="diffDots"><span></span><span></span><span></span></div>
    </div>
    <div class="img-wrap" id="imgWrap">
      <div class="img-overlay" id="overlay">
        <span class="ph-icon">🖼️</span>
        <span class="ph-text">Press Draw to load a scene</span>
      </div>
      <img class="scene-img" id="sceneImg" alt="Scene to describe" />
    </div>
  </div>

  <div class="status-bar" id="statusBar">Press Draw to start a round</div>

  <div class="hints-panel">
    <button class="hints-toggle" id="hintsToggle" onclick="toggleHints()">
      <span>💡 Vocabulary Hints</span>
      <span class="arrow">▼</span>
    </button>
    <div class="hints-body" id="hintsBody"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-draw" id="drawBtn" onclick="draw()">🎲 Draw Scene</button>
    <button class="btn btn-skip" id="skipBtn" onclick="skip()" disabled>Skip ›</button>
  </div>

  <script>
    const CDN = id =>
      `https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg` +
      `?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop`;

    const scenes = [
      // ── Café & Coffee Shop ─────────────────────────────────────────────
      { id:302899,  cat:'Café',        diff:1, hints:['chatting','sitting across','cups of coffee','cozy','leaning in','casual conversation'] },
      { id:1251175, cat:'Café',        diff:2, hints:['barista','serving','counter','customer','handing over','making coffee'] },

      // ── Restaurant & Dining ────────────────────────────────────────────

      { id:1267320, cat:'Restaurant',  diff:2, hints:['group dinner','raising glasses','toasting','celebration','smiling','sharing dishes'] },

      // ── Work & Meeting ─────────────────────────────────────────────────
      { id:3184291, cat:'Meeting',     diff:2, hints:['colleagues','conference table','documents','taking notes','discussion','boardroom'] },
      { id:3184292, cat:'Meeting',     diff:2, hints:['team','office','gathered around table','professional','focused','planning'] },
      { id:1181519, cat:'Work',        diff:1, hints:['laptops','open workspace','side by side','pointing at screen','collaboration','casual office'] },
      { id:1181622, cat:'Work',        diff:2, hints:['desk','busy office','paperwork','colleagues nearby','focused','professional setting'] },
      { id:3184339, cat:'Workshop',    diff:2, hints:['sticky notes','wall covered','standing','brainstorming','creative session','colourful'] },
      { id:3184418, cat:'Work',        diff:1, hints:['team around laptop','leaning in','explaining','screen sharing','informal meeting','desk'] },
      { id:3184465, cat:'Work',        diff:2, hints:['presenter','whiteboard','audience','gesturing','explaining','listening attentively'] },
      { id:2422281, cat:'Video Call',  diff:2, hints:['laptop screen','smiling at camera','remote meeting','headphones','home office','waving'] },
      { id:3184357, cat:'Interview',   diff:3, hints:['formal setting','across the desk','notepad','eye contact','interviewer','candidate'] },
      { id:3184319, cat:'People',      diff:2, hints:['group','interaction','indoor','casual','people','social'] },

      // ── Friends & Social ───────────────────────────────────────────────
      { id:1438081, cat:'Friends',     diff:1, hints:['group of friends','smiling','arms around each other','outdoor','relaxed','sunny'] },
      { id:3182812, cat:'Friends',     diff:1, hints:['diverse group','laughing together','candid moment','joy','natural','unposed'] },
      { id:1267321, cat:'Friends',     diff:1, hints:['outdoor','walking together','backpacks','talking','side by side','path'] },
      { id:2007647, cat:'Party',       diff:2, hints:['celebration','drinks','laughter','crowded','festive','background chatter'] },
      { id:1456951, cat:'Friends',     diff:2, hints:['selfie','group photo','big smiles','close together','fun moment','phone camera'] },
      { id:3184360, cat:'People',      diff:2, hints:['group','social','people','interaction','candid','diverse'] },

      // ── Family ─────────────────────────────────────────────────────────
      { id:3823488, cat:'Family',      diff:1, hints:['parents','children','living room','warm','bonding','everyday life'] },
      { id:1128318, cat:'Family',      diff:1, hints:['family at table','meal time','passing food','conversation','home kitchen','together'] },
      { id:3771074, cat:'Family',      diff:2, hints:['cooking together','apron','parent and child','mixing bowl','teaching','laughing'] },
      { id:2253938, cat:'Family',      diff:2, hints:['grandparent','grandchild','generations','reading together','warmth','garden'] },
      { id:1648374, cat:'Family',      diff:1, hints:['children playing','backyard','running','carefree','laughter','sunny afternoon'] },

      // ── Market & Street ────────────────────────────────────────────────
      { id:1005638, cat:'Market',      diff:2, hints:['market stall','vendor','customer','fresh produce','browsing','transaction'] },
      { id:374870,  cat:'Street',      diff:3, hints:['busy sidewalk','pedestrians','urban','crosswalk','rushing','city crowd'] },
      { id:2291558, cat:'Street Food', diff:2, hints:['food stall','outdoor cooking','queue','ordering','street','aroma'] },
      { id:1581339, cat:'Community',   diff:3, hints:['group outdoor','organized activity','working together','community','diverse','purposeful'] },

      // ── Education ──────────────────────────────────────────────────────
      { id:1560932, cat:'Classroom',   diff:1, hints:['students','teacher at front','whiteboard','lesson','attentive','seated in rows'] },
      { id:3807571, cat:'Classroom',   diff:2, hints:['small group','discussion','engaged','leaning in','notes','classroom setting'] },
      { id:5212345, cat:'Library',     diff:2, hints:['studying','books spread','concentration','desk','quiet','research'] },
      { id:3184287, cat:'Study Group', diff:2, hints:['students together','laptops','debate','group work','campus','whiteboard nearby'] },

      // ── Sport & Outdoor ────────────────────────────────────────────────
      { id:3764568, cat:'Sport',       diff:2, hints:['team celebrating','arms up','victory','jerseys','cheering','group energy'] },
      { id:1321909, cat:'Training',    diff:2, hints:['coach','instruction','athlete','gesturing','field','listening'] },
      { id:2526878, cat:'Outdoor',     diff:1, hints:['hiking','trail','friends','nature','backpacks','resting and chatting'] },
      { id:3621300, cat:'Sport',       diff:2, hints:['team huddle','pre-game','captain speaking','hands in','strategy','focus'] },

      // ── Lifestyle ──────────────────────────────────────────────────────
      { id:1036623, cat:'Café',        diff:1, hints:['friends','laughing','coffee table','relaxed','catching up','warm atmosphere'] },
      { id:1181686, cat:'Lifestyle',   diff:2, hints:['person','expression','indoor','casual','lifestyle','candid'] },
      { id:2379004, cat:'Lifestyle',   diff:1, hints:['person','smiling','casual','happy','natural','relaxed'] },
      { id:1681010, cat:'Lifestyle',   diff:2, hints:['person','action','outdoor','movement','candid','lifestyle'] },
      { id:1484516, cat:'Lifestyle',   diff:2, hints:['person','expression','close-up','emotional','candid','moment'] },
      { id:3771807, cat:'Lifestyle',   diff:2, hints:['person','lifestyle','candid','expression','indoor','everyday'] },
      { id:1587014, cat:'Lifestyle',   diff:2, hints:['scene','everyday','people','candid','lifestyle','environment'] },
      { id:1547813, cat:'Lifestyle',   diff:3, hints:['detail','texture','close-up','artistic','lifestyle','atmosphere'] },
      { id:1006965, cat:'Lifestyle',   diff:2, hints:['person','outdoor','activity','lifestyle','casual','movement'] },
      { id:2531803, cat:'Lifestyle',   diff:2, hints:['people','activity','outdoor','lifestyle','candid','scene'] },
      { id:3807517, cat:'Lifestyle',   diff:2, hints:['people','social','indoor','lifestyle','everyday','scene'] },
      { id:1058553, cat:'Lifestyle',   diff:2, hints:['scene','everyday','lifestyle','casual','indoor','environment'] },
      { id:2182975, cat:'Lifestyle',   diff:2, hints:['person','outdoor','expression','candid','natural','lifestyle'] },
      { id:3396122, cat:'Outdoor',     diff:2, hints:['outdoor','nature','scene','light','environment','natural'] },
      { id:2523823, cat:'Lifestyle',   diff:2, hints:['people','candid','everyday','social','natural','scene'] },
      { id:2613392, cat:'Lifestyle',   diff:3, hints:['action','unexpected','people','outdoor','moment','candid'] },
      { id:1619690, cat:'Outdoor',     diff:2, hints:['outdoor','light','natural','environment','scene','wide angle'] },
      { id:3771836, cat:'Lifestyle',   diff:2, hints:['person','expression','dramatic','indoor','close-up','lifestyle'] },
      { id:1643379, cat:'Lifestyle',   diff:2, hints:['people','indoor','social','everyday','environment','scene'] },
      { id:1851164, cat:'Outdoor',     diff:2, hints:['outdoor','nature','light','scenic','environment','wide view'] },
      { id:3807534, cat:'Lifestyle',   diff:2, hints:['people','activity','everyday','lifestyle','candid','scene'] },
      { id:2065491, cat:'Lifestyle',   diff:2, hints:['people','lifestyle','everyday','casual','environment','scene'] },

      // ── Animals ────────────────────────────────────────────────────────
      { id:220968,  cat:'Animals',     diff:1, hints:['dog','outdoor','grass','energetic','happy','playful'] },
      { id:1108099, cat:'Animals',     diff:1, hints:['cat','indoor','resting','whiskers','expressive','comfortable'] },
      { id:45201,   cat:'Animals',     diff:1, hints:['dog','tongue out','close-up','happy','fur','cute'] },
      { id:2253275, cat:'Animals',     diff:1, hints:['dog','wide eyes','close-up','surprised','fur','funny expression'] },
      { id:320014,  cat:'Animals',     diff:1, hints:['cat','close-up','face','indoor','curious','bright eyes'] },
      { id:991831,  cat:'Animals',     diff:1, hints:['cat','yawning','teeth','stretching','indoor','relaxed'] },
      { id:984950,  cat:'Animals',     diff:1, hints:['pug','wrinkles','close-up','dog','indoor','funny face'] },
      { id:39317,   cat:'Animals',     diff:2, hints:['primate','wildlife','tree','nature','looking','outdoor'] },
      { id:247376,  cat:'Animals',     diff:1, hints:['bird','colourful','perched','bright feathers','tropical','close-up'] },
      { id:617278,  cat:'Animals',     diff:2, hints:['animals','outdoor','natural habitat','looking','alert','wildlife'] },
      { id:2023384, cat:'Animals',     diff:2, hints:['dog','water','swimming','outdoor','wet','energetic'] },
      { id:1490908, cat:'Animals',     diff:1, hints:['cat','window','looking outside','indoor','curious','light'] },
      { id:1543793, cat:'Animals',     diff:2, hints:['cat','reflection','mirror','curious','indoor','close-up'] },
      { id:1805164, cat:'Animals',     diff:1, hints:['cat','sitting upright','indoor','staring','comfortable','fur'] },
      { id:3361739, cat:'Animals',     diff:1, hints:['dog','glasses','close-up','funny','wearing','indoor'] },
      { id:2607544, cat:'Animals',     diff:2, hints:['animal','outdoor','natural','close-up','wildlife','looking'] },
      { id:4587990, cat:'Animals',     diff:2, hints:['animal','outdoor','nature','close-up','wild','alert'] },
      { id:1619683, cat:'Outdoor',     diff:2, hints:['outdoor','scenic','natural','landscape','light','wide view'] },
    ];

    let pool = [], failedIds = new Set();
    let round = 0, hintsOpen = false;
    let current = null, busy = false;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function refillPool() {
      const available = scenes.filter(s => !failedIds.has(s.id));
      pool = shuffle(available.length ? available : scenes);
      if (!available.length) failedIds.clear();
    }

    function setDiff(n) {
      document.querySelectorAll('.diff span').forEach((el, i) => el.classList.toggle('on', i < n));
    }

    function setStatus(text, active) {
      const el = document.getElementById('statusBar');
      el.textContent = text;
      el.classList.toggle('active', !!active);
    }

    function toggleHints() {
      hintsOpen = !hintsOpen;
      document.getElementById('hintsToggle').classList.toggle('open', hintsOpen);
      document.getElementById('hintsBody').classList.toggle('open', hintsOpen);
    }

    function setButtons(disabled) {
      document.getElementById('drawBtn').disabled = disabled;
      document.getElementById('skipBtn').disabled = disabled;
    }

    function attemptLoad(scene) {
      const img  = document.getElementById('sceneImg');
      const card = document.getElementById('imgCard');

      img.classList.remove('loaded');
      card.classList.remove('active');
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('overlay').innerHTML = '<div class="spinner"></div>';

      document.getElementById('catPill').textContent = scene.cat;
      setDiff(scene.diff);

      hintsOpen = false;
      document.getElementById('hintsToggle').classList.remove('open');
      document.getElementById('hintsBody').classList.remove('open');
      document.getElementById('hintsBody').innerHTML =
        scene.hints.map(h => `<span class="hint-chip">${h}</span>`).join('');

      img.onload = () => {
        document.getElementById('overlay').style.display = 'none';
        img.classList.add('loaded');
        card.classList.add('active');
        setStatus('✏️ Describe what you see — share when everyone is ready!', true);
        setButtons(false);
        busy = false;
      };

      img.onerror = () => {
        failedIds.add(scene.id);
        tryNext();
      };

      img.src = CDN(scene.id);
    }

    function tryNext() {
      if (!pool.length) refillPool();
      const scene = pool.pop();
      current = scene;
      attemptLoad(scene);
    }

    function draw() {
      if (busy) return;
      busy = true;
      setButtons(true);
      setStatus('Loading…', false);
      round++;
      document.getElementById('roundNum').textContent = round;
      tryNext();
    }

    function skip() {
      if (busy) return;
      busy = true;
      setButtons(true);
      setStatus('Loading next scene…', false);
      tryNext();
    }

    refillPool();
  </script>

</body>
</html>
