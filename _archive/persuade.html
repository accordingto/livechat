<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Persuade Me! · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Persuade Me">
  <meta name="theme-color" content="#0d0d1a">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 72px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50%       { opacity: .55; }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(217,70,239,0); }
      50%       { box-shadow: 0 0 40px rgba(217,70,239,.28); }
    }

    /* ── Topbar ── */
    .topbar {
      width: 100%; max-width: 720px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 36px;
      animation: fadeUp .5s ease both;
      position: relative; z-index: 1;
    }
    a.back { color: #555; text-decoration: none; font-size: 14px; transition: color .2s; }
    a.back:hover { color: #eee; }
    .round-badge { font-size: 12px; color: #444; }
    .round-badge span { color: #d946ef; font-weight: 700; }

    /* ── Header ── */
    .header {
      text-align: center; margin-bottom: 32px;
      animation: fadeUp .5s .1s ease both;
      position: relative; z-index: 1;
    }
    .header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #d946ef);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .header p { color: #666; font-size: .93rem; }

    /* ── Scenario card ── */
    .scenario-card {
      width: 100%; max-width: 720px;
      background: #13132b;
      border: 2px solid #1e1e42;
      border-radius: 22px;
      padding: 28px 30px;
      margin-bottom: 16px;
      position: relative; overflow: hidden;
      transition: border-color .4s;
      animation: fadeUp .5s .2s ease both;
      min-height: 200px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .scenario-card.rolling { border-color: #d946ef; animation: flicker .13s infinite; }
    .scenario-card.landed  { border-color: #d946ef; animation: pulseGlow 2.8s ease infinite; }
    .scenario-card::before {
      content: '🎭';
      position: absolute; font-size: 10rem; opacity: .025;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }

    /* Placeholder */
    .sc-placeholder {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; text-align: center;
      min-height: 160px;
    }
    .sc-placeholder .big-emoji { font-size: 3rem; }
    .sc-placeholder p { color: #333; font-size: .95rem; }

    /* Content */
    .sc-content { display: none; flex-direction: column; gap: 18px; }
    .sc-content.show { display: flex; }

    .sc-field { display: flex; flex-direction: column; gap: 5px; }
    .sc-label {
      font-size: .72rem; text-transform: uppercase;
      letter-spacing: .13em; color: #d946ef; font-weight: 700;
    }
    .sc-judge    { font-size: 1.95rem; font-weight: 700; color: #eee; }
    .sc-situation{ font-size: 1.95rem; color: #ccc; line-height: 1.5; }
    .sc-persuader{ font-size: 1.95rem; color: #eee; }
    .sc-divider  { height: 1px; background: #1e1e42; }

    /* ── Redraw button ── */
    .btn-draw {
      width: 100%; max-width: 720px;
      background: #13132b; color: #d946ef; border: 2px solid #d946ef;
      border-radius: 14px; padding: 16px;
      font-size: 1.05rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s;
      animation: fadeUp .5s .3s ease both;
      position: relative; z-index: 1;
    }
    .btn-draw:hover { background: rgba(217,70,239,.1); }
    .btn-draw:active { transform: scale(.98); }
    .btn-draw:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="round-badge">Round <span id="round-num">0</span></div>
  </div>

  <div class="header">
    <h1>🎭 Persuade Me!</h1>
    <p>Draw a scenario — then take turns convincing the judge!</p>
  </div>

  <!-- Scenario card -->
  <div class="scenario-card" id="sc-card">
    <div class="sc-placeholder" id="sc-placeholder">
      <div class="big-emoji">🎭</div>
      <p>Press <strong>Draw</strong> to reveal the scene</p>
    </div>
    <div class="sc-content" id="sc-content">
      <div class="sc-field">
        <div class="sc-label">🗣️ Persuader Plays</div>
        <div class="sc-persuader" id="sc-persuader"></div>
      </div>
      <div class="sc-divider"></div>
      <div class="sc-field">
        <div class="sc-label">🎯 The Situation</div>
        <div class="sc-situation" id="sc-situation"></div>
      </div>
      <div class="sc-divider"></div>
      <div class="sc-field">
        <div class="sc-label">👨‍⚖️ Judge's Role</div>
        <div class="sc-judge" id="sc-judge"></div>
      </div>
    </div>
  </div>

  <button class="btn-draw" id="draw-btn" onclick="draw()">🎲 Draw</button>

  <script>
    const scenarios = [
      // School
      { judge:'Teacher', emoji:'🧑‍🏫',
        persuader:'A student who forgot their homework',
        situation:'You forgot to bring your homework today. Convince the teacher not to give you a zero.' },
      { judge:'Teacher', emoji:'🧑‍🏫',
        persuader:'A student who got a bad grade',
        situation:'You got 40% on your test. Convince the teacher to let you retake it.' },
      { judge:'Teacher', emoji:'🧑‍🏫',
        persuader:'A student who was late to class',
        situation:'You walked into class 15 minutes late. Convince the teacher not to mark you absent.' },
      { judge:'Teacher', emoji:'🧑‍🏫',
        persuader:'A student who wants special treatment',
        situation:'You want to sit next to your best friend in class. Your teacher said no. Convince them to change their mind.' },
      { judge:'Teacher', emoji:'🧑‍🏫',
        persuader:'A student who needs more time',
        situation:'The essay is due today but you only finished half of it. Convince the teacher to give you one more day.' },
      // Work
      { judge:'Boss', emoji:'💼',
        persuader:'An employee who wants to leave early',
        situation:'You want to leave work one hour early today. Convince your boss to say yes.' },
      { judge:'Boss', emoji:'💼',
        persuader:'An employee who was late to work',
        situation:'You arrived at work 30 minutes late. Convince your boss it will never happen again — and that you still deserve a raise.' },
      { judge:'Boss', emoji:'💼',
        persuader:'An employee who wants to work from home',
        situation:'You want to work from home every Friday. Convince your boss it is a great idea.' },
      { judge:'Boss', emoji:'💼',
        persuader:'An employee who broke something',
        situation:'You accidentally broke the office coffee machine. Convince your boss it was not your fault.' },
      // Relationships
      { judge:'Girlfriend / Boyfriend', emoji:'💑',
        persuader:'A partner who forgot to call',
        situation:'You forgot to call your partner last night. Convince them you had a good reason and you are sorry.' },
      { judge:'Girlfriend / Boyfriend', emoji:'💑',
        persuader:'A partner who forgot the date',
        situation:'You forgot your partner\'s birthday. Convince them to forgive you.' },
      { judge:'Mom or Dad', emoji:'👨‍👩‍👦',
        persuader:'A child who wants to stay up late',
        situation:'You want to stay up until midnight on a school night. Convince your parent to say yes.' },
      { judge:'Mom or Dad', emoji:'👨‍👩‍👦',
        persuader:'A child who wants a pet',
        situation:'You want to get a dog. Your parent says the house is too small. Convince them it is a great idea.' },
      { judge:'Mom or Dad', emoji:'👨‍👩‍👦',
        persuader:'A teenager who wants more pocket money',
        situation:'You want double your weekly allowance. Convince your parent you really need it.' },
      // Friends
      { judge:'Friend', emoji:'🧑‍🤝‍🧑',
        persuader:'A friend who was very late',
        situation:'You were 30 minutes late to meet your friend at a café. Convince them not to be angry.' },
      { judge:'Friend', emoji:'🧑‍🤝‍🧑',
        persuader:'A friend who owes money',
        situation:'You borrowed $20 from your friend last month and forgot to pay them back. Convince them to wait one more week.' },
      { judge:'Friend', emoji:'🧑‍🤝‍🧑',
        persuader:'A friend who told a secret',
        situation:'You accidentally told another person a secret your friend shared with you. Convince your friend you had a good reason.' },
      { judge:'Friend', emoji:'🧑‍🤝‍🧑',
        persuader:'A friend who cancelled plans',
        situation:'You cancelled plans with your friend at the last minute. Convince them to not be upset and to make new plans.' },
      // Shopping & Services
      { judge:'Shop Owner', emoji:'🛍️',
        persuader:'A customer without a receipt',
        situation:'You want to return a shirt but you lost the receipt. Convince the shop owner to give you a refund.' },
      { judge:'Barista', emoji:'☕',
        persuader:'A customer who wants a deal',
        situation:'The café only has small cups left, but you want a large coffee at the small price. Convince the barista to help you.' },
      { judge:'Restaurant Manager', emoji:'🍽️',
        persuader:'A customer who wants a discount',
        situation:'Your food was a little cold when it arrived. Convince the manager to give you a 50% discount.' },
      { judge:'Gym Receptionist', emoji:'💪',
        persuader:'A member who never comes',
        situation:'You have not been to the gym for 6 months. Convince the receptionist to give you a full refund for your membership.' },
      // Daily Life
      { judge:'Roommate', emoji:'🏠',
        persuader:'A roommate who ate the food',
        situation:'You ate your roommate\'s food from the fridge by mistake. Convince them it is not a big deal and you are still a great roommate.' },
      { judge:'Bus Driver', emoji:'🚌',
        persuader:'A passenger without exact change',
        situation:'You only have a big bill and the bus does not give change. Convince the driver to let you ride for free today.' },
      { judge:'Librarian', emoji:'📚',
        persuader:'A student who wants to eat inside',
        situation:'You want to eat your sandwich in the library. There is a "No Food" sign. Convince the librarian to make an exception.' },
      { judge:'Neighbour', emoji:'🏡',
        persuader:'A neighbour who plays music too loud',
        situation:'Your neighbour complained that your music is too loud at night. Convince them it is not a problem.' },
      // Fun & Silly
      { judge:'Mom or Dad', emoji:'😄',
        persuader:'A child who broke something',
        situation:'You accidentally broke your parent\'s favourite mug. Convince them not to be angry and that everything is fine.' },
      { judge:'Friend', emoji:'😂',
        persuader:'A friend who needs convincing',
        situation:'Convince your friend to try a very strange food that you love — like spicy ice cream or cheese-flavoured candy.' },
      { judge:'Boss', emoji:'😄',
        persuader:'An employee with a big idea',
        situation:'You want the company to have a "bring your pet to work" day every Friday. Convince your boss it will make everyone happier and more productive.' },
      { judge:'Teacher', emoji:'😄',
        persuader:'A very confident student',
        situation:'Convince your teacher to cancel homework for the whole class for one week. You must give at least three good reasons.' },
    ];

    let round = 0;
    let used  = [];
    let rolling = false;

    function draw() {
      if (rolling) return;
      rolling = true;

      const btn  = document.getElementById('draw-btn');
      const card = document.getElementById('sc-card');
      const ph   = document.getElementById('sc-placeholder');
      const ct   = document.getElementById('sc-content');

      btn.disabled = true;
      card.classList.remove('landed');
      card.classList.add('rolling');
      ph.style.display = 'none';
      ct.classList.add('show');

      let avail = scenarios.map((_,i) => i).filter(i => !used.includes(i));
      if (!avail.length) { used = []; avail = scenarios.map((_,i) => i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      used.push(fi);

      let ticks = 0;
      const iv = setInterval(() => {
        const tmp = scenarios[Math.floor(Math.random() * scenarios.length)];
        document.getElementById('sc-judge').textContent     = tmp.emoji + ' ' + tmp.judge;
        document.getElementById('sc-situation').textContent = tmp.situation;
        document.getElementById('sc-persuader').textContent = tmp.persuader;
        if (++ticks >= 24) {
          clearInterval(iv);
          const sc = scenarios[fi];
          document.getElementById('sc-judge').textContent     = sc.emoji + ' ' + sc.judge;
          document.getElementById('sc-situation').textContent = sc.situation;
          document.getElementById('sc-persuader').textContent = sc.persuader;
          card.classList.remove('rolling');
          card.classList.add('landed');
          round++;
          document.getElementById('round-num').textContent = round;
          btn.textContent  = '🔁 Redraw';
          btn.disabled     = false;
          rolling = false;
        }
      }, 82);
    }
  </script>
</body>
</html>
