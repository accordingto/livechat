<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Word Wolf · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Word Wolf">
  <meta name="theme-color" content="#0d0d1a">
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="shared.css">
  <style>
    :root { --accent: #f59e0b; --accent-alt: #d946ef; --warn: #f59e0b; }

    .header h1 { background: linear-gradient(135deg, #fff 30%, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    /* ── Shared control-card buttons ── */

    /* ── Control card: room code + player count + deal, grouped as one panel ── */




    /* ── Section labels ── */


    /* ── Reveal banner: shows the word pair after Reveal Wolf ── */
    .reveal-banner {
      width: 100%; max-width: 1100px;
      background: rgba(245,158,11,.1); border: 1.5px solid #f59e0b; color: #f59e0b;
      border-radius: 14px; padding: 14px 18px; font-size: .95rem; font-weight: 700; text-align: center;
      margin-bottom: 20px; position: relative; z-index: 1;
      animation: fadeUp .3s ease both;
    }

    /* ── Vote tally: live "X / Y voted" progress, then full breakdown after Reveal ── */
    .vote-tally {
      width: 100%; max-width: 1100px;
      background: #13132b; border: 1.5px solid #1e1e42; color: #999;
      border-radius: 14px; padding: 12px 18px; font-size: .85rem; text-align: center;
      margin-bottom: 20px; position: relative; z-index: 1;
    }
    .vote-tally.hidden { display: none; }
    .vote-tally .verdict { font-size: .95rem; font-weight: 800; color: #eee; margin-bottom: 4px; }


    /* ── Player links: one persistent link per player, sent once via LINE/etc ── */
    .link-col.is-wolf { border-color: #f59e0b; }
    /* border + glow alone read as too subtle a change on a shared screen —
       the fill itself needs to shift color, not just its edge */
    .link-col.is-picked, .link-col.is-picked-done { transition: border-color .3s, box-shadow .3s, background-color .3s; }
    .link-col.is-picked { border-color: #d946ef; background: rgba(217,70,239,.18); box-shadow: 0 0 24px rgba(217,70,239,.4); }
    .link-col.is-picked.pulse { animation: pickPulse .5s ease; }
    .link-col.is-picked-done { border-color: #14b8a6; background: rgba(20,184,166,.14); box-shadow: 0 0 14px rgba(20,184,166,.25); }
    @keyframes pickPulse {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }













    /* revealed word, shown under a player's link after "Reveal Wolf" */

    .link-answer .lw-emoji { font-size: 2rem; line-height: 1; }
    .link-answer .lw-text  { font-size: .95rem; font-weight: 800; color: #34d399; }
    .link-answer .lw-tag   { font-size: .8rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #f59e0b; }

    /* Firebase-not-configured warning */

    .round-badge #roundNum { color: #f59e0b; }

    /* ── Deck browser: the whole word list, for the host to skim before playing.
       Grouped by category, since the pairs only make sense next to their neighbours. ── */
    .pair-browser {
      width: 100%; max-width: 1100px;
      margin: 28px 0 40px;
      position: relative; z-index: 1;
    }
    .pair-browser-hdr {
      background: #1a1a38; color: #999; border: 2px solid #35335e; border-radius: 12px;
      padding: 10px 18px; font-size: .8rem; font-weight: 800; font-family: inherit; cursor: pointer;
      transition: background .2s, border-color .2s, color .2s; margin-bottom: 14px;
    }
    .pair-browser-hdr:hover { border-color: #f59e0b; color: #f59e0b; }
    .pair-cat {
      font-size: .88rem; font-weight: 900; color: #f59e0b;
      margin: 20px 0 8px;
    }
    .pair-cat:first-of-type { margin-top: 0; }
    .pair-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 8px;
    }
    .pair-item {
      background: #13132b; border: 1.5px solid #1e1e42; border-radius: 12px;
      padding: 10px 14px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: .85rem; font-weight: 700; color: #ddd; line-height: 1.4;
    }
    .pair-item .pi-num {
      flex-shrink: 0; min-width: 24px; text-align: right;
      color: #444; font-size: .74rem; font-weight: 900;
    }
    /* long pairs wrap onto a second line rather than truncating — the host is reading
       this list to judge the pairs, so a cut-off word defeats the point */
    .pair-item .pi-word { overflow-wrap: break-word; }
    .pair-item .pi-vs { color: #555; font-size: .74rem; font-weight: 900; flex-shrink: 0; }

    @media (max-width: 520px) {

    }
  </style>
</head>
<body data-guide="wordwolf" data-guide-next="game">

  <div class="topbar">
    <a class="back" href="index.html?step=2" data-i18n="common.backToHub">← Back to Hub</a>
    <div class="round-badge"><span data-i18n="wordwolf.roundLabel">Round</span> <span id="roundNum">0</span></div>
  </div>

  <div class="header">
    <h1>🐺 Word Wolf</h1>
  </div>

  <div class="fb-warning hidden" id="fb-warning">
    ⚠️ Firebase isn't configured yet, so player links won't update automatically. Open <code>firebase-config.js</code> and follow the setup steps at the top of that file.
  </div>

  <div id="room-mount"></div>

  <div class="reveal-banner hidden" id="reveal-banner"></div>
  <div class="vote-tally hidden" id="vote-tally"></div>

  <!-- Browse the whole deck: closed by default, since this screen is shared and the
       full list would spoil every pair before it's dealt -->
  <div class="pair-browser">
    <button class="pair-browser-hdr" id="pair-browser-hdr" onclick="togglePairBrowser()"></button>
    <div id="pair-browser-body" class="hidden"></div>
  </div>

  <!-- how-to-play briefing: shown first, hands over to the page below -->
  <script src="guide-data.js"></script>
  <script src="guide.js"></script>
  <script src="qrcode.js"></script>
  <script src="game-data.js"></script>
  <script src="sheet-data.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="room.js"></script>
  <script>
    I18N.registerDict('wordwolf', {
      roundLabel: { zh: '回合', en: 'Round' },
      fbWarning: { zh: '⚠️ 尚未設定 Firebase，玩家連結不會自動更新。請開啟 <code>firebase-config.js</code>，依照檔案開頭的設定步驟操作。', en: "⚠️ Firebase isn't configured yet, so player links won't update automatically. Open <code>firebase-config.js</code> and follow the setup steps at the top of that file." },
      linksNote: { zh: '每個連結只要複製一次，私訊傳給該玩家（例如 LINE）即可 — 每回合的字會自動更新。', en: 'Copy each link once and send it privately (e.g. a LINE DM) — the word updates automatically every round.' },
      dealBtn: { zh: '🐺 發字卡', en: '🐺 Deal Words' },
      revealBtn: { zh: '👁 全部公開', en: '👁 Reveal All' },
      pickBtn: { zh: '🎲 隨機點名', en: '🎲 Pick Someone' },
      browseBtn: { zh: '👁️ 瀏覽全部 {n} 組詞組（暴雷 — 分享畫面時請勿開啟）', en: "👁️ Browse all {n} word pairs (spoilers — don't open while sharing)" },
      hideBtn: { zh: '🙈 收起詞組清單', en: '🙈 Hide the word list' },
      vsLabel: { zh: 'vs', en: 'vs' },
      votedProgress: { zh: '🗳️ {cast} / {total} 位玩家已投票', en: '🗳️ {cast} / {total} players have voted' },
      noVotes: { zh: '這一輪沒有人投票。', en: 'No votes were cast this round.' },
      voteCount: { zh: '{name}：{count} 票', en: '{name}: {count} vote{s}' },
      verdictCorrect: { zh: '✅ 村民抓到狼人了！', en: '✅ Villagers caught the Wolf!' },
      verdictWrong: { zh: '❌ 狼人逃過一劫！', en: '❌ The Wolf escaped detection!' },
      revealBanner: { zh: '這一輪：<strong>{emojiA} {a}</strong> vs <strong>{emojiB} {b}</strong>', en: 'This round: <strong>{emojiA} {a}</strong> vs <strong>{emojiB} {b}</strong>' },
      wolfTag: { zh: '🐺 狼人', en: '🐺 Wolf' },
      // category headers in the pair browser below — UI chrome around the word pairs,
      // which themselves (game-data.js's wordwolf array) are never translated
      '🍔 Food & Drink': { zh: '🍔 美食飲品', en: '🍔 Food & Drink' },
      '🐾 Animals': { zh: '🐾 動物', en: '🐾 Animals' },
      '🗺️ Places': { zh: '🗺️ 地方', en: '🗺️ Places' },
      '🚗 Transport': { zh: '🚗 交通工具', en: '🚗 Transport' },
      '🎵 Music': { zh: '🎵 音樂', en: '🎵 Music' },
      '💼 Jobs': { zh: '💼 職業', en: '💼 Jobs' },
      '☀️ Weather': { zh: '☀️ 天氣', en: '☀️ Weather' },
      '🎯 Activities': { zh: '🎯 活動', en: '🎯 Activities' },
      '🎒 Objects': { zh: '🎒 物品', en: '🎒 Objects' },
      '🍽️ Kitchen': { zh: '🍽️ 廚房', en: '🍽️ Kitchen' },
      '📚 School': { zh: '📚 學校', en: '📚 School' },
      '💻 Technology': { zh: '💻 科技', en: '💻 Technology' },
      '👕 Clothing': { zh: '👕 服飾', en: '👕 Clothing' },
      '🎉 Holidays': { zh: '🎉 節慶', en: '🎉 Holidays' },
      '🎬 Entertainment': { zh: '🎬 娛樂', en: '🎬 Entertainment' },
      '🌳 Nature': { zh: '🌳 大自然', en: '🌳 Nature' },
      '🫀 Body': { zh: '🫀 身體部位', en: '🫀 Body' },
    });
    const wt = (key, vars) => {
      let s = I18N.t('wordwolf', key);
      if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
      return s;
    };

    const PAIRS = GAME_DATA.wordwolf;

    function escHTML(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    /* the full deck at the bottom of the page, grouped by category — a pair only reads
       as "fair" next to the others in its group, so the grouping is worth keeping.
       The words themselves (p.a / p.b) are never translated — only the header and
       category labels around them are. Re-run on every language toggle. */
    let pairBrowserOpen = false;
    function togglePairBrowser() {
      pairBrowserOpen = !pairBrowserOpen;
      document.getElementById('pair-browser-body').classList.toggle('hidden', !pairBrowserOpen);
      renderPairBrowserLabel();
    }
    function renderPairBrowserLabel() {
      document.getElementById('pair-browser-hdr').textContent = pairBrowserOpen
        ? wt('hideBtn')
        : wt('browseBtn', { n: PAIRS.length });
    }
    function buildPairBrowser() {
      renderPairBrowserLabel();
      const groups = [];
      PAIRS.forEach((p, i) => {
        if (!groups.length || groups[groups.length - 1].cat !== p.cat) groups.push({ cat: p.cat, items: [] });
        groups[groups.length - 1].items.push({ p, n: i + 1 });
      });
      document.getElementById('pair-browser-body').innerHTML = groups.map(g => `
        <div class="pair-cat">${escHTML(wt(g.cat))} (${g.items.length})</div>
        <div class="pair-list">
          ${g.items.map(({ p, n }) => `
            <div class="pair-item">
              <span class="pi-num">${n}</span>
              <span class="pi-word">${p.emojiA} ${escHTML(p.a)}</span>
              <span class="pi-vs">${escHTML(wt('vsLabel'))}</span>
              <span class="pi-word">${p.emojiB} ${escHTML(p.b)}</span>
            </div>`).join('')}
        </div>`).join('');
    }
    buildPairBrowser();
    I18N.onChange(() => buildPairBrowser());
    const ALLOWED_COUNTS = [3, 4, 5, 6];
    let assigned = [];    // [{ word, emoji, isWolf }] per player — this round's deal
    let currentPair = null;
    let revealed = false; // end-of-round: show every word + who the Wolf was
    let round = 0;

    /* 🎲 Pick Someone: draws players one at a time in shuffled order with no
       repeats until everyone's had a turn, then reshuffles for the next cycle */
    let pickOrder = [];
    let pickPos = 0;
    let currentPickIdx = null; // index of the player currently highlighted in Player Links
    let pickedThisCycle = new Set(); // indices already drawn this cycle (shown dimmer than the current pick)
    function resetPickOrder() {
      pickOrder = [];
      pickPos = 0;
      currentPickIdx = null;
      pickedThisCycle = new Set();
    }

    /* 🗳️ vote tally — room.js already keeps one listener per known token, so the votes
       arrive through onPlayerData; this game needs no Firebase code of its own. */
    let votes = {};        // playerNum -> the playerNum they voted for (or null)

    /* live "X / Y voted" while the round is open; full breakdown + verdict after Reveal */
    function renderVoteTally() {
      const el = document.getElementById('vote-tally');
      const cast = Object.values(votes).filter(v => v != null);
      if (!round) { el.classList.add('hidden'); return; }
      el.classList.remove('hidden');

      if (!revealed) {
        el.textContent = wt('votedProgress', { cast: cast.length, total: ROOM.count });
        return;
      }

      if (!cast.length) { el.innerHTML = wt('noVotes'); return; }

      const counts = {};
      cast.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
      const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      const lines = entries.map(([pnum, c]) => {
        const idx = Number(pnum) - 1;
        const name = ROOM.name(idx);
        return wt('voteCount', { name, count: c, s: c > 1 ? 's' : '' });
      }).join(' &nbsp;·&nbsp; ');

      const wolfIdx = assigned.findIndex(p => p.isWolf);
      const topPnum = Number(entries[0][0]);
      const correct = wolfIdx >= 0 && (topPnum - 1) === wolfIdx;
      const verdict = correct ? wt('verdictCorrect') : wt('verdictWrong');
      el.innerHTML = `<div class="verdict">${verdict}</div>${lines}`;
    }
    I18N.onChange(() => renderVoteTally());
    /* Room code, tokens, names, the setup UI and the links all live in room.js */
    ROOM.init({
      mount: 'room-mount',
      accent: '#f59e0b',
      counts: ALLOWED_COUNTS,
      defaultCount: 5,
      hideSetup: true, // player count and links are set up once on index.html now
      linksNote: () => wt('linksNote'),
      actionsHTML: '<button class="btn-primary" id="deal-btn" onclick="deal()" data-i18n="wordwolf.dealBtn">🐺 Deal Words</button>'
                 + '<button class="btn-secondary hidden" id="reveal-btn" onclick="revealAll()" data-i18n="wordwolf.revealBtn">👁 Reveal All</button>'
                 + '<button class="btn-secondary" id="dice-btn" onclick="pickSomeone()" data-i18n="wordwolf.pickBtn">🎲 Pick Someone</button>',
      onCountChange: () => { assigned = []; revealed = false; votes = {}; resetPickOrder(); renderVoteTally(); },
      onPlayerData: (num, data) => {
        votes[num] = data && data.vote != null ? data.vote : null;
        renderVoteTally();
      },
    });
    document.getElementById('fb-warning').classList.toggle('hidden', ROOM.enabled);
    function renderFbWarning() { document.getElementById('fb-warning').innerHTML = wt('fbWarning'); }
    renderFbWarning();
    I18N.onChange(() => renderFbWarning());

    /* the Wolf once revealed, the current pick, and everyone already picked this cycle */
    ROOM.setDecorator(i => {
      const p = assigned[i];
      let cls = '';
      if (revealed && p && p.isWolf) cls = 'is-wolf';
      else if (currentPickIdx === i) cls = 'is-picked';
      else if (pickedThisCycle.has(i)) cls = 'is-picked-done';
      const answer = revealed && p
        ? `<span class="lw-emoji">${p.emoji}</span><span class="lw-text">${p.word}</span>`
          + (p.isWolf ? `<span class="lw-tag">${wt('wolfTag')}</span>` : '')
        // pre-reveal, every player still needs a (blank) truthy answer — room.js's
        // compact roster only renders rows where info.answer is truthy, and Pick
        // Someone needs everyone's name on screen up front so the highlight has
        // something to move between, not just the players drawn so far
        : '&#8203;';
      return { cls, answer };
    });
    // every player's name should be on screen from the moment the room is
    // ready, not just after the first Deal/Pick click — setDecorator() alone
    // doesn't repaint anything by itself
    ROOM.render();
    I18N.onChange(() => ROOM.render());

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function deal() {
      const pair = PAIRS[Math.floor(Math.random() * PAIRS.length)];
      const wolfIndex = Math.floor(Math.random() * ROOM.count);
      currentPair = pair;
      assigned = Array.from({ length: ROOM.count }, (_, i) => {
        const isWolf = i === wolfIndex;
        return { word: isWolf ? pair.b : pair.a, emoji: isWolf ? pair.emojiB : pair.emojiA, isWolf };
      });
      revealed = false;
      round++;

      document.getElementById('roundNum').textContent = round;
      document.getElementById('reveal-btn').classList.remove('hidden');
      document.getElementById('reveal-banner').classList.add('hidden');
      resetPickOrder();

      // push this round's word to each player's link — their page updates live.
      // publish() uses .set(), so any leftover vote from last round goes with it,
      // and it writes the non-secret name roster the voting buttons read.
      votes = {};
      ROOM.publish(i => ({ game: 'wordwolf', word: assigned[i].word, emoji: assigned[i].emoji, isWolf: assigned[i].isWolf, round }));
      ROOM.render();
    }

    /* end of round: show every player's word, highlight the Wolf, and reveal the word pair */
    function revealAll() {
      revealed = true;
      ROOM.render();
      const banner = document.getElementById('reveal-banner');
      banner.classList.remove('hidden');
      banner.innerHTML = wt('revealBanner', { emojiA: currentPair.emojiA, a: currentPair.a, emojiB: currentPair.emojiB, b: currentPair.b });
      renderVoteTally();
    }
    I18N.onChange(() => { if (revealed && currentPair) revealAll(); });

    /* draws the next player in the shuffled order — everyone gets picked once
       before the cycle reshuffles and starts over. Shown entirely through the
       Player Links boxes: current pick glows fuchsia, already-picked-this-cycle
       players are marked green, no separate banner needed. */
    function pickSomeone() {
      if (ROOM.count < 1) return;
      if (pickOrder.length !== ROOM.count || pickPos >= pickOrder.length) {
        pickOrder = shuffle(Array.from({ length: ROOM.count }, (_, i) => i));
        pickPos = 0;
        pickedThisCycle = new Set();
      }
      const idx = pickOrder[pickPos++];
      currentPickIdx = idx;
      pickedThisCycle.add(idx);

      ROOM.render();
      const pickedCol = document.querySelectorAll('.link-col')[idx];
      if (pickedCol) {
        pickedCol.classList.add('pulse');
        pickedCol.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }
  </script>

</body>
</html>
