<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Your Secret Card</title>
  <meta name="theme-color" content="#0d0d1a">
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100dvh; padding: 24px;
    }
    .secret-card {
      background: #13132b;
      border: 2px solid #d946ef;
      border-radius: 26px;
      padding: 48px 40px;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      text-align: center;
      max-width: 420px; width: 100%;
      box-shadow: 0 0 60px rgba(217,70,239,.18);
      animation: fadeUp .5s ease both;
      transition: border-color .3s, box-shadow .3s;
    }
    .secret-card.theme-wordwolf    { border-color: #f59e0b; box-shadow: 0 0 60px rgba(245,158,11,.18); }
    .secret-card.theme-teamwords-a { border-color: #3b82f6; box-shadow: 0 0 60px rgba(59,130,246,.18); }
    .secret-card.theme-teamwords-b { border-color: #f43f5e; box-shadow: 0 0 60px rgba(244,63,94,.18); }
    .secret-card.theme-secretrule  { border-color: #14b8a6; box-shadow: 0 0 60px rgba(20,184,166,.18); }

    /* Secret Rule: the rule itself is a sentence, not a single word, so it gets
       its own left-aligned block plus a dimmer example line underneath */
    .rule-text {
      font-size: 1.45rem; font-weight: 800; color: #fff; line-height: 1.35;
      max-width: 100%; overflow-wrap: break-word;
    }
    .rule-example {
      font-size: .95rem; color: #7dd3c0; line-height: 1.5;
      background: #0d0d1a; border-radius: 12px; padding: 12px 16px; width: 100%;
    }
    .rule-topic {
      width: 100%; border-top: 1px solid #1e1e42; padding-top: 16px; margin-top: 4px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .rule-topic .rt-label {
      font-size: .7rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: #666;
    }
    .rule-topic .rt-text { font-size: 1.05rem; font-weight: 700; color: #ddd; line-height: 1.4; }

    /* 🗳️ Secret Rule guessing: one dropdown per other player, filled from the
       host's shortlist — a native <select> beats a wall of buttons on a phone */
    .guess-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; text-align: left; }
    .guess-row:last-child { margin-bottom: 0; }
    .guess-name { font-size: .9rem; font-weight: 800; color: #ddd; }
    .guess-select {
      width: 100%; background: #0d0d1a; border: 2px solid #1e1e42; border-radius: 12px;
      color: #ddd; font-family: inherit; font-size: .88rem; font-weight: 600;
      padding: 11px 34px 11px 12px; /* room on the right so long rules never run under the arrow */
      text-overflow: ellipsis; -webkit-appearance: none; appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, #14b8a6 50%), linear-gradient(135deg, #14b8a6 50%, transparent 50%);
      background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
      background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
      transition: border-color .2s;
    }
    .guess-select:focus { outline: none; border-color: #14b8a6; }
    .guess-select.answered { border-color: #14b8a6; color: #2dd4bf; }

    /* big per-player name badge — every player gets their own vivid gradient,
       so one glance at the color + name says "this card is mine" */
    .name-banner {
      font-size: 2rem; font-weight: 900; color: #fff; line-height: 1.2;
      padding: 12px 34px; border-radius: 999px;
      max-width: 100%; overflow-wrap: break-word;
      box-shadow: 0 6px 24px rgba(0,0,0,.45);
    }

    .team-tag {
      font-size: 1.1rem; font-weight: 900; letter-spacing: 1px;
      color: #fff; background: #3b82f6;
      padding: 6px 18px; border-radius: 999px;
    }
    .theme-teamwords-b .team-tag { background: #f43f5e; }

    .card-emoji { font-size: 6rem; line-height: 1; }
    .card-word  {
      font-weight: 800; color: #fff; line-height: 1.15;
      max-width: 100%; overflow-wrap: break-word;
    }
    .word-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .word-row {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      background: #0d0d1a; border-radius: 14px; padding: 14px;
    }
    .word-row .card-emoji { font-size: 2.4rem; }
    .word-row .card-word { font-size: 1.5rem; }
    .secret-hint {
      font-size: .85rem; color: #555;
      border-top: 1px solid #1e1e42; padding-top: 18px; margin-top: 4px;
      width: 100%;
    }
    .error-msg { color: #666; font-size: 1rem; text-align: center; line-height: 1.7; }

    /* 🗳️ vote section on the Word Wolf card */
    .vote-section {
      width: 100%;
      border-top: 1px solid #1e1e42; padding-top: 18px; margin-top: 4px;
    }
    .vote-title {
      font-size: .78rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
      color: #666; margin-bottom: 10px;
    }
    .vote-list { display: flex; flex-direction: column; gap: 8px; }
    .vote-btn {
      background: #0d0d1a; border: 2px solid #1e1e42; color: #ddd;
      border-radius: 12px; padding: 12px; font-size: .95rem; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: border-color .2s, background .2s;
    }
    .vote-btn:hover { border-color: #f59e0b; }
    .vote-btn.voted { border-color: #f59e0b; background: rgba(245,158,11,.15); color: #f59e0b; }
  </style>
</head>
<body>

  <div id="content">⏳</div>

  <script src="game-data.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script>
    const params  = new URLSearchParams(location.search);
    const session = params.get('s');
    const token   = params.get('p'); // this player's private random token, not a guessable number
    const el = document.getElementById('content');

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    /* one vivid gradient per player number — the same player always sees the
       same color all night, so their card is instantly recognizable as theirs */
    const NAME_COLORS = [
      ['#f59e0b', '#ef4444'], // amber -> red
      ['#22c55e', '#14b8a6'], // green -> teal
      ['#3b82f6', '#8b5cf6'], // blue -> violet
      ['#ec4899', '#d946ef'], // pink -> fuchsia
      ['#06b6d4', '#3b82f6'], // cyan -> blue
      ['#a78bfa', '#6366f1'], // violet -> indigo
    ];

    /* big colored name badge — host can give each player a name, fall back to Player N */
    function nameBanner(data) {
      const label = data.name ? esc(data.name) : `Player ${data.playerNum || '?'}`;
      const [c1, c2] = NAME_COLORS[((data.playerNum || 1) - 1) % NAME_COLORS.length];
      return `<span class="name-banner" style="background:linear-gradient(135deg,${c1},${c2})">${label}</span>`;
    }

    /* longer phrases (e.g. "Night Market Seller") get a smaller font so they
       still fit in 1-2 lines instead of overflowing or wrapping to 3+ lines */
    function wordFontSize(text) {
      const len = String(text).length;
      if (len <= 10) return '2.6rem';
      if (len <= 16) return '2.1rem';
      if (len <= 22) return '1.7rem';
      return '1.4rem';
    }

    function wordSpan(text) {
      return `<span class="card-word" style="font-size:${wordFontSize(text)}">${esc(text)}</span>`;
    }

    /* Forbidden Words shows 3 words stacked in one row each — smaller tiers than
       the single-word card since an emoji shares the row with the text */
    function listWordFontSize(text) {
      const len = String(text).length;
      if (len <= 8) return '1.5rem';
      if (len <= 12) return '1.2rem';
      return '1rem';
    }

    function wordListHTML(words) {
      return words.map(w => `
        <div class="word-row">
          <span class="card-emoji">${w.emoji}</span>
          <span class="card-word" style="font-size:${listWordFontSize(w.word)}">${esc(w.word)}</span>
        </div>`).join('');
    }

    /* 🗳️ Word Wolf voting: each player writes a "vote" field onto their OWN node
       (allowed by the same per-token rule already used for reads) — the host
       tallies by reading each known token individually, never a shared list */
    function submitVote(votedForPlayerNum) {
      if (!db || !session || !token) return;
      db.ref(`rooms/${session}/players/${token}`).update({ vote: votedForPlayerNum });
    }

    function voteSectionHTML(data) {
      const roster = (latestRoster || []).filter(p => p.playerNum !== data.playerNum);
      if (!roster.length) return '';
      const buttons = roster.map(p => {
        const voted = data.vote === p.playerNum;
        const name = esc(p.name || `Player ${p.playerNum}`);
        return `<button class="vote-btn${voted ? ' voted' : ''}" onclick="submitVote(${p.playerNum})">${voted ? '✅ ' : ''}${name}</button>`;
      }).join('');
      return `
        <div class="vote-section">
          <div class="vote-title">🗳️ Who is the Wolf?</div>
          <div class="vote-list">${buttons}</div>
        </div>`;
    }

    /* 🗳️ Secret Rule guessing: each player records a guess per other player onto
       their OWN node (same per-token rule already used for reads), so the host can
       tally by reading each known token individually — never a shared list */
    function submitGuess(targetPlayerNum, ruleIdx) {
      if (!db || !session || !token) return;
      const value = ruleIdx === '' ? null : Number(ruleIdx);
      db.ref(`rooms/${session}/players/${token}/guesses/${targetPlayerNum}`).set(value);
    }

    function guessSectionHTML(data) {
      const others = (latestRoster || []).filter(p => p.playerNum !== data.playerNum);
      const candidates = data.candidates || [];
      if (!others.length || !candidates.length) return '';
      const picked = data.guesses || {};
      const rows = others.map(p => {
        const chosen = picked[p.playerNum];
        const opts = ['<option value="">— pick a number —</option>'].concat(
          // numbered in the same order the host screen shows them, so a player can match
          // "number 4" on the shared screen to this list without re-reading the sentence
          candidates.map((ci, i) => {
            const r = GAME_DATA.secretRule[ci];
            if (!r) return '';
            const sel = String(chosen) === String(ci) ? ' selected' : '';
            return `<option value="${ci}"${sel}>${esc(`${i + 1}. ${r.emoji}  ${r.rule}`)}</option>`;
          })
        ).join('');
        return `
          <div class="guess-row">
            <span class="guess-name">${esc(p.name || `Player ${p.playerNum}`)}</span>
            <select class="guess-select${chosen != null ? ' answered' : ''}" onchange="submitGuess(${p.playerNum}, this.value)">${opts}</select>
          </div>`;
      }).join('');
      return `
        <div class="vote-section">
          <div class="vote-title">🗳️ What rule is everyone following?</div>
          ${rows}
        </div>`;
    }

    /* one shared link per player works for every game — this page just renders
       whichever game's data is currently sitting at rooms/{session}/players/{token} */
    function showCard(data) {
      if (data.game === 'wordwolf') {
        el.innerHTML = `
          <div class="secret-card theme-wordwolf">
            ${nameBanner(data)}
            <span class="card-emoji">${data.emoji}</span>
            ${wordSpan(data.word)}
            <span class="secret-hint">🤫 Keep it secret!</span>
            ${voteSectionHTML(data)}
          </div>`;
        return;
      }
      if (data.game === 'teamwords') {
        const teamClass = data.team === 'B' ? 'theme-teamwords-b' : 'theme-teamwords-a';
        el.innerHTML = `
          <div class="secret-card ${teamClass}">
            ${nameBanner(data)}
            <span class="team-tag">Team ${data.team}</span>
            <div class="word-list">${wordListHTML(data.words)}</div>
            <span class="secret-hint">🤐 Trick the other team into saying these!</span>
          </div>`;
        return;
      }
      if (data.game === 'secretrule') {
        const r = GAME_DATA.secretRule[data.idx];
        if (!r) { showError('😵 This card link is not valid.<br>Please ask your host for the link again.'); return; }
        el.innerHTML = `
          <div class="secret-card theme-secretrule">
            ${nameBanner(data)}
            <span class="card-emoji">${r.emoji}</span>
            <span class="rule-text">${esc(r.rule)}</span>
            ${r.example ? `<span class="rule-example">${esc(r.example)}</span>` : ''}
            ${data.topic ? `<div class="rule-topic"><span class="rt-label">💬 Talk about</span><span class="rt-text">${esc(data.topic)}</span></div>` : ''}
            <span class="secret-hint">🤫 Follow your rule — don't let anyone guess it!</span>
            ${guessSectionHTML(data)}
          </div>`;
        return;
      }
      if (data.game === 'emotion') {
        const emotion = GAME_DATA.emotion[data.idx];
        if (!emotion) { showError('😵 This card link is not valid.<br>Please ask your host for the link again.'); return; }
        el.innerHTML = `
          <div class="secret-card">
            ${nameBanner(data)}
            <span class="card-emoji">${emotion.emoji}</span>
            ${wordSpan(emotion.word)}
            <span class="secret-hint">🤫 Keep it secret!</span>
          </div>`;
        return;
      }
      showError('⏳ Waiting for the host to start a game...');
    }

    function showError(html) {
      el.innerHTML = `<div class="error-msg">${html}</div>`;
    }

    const firebaseReady = FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY';
    let db = null;
    let latestData = null;
    let latestRoster = null; // Word Wolf's non-secret {playerNum,name} list, for the vote buttons

    function tryRenderCard() {
      if (!latestData) return;
      showCard(latestData);
    }

    if (!firebaseReady) {
      showError('⚙️ This game isn\'t fully set up yet.<br>Ask your host to finish the Firebase setup.');
    } else if (!session || !token) {
      showError('😵 This card link is not valid.<br>Please ask your host for the link again.');
    } else {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      db.ref(`rooms/${session}/players/${token}`).on('value', snap => {
        const data = snap.val();
        if (!data) { showError('⏳ Waiting for the host to deal this round...'); return; }
        latestData = data;
        tryRenderCard();
      }, () => {
        showError('⚠️ Could not connect — check your internet connection.');
      });
      db.ref(`rooms/${session}/roster`).on('value', snap => {
        latestRoster = snap.val() || [];
        tryRenderCard();
      });
    }
  </script>

</body>
</html>
