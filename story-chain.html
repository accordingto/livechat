<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Story Chain · IceBreak Hub</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Story Chain">
  <meta name="theme-color" content="#0d0d1a">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #eee;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 72px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50%       { opacity: .55; }
    }
    @keyframes opGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(132,204,22,0); }
      50%       { box-shadow: 0 0 40px rgba(132,204,22,.28); }
    }
    @keyframes connGlow {
      0%, 100% { box-shadow: 0 0 0 var(--glow, transparent); }
      50%       { box-shadow: 0 0 40px var(--glow, transparent); }
    }

    /* ── Topbar ── */
    .topbar {
      width: 100%; max-width: 720px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 36px;
      animation: fadeUp .5s ease both;
    }
    a.back { color: #555; text-decoration: none; font-size: 14px; transition: color .2s; }
    a.back:hover { color: #eee; }
    .turn-badge { font-size: 12px; color: #444; }
    .turn-badge span { color: #84cc16; font-weight: 700; }

    /* ── Header ── */
    .header {
      text-align: center; margin-bottom: 32px;
      animation: fadeUp .5s .1s ease both;
    }
    .header h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #84cc16);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .header p { color: #666; font-size: .93rem; }

    /* ── Opening card ── */
    .opening-card {
      width: 100%; max-width: 720px;
      background: #13132b;
      border: 2px solid #1e1e42;
      border-radius: 22px;
      padding: 28px 30px;
      margin-bottom: 16px;
      position: relative; overflow: hidden;
      transition: border-color .4s;
      animation: fadeUp .5s .2s ease both;
      min-height: 140px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .opening-card.rolling { border-color: #84cc16; animation: flicker .13s infinite; }
    .opening-card.landed  { border-color: #84cc16; animation: opGlow 2.8s ease infinite; }
    .opening-card::before {
      content: '📖';
      position: absolute; font-size: 8rem; opacity: .03;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }
    .op-placeholder {
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 10px; text-align: center;
      min-height: 100px;
    }
    .op-placeholder .big-emoji { font-size: 2.5rem; }
    .op-placeholder p { color: #333; font-size: .9rem; }
    .op-content { display: none; flex-direction: column; gap: 8px; }
    .op-content.show { display: flex; }
    .op-label {
      font-size: .72rem; text-transform: uppercase;
      letter-spacing: .13em; color: #84cc16; font-weight: 700;
    }
    .op-text { font-size: 1.9rem; color: #eee; line-height: 1.5; }

    /* ── Connector card ── */
    .conn-card {
      width: 100%; max-width: 720px;
      background: #13132b;
      border: 2px solid #1e1e42;
      border-radius: 22px;
      padding: 36px 30px;
      margin-bottom: 16px;
      position: relative; overflow: hidden;
      transition: border-color .3s;
      min-height: 190px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      gap: 14px;
    }
    .conn-card.rolling { animation: flicker .13s infinite; }
    .conn-card.landed  { animation: connGlow 2.8s ease infinite; }
    .conn-bg-emoji {
      position: absolute; font-size: 9rem; opacity: .04;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      pointer-events: none;
    }
    .conn-placeholder {
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 10px; min-height: 130px;
    }
    .conn-placeholder .big-emoji { font-size: 2.5rem; }
    .conn-placeholder p { color: #333; font-size: .9rem; }
    .conn-content { display: none; flex-direction: column; align-items: center; gap: 10px; }
    .conn-content.show { display: flex; }
    .conn-cat {
      font-size: .78rem; text-transform: uppercase;
      letter-spacing: .14em; font-weight: 700;
    }
    .conn-word {
      font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 800;
      line-height: 1.2;
    }

    /* ── History dots ── */
    .history-row {
      width: 100%; max-width: 720px;
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 16px;
      min-height: 20px;
      animation: fadeUp .5s .35s ease both;
    }
    .hdot {
      width: 20px; height: 20px; border-radius: 50%;
    }
    .hdot.cur {
      transform: scale(1.35);
      filter: brightness(1.3);
    }

    /* ── Buttons ── */
    .btn-opening {
      width: 100%; max-width: 720px;
      background: #84cc16; color: #0d0d1a; border: none;
      border-radius: 14px; padding: 18px;
      font-size: 1.1rem; font-weight: 800;
      cursor: pointer; font-family: inherit;
      transition: opacity .2s, transform .1s;
      animation: fadeUp .5s .3s ease both;
    }
    .btn-opening:hover { opacity: .88; }
    .btn-opening:active { transform: scale(.98); }
    .btn-opening:disabled { opacity: .4; cursor: not-allowed; }

    .btn-row {
      width: 100%; max-width: 720px;
      display: flex; gap: 12px;
      animation: fadeUp .5s .4s ease both;
    }
    .btn-new {
      flex: 1;
      background: transparent; color: #84cc16; border: 2px solid #84cc16;
      border-radius: 14px; padding: 16px;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background .2s, transform .1s;
    }
    .btn-new:hover { background: rgba(132,204,22,.1); }
    .btn-new:active { transform: scale(.98); }
    .btn-new:disabled { opacity: .4; cursor: not-allowed; }

    .btn-draw {
      flex: 2;
      background: #84cc16; color: #0d0d1a; border: none;
      border-radius: 14px; padding: 16px;
      font-size: 1.05rem; font-weight: 800;
      cursor: pointer; font-family: inherit;
      transition: opacity .2s, transform .1s;
    }
    .btn-draw:hover { opacity: .88; }
    .btn-draw:active { transform: scale(.98); }
    .btn-draw:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← Back to Hub</a>
    <div class="turn-badge">Turn <span id="turn-num">0</span></div>
  </div>

  <div class="header">
    <h1>📖 Story Chain</h1>
    <p>Draw an opening — then keep the story going with a random connector!</p>
  </div>

  <!-- Opening card -->
  <div class="opening-card" id="op-card">
    <div class="op-placeholder" id="op-ph">
      <div class="big-emoji">📖</div>
      <p>Press <strong>Draw Opening</strong> to begin your story</p>
    </div>
    <div class="op-content" id="op-ct">
      <div class="op-label">📖 Opening</div>
      <div class="op-text" id="op-text"></div>
    </div>
  </div>

  <!-- Connector card (hidden until game starts) -->
  <div class="conn-card" id="conn-card" style="display:none">
    <div class="conn-bg-emoji" id="conn-bg">🔗</div>
    <div class="conn-placeholder" id="conn-ph">
      <div class="big-emoji">🔗</div>
      <p>Press <strong>Draw Connector</strong> to continue the story</p>
    </div>
    <div class="conn-content" id="conn-ct">
      <div class="conn-cat" id="conn-cat"></div>
      <div class="conn-word" id="conn-word"></div>
    </div>
  </div>

  <!-- History dots -->
  <div class="history-row" id="history-row"></div>

  <!-- Initial draw opening button -->
  <button class="btn-opening" id="btn-opening" onclick="drawOpening()">🎲 Draw Opening</button>

  <!-- Game buttons (shown after opening drawn) -->
  <div class="btn-row" id="btn-row" style="display:none">
    <button class="btn-new" id="btn-new" onclick="newStory()">🔁 New Story</button>
    <button class="btn-draw" id="btn-draw" onclick="drawConnector()">🎲 Draw Connector</button>
  </div>

  <script>
    const openings = [
      "A young musician played a song for the first time and made it rain.",
      "Two friends made a bet that changed everything.",
      "A cat walked into a board meeting and sat at the head of the table.",
      "A boy found a coin that always landed on its edge.",
      "A woman woke up to find all the clocks in her house set to the same wrong time.",
      "A scientist's experiment worked perfectly — just not in the way she expected.",
      "An old man on a park bench gave a stranger the most important advice of their life.",
      "A child asked a question in class that no teacher had ever been asked before.",
      "A city suddenly went completely silent for exactly one minute.",
      "A letter arrived with no return address and no stamp — but somehow it had been delivered.",
      "A bird landed on a windowsill and wouldn't leave until someone finally listened.",
      "A storm knocked out the power and revealed something glowing under the floorboards.",
      "A chef followed a recipe perfectly and produced something nobody had ever tasted before.",
      "A bus stopped at a station that wasn't on any map.",
      "A shadow appeared on the wall before its owner arrived.",
      "A runner training for a marathon accidentally ran straight into a different country.",
      "Two strangers reached for the same umbrella in a rainstorm.",
      "A phone rang in an empty house that had been abandoned for twenty years.",
      "An ordinary Tuesday morning became extraordinary when the sun rose from the west.",
      "A photograph developed and showed something that hadn't been in the original scene.",
      "A musician's broken instrument played one perfect note on its own.",
      "A zoo announced that all animals had passed the entry exam to become zookeepers.",
      "A bank teller opened the vault one morning and found it full of handwritten thank-you notes.",
      "A small earthquake shook the town — and somehow everything ended up tidier than before.",
      "A woman discovered she could understand what appliances were saying to each other.",
    ];

    const connectors = [
      { word: 'Oddly enough',           cat: 'Surprise',       emoji: '✨', color: '#a78bfa' },
      { word: "To everyone's shock",    cat: 'Surprise',       emoji: '✨', color: '#a78bfa' },
      { word: 'Out of the blue',        cat: 'Surprise',       emoji: '✨', color: '#a78bfa' },
      { word: "Who would've thought",   cat: 'Surprise',       emoji: '✨', color: '#a78bfa' },
      { word: 'Even so',                cat: 'Contrast',       emoji: '⚡', color: '#ef4444' },
      { word: 'Despite everything',     cat: 'Contrast',       emoji: '⚡', color: '#ef4444' },
      { word: 'On the contrary',        cat: 'Contrast',       emoji: '⚡', color: '#ef4444' },
      { word: 'Then again',             cat: 'Contrast',       emoji: '⚡', color: '#ef4444' },
      { word: 'Regardless',             cat: 'Contrast',       emoji: '⚡', color: '#ef4444' },
      { word: 'After all',              cat: 'Contrast',       emoji: '⚡', color: '#ef4444' },
      { word: 'Along with that',        cat: 'Addition',       emoji: '➕', color: '#22c55e' },
      { word: 'To make it worse',       cat: 'Addition',       emoji: '➕', color: '#22c55e' },
      { word: 'To make it better',      cat: 'Addition',       emoji: '➕', color: '#22c55e' },
      { word: 'Amazingly',              cat: 'Addition',       emoji: '➕', color: '#22c55e' },
      { word: 'Sure enough',            cat: 'Addition',       emoji: '➕', color: '#22c55e' },
      { word: 'Naturally',              cat: 'Cause & Effect', emoji: '🔗', color: '#f59e0b' },
      { word: 'As a consequence',       cat: 'Cause & Effect', emoji: '🔗', color: '#f59e0b' },
      { word: 'This caused',            cat: 'Cause & Effect', emoji: '🔗', color: '#f59e0b' },
      { word: 'So of course',           cat: 'Cause & Effect', emoji: '🔗', color: '#f59e0b' },
      { word: "That's exactly why",     cat: 'Cause & Effect', emoji: '🔗', color: '#f59e0b' },
      { word: 'Just then',              cat: 'Time',           emoji: '⏱️', color: '#4f9eff' },
      { word: 'By that evening',        cat: 'Time',           emoji: '⏱️', color: '#4f9eff' },
      { word: 'Hours later',            cat: 'Time',           emoji: '⏱️', color: '#4f9eff' },
      { word: 'Shortly after',          cat: 'Time',           emoji: '⏱️', color: '#4f9eff' },
      { word: 'Without warning',        cat: 'Time',           emoji: '⏱️', color: '#4f9eff' },
      { word: 'In the meantime',        cat: 'Time',           emoji: '⏱️', color: '#4f9eff' },
      { word: "That's when",            cat: 'Time',           emoji: '⏱️', color: '#4f9eff' },
      { word: 'Right at that moment',   cat: 'Time',           emoji: '⏱️', color: '#4f9eff' },
    ];

    let turnIdx  = 0;
    let history  = [];
    let rolling  = false;
    let usedOp   = [];
    let usedConn = [];

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function drawOpening() {
      if (rolling) return;
      rolling = true;

      const btn  = document.getElementById('btn-opening');
      const card = document.getElementById('op-card');
      const ph   = document.getElementById('op-ph');
      const ct   = document.getElementById('op-ct');
      const txt  = document.getElementById('op-text');

      btn.disabled = true;
      card.classList.add('rolling');
      ph.style.display = 'none';
      ct.classList.add('show');

      let avail = openings.map((_, i) => i).filter(i => !usedOp.includes(i));
      if (!avail.length) { usedOp = []; avail = openings.map((_, i) => i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      usedOp.push(fi);

      let ticks = 0;
      const iv = setInterval(() => {
        txt.textContent = openings[Math.floor(Math.random() * openings.length)];
        if (++ticks >= 22) {
          clearInterval(iv);
          txt.textContent = openings[fi];
          card.classList.remove('rolling');
          card.classList.add('landed');

          btn.style.display = 'none';
          document.getElementById('conn-card').style.display = 'flex';
          document.getElementById('btn-row').style.display   = 'flex';
          rolling = false;
        }
      }, 82);
    }

    function drawConnector() {
      if (rolling) return;
      rolling = true;

      const btn    = document.getElementById('btn-draw');
      const btnNew = document.getElementById('btn-new');
      const card   = document.getElementById('conn-card');
      const ph     = document.getElementById('conn-ph');
      const ct     = document.getElementById('conn-ct');
      const catEl  = document.getElementById('conn-cat');
      const wordEl = document.getElementById('conn-word');
      const bgEl   = document.getElementById('conn-bg');

      btn.disabled    = true;
      btnNew.disabled = true;
      ph.style.display = 'none';
      ct.classList.add('show');
      card.classList.remove('landed');
      card.classList.add('rolling');
      card.style.removeProperty('--glow');

      let avail = connectors.map((_, i) => i).filter(i => !usedConn.includes(i));
      if (!avail.length) { usedConn = []; avail = connectors.map((_, i) => i); }
      const fi = avail[Math.floor(Math.random() * avail.length)];
      usedConn.push(fi);

      let ticks = 0;
      const iv = setInterval(() => {
        const tmp = connectors[Math.floor(Math.random() * connectors.length)];
        catEl.textContent      = tmp.emoji + ' ' + tmp.cat;
        catEl.style.color      = tmp.color;
        wordEl.textContent     = tmp.word;
        wordEl.style.color     = tmp.color;
        bgEl.textContent       = tmp.emoji;
        card.style.borderColor = tmp.color;

        if (++ticks >= 22) {
          clearInterval(iv);
          const sc = connectors[fi];
          catEl.textContent      = sc.emoji + ' ' + sc.cat;
          catEl.style.color      = sc.color;
          wordEl.textContent     = sc.word;
          wordEl.style.color     = sc.color;
          bgEl.textContent       = sc.emoji;
          card.style.borderColor = sc.color;
          card.style.setProperty('--glow', hexToRgba(sc.color, 0.32));
          card.classList.remove('rolling');
          card.classList.add('landed');

          turnIdx++;
          history.push(sc);
          document.getElementById('turn-num').textContent = turnIdx;
          renderHistory();

          btn.disabled    = false;
          btnNew.disabled = false;
          rolling = false;
        }
      }, 82);
    }

    function renderHistory() {
      const row = document.getElementById('history-row');
      row.innerHTML = '';
      history.forEach((h, i) => {
        const d = document.createElement('div');
        d.className   = 'hdot' + (i === history.length - 1 ? ' cur' : '');
        d.style.background = h.color;
        d.title       = h.word;
        row.appendChild(d);
      });
    }

    function newStory() {
      if (rolling) return;

      turnIdx  = 0;
      history  = [];
      usedConn = [];

      const opCard = document.getElementById('op-card');
      opCard.classList.remove('rolling', 'landed');
      document.getElementById('op-ph').style.display = '';
      document.getElementById('op-ct').classList.remove('show');

      const connCard = document.getElementById('conn-card');
      connCard.style.display = 'none';
      connCard.style.borderColor = '';
      connCard.style.removeProperty('--glow');
      connCard.classList.remove('rolling', 'landed');
      document.getElementById('conn-ph').style.display = '';
      document.getElementById('conn-ct').classList.remove('show');
      document.getElementById('conn-bg').textContent = '🔗';

      document.getElementById('history-row').innerHTML = '';
      document.getElementById('turn-num').textContent  = '0';

      const btnOp = document.getElementById('btn-opening');
      btnOp.style.display = '';
      btnOp.disabled = false;
      document.getElementById('btn-row').style.display = 'none';
    }
  </script>
</body>
</html>
